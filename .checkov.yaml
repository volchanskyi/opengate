# Only the listed frameworks run; compose files are scanned by policy/docker_compose/images.rego.

framework:
  - terraform
  - dockerfile
  - github_actions
  - helm            # renders deploy/helm/** charts and scans the output

# The helm framework renders to temporary directories, so these findings are skipped by check id.
skip-check:
  - CKV_K8S_43    # image digest pin — images are pinned to concrete tags
  - CKV_K8S_15    # imagePullPolicy: Always — pinned and sha tags use IfNotPresent
  - CKV_K8S_26    # hostPort — single-node L4 path for QUIC/MPS that preserves client source IP
  - CKV_K8S_40    # high UID — server runs 65532; postgres must run uid 70 (official image)
  - CKV_K8S_35    # secrets as env — the server consumes JWT_SECRET/DATABASE_URL via env
  - CKV_K8S_22    # read-only rootfs — the official postgres image writes runtime files
  - CKV_K8S_21    # default namespace — false positive of the static render
  - CKV_K8S_153   # ingress snippet annotation — chart-controlled headers on a single-tenant cluster
  - CKV2_K8S_6    # default-deny NetworkPolicy — not yet applied
  - CKV_K8S_17    # hostPID — node-exporter reads per-process node metrics from the host PID namespace
  - CKV_K8S_38    # SA token mount — promtail needs the token for kubernetes_sd log discovery

compact: true
quiet: true
output: cli

skip-path:
  - '\.terraform/.*'
  - 'node_modules/.*'
  - 'agent/target/.*'
  - 'server/coverage.*'
  - 'web/coverage/.*'
  - 'web/reports/.*'
  - 'deploy/tests/fixtures/.*'   # holds the gitleaks canary

# The baseline holds the accepted findings; a run fails only on new ones.
baseline: .checkov.baseline
