name: Pinned shell tools
description: >-
  Install the ShellCheck, shfmt and jq versions named in
  scripts/lib/tool-versions.sh and put them ahead of the runner image's own, so
  a job runs the same tools the workstation's gauntlet does.

  Use it in every job whose steps run any of those three. jq is the reason the
  action exists rather than a per-job install line: 33 scripts in this
  repository read JSON with it, and the runner image's jq and the workstation's
  had disagreed about how a number is rendered, which passed the gauntlet and
  failed CI with nothing in the diff naming jq at all.

inputs:
  with-benchstat:
    description: Also install the pinned benchstat, which builds with the job's Go.
    required: false
    default: 'false'

runs:
  using: composite
  steps:
    - name: Install pinned shell tools
      shell: bash
      run: |
        scripts/install-shell-tools.sh
        echo "$HOME/.local/bin" >> "$GITHUB_PATH"
    - name: Verify the pinned tools are the ones on PATH
      shell: bash
      # Checks the copy PATH resolves, which can be an image copy ahead of the installed one.
      run: |
        set -euo pipefail
        . scripts/lib/tool-versions.sh
        fail=0
        check() {
          local name="$1" want="$2" got="$3"
          if [ "$want" = "$got" ]; then
            printf '  ok   %s %s\n' "$name" "$got"
          else
            printf '  FAIL %s is %s, pinned at %s\n' "$name" "$got" "$want" >&2
            fail=1
          fi
        }
        check jq "$TOOL_VERSION_JQ" "$(jq --version | sed 's/^jq-//')"
        check shellcheck "$TOOL_VERSION_SHELLCHECK" \
          "$(shellcheck --version | awk '/^version:/ { print $2 }')"
        check shfmt "$TOOL_VERSION_SHFMT" "$(shfmt --version | sed 's/^v//')"
        exit "$fail"
    - name: Install the pinned benchstat
      if: inputs.with-benchstat == 'true'
      shell: bash
      run: |
        set -euo pipefail
        scripts/install-benchstat.sh
        echo "$(go env GOPATH)/bin" >> "$GITHUB_PATH"
