version: 2
updates:
  - package-ecosystem: gomod
    directory: /server
    target-branch: dev
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      go-deps:
        patterns: ["*"]

  - package-ecosystem: cargo
    directory: /agent
    target-branch: dev
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      cargo-deps:
        patterns: ["*"]

  - package-ecosystem: npm
    directory: /web
    target-branch: dev
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      npm-deps:
        patterns: ["*"]
    # typescript is held because typescript-eslint does not support TypeScript 7.
    ignore:
      - dependency-name: "typescript"

  - package-ecosystem: github-actions
    directory: /
    target-branch: dev
    schedule:
      interval: daily
    open-pull-requests-limit: 10
    groups:
      actions-deps:
        patterns: ["*"]
