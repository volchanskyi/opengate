name: Benchmark Trends

on:
  schedule:
    - cron: '0 4 * * *'
  workflow_dispatch:
    inputs:
      update-baseline:
        description: 'Generate benchmarks/baseline.json as a reviewable artifact'
        required: false
        default: false
        type: boolean

permissions:
  contents: read

jobs:
  run:
    name: Run ${{ matrix.lang }} benchmarks
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - lang: go
          - lang: rust
    outputs:
      started_at: ${{ steps.started.outputs.at }}
    steps:
      # Every sample the night writes carries this time, so a re-run writes the same point.
      - name: Record when the run started
        id: started
        run: echo "at=$(date -u +%s)" >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@v7

      - uses: ./.github/actions/docker-hub-mirror
        if: matrix.lang == 'go'
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Start Postgres with max_connections=400
        if: matrix.lang == 'go'
        run: |
          set -euo pipefail
          docker run -d --rm --name pg-ci \
            -e POSTGRES_USER=opengate -e POSTGRES_PASSWORD=opengate -e POSTGRES_DB=opengate_test \
            --shm-size=1g -p 5432:5432 postgres:17-alpine -c max_connections=400 -c max_locks_per_transaction=256
          for i in {1..30}; do
            if docker exec pg-ci pg_isready -U opengate -d opengate_test >/dev/null 2>&1; then
              echo "postgres ready after ${i} attempt(s)"
              exit 0
            fi
            sleep 1
          done
          echo "::error::postgres never became ready"
          docker logs pg-ci
          exit 1

      - uses: actions/setup-go@v7
        if: matrix.lang == 'go'
        with:
          go-version: '1.27'
          cache-dependency-path: server/go.sum

      - name: Run Go benchmarks
        if: matrix.lang == 'go'
        env:
          POSTGRES_TEST_URL: postgres://opengate:opengate@localhost:5432/opengate_test?sslmode=disable
        run: |
          set -euo pipefail
          cd server
          # Pinned to the runner's four processors, which the gauntlet's local check runs at too.
          go test -bench=. -benchmem -count=1 -cpu 4 -run='^$' ./internal/... | tee "$GITHUB_WORKSPACE/bench-go.txt"

      - uses: actions/upload-artifact@v7
        if: matrix.lang == 'go'
        with:
          name: bench-go
          path: bench-go.txt
          retention-days: 30

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8
        if: matrix.lang == 'rust'

      - uses: Swatinem/rust-cache@c8037a86dde8214a8310e9f54a8fc61ab362aa31
        if: matrix.lang == 'rust'
        with:
          workspaces: agent

      - name: Run Rust benchmarks
        if: matrix.lang == 'rust'
        run: |
          set -euo pipefail
          cd agent
          cargo bench -p mesh-protocol -p mesh-agent-core -p edge-tsdb --bench '*'
          DEST="$GITHUB_WORKSPACE/bench-rust-estimates"
          mkdir -p "$DEST"
          # Copies only new/estimates.json, keeping the <bench>/new layout the summarizer globs.
          ( cd target/criterion && find . -path '*/new/estimates.json' -exec cp --parents {} "$DEST/" \; )

      - uses: actions/upload-artifact@v7
        if: matrix.lang == 'rust'
        with:
          name: bench-rust-estimates
          path: bench-rust-estimates
          if-no-files-found: error
          retention-days: 30

  publish:
    name: Publish benchmark trend
    needs: [run]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    # This job reports only whether the trend was published; the gate job carries the regression
    # verdict.
    permissions:
      contents: read
    outputs:
      alert_text: ${{ steps.summarize.outputs.alert_text }}
      regression: ${{ steps.summarize.outputs.regression }}
      flagged: ${{ steps.summarize.outputs.flagged }}
    env:
      VM_RUN_STARTED_AT: ${{ needs.run.outputs.started_at }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-pinned-tools
      - name: Download Go benchmark results
        uses: actions/download-artifact@v8
        with:
          name: bench-go
          path: artifacts/go

      - name: Download Rust benchmark results
        uses: actions/download-artifact@v8
        with:
          name: bench-rust-estimates
          path: artifacts/rust

      # Precedes Summarize, whose ns/op gate reads a VictoriaMetrics baseline through the
      # in-cluster Service.
      - name: OCI + kubeconfig setup
        uses: ./.github/actions/oci-kube-setup
        with:
          oci-tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci-user: ${{ secrets.OCI_WORKFLOW_USER_OCID }}
          oci-fingerprint: ${{ secrets.OCI_WORKFLOW_FINGERPRINT }}
          oci-private-key: ${{ secrets.OCI_WORKFLOW_PRIVATE_KEY }}
          oci-region: ${{ secrets.OCI_REGION }}
          cluster-id: ${{ secrets.OKE_CLUSTER_ID }}

      - name: Summarize and check regression
        id: summarize
        env:
          GITHUB_SHA: ${{ github.sha }}
          UPDATE_BASELINE: ${{ github.event_name == 'workflow_dispatch' && inputs.update-baseline == true }}
        run: |
          set -euo pipefail
          export GO_BENCH_FILE="artifacts/go/bench-go.txt"
          export CRITERION_ROOT="artifacts/rust"

          # The candidate is written beside the baseline, which it reads each row's history_from from.
          if [ "$UPDATE_BASELINE" = "true" ]; then
            ./scripts/benchmark-summarize.sh --update-baseline > baseline-candidate.json
            mv baseline-candidate.json benchmarks/baseline.json
            echo "updated_baseline=1" >> "$GITHUB_OUTPUT"
          else
            echo "updated_baseline=0" >> "$GITHUB_OUTPUT"
          fi

          set +e
          ./scripts/benchmark-summarize.sh > benchmark-summary.out 2>&1
          SUMMARY_STATUS=$?
          set -e

          case "$SUMMARY_STATUS" in
            0) REGRESSION=0 ;;
            1) REGRESSION=1 ;;
            2)
              echo "regression=0" >> "$GITHUB_OUTPUT"
              echo "::error::Benchmark summary input missing or invalid; at least one language artifact is absent or malformed."
              cat benchmark-summary.out
              exit 2
              ;;
            *)
              echo "regression=0" >> "$GITHUB_OUTPUT"
              echo "::error::benchmark-summarize.sh failed with unexpected exit ${SUMMARY_STATUS}"
              cat benchmark-summary.out
              exit "$SUMMARY_STATUS"
              ;;
          esac

          # A Go timing past its line is measured again in the confirm job before it can fail.
          if [ -s benchmark-flagged.tsv ]; then
            echo "flagged=1" >> "$GITHUB_OUTPUT"
          else
            echo "flagged=0" >> "$GITHUB_OUTPUT"
          fi

          cat benchmark-summary.out
          ROWS="$(grep -E '^\[' benchmark-summary.out | tail -n 1 || true)"
          if [ -z "$ROWS" ]; then
            echo "::error::benchmark-summarize.sh produced no canonical JSON row array"
            exit 2
          fi
          printf '%s\n' "$ROWS" > benchmark-rows.json

          if [ "${REGRESSION:-0}" = "1" ]; then
            echo "regression=1" >> "$GITHUB_OUTPUT"
          else
            echo "regression=0" >> "$GITHUB_OUTPUT"
          fi

          ALERT_TEXT="$(grep '^REGRESSION_ALERT:' benchmark-summary.out | sed 's/^REGRESSION_ALERT://' || true)"
          {
            echo "alert_text<<EOF"
            echo "$ALERT_TEXT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload the flagged benchmarks and their nights
        if: steps.summarize.outputs.flagged == '1'
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-flagged
          path: |
            benchmark-flagged.tsv
            benchmark-window.txt
          if-no-files-found: error
          retention-days: 30

      - name: Upload canonical rows as artifact
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-canonical-rows
          path: benchmark-rows.json
          retention-days: 90

      - name: Upload baseline candidate
        if: steps.summarize.outputs.updated_baseline == '1'
        uses: actions/upload-artifact@v7
        with:
          name: benchmark-baseline-candidate
          path: benchmarks/baseline.json
          retention-days: 90

      - name: Push to VictoriaMetrics
        run: ./scripts/benchmark-vm-push.sh benchmark-rows.json

      - name: Write GITHUB_STEP_SUMMARY
        run: |
          set -euo pipefail
          {
            echo "# Benchmark trend run"
            echo ""
            echo "Commit: \`${{ github.sha }}\`"
            echo "Regression: \`${{ steps.summarize.outputs.regression }}\`"
            echo "Baseline update mode: \`${{ steps.summarize.outputs.updated_baseline }}\`"
            echo ""
            # Written by the check that judged the readings, so page and verdict agree on a limit.
            if [ -s benchmark-summary.md ]; then
              cat benchmark-summary.md
            fi
            if [ -f benchmarks/baseline.json ] && [ "${{ steps.summarize.outputs.updated_baseline }}" = "1" ]; then
              echo ""
              echo "## Baseline candidate"
              echo '```json'
              python3 -m json.tool < benchmarks/baseline.json || cat benchmarks/baseline.json
              echo '```'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Remove OCI credentials
        if: always()
        uses: ./.github/actions/oci-kube-teardown

  # Measures each flagged Go benchmark ten times and fails only on a slowdown benchstat finds
  # significant whose median is past its line.
  confirm:
    name: Measure flagged benchmarks again
    needs: [publish]
    if: success() && needs.publish.outputs.flagged == '1'
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      regression: ${{ steps.judge.outputs.regression }}
      alert_text: ${{ steps.judge.outputs.alert_text }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/docker-hub-mirror
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Start Postgres with max_connections=400
        run: |
          set -euo pipefail
          docker run -d --rm --name pg-ci \
            -e POSTGRES_USER=opengate -e POSTGRES_PASSWORD=opengate -e POSTGRES_DB=opengate_test \
            --shm-size=1g -p 5432:5432 postgres:17-alpine -c max_connections=400 -c max_locks_per_transaction=256
          for i in {1..30}; do
            if docker exec pg-ci pg_isready -U opengate -d opengate_test >/dev/null 2>&1; then
              echo "postgres ready after ${i} attempt(s)"
              exit 0
            fi
            sleep 1
          done
          echo "::error::postgres never became ready"
          docker logs pg-ci
          exit 1

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: server/go.sum

      - uses: ./.github/actions/setup-pinned-tools
        with:
          with-benchstat: 'true'

      - name: Download the flagged benchmarks
        uses: actions/download-artifact@v8
        with:
          name: benchmark-flagged
          path: flagged

      - name: Measure the flagged benchmarks again
        env:
          POSTGRES_TEST_URL: postgres://opengate:opengate@localhost:5432/opengate_test?sslmode=disable
        run: scripts/benchmark-confirm.sh rerun flagged/benchmark-flagged.tsv benchmark-rerun.txt

      - name: Judge the re-run with benchstat
        id: judge
        run: |
          set -euo pipefail
          set +e
          scripts/benchmark-confirm.sh judge flagged/benchmark-flagged.tsv flagged/benchmark-window.txt \
            benchmark-rerun.txt > benchmark-confirm.out 2>&1
          status=$?
          set -e
          cat benchmark-confirm.out
          if [ -s benchmark-confirm.md ]; then
            cat benchmark-confirm.md >> "$GITHUB_STEP_SUMMARY"
          fi
          case "$status" in
            0) echo "regression=0" >> "$GITHUB_OUTPUT" ;;
            1) echo "regression=1" >> "$GITHUB_OUTPUT" ;;
            *)
              echo "::error::benchmark-confirm.sh judge exited ${status}; the flagged benchmarks were not judged."
              exit "$status"
              ;;
          esac
          ALERT_TEXT="$(grep '^REGRESSION_ALERT:' benchmark-confirm.out | sed 's/^REGRESSION_ALERT://' || true)"
          {
            echo "alert_text<<EOF"
            echo "$ALERT_TEXT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

  gate:
    name: Benchmark regression gate
    needs: [publish, confirm]
    if: ${{ !cancelled() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Fail workflow red on regression
        run: |
          if [ "${{ needs.publish.result }}" != "success" ]; then
            echo "::error::Benchmark trend publishing did not succeed; see the publish job."
            exit 1
          fi
          if [ "${{ needs.publish.outputs.regression }}" = "1" ]; then
            echo "::error::Benchmark regression detected (allocations against their limit, or a Rust timing past its line) — see workflow summary and Telegram alert (if delivered)."
            exit 1
          fi
          if [ "${{ needs.publish.outputs.flagged }}" = "1" ]; then
            if [ "${{ needs.confirm.result }}" != "success" ]; then
              echo "::error::The flagged benchmarks were not measured again; see the confirm job."
              exit 1
            fi
            if [ "${{ needs.confirm.outputs.regression }}" = "1" ]; then
              echo "::error::A slowdown benchstat finds significant is past its line — see the confirm job's summary."
              exit 1
            fi
          fi
          echo "No benchmark regression."

  # Sends the run's alert from a job of its own, which holds the Telegram secrets and nothing else.
  alert:
    name: Alert if the run did not finish
    needs: [publish, confirm]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-pinned-tools

      - name: Send Telegram alert
        # Says which of the three the night met. A refused send fails this job alone, so the
        # verdict the gate reads stays the run's.
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.DEPLOY_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.DEPLOY_TELEGRAM_CHAT_ID }}
          FINDING: ${{ needs.publish.outputs.regression }}
          CONFIRMED: ${{ needs.confirm.outputs.regression }}
          ALERT_TEXT: ${{ needs.publish.outputs.alert_text }}
          CONFIRMED_TEXT: ${{ needs.confirm.outputs.alert_text }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ needs.publish.result }}
          FLAGGED: ${{ needs.publish.outputs.flagged }}
          CONFIRM_STATUS: ${{ needs.confirm.result }}
        run: |
          set -euo pipefail
          # A cancel is what skips the publish job once the run it reads has finished.
          if [ "$JOB_STATUS" = "skipped" ]; then JOB_STATUS="cancelled before publishing"; fi
          # A flagged night is finished only once its re-run is.
          if [ "$JOB_STATUS" = "success" ] && [ "${FLAGGED:-0}" = "1" ] && [ "$CONFIRM_STATUS" != "success" ]; then
            JOB_STATUS="re-run $CONFIRM_STATUS"
          fi
          if [ "$JOB_STATUS" = "success" ] && [ "${FINDING:-0}" != "1" ] && [ "${CONFIRMED:-0}" != "1" ]; then
            echo "No alert sent: the run finished and found nothing."
            exit 0
          fi
          if [ "${FINDING:-0}" = "1" ] || [ "${CONFIRMED:-0}" = "1" ]; then
            MSG="$(printf '%s\n%s\n\nRun: %s\nTrend: Grafana dashboard "Benchmark Trends" (opengate-benchmark-trend)' \
              "$ALERT_TEXT" "$CONFIRMED_TEXT" "$RUN_URL")"
          else
            MSG="$(printf 'Benchmark trend: the night did not finish (%s), so nothing was measured.\n\nRun: %s' \
              "$JOB_STATUS" "$RUN_URL")"
          fi
          scripts/telegram-alert.sh "$MSG"
