name: Build & Push Container Image

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [dev]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository_owner }}/opengate-server

# Default-deny at the workflow level: a job without its own permissions block
# inherits no token scopes. Each job grants exactly what it needs.
permissions: {}

jobs:
  # Decides whether the diff against the SHA that produced :latest changes any image input.
  check-image-changed:
    name: Check image inputs changed since :latest
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      image_changed: ${{ steps.gate.outputs.image_changed }}
      prev_sha: ${{ steps.gate.outputs.prev_sha }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0

      - uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

      - name: Diff image inputs vs :latest
        id: gate
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          HEAD_SHA: ${{ github.sha }}
        run: ./scripts/build-image-gate.sh >> "$GITHUB_OUTPUT"

  # Built here because this workflow's cache token can write and the deploy's cannot.
  # Runs outside the image_changed gate, since the deploy needs the binary on every run.
  build-agent:
    name: Build the agent for ${{ matrix.target }}
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    if: >-
      github.event_name == 'push' ||
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install cross tools
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          # Pinned to a rev: the cross-build needs main, and an unpinned --git install is untested.
          cargo install --locked cross \
            --git https://github.com/cross-rs/cross --rev 8c1a8aa4b661711f4b7b6ac07c2e8929ce2f7d27

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: agent
          key: ${{ matrix.target }}

      - name: Build release binary (native)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        run: cargo build --release --target ${{ matrix.target }} -p mesh-agent

      - name: Build release binary (cross)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: cross build --release --target ${{ matrix.target }} -p mesh-agent

      - uses: actions/upload-artifact@v7
        with:
          name: mesh-agent-${{ matrix.target }}
          path: agent/target/${{ matrix.target }}/release/mesh-agent
          retention-days: 20

  # A refused cache save exits zero, so the cache API is asked for the key the build wrote.
  assert-agent-cache:
    name: The agent cache write landed for ${{ matrix.target }}
    needs: build-agent
    runs-on: ubuntu-24.04
    permissions:
      actions: read
      contents: read
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-musl
          - aarch64-unknown-linux-musl
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          sparse-checkout: scripts/assert-cache-written.sh
          sparse-checkout-cone-mode: false

      # rust-cache computes the rest of the key; this is the part the job chose.
      - name: Read the agent cache entry back
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: scripts/assert-cache-written.sh "${{ matrix.target }}-build-agent"

  build-and-push:
    name: Build & Push
    needs: check-image-changed
    if: needs.check-image-changed.outputs.image_changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    # Equals the scanner's row in scripts/lib/tool-versions.sh; trivy reads each TRIVY_* as a flag.
    env:
      PINNED_TRIVY: v0.70.0
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Set up QEMU (multi-arch)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,prefix=sha-,format=short
            type=raw,value=latest
            type=semver,pattern=v{{version}}
            type=semver,pattern=v{{major}}.{{minor}}

      - name: Build and push
        id: build
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
          provenance: true
          sbom: true

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign image with Cosign (keyless)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          cosign sign --yes \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${DIGEST}"

      - name: Generate SBOM attestation
        uses: anchore/sbom-action@66cbf4bc1f1c0d2edc94016e65bc221b6bb0ad6c # v0.24.3
        with:
          image: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          format: spdx-json
          output-file: sbom.spdx.json

      - name: Attest SBOM to image
        run: |
          cosign attest --yes \
            --type spdxjson \
            --predicate sbom.spdx.json \
            "${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}"

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v7
        with:
          name: sbom
          path: sbom.spdx.json
          retention-days: 20

      - name: Scan image for vulnerabilities
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          version: ${{ env.PINNED_TRIVY }}
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest
          format: 'table'
          exit-code: '1'
          severity: 'CRITICAL,HIGH'
          ignore-unfixed: true

  # Reuses the existing :latest digest under the new sha- tag, which CD requires to exist.
  # crane copy keeps the manifest digest, so signatures, SBOM and attestations carry over.
  tag-forward:
    name: Tag-forward :latest → sha-<newsha>
    needs: check-image-changed
    if: needs.check-image-changed.outputs.image_changed != 'true'
    runs-on: ubuntu-24.04
    permissions:
      packages: write
      contents: read
    steps:
      - uses: docker/login-action@v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

      - name: Copy :latest → sha-<newsha>
        env:
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          SHORT_SHA="${HEAD_SHA:0:7}"
          crane copy "${IMAGE}:latest" "${IMAGE}:sha-${SHORT_SHA}"
          echo "::notice::tag-forwarded :latest → sha-${SHORT_SHA} (no image inputs changed)"
