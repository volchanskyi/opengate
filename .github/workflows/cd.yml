name: CD

on:
  workflow_run:
    workflows: ["Build & Push Container Image"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      image_tag:
        description: "Image tag to deploy (e.g. sha-abc1234)"
        required: true

concurrency:
  group: deploy
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: volchanskyi/opengate-server
  # Helm keeps release records in configmaps, which the workflows' login may read.
  HELM_DRIVER: configmap

permissions:
  contents: read
  packages: read
  issues: write
  actions: read

jobs:
  # Resolves the image tag, verifies it exists and decides whether staging needs to run.
  resolve-tag:
    name: Resolve image tag
    runs-on: ubuntu-24.04
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event.workflow_run.conclusion == 'success'
    outputs:
      image_tag: ${{ steps.tag.outputs.tag }}
      target_digest: ${{ steps.preflight.outputs.target_digest }}
      should_skip_staging: ${{ steps.preflight.outputs.should_skip_staging }}
      cluster_changed: ${{ steps.cluster.outputs.changed }}
      cluster_reason: ${{ steps.cluster.outputs.reason }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Determine tag
        id: tag
        # The dispatched tag and the head commit reach the script as variables, never as its text.
        env:
          EVENT_NAME: ${{ github.event_name }}
          DISPATCHED_TAG: ${{ inputs.image_tag }}
          HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            TAG="$DISPATCHED_TAG"
          else
            TAG="sha-${HEAD_SHA:0:7}"
          fi
          if [[ ! "$TAG" =~ ^[A-Za-z0-9_][A-Za-z0-9_.-]{0,127}$ ]]; then
            echo "::error::'$TAG' is not an image tag." >&2
            exit 1
          fi
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "Resolved image tag: $TAG"

      - name: Log in to GHCR
        uses: docker/login-action@v4.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Verify image exists in GHCR
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          echo "Checking ghcr.io/${{ env.IMAGE_NAME }}:${TAG}..."
          docker manifest inspect "ghcr.io/${{ env.IMAGE_NAME }}:${TAG}" \
            || { echo "::error::Image tag '${TAG}' not found in GHCR"; exit 1; }

      - name: Install Cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Verify image signature
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          cosign verify \
            --certificate-identity-regexp="https://github.com/${{ github.repository_owner }}/.*" \
            --certificate-oidc-issuer="https://token.actions.githubusercontent.com" \
            "ghcr.io/${{ env.IMAGE_NAME }}:${TAG}"

      - uses: imjasonh/setup-crane@feee3b6bb0d4c68370f256a4502498c9227e5c6b # v0.7

      # The running tag is read off the cluster, which it cannot disagree with.
      # A dispatch deploys what it names, so it skips the read and the credentials stay off.
      - name: OCI + kubeconfig setup
        if: github.event_name != 'workflow_dispatch'
        uses: ./.github/actions/oci-kube-setup
        with:
          oci-tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci-user: ${{ secrets.OCI_WORKFLOW_USER_OCID }}
          oci-fingerprint: ${{ secrets.OCI_WORKFLOW_FINGERPRINT }}
          oci-private-key: ${{ secrets.OCI_WORKFLOW_PRIVATE_KEY }}
          oci-region: ${{ secrets.OCI_REGION }}
          cluster-id: ${{ secrets.OKE_CLUSTER_ID }}

      - name: Pre-flight digest check
        id: preflight
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          IMAGE: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          GIT_SHA: ${{ github.sha }}
          EVENT_NAME: ${{ github.event_name }}
          STAGING_NAMESPACE: opengate-staging
          STAGING_DEPLOYMENT: deploy/opengate-staging-server
        run: |
          set -euo pipefail

          TARGET_DIGEST="$(crane digest "${IMAGE}:${TAG}" 2>/dev/null || true)"
          echo "target_digest=${TARGET_DIGEST}" >> "$GITHUB_OUTPUT"
          echo "Target digest: ${TARGET_DIGEST:-<unresolved>}"

          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            echo "should_skip_staging=false" >> "$GITHUB_OUTPUT"
            echo "Pre-flight: workflow_dispatch → full deploy"
            exit 0
          fi

          if [[ -z "$TARGET_DIGEST" ]]; then
            echo "should_skip_staging=false" >> "$GITHUB_OUTPUT"
            echo "Pre-flight: target digest unresolved → full deploy (fail-open)"
            exit 0
          fi

          # The running server image reference; any unreadable answer leaves it empty, and
          # an empty answer deploys.
          RUNNING_REF="$(kubectl -n "$STAGING_NAMESPACE" get "$STAGING_DEPLOYMENT" \
            -o jsonpath='{.spec.template.spec.containers[?(@.name=="server")].image}' \
            2>/dev/null || true)"
          echo "Running reference: ${RUNNING_REF:-<none>}"

          PRIOR_TAG="${RUNNING_REF##*:}"
          [[ "$PRIOR_TAG" != sha-* ]] || echo "prior_sha=${PRIOR_TAG#sha-}" >> "$GITHUB_OUTPUT"
          if [[ -z "$RUNNING_REF" ]] || [[ "$PRIOR_TAG" != sha-* ]]; then
            echo "should_skip_staging=false" >> "$GITHUB_OUTPUT"
            echo "Pre-flight: staging is running nothing this can read → full deploy"
            exit 0
          fi

          PRIOR_DIGEST="$(crane digest "${IMAGE}:${PRIOR_TAG}" 2>/dev/null || true)"
          PRIOR_SHA="${PRIOR_TAG#sha-}"
          echo "Prior digest: ${PRIOR_DIGEST:-<unresolved>}"
          echo "Prior sha:    ${PRIOR_SHA}"

          if [[ -z "$PRIOR_DIGEST" ]] || [[ "$TARGET_DIGEST" != "$PRIOR_DIGEST" ]]; then
            echo "should_skip_staging=false" >> "$GITHUB_OUTPUT"
            echo "Pre-flight: digest changed → full deploy"
            exit 0
          fi

          if ! git cat-file -e "${PRIOR_SHA}^{commit}" 2>/dev/null \
             || ! git diff --quiet "$PRIOR_SHA" "$GIT_SHA" -- deploy/; then
            echo "should_skip_staging=false" >> "$GITHUB_OUTPUT"
            echo "Pre-flight: deploy/** changed since prior deploy → full deploy"
            exit 0
          fi

          echo "should_skip_staging=true" >> "$GITHUB_OUTPUT"
          echo "::notice::Pre-flight: digest and deploy configuration unchanged → skip staging"

      # The cluster job waits for approval, so it runs only when what it applies has changed since
      # the commit staging runs, or when that commit cannot be read.
      - name: Decide whether the cluster-wide pieces changed
        id: cluster
        env:
          EVENT_NAME: ${{ github.event_name }}
          PRIOR_SHA: ${{ steps.preflight.outputs.prior_sha }}
          GIT_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          . scripts/lib/cluster-paths.sh
          mapfile -t paths < <(cluster_paths)
          reason=""
          if [[ "$EVENT_NAME" == "workflow_dispatch" ]]; then
            reason="the deploy was started by hand"
          elif [[ -z "$PRIOR_SHA" ]] || ! git cat-file -e "${PRIOR_SHA}^{commit}" 2>/dev/null; then
            reason="the commit staging runs could not be read"
          elif ! git diff --quiet "$PRIOR_SHA" "$GIT_SHA" -- "${paths[@]}"; then
            changed="$(git diff --name-only "$PRIOR_SHA" "$GIT_SHA" -- "${paths[@]}" | paste -sd, -)"
            reason="changed since ${PRIOR_SHA:0:7}: ${changed//,/, }"
          elif rows="$(cluster_rows_changed "$PRIOR_SHA" "$GIT_SHA")"; then
            reason="changed since ${PRIOR_SHA:0:7}: $(paste -sd, - <<<"$rows" | sed 's/,/, /g')"
          fi
          if [[ -n "$reason" ]]; then
            echo "changed=true" >> "$GITHUB_OUTPUT"
            echo "reason=${reason}" >> "$GITHUB_OUTPUT"
            echo "Cluster job runs: ${reason}"
          else
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "Cluster-wide pieces unchanged since ${PRIOR_SHA}"
          fi

      - name: Remove OCI credentials
        if: always()
        uses: ./.github/actions/oci-kube-teardown

  # Applies what a routine deploy's login cannot write, as the administrator login held only by the
  # production environment, so every run waits for approval.
  cluster:
    name: Admin cluster changes
    needs: resolve-tag
    if: success() && needs.resolve-tag.outputs.cluster_changed == 'true'
    runs-on: ubuntu-24.04
    environment: production
    steps:
      - uses: actions/checkout@v7

      - name: OCI + kubeconfig setup
        uses: ./.github/actions/oci-kube-setup
        with:
          oci-tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci-user: ${{ secrets.OCI_ADMIN_USER_OCID }}
          oci-fingerprint: ${{ secrets.OCI_ADMIN_FINGERPRINT }}
          oci-private-key: ${{ secrets.OCI_ADMIN_PRIVATE_KEY }}
          oci-region: ${{ secrets.OCI_REGION }}
          cluster-id: ${{ secrets.OKE_CLUSTER_ID }}

      # Every image the deploy installs is asked for a build of each node's platform first.
      - name: Check every image the deploy installs runs on the cluster's nodes
        run: deploy/scripts/deploy-images-platform-check.sh

      - name: Give the cluster the pieces this commit declares
        env:
          WORKFLOW_USER_OCID: ${{ secrets.OCI_WORKFLOW_USER_OCID }}
          ACME_EMAIL: ${{ secrets.DEPLOY_ACME_EMAIL }}
          CLUSTER_RUN_REASON: ${{ needs.resolve-tag.outputs.cluster_reason }}
        run: deploy/scripts/cluster-apply.sh

      - name: Remove OCI credentials
        if: always()
        uses: ./.github/actions/oci-kube-teardown

  deploy-staging-k8s:
    name: Deploy staging
    needs: [resolve-tag, cluster]
    # Runs past a skipped cluster job; a failed or refused one, or a cancel, stops the deploy here.
    if: >-
      ${{ !cancelled() &&
      needs.resolve-tag.result == 'success' &&
      needs.resolve-tag.outputs.should_skip_staging != 'true' &&
      (needs.cluster.result == 'success' || needs.cluster.result == 'skipped') }}
    runs-on: ubuntu-24.04
    environment: staging
    # Bounded below the lease it holds, so the job cannot outlive its own claim
    # and have it taken over while it is still writing to the namespace.
    timeout-minutes: 60
    env:
      IMAGE_TAG: ${{ needs.resolve-tag.outputs.image_tag }}
      TARGET_DIGEST: ${{ needs.resolve-tag.outputs.target_digest }}
      NAMESPACE: opengate-staging
      RELEASE: opengate-staging
      # Named once: the release step matches on this identity, and a claim
      # released under a different one is left to time out instead.
      STAGING_LEASE_HOLDER: cd-${{ github.run_id }}-${{ github.run_attempt }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-pinned-tools
      # No cache half: this workflow's token carries read scope only, so the
      # save that follows a restore is refused while its step reports success.
      - uses: actions/setup-node@v7
        with:
          node-version: '24'

      - name: Install Playwright dependencies
        working-directory: web
        run: npm ci && npx playwright install --with-deps chromium

      - name: OCI + kubeconfig setup
        uses: ./.github/actions/oci-kube-setup
        with:
          oci-tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci-user: ${{ secrets.OCI_WORKFLOW_USER_OCID }}
          oci-fingerprint: ${{ secrets.OCI_WORKFLOW_FINGERPRINT }}
          oci-private-key: ${{ secrets.OCI_WORKFLOW_PRIVATE_KEY }}
          oci-region: ${{ secrets.OCI_REGION }}
          cluster-id: ${{ secrets.OKE_CLUSTER_ID }}

      # Every image the deploy installs, production's monitoring among them, is asked for a build of
      # each node's platform before staging changes anything.
      - name: Check every image the deploy installs runs on the cluster's nodes
        run: deploy/scripts/deploy-images-platform-check.sh

      # The nightly load run drives this same release in another concurrency group, so each
      # run takes the namespace before touching it and gives it back after.
      - name: Take the staging namespace
        env:
          STAGING_LEASE_TTL_SECONDS: "3600"
        run: scripts/staging-lease.sh acquire "$STAGING_LEASE_HOLDER"

      # The suite's two machines run as pods: an agent speaks QUIC over UDP, which the TCP-only
      # port-forward cannot carry. Their binary is the image build's artifact for this commit.
      - name: Resolve the staging node's architecture
        run: |
          set -euo pipefail
          NODE_ARCH="$(kubectl get nodes -o jsonpath='{.items[0].status.nodeInfo.architecture}')"
          case "$NODE_ARCH" in
            arm64) AGENT_TARGET=aarch64-unknown-linux-musl ;;
            amd64) AGENT_TARGET=x86_64-unknown-linux-musl ;;
            *) echo "::error::Unsupported OKE node architecture: $NODE_ARCH"; exit 1 ;;
          esac
          {
            echo "NODE_ARCH=$NODE_ARCH"
            echo "AGENT_TARGET=$AGENT_TARGET"
          } >>"$GITHUB_ENV"
          echo "Building the staging machines for $NODE_ARCH ($AGENT_TARGET)"

      - name: Locate the run that built the agent
        id: agent-build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          EVENT_NAME: ${{ github.event_name }}
          UPSTREAM_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            # A dispatched tag names its own commit, so the run that built the
            # agent for it is the image build that checked that commit out.
            SHORT_SHA="${IMAGE_TAG#sha-}"
            # Bounded by the artifact retention window: a run older than that
            # has nothing left to download anyway, and the search stays small.
            SINCE="$(date -u -d '21 days ago' +%Y-%m-%d)"
            # Read to the end before narrowing: a pipe closed early takes gh
            # down with it, and pipefail would read that as "no such run".
            MATCHES="$(gh api -X GET --paginate \
              "/repos/$REPO/actions/workflows/build-image.yml/runs" \
              -f "created=>=$SINCE" -F per_page=100 \
              --jq "[.workflow_runs[] | select(.head_sha | startswith(\"$SHORT_SHA\")) | .id] | first // empty")"
            RUN_ID="$(printf '%s\n' "$MATCHES" | head -n 1)"
            if [ -z "$RUN_ID" ]; then
              echo "::error::no image-build run checked out ${IMAGE_TAG}, so nothing built the agent for it"
              exit 1
            fi
          else
            RUN_ID="$UPSTREAM_RUN_ID"
          fi

          # A missing artifact stops the deploy with a message naming the tag and the run.
          ARTIFACT="mesh-agent-${AGENT_TARGET}"
          PRESENT="$(gh api --paginate "/repos/$REPO/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.expired == false) | .name')"
          if ! printf '%s\n' "$PRESENT" | grep -qFx "$ARTIFACT"; then
            echo "::error::${ARTIFACT} is absent from image-build run ${RUN_ID}," \
              "the run that produced ${IMAGE_TAG}. It aged out or never built;" \
              "re-run that build before deploying this tag."
            exit 1
          fi

          echo "run_id=$RUN_ID" >> "$GITHUB_OUTPUT"
          echo "Taking $ARTIFACT from image-build run $RUN_ID"

      - name: Download the agent built for the staging node
        uses: actions/download-artifact@v8
        with:
          name: mesh-agent-${{ env.AGENT_TARGET }}
          path: /tmp/agent-artifact
          run-id: ${{ steps.agent-build.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Make the agent binary executable
        run: install -m 0755 /tmp/agent-artifact/mesh-agent /tmp/mesh-agent

      - name: Sync the shared secret
        env:
          JWT_SECRET: ${{ secrets.DEPLOY_STAGING_JWT_SECRET }}
          AMT_PASS: ${{ secrets.DEPLOY_STAGING_AMT_PASS }}
          VAPID_CONTACT: ${{ secrets.DEPLOY_STAGING_VAPID_CONTACT }}
          POSTGRES_PASSWORD: ${{ secrets.DEPLOY_STAGING_POSTGRES_PASSWORD }}
          POSTGRES_APP_PASSWORD: ${{ secrets.DEPLOY_STAGING_POSTGRES_APP_PASSWORD || secrets.DEPLOY_STAGING_POSTGRES_PASSWORD }}
        run: deploy/scripts/shared-secret-sync.sh

      - name: Ensure database role honors RLS
        env:
          POSTGRES_APP_PASSWORD: ${{ secrets.DEPLOY_STAGING_POSTGRES_APP_PASSWORD || secrets.DEPLOY_STAGING_POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail
          if ! kubectl -n "$NAMESPACE" get statefulset "${RELEASE}-postgres" >/dev/null 2>&1; then
            echo "Postgres StatefulSet not present yet; zz-app-role.sh will create opengate_app on first bootstrap."
            exit 0
          fi
          # The password reaches psql over stdin: a --set flag would land in the
          # pod's process list and in the API server's exec audit record.
          deploy/scripts/pg-app-role-sql.sh \
            | kubectl -n "$NAMESPACE" exec -i "statefulset/${RELEASE}-postgres" -- \
                psql -U opengate -d opengate -v ON_ERROR_STOP=1

      - name: Helm upgrade
        env:
          DOMAIN: ${{ secrets.DEPLOY_STAGING_DOMAIN }}
        run: |
          helm upgrade --install "$RELEASE" deploy/helm/opengate -n "$NAMESPACE" \
            -f deploy/helm/opengate/values-staging.yaml \
            --set image.tag="${IMAGE_TAG}" \
            --set domain="$DOMAIN" \
            --set certManager.create=false \
            --wait --timeout 5m
          kubectl -n "$NAMESPACE" rollout status "deploy/${RELEASE}-server" --timeout=300s

      - name: Read back what this login may do
        run: deploy/scripts/workflow-access-readback.sh

      - name: Port-forward server
        run: |
          kubectl -n "$NAMESPACE" port-forward "svc/${RELEASE}-server" 18080:8080 18081:8081 >/tmp/pf.log 2>&1 &
          echo "$!" > /tmp/pf.pid
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18080/api/v1/health >/dev/null; then
              exit 0
            fi
            sleep 1
          done
          cat /tmp/pf.log
          exit 1

      - name: Run smoke tests
        run: bash deploy/scripts/smoke-test.sh --host 127.0.0.1 --port 18080 --metrics-port 18081 --mode staging --scheme http

      # The public edge is where the exposition and profiler listeners are asserted unreachable.
      # The Ingress serves plain HTTP, so the run is given its scheme and published address.
      - name: Run smoke tests through the public edge
        env:
          DOMAIN: ${{ secrets.DEPLOY_STAGING_DOMAIN }}
        run: |
          set -euo pipefail
          EDGE="$(kubectl -n "$NAMESPACE" get ingress "$RELEASE" \
            -o jsonpath='{.status.loadBalancer.ingress[0].ip}')"
          if [ -z "$EDGE" ]; then
            echo "::error::the staging Ingress carries no address; nothing reaches the edge"
            exit 1
          fi
          bash deploy/scripts/smoke-test.sh --domain "$DOMAIN" --mode staging \
            --scheme http --edge-address "$EDGE"

      # Customer names are unique within a tenant, so the reset empties customers too and
      # gives every tenant its default customer back.
      - name: Reset staging DB for E2E
        run: |
          kubectl -n "$NAMESPACE" exec "statefulset/${RELEASE}-postgres" -- \
            psql -U opengate -d opengate -c "
            TRUNCATE TABLE
              security_group_members, device_hardware, device_updates,
              enrollment_tokens, amt_devices, audit_events, web_push_subscriptions,
              agent_sessions, device_certificates, devices, sites, organizations, security_groups, users
            RESTART IDENTITY CASCADE;
            INSERT INTO security_groups (id, tenant_id, name, description, is_system)
            VALUES ('00000000-0000-0000-0000-000000000001', '00000000-0000-0000-0000-000000000002', 'Administrators', 'Full system access', TRUE)
            ON CONFLICT (id) DO NOTHING;
            INSERT INTO organizations (id, tenant_id, name)
            SELECT gen_random_uuid(), t.id, 'Default Organization' FROM tenants t
            ON CONFLICT DO NOTHING;"

      # After the reset, which truncates devices, and before the suite, which
      # reads them.
      - name: Enrol two machines against staging
        env:
          # The first account registered becomes administrator, so registering this one right
          # after the reset makes it the operator web/e2e/global-setup.ts signs in as.
          BOOTSTRAP_EMAIL: bootstrap-admin@test.local
          BOOTSTRAP_PASSWORD: BootstrapPass123!
          ENROLMENT_SECRET: opengate-e2e-enrolment
        run: |
          set -euo pipefail
          BASE=http://127.0.0.1:18080

          bearer() {
            curl -sS -X POST "$1" -H 'Content-Type: application/json' \
              -d "{\"email\":\"$BOOTSTRAP_EMAIL\",\"password\":\"$BOOTSTRAP_PASSWORD\"}" \
              | jq -r '.token // empty'
          }

          TOKEN="$(bearer "$BASE/api/v1/auth/register" || true)"
          if [ -z "$TOKEN" ]; then
            TOKEN="$(bearer "$BASE/api/v1/auth/login" || true)"
          fi
          if [ -z "$TOKEN" ]; then
            echo "::error::could not sign in as the bootstrap operator"
            exit 1
          fi
          echo "::add-mask::$TOKEN"

          # The token comes from the public endpoint an installer uses, so the certificate
          # authority key stays in the cluster.
          ENROLMENT="$(curl -sS -X POST "$BASE/api/v1/enrollment-tokens" \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $TOKEN" \
            -d '{"label":"staging browser suite","max_uses":0,"expires_in_hours":1}' \
            | jq -r '.token // empty')"
          if [ -z "$ENROLMENT" ]; then
            echo "::error::could not mint an enrolment token"
            exit 1
          fi
          echo "::add-mask::$ENROLMENT"

          # The machines get the note an installer leaves, aimed at the server's in-cluster name.
          PROBE_REPLY="$(curl -sS -X POST "$BASE/api/v1/enroll/$ENROLMENT" \
            -H 'Content-Type: application/json' -d '{"csr_pem":""}')"
          NOTE="$(deploy/scripts/install-note.sh "http://${RELEASE}-server:8080" "$ENROLMENT" <<<"$PROBE_REPLY")"
          kubectl -n "$NAMESPACE" create secret generic "$ENROLMENT_SECRET" \
            --from-literal=note="$NOTE" \
            --dry-run=client -o yaml | kubectl -n "$NAMESPACE" apply -f -

          SERVER_POD_IP="$(kubectl -n "$NAMESPACE" get pods \
            -l "app.kubernetes.io/instance=${RELEASE},app.kubernetes.io/component=server" \
            -o jsonpath='{.items[0].status.podIP}')"
          test -n "$SERVER_POD_IP"

          for machine in agent-a agent-b; do
            kubectl -n "$NAMESPACE" delete pod "$machine" --ignore-not-found --wait=true
            MACHINE="$machine" \
              RELEASE="$RELEASE" \
              NODE_ARCH="$NODE_ARCH" \
              SERVER_POD_IP="$SERVER_POD_IP" \
              ENROLMENT_SECRET="$ENROLMENT_SECRET" \
              deploy/scripts/e2e-machine-pod.sh \
              | kubectl -n "$NAMESPACE" apply -f -
          done

          for machine in agent-a agent-b; do
            deploy/scripts/wait-for-pod-ready.sh "$machine" 120
            kubectl -n "$NAMESPACE" exec "$machine" -- mkdir -p /tmp/agent
            kubectl -n "$NAMESPACE" cp /tmp/mesh-agent "$machine:/tmp/mesh-agent"
            kubectl -n "$NAMESPACE" exec "$machine" -- chmod 0755 /tmp/mesh-agent
            # The container waits on this file, so a half-copied binary is never executed.
            kubectl -n "$NAMESPACE" exec "$machine" -- touch /tmp/ready
          done

          # A machine that never arrives is reported here, ahead of the suite's in-test timeout.
          for _ in $(seq 1 60); do
            ONLINE="$(curl -sS "$BASE/api/v1/devices" -H "Authorization: Bearer $TOKEN" \
              | jq -r '[.[] | select(.status == "online") | .hostname] | sort | join(",")' \
              || true)"
            if [ "$ONLINE" = "agent-a,agent-b" ]; then
              echo "both machines are online"
              exit 0
            fi
            sleep 2
          done

          echo "::error::the machines never came online. The fleet holds: ${ONLINE:-nothing}"
          kubectl -n "$NAMESPACE" logs agent-a --tail=50 || true
          kubectl -n "$NAMESPACE" logs agent-b --tail=50 || true
          exit 1

      - name: Run Playwright E2E against staging
        id: staging-e2e
        working-directory: web
        run: npx playwright test --config=playwright.staging.config.ts

      - name: Summarise the staging browser tests
        if: always() && steps.staging-e2e.outcome != 'skipped'
        run: scripts/e2e-summarize.sh staging web/test-results/e2e-report.json >>"$GITHUB_STEP_SUMMARY"

      # The enrolment token expires within the hour and the next reset truncates its table.
      - name: Remove the staging machines
        if: always()
        run: |
          kubectl -n "$NAMESPACE" delete pod agent-a agent-b \
            --ignore-not-found --wait=false || true
          kubectl -n "$NAMESPACE" delete secret opengate-e2e-enrolment \
            --ignore-not-found || true

      - name: Stop port-forward
        if: always()
        run: kill "$(cat /tmp/pf.pid)" 2>/dev/null || true

      - name: Release the staging namespace
        if: always()
        run: scripts/staging-lease.sh release "$STAGING_LEASE_HOLDER"

      - name: Remove OCI credentials
        if: always()
        uses: ./.github/actions/oci-kube-teardown

  # Runs once staging deployed when STAGING_FAULT_TESTS is 'true', and gates production promotion;
  # STAGING_FAULT_PROFILE picks the scenario.
  staging-fault-drills:
    name: Staging fault drills
    needs: [resolve-tag, deploy-staging-k8s]
    if: >-
      ${{ !cancelled() &&
      needs.deploy-staging-k8s.result == 'success' &&
      needs.resolve-tag.outputs.should_skip_staging != 'true' &&
      vars.STAGING_FAULT_TESTS == 'true' }}
    uses: ./.github/workflows/fault-tolerance.yml
    with:
      scenario: ${{ vars.STAGING_FAULT_PROFILE || 'pod-delete' }}
      under_test: ${{ needs.resolve-tag.outputs.image_tag }}
    secrets: inherit

  deploy-production-k8s:
    name: Deploy production
    needs: [resolve-tag, deploy-staging-k8s, staging-fault-drills]
    # Promotes when staging deployed and the drills passed, or were skipped while switched off.
    if: >-
      ${{ !cancelled() &&
      needs.resolve-tag.outputs.should_skip_staging != 'true' &&
      needs.deploy-staging-k8s.result == 'success' &&
      (needs.staging-fault-drills.result == 'success' ||
      (needs.staging-fault-drills.result == 'skipped' && vars.STAGING_FAULT_TESTS != 'true')) }}
    runs-on: ubuntu-24.04
    environment: production
    env:
      IMAGE_TAG: ${{ needs.resolve-tag.outputs.image_tag }}
      NAMESPACE: opengate
      RELEASE: opengate
    steps:
      - uses: actions/checkout@v7

      - name: OCI + kubeconfig setup
        uses: ./.github/actions/oci-kube-setup
        with:
          oci-tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci-user: ${{ secrets.OCI_WORKFLOW_USER_OCID }}
          oci-fingerprint: ${{ secrets.OCI_WORKFLOW_FINGERPRINT }}
          oci-private-key: ${{ secrets.OCI_WORKFLOW_PRIVATE_KEY }}
          oci-region: ${{ secrets.OCI_REGION }}
          cluster-id: ${{ secrets.OKE_CLUSTER_ID }}

      - name: Sync the shared secret
        env:
          JWT_SECRET: ${{ secrets.DEPLOY_JWT_SECRET }}
          AMT_PASS: ${{ secrets.DEPLOY_AMT_PASS }}
          VAPID_CONTACT: ${{ secrets.DEPLOY_VAPID_CONTACT }}
          POSTGRES_PASSWORD: ${{ secrets.DEPLOY_POSTGRES_PASSWORD }}
          POSTGRES_APP_PASSWORD: ${{ secrets.DEPLOY_POSTGRES_APP_PASSWORD || secrets.DEPLOY_POSTGRES_PASSWORD }}
        run: deploy/scripts/shared-secret-sync.sh

      - name: Ensure database role honors RLS
        env:
          POSTGRES_APP_PASSWORD: ${{ secrets.DEPLOY_POSTGRES_APP_PASSWORD || secrets.DEPLOY_POSTGRES_PASSWORD }}
        run: |
          set -euo pipefail
          if ! kubectl -n "$NAMESPACE" get statefulset "${RELEASE}-postgres" >/dev/null 2>&1; then
            echo "Postgres StatefulSet not present yet; zz-app-role.sh will create opengate_app on first bootstrap."
            exit 0
          fi
          # The password reaches psql over stdin: a --set flag would land in the
          # pod's process list and in the API server's exec audit record.
          deploy/scripts/pg-app-role-sql.sh \
            | kubectl -n "$NAMESPACE" exec -i "statefulset/${RELEASE}-postgres" -- \
                psql -U opengate -d opengate -v ON_ERROR_STOP=1

      # One server, stopped before the next starts: a release whose server is not ready within the
      # wait is rolled back to the one before, and the step still fails.
      - name: Helm upgrade
        env:
          DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
        run: |
          helm upgrade --install "$RELEASE" deploy/helm/opengate -n "$NAMESPACE" \
            -f deploy/helm/opengate/values-production.yaml \
            --set image.tag="${IMAGE_TAG}" \
            --set server.replicas=1 \
            --set domain="$DOMAIN" \
            --set certManager.create=false \
            --atomic --wait --timeout 5m
          kubectl -n "$NAMESPACE" rollout status "deploy/${RELEASE}-server" --timeout=300s

      - name: Read back what this login may do
        run: deploy/scripts/workflow-access-readback.sh

      # Dry runs only: an outside pod is refused the master key, and the server's own is admitted.
      - name: Prove the master key's guard rule
        run: deploy/scripts/authority-readers-check.sh

      # The monitoring release follows its chart on every production deploy; a wait that runs out
      # names each pod short of ready, with its reason and last lines, and the step fails.
      - name: Helm upgrade monitoring
        env:
          DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
        run: |
          if ! helm upgrade --install monitoring deploy/helm/monitoring -n monitoring \
            -f deploy/helm/monitoring/values-production.yaml \
            --set domain="$DOMAIN" \
            --set clusterRBAC.create=false \
            --wait --timeout 5m; then
            deploy/scripts/pods-not-ready.sh monitoring
            exit 1
          fi

      # The running store is asked what it loaded, and every panel and rule is checked for
      # readings, waiting up to two minutes for a freshly started target.
      - name: Give the cluster the monitoring configuration this commit declares
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.DEPLOY_TELEGRAM_CHAT_ID }}
          MONITORING_NAMESPACE: monitoring
        run: deploy/scripts/monitoring-config-apply.sh

      # The dependency check reads what the repository declares, so nothing else may run.
      - name: Read back every image the cluster runs
        run: deploy/scripts/running-images-check.sh

      - name: Port-forward + smoke test
        run: |
          kubectl -n "$NAMESPACE" port-forward "svc/${RELEASE}-server" 18080:8080 18081:8081 >/tmp/pf.log 2>&1 &
          PF_PID=$!
          for _ in $(seq 1 30); do
            if curl -sf http://127.0.0.1:18080/api/v1/health >/dev/null; then
              break
            fi
            sleep 1
          done
          bash deploy/scripts/smoke-test.sh --host 127.0.0.1 --port 18080 --metrics-port 18081 --mode production --scheme http
          kill "$PF_PID" 2>/dev/null || true

      - name: Run smoke tests through the public edge
        env:
          DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
        run: bash deploy/scripts/smoke-test.sh --domain "$DOMAIN" --mode production

      # The edge reports the runner's address as it saw it; the helper must see the same one.
      - name: Ask the production helper where this runner comes from
        env:
          DOMAIN: ${{ secrets.DEPLOY_DOMAIN }}
        run: |
          set -euo pipefail
          HELPER="$(kubectl -n "$NAMESPACE" get deploy "${RELEASE}-server" -o jsonpath='{.spec.template.spec.containers[0].env[?(@.name=="OPENGATE_ICE_SERVERS")].value}' | cut -d, -f1)"
          test -n "$HELPER"
          SEEN="$(curl -4 -sSf --max-time 20 "https://${DOMAIN}/cdn-cgi/trace" | sed -n 's/^ip=//p')"
          test -n "$SEEN"
          python3 deploy/scripts/helper-probe.py "$HELPER" "$SEEN"

      - name: Remove OCI credentials
        if: always()
        uses: ./.github/actions/oci-kube-teardown

  notify-failure:
    name: Create failure issue
    needs: [resolve-tag, cluster, deploy-staging-k8s, staging-fault-drills, deploy-production-k8s]
    if: failure()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          sparse-checkout: .github/scripts
          sparse-checkout-cone-mode: false

      - name: Ensure cd-failure label exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh label create "cd-failure" \
            --description "Automated: CD pipeline failure" \
            --color "D93F0B" \
            --force \
            --repo "${{ github.repository }}"

      - name: Create or update failure issue
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          FAILURE_LABEL: cd-failure
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
          BRANCH: ${{ github.ref_name }}
          WORKFLOW: ${{ github.workflow }}
          SHA: ${{ github.sha }}
          EVENT: ${{ github.event_name }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: python3 .github/scripts/notify_failure.py
