name: Core Walk

# Proves the pinned, patched core reader follows a live object to its root on a fresh core.
# The newest unpatched upstream reader reads the same core; when it succeeds, the patch can go.
on:
  push:
    branches: [dev]
    paths:
      - server/go.mod
      - scripts/lib/tool-versions.sh
      - scripts/core-walk-check.sh
      - scripts/install-viewcore.sh
      - scripts/lib/reference-walk.sh
      - scripts/patches/viewcore-gcmask-on-demand.patch
      - .github/workflows/core-walk.yml
  schedule:
    # The hour sets a place in the order, behind the weekday batch.
    - cron: '30 6 * * *'
  workflow_dispatch:

concurrency:
  group: core-walk
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  walk:
    name: The pinned reader walks a core the pinned toolchain wrote
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      VIEWCORE_UPSTREAM: /tmp/viewcore-upstream
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: server/go.sum

      # gdb brings gcore, which takes the core; the reader matches the soak's pin and patch.
      - name: Install the core tools
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdb
          scripts/install-viewcore.sh "$(go env GOPATH)/bin/viewcore"
          echo "$(go env GOPATH)/bin" >>"$GITHUB_PATH"
          scripts/install-viewcore.sh --upstream "$VIEWCORE_UPSTREAM"

      - name: Walk a core the pinned toolchain wrote
        run: scripts/core-walk-check.sh /tmp/core-walk

      - name: Upload what the reader said
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: core-walk
          path: /tmp/core-walk
          if-no-files-found: ignore
          retention-days: 14

  # A job of its own reads the result, because a job killed at its timeout runs no step.
  alert:
    name: Alert if the run did not finish
    needs: [walk]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: observability
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-pinned-tools

      - name: Send Telegram alert
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.DEPLOY_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.DEPLOY_TELEGRAM_CHAT_ID }}
          RESULTS: walk=${{ needs.walk.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          LOST=""
          for entry in $RESULTS; do
            name="${entry%%=*}"
            result="${entry#*=}"
            case "$result" in
              success | skipped) ;;
              *) LOST="${LOST}  - ${name}: ${result}"$'\n' ;;
            esac
          done
          if [ -z "$LOST" ]; then
            echo "No alert sent: every job finished."
            exit 0
          fi
          scripts/telegram-alert.sh "$(printf 'The core-walk check did not pass, or says the reader patch can go:\n\n%s\nRun: %s' "$LOST" "$RUN_URL")"
