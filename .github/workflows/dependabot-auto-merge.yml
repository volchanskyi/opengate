name: Dependabot Auto-Merge

# Auto-merges patch and minor Dependabot PRs into `dev` once the required checks pass.
# Runs on pull_request_target because a Dependabot pull_request token is read-only.

on:
  pull_request_target:
    types: [opened, synchronize, reopened]

permissions: {}

jobs:
  auto-merge:
    name: Auto-merge patch + minor updates
    runs-on: ubuntu-24.04
    # The PR author field is fixed at creation, while `github.actor` can shift on re-runs.
    if: github.event.pull_request.user.login == 'dependabot[bot]'
    timeout-minutes: 5
    permissions:
      contents: write
      pull-requests: write
    env:
      PR_URL: ${{ github.event.pull_request.html_url }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Fetch Dependabot metadata
        id: metadata
        uses: dependabot/fetch-metadata@25dd0e34f4fe68f24cc83900b1fe3fe149efef98 # v3.1.0
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Enable auto-merge for patch + minor updates
        if: contains(fromJSON('["version-update:semver-patch", "version-update:semver-minor"]'), steps.metadata.outputs.update-type)
        run: gh pr merge --auto --squash "$PR_URL"

      - name: Comment on major-version updates
        if: steps.metadata.outputs.update-type == 'version-update:semver-major'
        run: |
          gh pr comment "$PR_URL" --body \
            "Major-version update — auto-merge deliberately skipped. Review for breaking changes; merge manually if accepted."
