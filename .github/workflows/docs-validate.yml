name: Docs Validate

# Parses every Mermaid fence with the parser pinned in tools/mermaid-validate/package-lock.json
# and runs scripts/check-doc-links over docs/ and .claude/.

on:
  push:
    branches: [dev]
    paths:
      - 'docs/**'
      - '.claude/**'
      - 'scripts/check-doc-links/**'
      - 'tools/mermaid-validate/**'
      - '.github/workflows/docs-validate.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'docs/**'
      - '.claude/**'
      - 'scripts/check-doc-links/**'
      - 'tools/mermaid-validate/**'
      - '.github/workflows/docs-validate.yml'
  workflow_dispatch:

permissions: {}

jobs:
  mermaid-syntax:
    name: Mermaid Syntax
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tools/mermaid-validate
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/mermaid-validate/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Validate Mermaid fences under docs/
        run: node validate-mermaid.mjs ../../docs

  links-and-contents:
    name: Links and Contents
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          # A standalone program with no module, so there is nothing to cache.
          cache: false
      - name: Every link resolves and every page opens with its contents
        run: GO111MODULE=off go run ./scripts/check-doc-links
