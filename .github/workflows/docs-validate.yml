name: Docs Validate

# Mermaid syntax validation. Catches a malformed fence (including experimental
# C4) before GitHub would render an error box. The same validator runs as a
# step in the local /precommit gauntlet, so this job is the CI backstop. The
# validator uses the official Mermaid parser pinned in
# tools/mermaid-validate/package-lock.json; GitHub's renderer is the
# authoritative check, this job is a fast pre-filter.

on:
  push:
    branches: [dev]
    paths:
      - 'docs/**'
      - 'tools/mermaid-validate/**'
      - '.github/workflows/docs-validate.yml'
  pull_request:
    branches: [main, dev]
    paths:
      - 'docs/**'
      - 'tools/mermaid-validate/**'
      - '.github/workflows/docs-validate.yml'
  workflow_dispatch:

permissions: {}

jobs:
  mermaid-syntax:
    name: Mermaid Syntax
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    defaults:
      run:
        working-directory: tools/mermaid-validate
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tools/mermaid-validate/package-lock.json
      - run: npm ci --ignore-scripts
      - name: Validate Mermaid fences under docs/
        run: node validate-mermaid.mjs ../../docs
