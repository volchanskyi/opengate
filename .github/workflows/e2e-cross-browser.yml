name: E2E Cross-Browser

# Runs the Playwright suite against Firefox and WebKit on dispatch and nightly, never on PRs.
# Playwright retries once when PLAYWRIGHT_ALL_BROWSERS=1, because WebKit flakes inside Docker.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 3 * * *'

permissions: {}

jobs:
  e2e:
    name: E2E (Firefox + WebKit + Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    env:
      PLAYWRIGHT_ALL_BROWSERS: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - name: Install Playwright browsers
        run: npx playwright install --with-deps
      - uses: ./.github/actions/docker-hub-mirror
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
      # The stack's two machines need the agent as a static binary staged for the image build.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: agent
      - name: Install musl tools
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build the agent
        working-directory: .
        run: make agent-binary
      - name: Run Playwright across all browsers
        id: pw
        run: |
          set -e
          cd ../deploy
          docker compose -f docker-compose.test.yml down -v 2>/dev/null || true
          bash scripts/e2e-stack-up.sh
          cd ../web
          # A flaky test passes on retry and exits 0, so the captured output is the next step's source.
          set +e
          npx playwright test 2>&1 | tee /tmp/playwright-output.txt
          ec=${PIPESTATUS[0]}
          set -e
          exit "$ec"
      - name: Summarize flaky tests
        # Always runs so flake visibility is preserved even when the job is
        # going red for an unrelated reason (e.g. Docker compose failure).
        if: always() && hashFiles('/tmp/playwright-output.txt') != ''
        run: |
          set -euo pipefail
          # Playwright's summary line looks like `  N flaky` followed by one
          # indented line per flaky test, then `  N skipped` / `  N passed`.
          FLAKY_LINE="$(grep -E '^[[:space:]]+[0-9]+[[:space:]]+flaky$' /tmp/playwright-output.txt || true)"
          if [[ -z "$FLAKY_LINE" ]]; then
            echo "no flaky tests"
            exit 0
          fi
          FLAKY_COUNT="$(echo "$FLAKY_LINE" | awk '{print $1}')"
          # Collects every line between the `N flaky` header and the next summary line.
          FLAKY_LIST="$(awk '
            /^[[:space:]]+[0-9]+[[:space:]]+flaky$/ {flag=1; next}
            /^[[:space:]]+[0-9]+[[:space:]]+(skipped|passed|did not run)/ {flag=0}
            flag {print}
          ' /tmp/playwright-output.txt)"
          echo "::warning::${FLAKY_COUNT} flaky test(s) passed only on retry — see job summary for the list"
          # Emit a per-flake warning so they show as annotations on the run.
          while IFS= read -r line; do
            [[ -z "$line" ]] && continue
            # Parameter expansion trims leading whitespace without a process per line.
            trimmed="${line#"${line%%[![:space:]]*}"}"
            echo "::warning::flaky: ${trimmed}"
          done <<< "$FLAKY_LIST"
          {
            echo "## :warning: Flaky tests (${FLAKY_COUNT})"
            echo ""
            echo "These tests **failed on first attempt and passed on retry** (Playwright \`retries: 1\` policy)."
            echo "They did not fail the job, but indicate browser-engine or infrastructure noise worth tracking."
            echo ""
            echo '```'
            echo "$FLAKY_LIST"
            echo '```'
            echo ""
            echo "Full HTML report: see the \`playwright-report-cross-browser\` artifact below."
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Tear down docker
        if: always()
        working-directory: deploy
        run: docker compose -f docker-compose.test.yml down -v
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-cross-browser
          path: web/playwright-report/
          retention-days: 14

  alert:
    name: Alert if the run did not finish
    # Firefox and WebKit run only here, so a lost night leaves them unwatched.
    needs: [e2e]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-pinned-tools

      - name: Send Telegram alert
        # `needs.<job>.result` is a fact about the named job and tells a cancel from a failure.
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.DEPLOY_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.DEPLOY_TELEGRAM_CHAT_ID }}
          RESULTS: e2e=${{ needs.e2e.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          LOST=""
          for entry in $RESULTS; do
            name="${entry%%=*}"
            result="${entry#*=}"
            case "$result" in
              success | skipped) ;;
              *) LOST="${LOST}  - ${name}: ${result}"$'\n' ;;
            esac
          done
          if [ -z "$LOST" ]; then
            echo "No alert sent: every job finished."
            exit 0
          fi
          scripts/telegram-alert.sh "$(printf 'The cross-browser run did not finish:\n\n%s\nRun: %s' "$LOST" "$RUN_URL")"
