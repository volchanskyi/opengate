name: E2E Performance

# Runs the speed specs nightly and on dispatch, kept off every push for the minutes they take, as up
# to four tries in a row: a try whose runner's processor is refused asks for a fresh runner.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions: {}

jobs:
  try-1:
    name: Try 1
    permissions:
      contents: read
    uses: ./.github/workflows/e2e-performance-try.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  try-2:
    name: Try 2
    needs: [try-1]
    if: ${{ !cancelled() && needs.try-1.outputs.refused == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/e2e-performance-try.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  try-3:
    name: Try 3
    needs: [try-2]
    if: ${{ !cancelled() && needs.try-2.outputs.refused == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/e2e-performance-try.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  try-4:
    name: Try 4
    needs: [try-3]
    if: ${{ !cancelled() && needs.try-3.outputs.refused == 'true' }}
    permissions:
      contents: read
    uses: ./.github/workflows/e2e-performance-try.yml
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  alert:
    name: Alert if the run did not finish
    # The speed specs run only here, so a red or lost night leaves their budgets unwatched.
    needs: [try-1, try-2, try-3, try-4]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-pinned-tools

      - name: Send Telegram alert
        # `needs.<job>.result` is a fact about the named job and tells a cancel from a failure.
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.DEPLOY_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.DEPLOY_TELEGRAM_CHAT_ID }}
          RESULTS: >-
            try-1=${{ needs.try-1.result }} try-2=${{ needs.try-2.result }}
            try-3=${{ needs.try-3.result }} try-4=${{ needs.try-4.result }}
          REFUSED: ${{ needs.try-4.outputs.refused }}
          PROCESSORS: >-
            ${{ needs.try-1.outputs.processor }}; ${{ needs.try-2.outputs.processor }};
            ${{ needs.try-3.outputs.processor }}; ${{ needs.try-4.outputs.processor }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          if [ "$REFUSED" = "true" ]; then
            scripts/telegram-alert.sh "$(printf 'The speed specs were skipped: four runners in a row had a refused processor (%s).\n\nRun: %s' "$PROCESSORS" "$RUN_URL")"
            exit 0
          fi
          LOST=""
          for entry in $RESULTS; do
            name="${entry%%=*}"
            result="${entry#*=}"
            case "$result" in
              success | skipped) ;;
              *) LOST="${LOST}  - ${name}: ${result}"$'\n' ;;
            esac
          done
          if [ -z "$LOST" ]; then
            echo "No alert sent: every job passed."
            exit 0
          fi
          scripts/telegram-alert.sh "$(printf 'The speed specs did not pass:\n\n%s\nRun: %s' "$LOST" "$RUN_URL")"
