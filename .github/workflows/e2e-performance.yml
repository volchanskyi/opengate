name: E2E Performance

# Runs the speed specs in Chromium against the stack's shaped routers, on dispatch and nightly.
# Every push runs the rest of the suite; these specs take minutes each to hold their budgets.

on:
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * *'

permissions: {}

jobs:
  e2e:
    name: E2E speed specs (Chromium)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    permissions:
      contents: read
    defaults:
      run:
        working-directory: web
    env:
      PLAYWRIGHT_PERFORMANCE: '1'
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      - uses: ./.github/actions/setup-pinned-tools
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
      - uses: ./.github/actions/docker-hub-mirror
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
      # The stack's two machines need the agent as a static binary staged for the image build.
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: x86_64-unknown-linux-musl
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: agent
      - name: Install musl tools
        working-directory: .
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools
      - name: Build the agent
        working-directory: .
        run: make agent-binary
      - name: Start the test stack
        working-directory: .
        run: bash deploy/scripts/e2e-stack-up.sh
      - name: Run the speed specs
        run: npx playwright test
      - name: Write the run summary
        # Runs on a red or a lost run too; a run that wrote no report says so in its summary.
        if: always()
        working-directory: .
        run: scripts/e2e-summarize.sh performance web/test-results/e2e-report.json >>"$GITHUB_STEP_SUMMARY"
      - name: Tear down docker
        if: always()
        working-directory: deploy
        run: docker compose -f docker-compose.test.yml down -v
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-performance
          path: web/playwright-report/
          retention-days: 14

  alert:
    name: Alert if the run did not finish
    # The speed specs run only here, so a red or lost night leaves their budgets unwatched.
    needs: [e2e]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-pinned-tools

      - name: Send Telegram alert
        # `needs.<job>.result` is a fact about the named job and tells a cancel from a failure.
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.DEPLOY_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.DEPLOY_TELEGRAM_CHAT_ID }}
          RESULTS: e2e=${{ needs.e2e.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          LOST=""
          for entry in $RESULTS; do
            name="${entry%%=*}"
            result="${entry#*=}"
            case "$result" in
              success | skipped) ;;
              *) LOST="${LOST}  - ${name}: ${result}"$'\n' ;;
            esac
          done
          if [ -z "$LOST" ]; then
            echo "No alert sent: every job passed."
            exit 0
          fi
          scripts/telegram-alert.sh "$(printf 'The speed specs did not pass:\n\n%s\nRun: %s' "$LOST" "$RUN_URL")"
