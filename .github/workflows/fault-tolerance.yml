name: Fault Tolerance Drills

# Deployed fault drills against opengate-staging, injected out-of-band by scripts/fault/.
# Called from cd.yml after staging E2E when the STAGING_FAULT_TESTS repo variable is set.

on:
  workflow_call:
    inputs:
      scenario:
        description: "Staging fault scenario to run (one of the enumerated allow-list)"
        required: true
        type: string
    secrets:
      OCI_TENANCY_OCID:
        required: true
      OCI_USER_OCID:
        required: true
      OCI_FINGERPRINT:
        required: true
      OCI_PRIVATE_KEY:
        required: true
      OCI_REGION:
        required: true
      OKE_CLUSTER_ID:
        required: true

# One staging fault run at a time: overlapping drills share one worker and its cleanup.
concurrency:
  group: fault-tolerance-staging
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  drill:
    name: Staging fault drill
    runs-on: ubuntu-24.04
    environment: staging
    # Exceeds the longest scenario: bad-rollout runs a 90s failing upgrade, a rollback and a verify.
    timeout-minutes: 20
    env:
      NAMESPACE: opengate-staging
      RELEASE: opengate-staging
      SCENARIO: ${{ inputs.scenario }}
      # Named once: the release step matches on this identity, and a claim
      # released under a different one is left to time out instead.
      STAGING_LEASE_HOLDER: fault-drill-${{ github.run_id }}-${{ github.run_attempt }}
      EVIDENCE_DIR: ${{ github.workspace }}/fault-evidence
    steps:
      - uses: actions/checkout@v7

      # workflow_call passes scenario as a free string, so it is checked against the allow-list.
      - name: Guard enumerated scenario
        run: |
          case "$SCENARIO" in
            pod-delete | bad-rollout | ingress-504 | ingress-502) ;;
            *)
              echo "::error::unknown or non-gating fault scenario '$SCENARIO'"
              echo "allowed: pod-delete, bad-rollout, ingress-504, ingress-502"
              exit 1
              ;;
          esac
          echo "Running staging fault scenario: $SCENARIO"

      - name: OCI + kubeconfig setup
        uses: ./.github/actions/oci-kube-setup
        with:
          oci-tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci-user: ${{ secrets.OCI_USER_OCID }}
          oci-fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          oci-private-key: ${{ secrets.OCI_PRIVATE_KEY }}
          oci-region: ${{ secrets.OCI_REGION }}
          cluster-id: ${{ secrets.OKE_CLUSTER_ID }}

      # The drill deletes pods in this namespace on purpose, which a load run
      # reading the same server would report as its own failure.
      - name: Take the staging namespace
        run: scripts/staging-lease.sh acquire "$STAGING_LEASE_HOLDER"

      - name: Run fault scenario
        run: |
          mkdir -p "$EVIDENCE_DIR"
          case "$SCENARIO" in
            pod-delete) scripts/fault/pod-delete.sh ;;
            bad-rollout) scripts/fault/bad-rollout.sh ;;
            ingress-504) scripts/fault/ingress-apply.sh edge-504 ;;
            ingress-502) scripts/fault/ingress-apply.sh edge-502 ;;
          esac

      # Reverts the ingress scenarios (idempotent) and asserts the Ingress carries no fault annotation.
      - name: Restore fault + verify no residue
        if: always()
        run: |
          case "$SCENARIO" in
            ingress-504) scripts/fault/ingress-restore.sh edge-504 ;;
            ingress-502) scripts/fault/ingress-restore.sh edge-502 ;;
          esac
          residue="$(kubectl get ingress "$RELEASE" -n "$NAMESPACE" \
            -o jsonpath='{.metadata.annotations}' 2>/dev/null || true)"
          if printf '%s' "$residue" | grep -q 'fault.opengate.dev'; then
            echo "::error::fault annotation residue left on ingress/$RELEASE"
            exit 1
          fi
          echo "No fault residue on the staging Ingress."

      - name: Upload drill evidence
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: fault-evidence-${{ inputs.scenario }}
          path: ${{ env.EVIDENCE_DIR }}
          if-no-files-found: warn
          retention-days: 30

      - name: Release the staging namespace
        if: always()
        run: scripts/staging-lease.sh release "$STAGING_LEASE_HOLDER"

      - name: Remove OCI credentials
        if: always()
        uses: ./.github/actions/oci-kube-teardown
