name: Fuzz

# Coverage-guided fuzzing of the mesh-protocol wire decoder, as observability.
# Runs nightly on a bounded budget; never gates merges or deploys. libFuzzer
# requires a nightly toolchain, so this is kept off the stable critical path —
# the always-run guard is the stable corpus-replay test
# (crates/mesh-protocol/tests/decode_corpus_test.rs), which runs in the normal
# CI Rust test job. A crash here is minimized and committed under
# agent/fuzz/corpus/decode so the stable replay re-runs it forever.

on:
  schedule:
    - cron: '0 4 * * *'  # nightly 04:00 UTC (after the 03:00 mutation/drift batch)
  workflow_dispatch:
    inputs:
      runs:
        description: Number of libFuzzer iterations
        required: false
        default: '5000000'

concurrency:
  group: fuzz
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  decode:
    name: Fuzz mesh-protocol decode
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: nightly
          components: rust-src
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: agent/fuzz
      - uses: taiki-e/install-action@94c31af3204a9f15ab40b35ad084410b905bbc73 # v2
        with:
          # Pinned in scripts/lib/tool-versions.sh; a bare name is whatever
          # released this morning.
          tool: cargo-fuzz@0.13.2
      - name: Run bounded fuzz session
        working-directory: ${{ github.workspace }}
        run: make fuzz-rust FUZZ_RUNS=${{ github.event.inputs.runs || '5000000' }}
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-decode-artifacts
          path: agent/fuzz/artifacts/
          if-no-files-found: ignore

  # Say so when the night was lost.
  #
  # Every nightly here published its verdict into its own result and nothing
  # read it: a run that died, was cancelled, or was killed at its timeout went
  # red on a page nobody opens. The alert path is the part that makes a red run
  # a thing somebody knows about.
  alert:
    name: Say so if the night was lost
    # A crash the fuzzer found is reported by the run's own result, and a run
    # that never got as far as fuzzing reports nothing at all unless something
    # outside it is looking.
    needs: [decode]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: observability
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-pinned-tools

      - name: Say what this night was
        # `needs.<job>.result` rather than `failure()`: the result is a fact
        # about the job named, and it is what the repository's other gate jobs
        # already read. It also tells a cancel from a failure, which matters —
        # one of them is somebody's decision and the other is a lost night.
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.DEPLOY_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.DEPLOY_TELEGRAM_CHAT_ID }}
          RESULTS: decode=${{ needs.decode.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          LOST=""
          for entry in $RESULTS; do
            name="${entry%%=*}"
            result="${entry#*=}"
            case "$result" in
              success | skipped) ;;
              *) LOST="${LOST}  - ${name}: ${result}"$'\n' ;;
            esac
          done
          if [ -z "$LOST" ]; then
            echo "Nothing to say: every job finished."
            exit 0
          fi
          scripts/telegram-alert.sh "$(printf 'The fuzzing run did not finish:\n\n%s\nRun: %s' "$LOST" "$RUN_URL")"
