name: Fuzz

# Nightly fuzzing of the mesh-protocol wire decoder on a bounded budget; it gates no merge.
# libFuzzer needs nightly Rust; the stable replay is mesh-protocol's decode_corpus_test.rs.

on:
  schedule:
    - cron: '0 4 * * *'  # nightly 04:00 UTC (after the 03:00 mutation/drift batch)
  workflow_dispatch:
    inputs:
      runs:
        description: Number of libFuzzer iterations
        required: false
        default: '5000000'

concurrency:
  group: fuzz
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  decode:
    name: Fuzz mesh-protocol decode
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: nightly
          components: rust-src
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: agent/fuzz
      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2
        with:
          # Pinned in scripts/lib/tool-versions.sh; a bare name is whatever
          # released this morning.
          tool: cargo-fuzz@0.13.2
      - name: Run bounded fuzz session
        working-directory: ${{ github.workspace }}
        run: make fuzz-rust FUZZ_RUNS=${{ github.event.inputs.runs || '5000000' }}
      - name: Upload crash artifacts
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: fuzz-decode-artifacts
          path: agent/fuzz/artifacts/
          if-no-files-found: ignore

  alert:
    name: Alert if the run did not finish
    # A run that dies, is cancelled or times out before fuzzing reports nothing by itself.
    needs: [decode]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-pinned-tools

      - name: Send Telegram alert
        # `needs.<job>.result` is a fact about the named job and tells a cancel from a failure.
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.DEPLOY_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.DEPLOY_TELEGRAM_CHAT_ID }}
          RESULTS: decode=${{ needs.decode.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          LOST=""
          for entry in $RESULTS; do
            name="${entry%%=*}"
            result="${entry#*=}"
            case "$result" in
              success | skipped) ;;
              *) LOST="${LOST}  - ${name}: ${result}"$'\n' ;;
            esac
          done
          if [ -z "$LOST" ]; then
            echo "No alert sent: every job finished."
            exit 0
          fi
          scripts/telegram-alert.sh "$(printf 'The fuzzing run did not finish:\n\n%s\nRun: %s' "$LOST" "$RUN_URL")"
