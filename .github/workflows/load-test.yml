name: Load Tests

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      agents:
        description: >-
          The estate the profile draws its machines from. It has to cover the
          profile's own highest level: a machine that cannot be given an
          identity has not arrived, and a run short of the level it declared is
          a mis-sized run rather than a finding about the system.
        required: false
        default: "500"
      fixture:
        description: >-
          Fleet to build before the run. The nightly builds the reference fleet;
          the two larger ones exist for a deliberate run, because staging's
          database shares the node root production sits on and a fleet four times
          the size has not yet been weighed there.
        required: false
        default: small
        type: choice
        options: [small, large, lopsided]

concurrency:
  group: load-test
  cancel-in-progress: false

env:
  K6_VERSION: v1.6.1
  # The bundle records screen-open counts, which the export carries only when count is requested.
  K6_SUMMARY_TREND_STATS: avg,min,med,p(50),p(95),p(99),max,count
  LOADTEST_K6_SUMMARY_DIR: /tmp/loadtest-k6
  LOADTEST_QUIC_OUTPUT: /tmp/loadtest-quic.txt
  # The hold is the floor under the profile's walk and covers all of it, since a machine whose hold
  # ran out leaves on its next reconnect.
  LOADTEST_HOLD: 12m
  NAMESPACE: opengate-staging
  RELEASE: opengate-staging
  # Every identity a run creates derives from this id, so each night's addresses are unique.
  LOADTEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  # The release step matches on this identity, so it is named once.
  STAGING_LEASE_HOLDER: load-test-${{ github.run_id }}-${{ github.run_attempt }}
  # The deployment seeds this administrator, which the enrollment token is minted against.
  LOADTEST_SERVICE_ACCOUNT: opengate-service@service.invalid
  # The profile declares the load shape and every number the night's rows are judged against.
  LOADTEST_PROFILE: load/profiles/normal.yaml
  # This label puts generator pods behind the service the staging server treats as a proxy.
  # The chart's selector is held equal to it by scripts/tests/loadtest-rate-budget.test.sh.
  LOADTEST_GENERATOR_LABEL: opengate.io/loadtest-generator

permissions:
  contents: read

jobs:
  load-test:
    name: Load Tests (k6 + QUIC)
    runs-on: ubuntu-24.04
    # The budget covers the verdict wait derived from the hold plus the 25 minute namespace claim wait.
    # scripts/tests/loadtest-run-budget.test.sh holds the sum against this.
    timeout-minutes: 60
    # `environment: staging` would put its required reviewers in front of the scheduled run.
    # The job uses repository-level OCI credentials and creates short-lived test pods.
    outputs:
      started_at: ${{ steps.started.outputs.at }}
    steps:
      # Every sample of the night carries this time, so a re-run of failed jobs writes the same point.
      - name: Record when the run started
        id: started
        run: echo "at=$(date -u +%s)" >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: server/go.sum

      - name: OCI + kubeconfig setup
        uses: ./.github/actions/oci-kube-setup
        with:
          oci-tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci-user: ${{ secrets.OCI_USER_OCID }}
          oci-fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          oci-private-key: ${{ secrets.OCI_PRIVATE_KEY }}
          oci-region: ${{ secrets.OCI_REGION }}
          cluster-id: ${{ secrets.OKE_CLUSTER_ID }}

      # The staging deploy rolls the server, truncates the account and loads the node, so each side
      # takes the namespace first; the wait covers a deploy and a drill.
      - name: Take the staging namespace
        env:
          STAGING_LEASE_WAIT_SECONDS: "1500"
        run: scripts/staging-lease.sh acquire "$STAGING_LEASE_HOLDER"

      # Both phases run their generator in the cluster, so both need the server pod and its arch.
      - name: Resolve staging target
        run: |
          set -euo pipefail
          # The rollout wait matches the deploy's own wait.
          kubectl -n "$NAMESPACE" rollout status "deploy/${RELEASE}-server" --timeout=300s
          SERVER_POD="$(kubectl -n "$NAMESPACE" get pods \
            -l "app.kubernetes.io/instance=${RELEASE},app.kubernetes.io/component=server" \
            -o jsonpath='{.items[0].metadata.name}')"
          SERVER_POD_IP="$(kubectl -n "$NAMESPACE" get pod "$SERVER_POD" \
            -o jsonpath='{.status.podIP}')"
          SERVER_NODE="$(kubectl -n "$NAMESPACE" get pod "$SERVER_POD" \
            -o jsonpath='{.spec.nodeName}')"
          LOADTEST_GOARCH="$(kubectl get node "$SERVER_NODE" \
            -o jsonpath='{.status.nodeInfo.architecture}')"
          # The target's limits are known to the cluster alone, so they are read off the running container.
          LOADTEST_TARGET_CPUS="$(kubectl -n "$NAMESPACE" get pod "$SERVER_POD" \
            -o jsonpath='{.spec.containers[?(@.name=="server")].resources.limits.cpu}')"
          LOADTEST_TARGET_MEMORY="$(kubectl -n "$NAMESPACE" get pod "$SERVER_POD" \
            -o jsonpath='{.spec.containers[?(@.name=="server")].resources.limits.memory}')"
          test -n "$LOADTEST_TARGET_CPUS"
          test -n "$LOADTEST_TARGET_MEMORY"
          case "$LOADTEST_GOARCH" in
            amd64|arm64) ;;
            *) echo "::error::Unsupported OKE node architecture: $LOADTEST_GOARCH"; exit 1 ;;
          esac
          test -n "$SERVER_POD_IP"
          {
            echo "SERVER_POD=$SERVER_POD"
            echo "SERVER_POD_IP=$SERVER_POD_IP"
            echo "LOADTEST_GOARCH=$LOADTEST_GOARCH"
            # The in-cluster listener is plaintext because TLS terminates at the ingress.
            echo "LOADTEST_BASE_URL=http://${RELEASE}-server:8080"
            # The exposition is on the server's second listener, published on its own Service port.
            echo "LOADTEST_METRICS_URL=http://${RELEASE}-server:8081"
            # The harness records a processor share as a fraction and memory as bytes.
            echo "LOADTEST_TARGET_CPUS=$(scripts/k8s-quantity.sh cpu "$LOADTEST_TARGET_CPUS")"
            echo "LOADTEST_TARGET_MEMORY_BYTES=$(scripts/k8s-quantity.sh memory "$LOADTEST_TARGET_MEMORY")"
            echo "LOADTEST_TARGET_DESCRIPTION=${RELEASE}-server, ${LOADTEST_TARGET_CPUS} / ${LOADTEST_TARGET_MEMORY} on ${LOADTEST_GOARCH}"
          } >>"$GITHUB_ENV"

      - name: Install k6
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-${LOADTEST_GOARCH}.tar.gz" \
            | tar -xz -C /tmp
          install -m 0755 "/tmp/k6-${K6_VERSION}-linux-${LOADTEST_GOARCH}/k6" /tmp/k6

      - name: Prepare load-test summaries
        run: install -d -m 0755 "$LOADTEST_K6_SUMMARY_DIR"

      # The generator pods live as long as the hold this file declares.
      - name: Size the run from the hold it declares
        run: scripts/loadtest-run-budget.sh >>"$GITHUB_ENV"

      - name: Stage k6 harness in cluster
        run: |
          set -euo pipefail
          # The helper names which cluster calls may be repeated after a dropped connection.
          . scripts/lib/kubectl-retry.sh
          LOADTEST_K6_POD="k6-loadtest-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "LOADTEST_K6_POD=$LOADTEST_K6_POD" >>"$GITHUB_ENV"

          # The generator reserves little and may burst high, because reservation governs admission.
          # The memory cap covers three k6 runtimes and their virtual users sharing this pod.
          kubectl -n "$NAMESPACE" run "$LOADTEST_K6_POD" \
            --image=docker.io/library/alpine:3.21.3 \
            --restart=Never \
            --labels="$LOADTEST_GENERATOR_LABEL=true" \
            --overrides='{"spec":{"containers":[{"name":"'"$LOADTEST_K6_POD"'","image":"docker.io/library/alpine:3.21.3","command":["sleep","'"$LOADTEST_POD_LIFETIME_SECONDS"'"],"resources":{"requests":{"cpu":"75m","memory":"128Mi"},"limits":{"cpu":"600m","memory":"768Mi"}}}]}}' \
            --command -- sleep "$LOADTEST_POD_LIFETIME_SECONDS"
          deploy/scripts/wait-for-pod-ready.sh "$LOADTEST_K6_POD" 120
          # These calls are short and idempotent, so repeating them is safe.
          kubectl_retry -n "$NAMESPACE" exec "$LOADTEST_K6_POD" -- mkdir -p /tmp/load "$LOADTEST_K6_SUMMARY_DIR"
          kubectl_retry -n "$NAMESPACE" cp /tmp/k6 "$LOADTEST_K6_POD:/tmp/k6"
          kubectl_retry -n "$NAMESPACE" cp load/. "$LOADTEST_K6_POD:/tmp/load"
          kubectl_retry -n "$NAMESPACE" exec "$LOADTEST_K6_POD" -- chmod 0755 /tmp/k6
          kubectl_retry -n "$NAMESPACE" exec "$LOADTEST_K6_POD" -- /tmp/k6 version

      - name: Build QUIC load test harness
        working-directory: server
        run: CGO_ENABLED=0 GOOS=linux GOARCH="$LOADTEST_GOARCH" go build -trimpath -o /tmp/loadtest ./tests/loadtest/

      # The harness enrols as an installer does, with its own private keys and signing requests.
      # The certificate authority's key stays in the cluster, since it would mint a trusted machine.
      - name: Read the load-test service account's password, and seed the account
        run: |
          set -euo pipefail
          PASSWORD="$(kubectl -n "$NAMESPACE" get secret \
            "${RELEASE}-loadtest-account" -o jsonpath='{.data.password}' | base64 -d)"
          test -n "$PASSWORD"
          echo "::add-mask::$PASSWORD"
          echo "LOADTEST_SERVICE_PASSWORD=$PASSWORD" >>"$GITHUB_ENV"
          # Standard input keeps the password out of the psql argv and the API server's exec audit entry.
          # Not retried: a dropped connection cannot say whether the statements landed.
          ACCOUNT_EMAIL="$LOADTEST_SERVICE_ACCOUNT" ACCOUNT_PASSWORD="$PASSWORD" \
            deploy/scripts/loadtest-account-sql.sh \
            | kubectl -n "$NAMESPACE" exec -i "statefulset/${RELEASE}-postgres" -- \
                psql -U opengate -d opengate -v ON_ERROR_STOP=1 -q
          echo "load-test administrator present: $LOADTEST_SERVICE_ACCOUNT"

      - name: Stage QUIC harness in cluster
        run: |
          set -euo pipefail
          # The helper names which cluster calls may be repeated after a dropped connection.
          . scripts/lib/kubectl-retry.sh
          LOADTEST_POD="quic-loadtest-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "LOADTEST_POD=$LOADTEST_POD" >>"$GITHUB_ENV"

          # The Service carries the HTTP port only, so the certificate's name is pointed at the pod IP.
          # An agent takes its TLS name from the host half of its address, so dial and verify names match.
          kubectl -n "$NAMESPACE" run "$LOADTEST_POD" \
            --image=docker.io/library/alpine:3.21.3 \
            --restart=Never \
            --labels="$LOADTEST_GENERATOR_LABEL=true" \
            --overrides='{"spec":{"hostAliases":[{"ip":"'"$SERVER_POD_IP"'","hostnames":["'"${RELEASE}"'-server"]}],"containers":[{"name":"'"$LOADTEST_POD"'","image":"docker.io/library/alpine:3.21.3","command":["sleep","'"$LOADTEST_POD_LIFETIME_SECONDS"'"],"resources":{"requests":{"cpu":"75m","memory":"128Mi"},"limits":{"cpu":"400m","memory":"384Mi"}}}]}}' \
            --command -- sleep "$LOADTEST_POD_LIFETIME_SECONDS"
          deploy/scripts/wait-for-pod-ready.sh "$LOADTEST_POD" 120
          # Staging into a pod that is already up is short and idempotent.
          kubectl_retry -n "$NAMESPACE" cp /tmp/loadtest "$LOADTEST_POD:/tmp/loadtest"
          kubectl_retry -n "$NAMESPACE" exec "$LOADTEST_POD" -- chmod 0755 /tmp/loadtest

          # The profile travels with the harness because the pod holds no checkout.
          # The in-pod path is exported so the copy and the flag name the same file.
          kubectl_retry -n "$NAMESPACE" cp "$LOADTEST_PROFILE" \
            "$LOADTEST_POD:/tmp/$(basename "$LOADTEST_PROFILE")"
          echo "LOADTEST_POD_PROFILE=/tmp/$(basename "$LOADTEST_PROFILE")" >>"$GITHUB_ENV"

      - name: Start the QUIC fleet and hold it connected
        run: |
          set -euo pipefail
          AGENTS="${{ inputs.agents || '500' }}"
          # The harness runs detached in the pod and the step returns once it offers its fleet.
          scripts/loadtest-quic-incluster.sh start -- \
            /tmp/loadtest \
              -agents="$AGENTS" \
              -addr="${RELEASE}-server:9090" \
              -enroll-url="$LOADTEST_BASE_URL" \
              -metrics-url="$LOADTEST_METRICS_URL" \
              -fixture-account="$LOADTEST_SERVICE_ACCOUNT" \
              -fixture-password="$LOADTEST_SERVICE_PASSWORD" \
              -fixture-size="${{ inputs.fixture || 'small' }}" \
              -fixture-seed="$GITHUB_RUN_ID" \
              -relay-sessions \
              -hold="$LOADTEST_HOLD" \
              -profile="$LOADTEST_POD_PROFILE" \
              -commit="$GITHUB_SHA" \
              -target-cpus="$LOADTEST_TARGET_CPUS" \
              -target-memory-bytes="$LOADTEST_TARGET_MEMORY_BYTES" \
              -target-description="$LOADTEST_TARGET_DESCRIPTION" \
              -bundle=/tmp/loadtest-bundle

      # Scenarios pick a building once at setup, and a machine is filed into a building only after
      # it registers, so this wait lets the filing finish first.
      - name: Wait for the estate to be filed
        run: scripts/loadtest-quic-incluster.sh await-filed

      # The browser-side generators join the machine-side walk where it is, so every phase lines up.
      - name: Say how far the walk has already gone
        run: |
          set -euo pipefail
          started="$(scripts/loadtest-quic-incluster.sh walk-started-at)"
          echo "LOADTEST_WALK_ELAPSED_SECONDS=$(( $(date +%s) - started ))" >>"$GITHUB_ENV"

      # The three scenarios walk one profile concurrently, each presenting addresses from its own block.
      # Waiting on each named job checks all three statuses and keeps what the others measured.
      - name: Run the browser-side scenarios against the walk
        run: |
          set -uo pipefail
          declare -A running=()
          for scenario in api-baseline concurrent-agents relay-throughput; do
            K6_BIN=scripts/loadtest-k6-incluster.sh \
              scripts/loadtest-k6-run.sh "$scenario" "/tmp/load/k6/scenarios/$scenario.js" &
            running["$scenario"]=$!
          done

          failed=0
          for scenario in "${!running[@]}"; do
            if ! wait "${running[$scenario]}"; then
              echo "::error::k6 scenario $scenario did not finish; the night is short of its numbers."
              failed=1
            fi
          done
          exit "$failed"

      - name: Cleanup k6 load test pod
        if: always()
        run: |
          if [[ -n "${LOADTEST_K6_POD:-}" ]]; then
            kubectl -n "$NAMESPACE" delete pod "$LOADTEST_K6_POD" --ignore-not-found --wait=false
          fi

      # The fleet's output and exit code are read back from the pod on every path, since a failed
      # scenario is where the fleet's log holds the answer.
      - name: Wait for the QUIC fleet to finish
        if: always()
        run: |
          set -euo pipefail
          # Exit 1 is a partly arrived fleet, a measurement the gate and completeness steps judge.
          set +e
          scripts/loadtest-quic-run.sh "$LOADTEST_QUIC_OUTPUT" -- \
            scripts/loadtest-quic-incluster.sh collect
          collected=$?
          set -e
          if [ "$collected" -gt 1 ]; then
            echo "::error::the QUIC harness did not complete a run (exit $collected)." >&2
            exit "$collected"
          fi

      - name: Collect the QUIC evidence bundle
        if: always()
        run: |
          set -euo pipefail
          # The helper names which cluster calls may be repeated after a dropped connection.
          . scripts/lib/kubectl-retry.sh
          mkdir -p loadtest-bundle
          kubectl_retry -n "$NAMESPACE" cp "$LOADTEST_POD:/tmp/loadtest-bundle/bundle.json" \
            loadtest-bundle/quic-agents.json 2>/dev/null \
            || echo "::warning::the QUIC harness wrote no evidence bundle"

          # The browser-side generator runs in another pod, so its screen timings join the bundle here.
          if [ -s loadtest-bundle/quic-agents.json ] \
            && [ -s "$LOADTEST_K6_SUMMARY_DIR/api-baseline.json" ]; then
            scripts/loadtest-bundle-merge.sh loadtest-bundle/quic-agents.json \
              --journeys "$LOADTEST_K6_SUMMARY_DIR/api-baseline.json"
          fi

      # The pod, the local build and the spent token go whatever the run's verdict was.
      - name: Cleanup QUIC load test pod and spent credential
        if: always()
        run: |
          if [[ -n "${LOADTEST_POD:-}" ]]; then
            kubectl -n "$NAMESPACE" delete pod "$LOADTEST_POD" --ignore-not-found --wait=false
          fi
          POSTGRES_POD="$(kubectl -n "$NAMESPACE" get pods \
            -l "app.kubernetes.io/instance=${RELEASE},app.kubernetes.io/component=postgres" \
            -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
          if [[ -n "$POSTGRES_POD" ]]; then
            # Standard input expands the -v variable, which -c never does.
            # Not retried: the delete tolerates its own failure and the next deploy's reset covers it.
            kubectl -n "$NAMESPACE" exec -i "$POSTGRES_POD" -- \
              psql -U opengate -d opengate -q \
                -v marker="opengate-loadtest" <<'SQL' || true
            DELETE FROM enrollment_tokens WHERE label LIKE '%' || :'marker' || '%';
          SQL
          fi
          rm -rf /tmp/loadtest /tmp/k6 /tmp/k6-"${K6_VERSION}"-linux-amd64

      # The cleanup proof is what the evidence bundle carries.
      - name: Remove what the run created, and prove it
        if: always()
        run: |
          set -euo pipefail
          POSTGRES_POD="$(kubectl -n "$NAMESPACE" get pods \
            -l "app.kubernetes.io/instance=${RELEASE},app.kubernetes.io/component=postgres" \
            -o jsonpath='{.items[0].metadata.name}')"
          test -n "$POSTGRES_POD"
          # Not retried: this handle makes a non-idempotent write, so a drop cannot say whether it landed.
          LOADTEST_PSQL="kubectl -n $NAMESPACE exec -i $POSTGRES_POD -- psql -U opengate -d opengate" \
            scripts/loadtest-cleanup.sh loadtest-cleanup.json

      # The harness writes its bundle before cleanup, so the proof is folded in afterwards.
      - name: Fold the cleanup proof into the evidence
        if: always()
        run: |
          set -euo pipefail
          if [ ! -s loadtest-bundle/quic-agents.json ]; then
            echo "there is no evidence bundle to fold the cleanup proof into"
            exit 0
          fi
          scripts/loadtest-bundle-merge.sh loadtest-bundle/quic-agents.json --cleanup loadtest-cleanup.json

      - name: Build canonical load-test summary
        if: always()
        run: |
          K6_SUMMARY_DIR="$LOADTEST_K6_SUMMARY_DIR" \
            QUIC_OUTPUT_FILE="$LOADTEST_QUIC_OUTPUT" \
            scripts/loadtest-summarize.sh > loadtest-summary.json
          # The raw exports stage inside the workspace so the artifact layout is workspace-relative.
          mkdir -p loadtest-k6-raw
          cp "$LOADTEST_K6_SUMMARY_DIR"/*.json loadtest-k6-raw/ 2>/dev/null || true
          cp "$LOADTEST_K6_SUMMARY_DIR"/*.thresholds loadtest-k6-raw/ 2>/dev/null || true

      # The profile's limits are read against the summary rows, where both halves of the night meet.
      # The breach file feeds the completeness verdict; exit 2 means the limits could not be read.
      - name: Read the profile's limits against tonight's rows
        if: always()
        run: |
          set -euo pipefail
          set +e
          scripts/loadtest-gate-check.sh "$LOADTEST_PROFILE" \
            loadtest-summary.json loadtest-gate-breaches.json
          GATE_STATUS=$?
          set -e
          if [ "$GATE_STATUS" -ge 2 ]; then
            echo "::error::the profile's limits could not be read, which is not the same as no limit being breached."
            exit "$GATE_STATUS"
          fi

      # Reads the canonical rows the step above produced, so it runs after it.
      - name: Record run completeness
        if: always()
        run: |
          set -euo pipefail
          set +e
          LOADTEST_K6_SUMMARY_DIR="$LOADTEST_K6_SUMMARY_DIR" \
            LOADTEST_BUNDLE=loadtest-bundle/quic-agents.json \
            LOADTEST_GATE_BREACHES=loadtest-gate-breaches.json \
            scripts/loadtest-run-completeness.sh loadtest-summary.json loadtest-completeness.json
          COMPLETENESS_STATUS=$?
          set -e
          # Exit 3 is a run that measured nothing and stays out of the trend, where it would drag the
          # window median down. Exit 4 is a run past a limit whose rows enter the trend. Both redden the job.
          exit "$COMPLETENESS_STATUS"

      # The raw k6 exports separate a summary row that lost its metrics from a scenario never run.
      - name: Upload canonical load-test summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: loadtest-summary
          path: |
            loadtest-summary.json
            loadtest-completeness.json
            loadtest-gate-breaches.json
            loadtest-cleanup.json
            loadtest-k6-raw
            loadtest-bundle
          if-no-files-found: error
          retention-days: 90

      - name: Release the staging namespace
        if: always()
        run: scripts/staging-lease.sh release "$STAGING_LEASE_HOLDER"

      - name: Remove OCI credentials
        if: always()
        uses: ./.github/actions/oci-kube-teardown

  publish:
    name: Publish load-test trend
    needs: [load-test]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # This job's result is the observability deployment status, so it reports only whether the trend
    # was collected and published; the regression verdict is the gate job's.
    environment: observability
    permissions:
      contents: read
    outputs:
      regression: ${{ steps.check.outputs.regression }}
    env:
      # When the run started, which every sample of the night carries.
      VM_RUN_STARTED_AT: ${{ needs.load-test.outputs.started_at }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-pinned-tools
      - name: OCI + kubeconfig setup
        uses: ./.github/actions/oci-kube-setup
        with:
          oci-tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci-user: ${{ secrets.OCI_USER_OCID }}
          oci-fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          oci-private-key: ${{ secrets.OCI_PRIVATE_KEY }}
          oci-region: ${{ secrets.OCI_REGION }}
          cluster-id: ${{ secrets.OKE_CLUSTER_ID }}

      - name: Download load-test summary
        uses: actions/download-artifact@v8
        with:
          name: loadtest-summary
          path: artifacts/loadtest

      # A run that measured nothing stays out of the trend, and an absent verdict fails as loudly.
      - name: Read the run's own verdict before publishing anything
        run: |
          set -euo pipefail
          VERDICT_FILE=artifacts/loadtest/loadtest-completeness.json
          if [ ! -s "$VERDICT_FILE" ]; then
            echo "::error::the run wrote no completeness verdict, so whether it measured anything is unknown."
            exit 1
          fi
          RESULT="$(jq -r '.result // empty' "$VERDICT_FILE")"
          echo "run verdict: ${RESULT:-<none>}"
          if [ "$RESULT" != "valid" ] && [ "$RESULT" != "failed" ]; then
            jq . "$VERDICT_FILE"
            echo "::error::this run did not measure the system, so its rows do not enter the trend."
            exit 1
          fi

      - name: Check regression
        id: check
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          set +e
          ./scripts/loadtest-regression-check.sh artifacts/loadtest/loadtest-summary.json > loadtest-regression.out 2>&1
          CHECK_STATUS=$?
          set -e

          cat loadtest-regression.out

          case "$CHECK_STATUS" in
            0) REGRESSION=0 ;;
            1) REGRESSION=1 ;;
            2)
              echo "regression=0" >> "$GITHUB_OUTPUT"
              echo "::error::Load-test summary input missing or invalid."
              exit 2
              ;;
            *)
              echo "regression=0" >> "$GITHUB_OUTPUT"
              echo "::error::loadtest-regression-check.sh failed with unexpected exit ${CHECK_STATUS}"
              exit "$CHECK_STATUS"
              ;;
          esac

          ROWS="$(grep -E '^\[' loadtest-regression.out | tail -n 1 || true)"
          if [ -z "$ROWS" ]; then
            echo "::error::loadtest-regression-check.sh produced no canonical JSON row array"
            exit 2
          fi
          printf '%s\n' "$ROWS" > loadtest-rows.json

          echo "regression=$REGRESSION" >> "$GITHUB_OUTPUT"
          ALERT_TEXT="$(grep '^REGRESSION_ALERT:' loadtest-regression.out | sed 's/^REGRESSION_ALERT://' || true)"
          {
            echo "alert_text<<EOF"
            echo "$ALERT_TEXT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload canonical rows as artifact
        uses: actions/upload-artifact@v7
        with:
          name: loadtest-canonical-rows
          path: loadtest-rows.json
          retention-days: 90

      - name: Push to VictoriaMetrics
        # The consecutive-night counts ride along, since the next night's check has no other memory.
        run: ./scripts/loadtest-vm-push.sh loadtest-rows.json loadtest-p99-streaks.json

      - name: Write GITHUB_STEP_SUMMARY
        run: |
          set -euo pipefail
          BUNDLE=artifacts/loadtest/loadtest-bundle/quic-agents.json
          SUMMARY_ARGS=(--title "Nightly load test" --profile "$LOADTEST_PROFILE" --rows loadtest-rows.json)
          if [ -s "$BUNDLE" ]; then
            SUMMARY_ARGS+=(--bundle "$BUNDLE")
            read -r FROM TO <<<"$(scripts/run-summary.sh window "$LOADTEST_PROFILE" "$BUNDLE")"
            if [ -n "${FROM:-}" ]; then
              scripts/database-levels.sh cluster "$NAMESPACE" "$FROM" "$TO" >database-levels.json
              SUMMARY_ARGS+=(--database database-levels.json)
            fi
          fi
          {
            echo "Commit: \`${{ github.sha }}\`"
            echo "Regression against the nights before: \`${{ steps.check.outputs.regression }}\`"
            echo ""
            scripts/run-summary.sh render "${SUMMARY_ARGS[@]}"
            if grep -q '^P99_ADVISORY:' loadtest-regression.out; then
              echo ""
              echo "## p99 advisories"
              grep '^P99_ADVISORY:' loadtest-regression.out | sed 's/^P99_ADVISORY:/- /'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Send Telegram alert
        # Runs whatever happened above it, and the message names which of the three it was.
        # A refused send reddens this job and hides nothing, since a separate job reads the verdict.
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.DEPLOY_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.DEPLOY_TELEGRAM_CHAT_ID }}
          FINDING: ${{ steps.check.outputs.regression }}
          ALERT_TEXT: ${{ steps.check.outputs.alert_text }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = "success" ] && [ "${FINDING:-0}" != "1" ]; then
            echo "No alert sent: the run finished and found nothing."
            exit 0
          fi
          if [ "${FINDING:-0}" = "1" ]; then
            MSG="$(printf '%s\n\nRun: %s\nTrend: Grafana dashboard "Load Test Trends" (opengate-loadtest-trend)' "$ALERT_TEXT" "$RUN_URL")"
          else
            MSG="$(printf 'Load-test trend: the night did not finish (%s), so nothing was measured.\n\nRun: %s' \
              "$JOB_STATUS" "$RUN_URL")"
          fi
          scripts/telegram-alert.sh "$MSG"

      - name: Remove OCI credentials
        if: always()
        uses: ./.github/actions/oci-kube-teardown

  gate:
    name: Load-test regression gate
    needs: [publish]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Fail workflow red on regression
        run: |
          if [ "${{ needs.publish.result }}" != "success" ]; then
            echo "::error::Load-test trend publishing did not succeed; see the publish job."
            exit 1
          fi
          if [ "${{ needs.publish.outputs.regression }}" = "1" ]; then
            echo "::error::Load-test regression detected (latency/rps/error_rate vs VM window or absolute ceilings) — see workflow summary and Telegram alert (if delivered)."
            exit 1
          fi
          echo "No load-test regression."
