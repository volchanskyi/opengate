name: Load Tests

on:
  schedule:
    - cron: '0 5 * * *'
  workflow_dispatch:
    inputs:
      agents:
        description: "Number of QUIC agents to simulate"
        required: false
        default: "100"
      fixture:
        description: >-
          Fleet to build before the run. The nightly builds the reference fleet;
          the two larger ones exist for a deliberate run, because staging's
          database shares the node root production sits on and a fleet four times
          the size has not yet been weighed there.
        required: false
        default: small
        type: choice
        options: [small, large, lopsided]

concurrency:
  group: load-test
  cancel-in-progress: false

env:
  K6_VERSION: v1.6.1
  K6_SUMMARY_TREND_STATS: avg,min,med,p(50),p(95),p(99),max
  LOADTEST_K6_SUMMARY_DIR: /tmp/loadtest-k6
  LOADTEST_QUIC_OUTPUT: /tmp/loadtest-quic.txt
  # How long the QUIC fleet stays connected. It has to outlast the three k6
  # scenarios beside it, because the relay scenario needs a machine on the other
  # end of every session it opens.
  LOADTEST_HOLD: 8m
  NAMESPACE: opengate-staging
  RELEASE: opengate-staging
  # Every identity a run creates is built from this. Left unset it falls back to
  # a fixed word, every night asks for the same three addresses, and the second
  # night is refused as a duplicate — which is what happened.
  LOADTEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
  # Named once: the release step matches on this identity, and a claim released
  # under a different one is left to time out instead.
  STAGING_LEASE_HOLDER: load-test-${{ github.run_id }}-${{ github.run_attempt }}
  # The administrator the enrollment token is minted against. The deployment
  # seeds it and no cleanup removes it, so it is still there on the night after
  # a cleanup that finally worked.
  LOADTEST_SERVICE_ACCOUNT: opengate-service@service.invalid

permissions:
  contents: read

jobs:
  load-test:
    name: Load Tests (k6 + QUIC)
    runs-on: ubuntu-latest
    # The in-cluster k6 and QUIC runs finish in well under 15 minutes; this
    # bounds a staging pod that never goes Ready or a scenario that wedges.
    # Room for the wait on the namespace lease as well as the run itself: a
    # run that queues behind a staging deploy still needs its own half hour.
    timeout-minutes: 45
    # Deliberately avoid `environment: staging`: its required reviewers would
    # block the scheduled run. This read-only workload uses repository-level OCI
    # credentials and creates only short-lived test pods.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: server/go.sum

      - name: OCI + kubeconfig setup
        uses: ./.github/actions/oci-kube-setup
        with:
          oci-tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci-user: ${{ secrets.OCI_USER_OCID }}
          oci-fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          oci-private-key: ${{ secrets.OCI_PRIVATE_KEY }}
          oci-region: ${{ secrets.OCI_REGION }}
          cluster-id: ${{ secrets.OKE_CLUSTER_ID }}

      # The staging deploy drives this same release — it rolls the server this
      # run reads, truncates the account this run mints against, and puts its
      # own machines on the one node. The two are scheduled independently and
      # sit in different concurrency groups, so each takes the namespace before
      # touching it and gives it back after.
      - name: Take the staging namespace
        env:
          STAGING_LEASE_WAIT_SECONDS: "900"
        run: scripts/staging-lease.sh acquire "$STAGING_LEASE_HOLDER"

      # Both phases run their generator inside the cluster, so both need the
      # server pod and the architecture its node runs.
      - name: Resolve staging target
        run: |
          set -euo pipefail
          # As patient as the deploy's own wait. Given half of it, a run that
          # started while a staging upgrade was still rolling gave up first and
          # reported the deploy's rollout as a load-test failure.
          kubectl -n "$NAMESPACE" rollout status "deploy/${RELEASE}-server" --timeout=300s
          SERVER_POD="$(kubectl -n "$NAMESPACE" get pods \
            -l "app.kubernetes.io/instance=${RELEASE},app.kubernetes.io/component=server" \
            -o jsonpath='{.items[0].metadata.name}')"
          SERVER_POD_IP="$(kubectl -n "$NAMESPACE" get pod "$SERVER_POD" \
            -o jsonpath='{.status.podIP}')"
          SERVER_NODE="$(kubectl -n "$NAMESPACE" get pod "$SERVER_POD" \
            -o jsonpath='{.spec.nodeName}')"
          LOADTEST_GOARCH="$(kubectl get node "$SERVER_NODE" \
            -o jsonpath='{.status.nodeInfo.architecture}')"
          case "$LOADTEST_GOARCH" in
            amd64|arm64) ;;
            *) echo "::error::Unsupported OKE node architecture: $LOADTEST_GOARCH"; exit 1 ;;
          esac
          test -n "$SERVER_POD_IP"
          {
            echo "SERVER_POD=$SERVER_POD"
            echo "SERVER_POD_IP=$SERVER_POD_IP"
            echo "LOADTEST_GOARCH=$LOADTEST_GOARCH"
            # k6 addresses the server over the cluster network, where the
            # listener is plaintext: TLS terminates at the ingress, in front of
            # this service, so naming the service by its in-cluster DNS is the
            # same hop every other pod in the namespace makes.
            echo "LOADTEST_BASE_URL=http://${RELEASE}-server:8080"
            # The exposition is on the server's second listener, which the
            # Service publishes on its own port. A run that read it off the API
            # port would find the SPA fallback instead, and record a target it
            # never measured.
            echo "LOADTEST_METRICS_URL=http://${RELEASE}-server:8081"
          } >>"$GITHUB_ENV"

      # --- Both generators run beside the server -----------------------------
      #
      # k6 and the QUIC harness both run inside the cluster, addressing the
      # staging service by its in-cluster name, so the load reaches the system
      # under test over one network hop and the trend records the server's
      # latency rather than the generator's path to it.
      #
      # They also overlap. The relay scenario opens the operator's side of a
      # real session, which needs a machine on the other side of it, so the QUIC
      # harness holds a fleet connected while k6 runs rather than running after
      # it. A relay figure measured with no machine connected is a figure about
      # something else.

      - name: Install k6
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-${LOADTEST_GOARCH}.tar.gz" \
            | tar -xz -C /tmp
          install -m 0755 "/tmp/k6-${K6_VERSION}-linux-${LOADTEST_GOARCH}/k6" /tmp/k6

      - name: Prepare load-test summaries
        run: install -d -m 0755 "$LOADTEST_K6_SUMMARY_DIR"

      - name: Stage k6 harness in cluster
        run: |
          set -euo pipefail
          LOADTEST_K6_POD="k6-loadtest-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "LOADTEST_K6_POD=$LOADTEST_K6_POD" >>"$GITHUB_ENV"

          # The generator holds its own processor and memory, distinct from the
          # server's. Sharing them is why the API mark had to be set wider than
          # any regression worth finding: the measurement's own spread was
          # larger than the thing being measured.
          kubectl -n "$NAMESPACE" run "$LOADTEST_K6_POD" \
            --image=docker.io/library/alpine:3.21.3 \
            --restart=Never \
            --overrides='{"spec":{"containers":[{"name":"'"$LOADTEST_K6_POD"'","image":"docker.io/library/alpine:3.21.3","command":["sleep","1800"],"resources":{"requests":{"cpu":"100m","memory":"128Mi"},"limits":{"cpu":"400m","memory":"384Mi"}}}]}}' \
            --command -- sleep 1800
          kubectl -n "$NAMESPACE" wait --for=condition=Ready "pod/$LOADTEST_K6_POD" --timeout=120s
          kubectl -n "$NAMESPACE" exec "$LOADTEST_K6_POD" -- mkdir -p /tmp/load "$LOADTEST_K6_SUMMARY_DIR"
          kubectl -n "$NAMESPACE" cp /tmp/k6 "$LOADTEST_K6_POD:/tmp/k6"
          kubectl -n "$NAMESPACE" cp load/. "$LOADTEST_K6_POD:/tmp/load"
          kubectl -n "$NAMESPACE" exec "$LOADTEST_K6_POD" -- chmod 0755 /tmp/k6
          kubectl -n "$NAMESPACE" exec "$LOADTEST_K6_POD" -- /tmp/k6 version

      # The QUIC harness is staged and started before k6, and it holds its fleet
      # connected for the whole k6 window. The relay scenario opens the
      # operator's side of a real session, and a session needs a machine on the
      # other end of it.
      - name: Build QUIC load test harness
        working-directory: server
        run: CGO_ENABLED=0 GOOS=linux GOARCH="$LOADTEST_GOARCH" go build -trimpath -o /tmp/loadtest ./tests/loadtest/

      # The harness enrols the way an installer does: it keeps its own private
      # keys and sends signing requests, and what comes back is a certificate.
      # Nothing here copies the certificate authority's key out of the cluster —
      # that key mints a trusted machine for the whole fleet, no rotation story
      # covers it, and a shared CI runner is the last place it should exist.
      #
      # The credential the fleet spends is minted by the harness itself, through
      # the same interface a technician uses, as the account the deployment
      # seeds. It expires within the hour and this run is the only thing that
      # spends it.
      - name: Read the load-test service account's password, and seed the account
        run: |
          set -euo pipefail
          PASSWORD="$(kubectl -n "$NAMESPACE" get secret \
            "${RELEASE}-loadtest-account" -o jsonpath='{.data.password}' | base64 -d)"
          test -n "$PASSWORD"
          echo "::add-mask::$PASSWORD"
          echo "LOADTEST_SERVICE_PASSWORD=$PASSWORD" >>"$GITHUB_ENV"
          # The chart seeds this account and the staging deploy's database reset
          # truncates it away again, so whether it is there when a run starts
          # depends on what a deploy did hours earlier. The run seeds it itself,
          # from the file the chart hook and the deploy job both read, and the
          # statements are idempotent — an account already present is left
          # holding the password this run is about to spend. Over standard input
          # for the reason the deploy uses it: a psql argv is readable by every
          # process in the Postgres pod and is recorded verbatim in the API
          # server's exec audit entry.
          ACCOUNT_EMAIL="$LOADTEST_SERVICE_ACCOUNT" ACCOUNT_PASSWORD="$PASSWORD" \
            deploy/scripts/loadtest-account-sql.sh \
            | kubectl -n "$NAMESPACE" exec -i "statefulset/${RELEASE}-postgres" -- \
                psql -U opengate -d opengate -v ON_ERROR_STOP=1 -q
          echo "load-test administrator present: $LOADTEST_SERVICE_ACCOUNT"

      - name: Stage QUIC harness in cluster
        run: |
          set -euo pipefail
          LOADTEST_POD="quic-loadtest-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "LOADTEST_POD=$LOADTEST_POD" >>"$GITHUB_ENV"

          # The QUIC generator holds its own allocation too, so the two
          # generators cannot take each other's processor either.
          #
          # The Service carries the HTTP port only, so the name the certificate
          # names is pointed at the server pod here — the arrangement the staging
          # browser suite's own machines use (deploy/scripts/e2e-machine-pod.sh).
          # An agent takes its TLS name from the host half of the address it is
          # given, and a pod IP is in no certificate, so the name it dials and
          # the name it verifies have to be this one and the same.
          kubectl -n "$NAMESPACE" run "$LOADTEST_POD" \
            --image=docker.io/library/alpine:3.21.3 \
            --restart=Never \
            --overrides='{"spec":{"hostAliases":[{"ip":"'"$SERVER_POD_IP"'","hostnames":["'"${RELEASE}"'-server"]}],"containers":[{"name":"'"$LOADTEST_POD"'","image":"docker.io/library/alpine:3.21.3","command":["sleep","1800"],"resources":{"requests":{"cpu":"100m","memory":"128Mi"},"limits":{"cpu":"400m","memory":"384Mi"}}}]}}' \
            --command -- sleep 1800
          kubectl -n "$NAMESPACE" wait --for=condition=Ready "pod/$LOADTEST_POD" --timeout=120s
          kubectl -n "$NAMESPACE" cp /tmp/loadtest "$LOADTEST_POD:/tmp/loadtest"
          kubectl -n "$NAMESPACE" exec "$LOADTEST_POD" -- chmod 0755 /tmp/loadtest

      - name: Start the QUIC fleet and hold it connected
        run: |
          set -euo pipefail
          AGENTS="${{ inputs.agents || '100' }}"
          # The harness is launched detached inside the pod, so the fleet is
          # held by the pod rather than by a stream this runner owns, and the
          # step returns only once the harness says it is offering its fleet.
          scripts/loadtest-quic-incluster.sh start -- \
            /tmp/loadtest \
              -agents="$AGENTS" \
              -addr="${RELEASE}-server:9090" \
              -enroll-url="$LOADTEST_BASE_URL" \
              -metrics-url="$LOADTEST_METRICS_URL" \
              -fixture-account="$LOADTEST_SERVICE_ACCOUNT" \
              -fixture-password="$LOADTEST_SERVICE_PASSWORD" \
              -fixture-size="${{ inputs.fixture || 'small' }}" \
              -fixture-seed="$GITHUB_RUN_ID" \
              -relay-sessions \
              -hold="$LOADTEST_HOLD" \
              -bundle=/tmp/loadtest-bundle

      - name: Run k6 API baseline
        run: |
          K6_BIN=scripts/loadtest-k6-incluster.sh \
            scripts/loadtest-k6-run.sh api-baseline /tmp/load/k6/scenarios/api-baseline.js

      - name: Run k6 concurrent agents
        run: |
          K6_BIN=scripts/loadtest-k6-incluster.sh \
            scripts/loadtest-k6-run.sh concurrent-agents /tmp/load/k6/scenarios/concurrent-agents.js

      - name: Run k6 relay throughput
        run: |
          K6_BIN=scripts/loadtest-k6-incluster.sh \
            scripts/loadtest-k6-run.sh relay-throughput /tmp/load/k6/scenarios/relay-throughput.js

      - name: Cleanup k6 load test pod
        if: always()
        run: |
          if [[ -n "${LOADTEST_K6_POD:-}" ]]; then
            kubectl -n "$NAMESPACE" delete pod "$LOADTEST_K6_POD" --ignore-not-found --wait=false
          fi

      # The harness holds its fleet in the pod, so its output and its exit code
      # are read back from there and handed to the keep-or-discard rule, which
      # stays the one place that decides whether the night measured anything.
      #
      # On every path, because the path where a scenario failed is the one where
      # the fleet's log is the answer. A relay scenario finds no machine to open
      # a session against precisely when the fleet did not come up, and skipping
      # this step there threw away the only account of why.
      - name: Wait for the QUIC fleet to finish
        if: always()
        run: |
          set -euo pipefail
          scripts/loadtest-quic-run.sh "$LOADTEST_QUIC_OUTPUT" -- \
            scripts/loadtest-quic-incluster.sh collect

      - name: Collect the QUIC evidence bundle
        if: always()
        run: |
          set -euo pipefail
          mkdir -p loadtest-bundle
          kubectl -n "$NAMESPACE" cp "$LOADTEST_POD:/tmp/loadtest-bundle/bundle.json" \
            loadtest-bundle/quic-agents.json 2>/dev/null \
            || echo "::warning::the QUIC harness wrote no evidence bundle"

      # A run leaves nothing behind: the pod, the local build, and the token it
      # was given all go, whatever the run's verdict was.
      - name: Cleanup QUIC load test pod and spent credential
        if: always()
        run: |
          if [[ -n "${LOADTEST_POD:-}" ]]; then
            kubectl -n "$NAMESPACE" delete pod "$LOADTEST_POD" --ignore-not-found --wait=false
          fi
          POSTGRES_POD="$(kubectl -n "$NAMESPACE" get pods \
            -l "app.kubernetes.io/instance=${RELEASE},app.kubernetes.io/component=postgres" \
            -o jsonpath='{.items[0].metadata.name}' 2>/dev/null || true)"
          if [[ -n "$POSTGRES_POD" ]]; then
            # Over standard input, not -c: psql expands a -v variable in a file
            # and on standard input and never inside -c, so written the other way
            # the server receives the colon literally, answers with a syntax
            # error, and the spent credential outlives the run.
            kubectl -n "$NAMESPACE" exec -i "$POSTGRES_POD" -- \
              psql -U opengate -d opengate -q \
                -v marker="opengate-loadtest" <<'SQL' || true
            DELETE FROM enrollment_tokens WHERE label LIKE '%' || :'marker' || '%';
          SQL
          fi
          rm -rf /tmp/loadtest /tmp/k6 /tmp/k6-"${K6_VERSION}"-linux-amd64

      # A run leaves nothing behind, and says so. Every account in this database
      # was once load-test residue — eighty-one of them — because no run had
      # ever removed what it made and nothing counted. The proof this writes is
      # what the evidence bundle carries: a run that claims it left nothing has
      # to have looked.
      - name: Remove what the run created, and prove it
        if: always()
        run: |
          set -euo pipefail
          POSTGRES_POD="$(kubectl -n "$NAMESPACE" get pods \
            -l "app.kubernetes.io/instance=${RELEASE},app.kubernetes.io/component=postgres" \
            -o jsonpath='{.items[0].metadata.name}')"
          test -n "$POSTGRES_POD"
          LOADTEST_PSQL="kubectl -n $NAMESPACE exec -i $POSTGRES_POD -- psql -U opengate -d opengate" \
            scripts/loadtest-cleanup.sh loadtest-cleanup.json

      - name: Build canonical load-test summary
        if: always()
        run: |
          K6_SUMMARY_DIR="$LOADTEST_K6_SUMMARY_DIR" \
            QUIC_OUTPUT_FILE="$LOADTEST_QUIC_OUTPUT" \
            scripts/loadtest-summarize.sh > loadtest-summary.json
          # Stage the raw exports inside the workspace so the artifact keeps a
          # workspace-relative layout and the publish job's download path holds.
          mkdir -p loadtest-k6-raw
          cp "$LOADTEST_K6_SUMMARY_DIR"/*.json loadtest-k6-raw/ 2>/dev/null || true
          cp "$LOADTEST_K6_SUMMARY_DIR"/*.thresholds loadtest-k6-raw/ 2>/dev/null || true

      # Reads the canonical rows the step above produced, so it runs after it.
      - name: Record run completeness
        if: always()
        run: |
          set -euo pipefail
          set +e
          LOADTEST_K6_SUMMARY_DIR="$LOADTEST_K6_SUMMARY_DIR" \
            LOADTEST_BUNDLE=loadtest-bundle/quic-agents.json \
            scripts/loadtest-run-completeness.sh loadtest-summary.json loadtest-completeness.json
          COMPLETENESS_STATUS=$?
          set -e
          # A run that measured nothing is invalid, and an invalid run does not
          # enter the trend: absorbed as data it pulls the window median down,
          # and the next genuinely slow night then compares favourably and
          # passes. Exit 3 is that verdict; the job goes red on it.
          exit "$COMPLETENESS_STATUS"

      # The raw k6 exports ship alongside the canonical summary. Without them a
      # summary row that silently lost its metrics is indistinguishable from a
      # scenario that never ran, and the extraction has no observable input to
      # check it against.
      - name: Upload canonical load-test summary
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: loadtest-summary
          path: |
            loadtest-summary.json
            loadtest-completeness.json
            loadtest-cleanup.json
            loadtest-k6-raw
            loadtest-bundle
          if-no-files-found: error
          retention-days: 90

      - name: Release the staging namespace
        if: always()
        run: scripts/staging-lease.sh release "$STAGING_LEASE_HOLDER"

      - name: Remove OCI credentials
        if: always()
        uses: ./.github/actions/oci-kube-teardown

  publish:
    name: Publish load-test trend
    needs: [load-test]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # This job's result is the observability environment's deployment status, so
    # it reports only whether the trend was collected and published. The
    # regression verdict is a separate job below: a regression is a finding about
    # the system under test, not a failure to publish.
    environment: observability
    permissions:
      contents: read
    outputs:
      regression: ${{ steps.check.outputs.regression }}
    steps:
      - uses: actions/checkout@v7

      - name: OCI + kubeconfig setup
        uses: ./.github/actions/oci-kube-setup
        with:
          oci-tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci-user: ${{ secrets.OCI_USER_OCID }}
          oci-fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          oci-private-key: ${{ secrets.OCI_PRIVATE_KEY }}
          oci-region: ${{ secrets.OCI_REGION }}
          cluster-id: ${{ secrets.OKE_CLUSTER_ID }}

      - name: Download load-test summary
        uses: actions/download-artifact@v8
        with:
          name: loadtest-summary
          path: artifacts/loadtest

      # The run already classified itself, into a file that reached this job and
      # was read by nothing. Every night since the fleet stopped connecting
      # pushed rps 0 and error_rate 1 for a scenario that never ran, and the
      # fourteen-day median fell from 113 to 57 — which raises the bar a genuine
      # collapse has to clear before the gate notices it. One partial night
      # quietly costs two, and that is the whole reason the verdict exists.
      #
      # An absent verdict fails here as loudly as an invalid one: a guard that
      # answers yes when it cannot ask protects nothing.
      - name: Read the run's own verdict before publishing anything
        run: |
          set -euo pipefail
          VERDICT_FILE=artifacts/loadtest/loadtest-completeness.json
          if [ ! -s "$VERDICT_FILE" ]; then
            echo "::error::the run wrote no completeness verdict, so whether it measured anything is unknown."
            exit 1
          fi
          RESULT="$(jq -r '.result // empty' "$VERDICT_FILE")"
          echo "run verdict: ${RESULT:-<none>}"
          if [ "$RESULT" != "valid" ] && [ "$RESULT" != "failed" ]; then
            jq . "$VERDICT_FILE"
            echo "::error::this run did not measure the system, so its rows do not enter the trend."
            exit 1
          fi

      - name: Check regression
        id: check
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          set +e
          ./scripts/loadtest-regression-check.sh artifacts/loadtest/loadtest-summary.json > loadtest-regression.out 2>&1
          CHECK_STATUS=$?
          set -e

          cat loadtest-regression.out

          case "$CHECK_STATUS" in
            0) REGRESSION=0 ;;
            1) REGRESSION=1 ;;
            2)
              echo "regression=0" >> "$GITHUB_OUTPUT"
              echo "::error::Load-test summary input missing or invalid."
              exit 2
              ;;
            *)
              echo "regression=0" >> "$GITHUB_OUTPUT"
              echo "::error::loadtest-regression-check.sh failed with unexpected exit ${CHECK_STATUS}"
              exit "$CHECK_STATUS"
              ;;
          esac

          ROWS="$(grep -E '^\[' loadtest-regression.out | tail -n 1 || true)"
          if [ -z "$ROWS" ]; then
            echo "::error::loadtest-regression-check.sh produced no canonical JSON row array"
            exit 2
          fi
          printf '%s\n' "$ROWS" > loadtest-rows.json

          echo "regression=$REGRESSION" >> "$GITHUB_OUTPUT"
          ALERT_TEXT="$(grep '^REGRESSION_ALERT:' loadtest-regression.out | sed 's/^REGRESSION_ALERT://' || true)"
          {
            echo "alert_text<<EOF"
            echo "$ALERT_TEXT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload canonical rows as artifact
        uses: actions/upload-artifact@v7
        with:
          name: loadtest-canonical-rows
          path: loadtest-rows.json
          retention-days: 90

      - name: Push to VictoriaMetrics
        run: ./scripts/loadtest-vm-push.sh loadtest-rows.json

      - name: Write GITHUB_STEP_SUMMARY
        run: |
          set -euo pipefail
          {
            echo "# Load-test trend run"
            echo ""
            echo "Commit: \`${{ github.sha }}\`"
            echo "Regression: \`${{ steps.check.outputs.regression }}\`"
            echo ""
            echo "## Canonical rows"
            echo '```json'
            python3 -m json.tool < loadtest-rows.json || cat loadtest-rows.json
            echo '```'
            if grep -q '^P99_ADVISORY:' loadtest-regression.out; then
              echo ""
              echo "## p99 advisories"
              grep '^P99_ADVISORY:' loadtest-regression.out | sed 's/^P99_ADVISORY:/- /'
            fi
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Telegram alert on regression
        if: steps.check.outputs.regression == '1'
        env:
          BOT: ${{ secrets.DEPLOY_TELEGRAM_BOT_TOKEN }}
          CHAT: ${{ secrets.DEPLOY_TELEGRAM_CHAT_ID }}
          ALERT_TEXT: ${{ steps.check.outputs.alert_text }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -uo pipefail
          if [ -z "${BOT:-}" ] || [ -z "${CHAT:-}" ]; then
            echo "::warning::Telegram secrets not set; skipping alert (regression still reported via workflow exit)."
            exit 0
          fi

          getme_http=$(curl -sS --max-time 10 \
            -o /tmp/telegram-getme.json \
            -w '%{http_code}' \
            "https://api.telegram.org/bot${BOT}/getMe" 2>/dev/null || echo "curl_error")
          if [ "$getme_http" != "200" ] || ! jq -e '.ok == true' /tmp/telegram-getme.json >/dev/null 2>&1; then
            echo "::error::Telegram getMe returned HTTP ${getme_http} — DEPLOY_TELEGRAM_BOT_TOKEN appears invalid or revoked."
            cat /tmp/telegram-getme.json 2>/dev/null || echo "(no body)"
            exit 0
          fi

          MSG="$(printf '%s\n\nRun: %s\nTrend: Grafana dashboard \"Load Test Trends\" (opengate-loadtest-trend)' \
            "$ALERT_TEXT" "$RUN_URL")"
          send_http=$(curl -sS --max-time 30 \
            -o /tmp/telegram-send.json \
            -w '%{http_code}' \
            -X POST "https://api.telegram.org/bot${BOT}/sendMessage" \
            --data-urlencode "chat_id=${CHAT}" \
            --data-urlencode "text=${MSG}" \
            --data-urlencode "disable_web_page_preview=true" 2>/dev/null || echo "curl_error")
          if [ "$send_http" != "200" ] || ! jq -e '.ok == true' /tmp/telegram-send.json >/dev/null 2>&1; then
            echo "::error::Telegram sendMessage returned HTTP ${send_http}."
            cat /tmp/telegram-send.json 2>/dev/null || echo "(no body)"
            exit 0
          fi
          echo "Telegram alert delivered"

      - name: Remove OCI credentials
        if: always()
        uses: ./.github/actions/oci-kube-teardown

  gate:
    name: Load-test regression gate
    needs: [publish]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Fail workflow red on regression
        run: |
          if [ "${{ needs.publish.result }}" != "success" ]; then
            echo "::error::Load-test trend publishing did not succeed; see the publish job."
            exit 1
          fi
          if [ "${{ needs.publish.outputs.regression }}" = "1" ]; then
            echo "::error::Load-test regression detected (latency/rps/error_rate vs VM window or absolute ceilings) — see workflow summary and Telegram alert (if delivered)."
            exit 1
          fi
          echo "No load-test regression."
