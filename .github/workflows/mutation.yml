name: Mutation Testing

# Nightly mutation run that observes scores and never blocks merges or deploys.
# Scores go to VictoriaMetrics; a regression sends a Telegram alert and turns the run red.

on:
  schedule:
    - cron: '0 3 * * *'  # nightly 03:00 UTC
  workflow_dispatch:

concurrency:
  group: mutation-testing
  cancel-in-progress: false

# Read-only at the workflow level is sufficient throughout: trend data lives in
# VictoriaMetrics and in workflow artifacts, so no job writes to the repo.
permissions:
  contents: read

env:
  RUST_VERSION: stable
  GO_VERSION: '1.27'
  NODE_VERSION: '24'
  CARGO_MUTANTS_VERSION: 27.0.0
  GREMLINS_VERSION: v0.6.0
jobs:
  # Projects each shard's mutant count against the job cap; it does not gate the matrix.
  # The Go count is a gremlins dry-run, since a Go mutant runs only where coverage reaches it.
  shard-budget:
    name: Shard budget
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    outputs:
      started_at: ${{ steps.started.outputs.at }}
    steps:
      # Every sample the night writes carries this time, so a re-run writes the same point.
      - name: Record when the run started
        id: started
        run: echo "at=$(date -u +%s)" >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
      - uses: ./.github/actions/docker-hub-mirror
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
      # The Go dry-run gathers module-wide coverage, and the API and domain suites need Postgres.
      - name: Start Postgres with max_connections=400
        run: |
          for attempt in 1 2 3; do
            if docker pull postgres:17-alpine; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::could not pull postgres:17-alpine after 3 attempts"; exit 1
            fi
            echo "::warning::postgres image pull attempt $attempt/3 failed; retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          docker run -d --rm --name pg-ci \
            -e POSTGRES_USER=opengate -e POSTGRES_PASSWORD=opengate -e POSTGRES_DB=opengate_test \
            --shm-size=1g -p 5432:5432 postgres:17-alpine -c max_connections=400 -c max_locks_per_transaction=256
          for i in {1..30}; do
            if docker exec pg-ci pg_isready -U opengate -d opengate_test >/dev/null 2>&1; then
              echo "postgres ready after ${i} attempt(s)"; exit 0
            fi
            sleep 1
          done
          echo "::error::postgres never became ready"; docker logs pg-ci; exit 1
      # testvm memoizes per test binary, so one shared store replaces one per package.
      - name: Start VictoriaMetrics
        run: |
          for attempt in 1 2 3; do
            if docker pull victoriametrics/victoria-metrics:v1.114.0; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::could not pull victoriametrics/victoria-metrics:v1.114.0 after 3 attempts"; exit 1
            fi
            echo "::warning::victoriametrics image pull attempt $attempt/3 failed; retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          docker run -d --rm --name vm-ci \
            -p 8428:8428 victoriametrics/victoria-metrics:v1.114.0
          for i in {1..30}; do
            if curl -fsS --max-time 2 http://127.0.0.1:8428/health >/dev/null 2>&1; then
              echo "victoriametrics ready after ${i} attempt(s)"; exit 0
            fi
            sleep 1
          done
          echo "::error::victoriametrics never became ready"; docker logs vm-ci; exit 1
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: agent
          cache-on-failure: true
      - name: Install cargo-mutants
        run: cargo install --locked --version "${CARGO_MUTANTS_VERSION}" cargo-mutants
      - uses: actions/setup-go@v7
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum
      - name: Install gremlins
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@${{ env.GREMLINS_VERSION }}
      - name: Project every shard against the job cap
        env:
          POSTGRES_TEST_URL: postgres://opengate:opengate@localhost:5432/opengate_test?sslmode=disable
          VICTORIAMETRICS_TEST_URL: http://127.0.0.1:8428
        # The default shell does not set pipefail, so the step sets it to carry the projection's status.
        run: |
          set -o pipefail
          ./scripts/mutation-shard-budget.sh | tee -a "$GITHUB_STEP_SUMMARY"

  # Per-language runs go in parallel; fail-fast is off so one failing leg leaves the others running.
  mutation:
    name: Mutation (${{ matrix.shard || matrix.language }})
    strategy:
      fail-fast: false
      # Each Go shard runs the whole module for coverage and restricts mutation via --exclude-files.
      # The split in scripts/lib/mutation-shards.sh is balanced by CI runtime.
      matrix:
        include:
          # Each Rust shard id names the behavior it measures, and its rebuilds stay inside one crate.
          # The split lives in scripts/lib/mutation-shards.sh.
          - { language: rust, shard: rust-core-ml-backfill-drain }
          - { language: rust, shard: rust-core-ml-backfill-tiers }
          - { language: rust, shard: rust-core-ml-sampling }
          - { language: rust, shard: rust-core-ml-host-sources }
          - { language: rust, shard: rust-core-ml-store-sink }
          - { language: rust, shard: rust-core-ml-analysis }
          - { language: rust, shard: rust-core-ml-redaction }
          - { language: rust, shard: rust-core-alerts-retro-plan }
          - { language: rust, shard: rust-core-alerts-retro-scan }
          - { language: rust, shard: rust-core-alerts-conditions }
          - { language: rust, shard: rust-core-alerts-evaluator }
          - { language: rust, shard: rust-core-alerts-event }
          - { language: rust, shard: rust-core-alerts-sink }
          - { language: rust, shard: rust-core-correlate-divergence }
          - { language: rust, shard: rust-core-correlate-ranking }
          - { language: rust, shard: rust-core-session-terminal }
          - { language: rust, shard: rust-core-session-dispatch }
          - { language: rust, shard: rust-core-discovery }
          - { language: rust, shard: rust-core-runtime-lifecycle }
          - { language: rust, shard: rust-core-runtime }
          - { language: rust, shard: rust-tsdb-blocks }
          - { language: rust, shard: rust-tsdb-encoding }
          - { language: rust, shard: rust-tsdb-surface }
          - { language: rust, shard: rust-agent-loops }
          - { language: rust, shard: rust-protocol-wire }
          - { language: web }
          # The internal/api shards are sized by per-mutant cost, since each mutant re-runs the
          # Postgres-backed API suite.
          - { language: go, shard: go-api-runtime }
          - { language: go, shard: go-api-intake }
          - { language: go, shard: go-api-status }
          - { language: go, shard: go-api-converters }
          - { language: go, shard: go-api-identity }
          - { language: go, shard: go-api-tenancy-admin }
          - { language: go, shard: go-api-device-control }
          - { language: go, shard: go-api-device-sessions }
          - { language: go, shard: go-api-device-reads }
          - { language: go, shard: go-api-incidents }
          - { language: go, shard: go-api-rules }
          - { language: go, shard: go-api-enrollment }
          - { language: go, shard: go-api-updates-purge }
          # conn_backfill.go's mutants run under the Postgres-backed harness, so it is sized alone.
          - { language: go, shard: go-agentapi-connection }
          - { language: go, shard: go-agentapi-handshake }
          - { language: go, shard: go-agentapi-backfill }
          - { language: go, shard: go-agentapi-edge-telemetry }
          - { language: go, shard: go-domain-rules }
          - { language: go, shard: go-domain-alerts-room }
          - { language: go, shard: go-domain-alerts-record }
          - { language: go, shard: go-domain-persistence }
          - { language: go, shard: go-amt }
          - { language: go, shard: go-updates-certificates }
          - { language: go, shard: go-protocol-wire }
          - { language: go, shard: go-relay-signaling }
          - { language: go, shard: go-observability-harness }
          - { language: go, shard: go-composition-root }
    runs-on: ubuntu-24.04
    # A flat safety cap above the widest measured shard; a shard shot at the cap writes no report.
    # The shard-budget job refuses a split that has drifted past it.
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v7
      # Only the Go legs pull an image, so only they need the registry mirror.
      - uses: ./.github/actions/docker-hub-mirror
        if: matrix.language == 'go'
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}
      # Only the Go legs open a Postgres connection; max_connections=400 covers the per-schema
      # stores of testutil.NewTestStore, and max_locks_per_transaction=256 covers migrations.
      - name: Start Postgres with max_connections=400
        if: matrix.language == 'go'
        run: |
          # The retry covers a transient token or connection reset that the mirror does not.
          for attempt in 1 2 3; do
            if docker pull postgres:17-alpine; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::could not pull postgres:17-alpine after 3 attempts"; exit 1
            fi
            echo "::warning::postgres image pull attempt $attempt/3 failed; retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          docker run -d --rm --name pg-ci \
            -e POSTGRES_USER=opengate -e POSTGRES_PASSWORD=opengate -e POSTGRES_DB=opengate_test \
            --shm-size=1g -p 5432:5432 postgres:17-alpine -c max_connections=400 -c max_locks_per_transaction=256
          for i in {1..30}; do
            if docker exec pg-ci pg_isready -U opengate -d opengate_test >/dev/null 2>&1; then
              echo "postgres ready after ${i} attempt(s)"; exit 0
            fi
            sleep 1
          done
          echo "::error::postgres never became ready"; docker logs pg-ci; exit 1

      # testvm memoizes per test binary, so one shared store avoids a store per package under
      # server/tests/ and the memory pressure of many at once.
      - name: Start VictoriaMetrics
        if: matrix.language == 'go'
        run: |
          for attempt in 1 2 3; do
            if docker pull victoriametrics/victoria-metrics:v1.114.0; then
              break
            fi
            if [ "$attempt" = 3 ]; then
              echo "::error::could not pull victoriametrics/victoria-metrics:v1.114.0 after 3 attempts"; exit 1
            fi
            echo "::warning::victoriametrics image pull attempt $attempt/3 failed; retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          docker run -d --rm --name vm-ci \
            -p 8428:8428 victoriametrics/victoria-metrics:v1.114.0
          for i in {1..30}; do
            if curl -fsS --max-time 2 http://127.0.0.1:8428/health >/dev/null 2>&1; then
              echo "victoriametrics ready after ${i} attempt(s)"; exit 0
            fi
            sleep 1
          done
          echo "::error::victoriametrics never became ready"; docker logs vm-ci; exit 1

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        if: matrix.language == 'rust'
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        if: matrix.language == 'rust'
        with:
          workspaces: agent
          cache-on-failure: true
      - name: Install cargo-mutants
        if: matrix.language == 'rust'
        run: cargo install --locked --version "${CARGO_MUTANTS_VERSION}" cargo-mutants
      - name: Run cargo-mutants (shard ${{ matrix.shard }})
        if: matrix.language == 'rust'
        env:
          OPENGATE_GOLDEN_DIR: ${{ github.workspace }}/testdata/golden
        # The `mutants` profile (agent/.cargo/mutants.toml) is the test profile without debug info.
        # --jobs 4 matches the 4-vCPU runner and --no-shuffle keeps runs comparable.
        run: |
          . scripts/lib/mutation-shards.sh
          mapfile -t shard_args < <(mutation_rust_shard_args '${{ matrix.shard }}')
          printf 'shard %s selects:' '${{ matrix.shard }}'
          printf ' %s' "${shard_args[@]}"
          echo
          cd agent
          cargo mutants "${shard_args[@]}" --no-shuffle --jobs 4 --annotations none || EXIT=$?
          # cargo-mutants exits non-zero when any mutant survives, which the run captures.
          echo "cargo-mutants exit: ${EXIT:-0}"
          # The outcome file says this shard did work; reading it back fails a refused run here.
          "$GITHUB_WORKSPACE/scripts/assert-mutation-report.sh" cargo-mutants mutants.out/outcomes.json

      - uses: actions/setup-go@v7
        if: matrix.language == 'go'
        with:
          go-version: ${{ env.GO_VERSION }}
          cache-dependency-path: server/go.sum
      - name: Install gremlins
        if: matrix.language == 'go'
        run: go install github.com/go-gremlins/gremlins/cmd/gremlins@${{ env.GREMLINS_VERSION }}
      - name: Run gremlins (shard ${{ matrix.shard }})
        if: matrix.language == 'go'
        env:
          POSTGRES_TEST_URL: postgres://opengate:opengate@localhost:5432/opengate_test?sslmode=disable
          VICTORIAMETRICS_TEST_URL: http://127.0.0.1:8428
          # gremlins derives each mutant's timeout from the dry-run elapsed time, so -count=1
          # bypasses the restored test cache and keeps that budget stable.
          GOFLAGS: "-count=1"
        # gremlins walks its one path for mutants and runs `go test` over it for coverage, so the
        # path is the narrowest one holding the shard's mutants (scripts/lib/mutation-shards.sh).
        run: |
          . scripts/lib/mutation-shards.sh
          scan="$(mutation_go_shard_scan_path '${{ matrix.shard }}')"
          excl="$(mutation_go_shard_exclude_regex '${{ matrix.shard }}')"
          echo "shard ${{ matrix.shard }} walks: $scan"
          echo "shard ${{ matrix.shard }} exclude: $excl"
          # Every shard inherits the timeout coefficient from server/.gremlins.yaml.
          coef="$(mutation_go_shard_timeout_coefficient '${{ matrix.shard }}')"
          coef_flag=()
          [ -n "$coef" ] && coef_flag=(--timeout-coefficient "$coef")
          echo "shard ${{ matrix.shard }} timeout-coefficient: ${coef:-baseline}"
          cd server
          gremlins unleash "$scan" -E "$excl" "${coef_flag[@]}" --output "mutation-report-${{ matrix.shard }}.json" || EXIT=$?
          # gremlins exits non-zero on a surviving mutant, so the status is captured; the report
          # separates a shard that found survivors from one whose coverage baseline failed.
          echo "gremlins exit: ${EXIT:-0}"
          "$GITHUB_WORKSPACE/scripts/assert-mutation-report.sh" gremlins "mutation-report-${{ matrix.shard }}.json"

      - uses: actions/setup-node@v7
        if: matrix.language == 'web'
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install web deps
        if: matrix.language == 'web'
        run: cd web && npm ci
      - name: Run stryker
        if: matrix.language == 'web'
        env:
          # web/vitest.config.ts sets the default reporter under Stryker; the /dev/null sink keeps
          # per-mutant vitest reports out of GITHUB_STEP_SUMMARY.
          GITHUB_STEP_SUMMARY: /dev/null
        run: |
          cd web
          # Stryker exits 0 even with surviving mutants when thresholds.break
          # is null (it is). JSON reporter writes to reports/mutation/mutation.json.
          ./node_modules/.bin/stryker run
          "$GITHUB_WORKSPACE/scripts/assert-mutation-report.sh" stryker reports/mutation/mutation.json

      - name: Upload mutation artifacts (${{ matrix.shard || matrix.language }})
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-${{ matrix.shard || matrix.language }}
          retention-days: 90
          # A shard step swallows the tool's exit code, so a missing report is what fails the shard.
          if-no-files-found: error
          path: |
            agent/mutants.out/
            server/mutation-report-${{ matrix.shard }}.json
            web/reports/mutation/

  # Aggregates the matrix outputs, pushes to VictoriaMetrics, checks regressions and alerts.
  publish:
    name: Publish results + alert on regression
    # shard-budget is named for the time the run started, which it records.
    needs: [shard-budget, mutation]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The `observability` environment scopes the Telegram alert secrets to unattended workflows;
    # it has no reviewers or wait timer and permits only `main` and `dev`.
    environment: observability
    permissions:
      contents: read
    # This job's result is the environment's deployment status; the score verdict is the gate job.
    outputs:
      regression: ${{ steps.summarize.outputs.regression }}
      complete: ${{ steps.status.outputs.complete }}
      incomplete-legs: ${{ steps.status.outputs.incomplete-legs }}
    env:
      # When the run started, which every sample of the night carries.
      VM_RUN_STARTED_AT: ${{ needs.shard-budget.outputs.started_at }}
    steps:
      - uses: actions/checkout@v7
        with:
          # Shallow checkout; no commit-history needs remain after dropping the
          # in-repo JSONL trend file.
          fetch-depth: 1

      - uses: ./.github/actions/setup-pinned-tools
      - name: Download all matrix artifacts
        uses: actions/download-artifact@v8
        with:
          path: artifacts
          pattern: mutation-*
          merge-multiple: false

      - name: Validate mutation artifact status
        id: status
        env:
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
        run: |
          set -euo pipefail
          ./scripts/mutation-status-build.sh artifacts mutation-status.json
          jq . mutation-status.json
          echo "complete=$(jq -r '.complete' mutation-status.json)" >> "$GITHUB_OUTPUT"
          # Records which legs finished, so a night with one flaked language still publishes the rest.
          for language in rust go web; do
            echo "$language=$(jq -r --arg l "$language" '.complete_by_language[$l]' mutation-status.json)" >> "$GITHUB_OUTPUT"
          done
          complete_legs="$(jq -r '[.complete_by_language | to_entries[] | select(.value) | .key] | join(" ")' mutation-status.json)"
          incomplete_legs="$(jq -r '[.complete_by_language | to_entries[] | select(.value | not) | .key] | join(" ")' mutation-status.json)"
          echo "complete-legs=$complete_legs" >> "$GITHUB_OUTPUT"
          echo "incomplete-legs=$incomplete_legs" >> "$GITHUB_OUTPUT"

      - name: Place artifacts at canonical input paths
        if: steps.status.outputs.rust == 'true' || steps.status.outputs.go == 'true' || steps.status.outputs.web == 'true'
        run: |
          set -euo pipefail
          # Artifacts sit under artifacts/mutation-<lang|shard>/ and status validation has proved the set.
          . scripts/lib/mutation-shards.sh
          # A leg merges only when all its shards are present, since a short merge reads as a score.
          if [ "${{ steps.status.outputs.rust }}" = "true" ]; then
            rust_expected=()
            for shard in $(mutation_rust_shards); do
              rust_expected+=("artifacts/mutation-$shard/agent/mutants.out/outcomes.json")
            done
            mkdir -p agent/mutants.out
            ./scripts/mutation-merge-rust.sh agent/mutants.out/outcomes.json "${rust_expected[@]}"
          fi
          if [ "${{ steps.status.outputs.go }}" = "true" ]; then
            expected=()
            for shard in $(mutation_go_shards); do
              expected+=("artifacts/mutation-$shard/server/mutation-report-$shard.json")
            done
            mkdir -p server
            ./scripts/mutation-merge-go.sh server/mutation-report.json "${expected[@]}"
          fi
          if [ "${{ steps.status.outputs.web }}" = "true" ]; then
            mkdir -p web/reports
            mv artifacts/mutation-web/web/reports/mutation web/reports/mutation
          fi

      - name: Upload mutation run status
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: mutation-run-status
          path: mutation-status.json
          retention-days: 90
          if-no-files-found: error

      - name: OCI + kubeconfig setup
        id: infra
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        uses: ./.github/actions/oci-kube-setup
        with:
          oci-tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci-user: ${{ secrets.OCI_USER_OCID }}
          oci-fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          oci-private-key: ${{ secrets.OCI_PRIVATE_KEY }}
          oci-region: ${{ secrets.OCI_REGION }}
          cluster-id: ${{ secrets.OKE_CLUSTER_ID }}

      - name: Push mutation completion status to VM
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          if ! ./scripts/mutation-status-vm-push.sh mutation-status.json; then
            echo "::warning::Failed to push mutation completion status; artifact classification remains authoritative."
          fi

      # The previous night's score, taken by date: whatever code that night ran,
      # and never tonight's own reading, which a re-run of this night leaves.
      - name: Restore baseline from VM
        if: steps.status.outputs.complete-legs != '' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: |
          ./scripts/mutation-baseline-fetch.sh > mutation-baseline.jsonl
          if [ -s mutation-baseline.jsonl ]; then
            echo "HISTORY_FILE=$PWD/mutation-baseline.jsonl" >> "$GITHUB_ENV"
          else
            rm -f mutation-baseline.jsonl
          fi

      # A night with every leg short fails here; one short leg still publishes the finished legs.
      # The gate job below turns the whole run red from the whole-run `complete`.
      - name: Fail a mutation run with no complete leg
        if: steps.status.outputs.complete-legs == ''
        run: |
          echo "::error::Every mutation leg is incomplete or invalid; see mutation-run-status. No canonical score row was produced."
          exit 2

      - name: Note the legs that did not complete
        if: steps.status.outputs.complete-legs != '' && steps.status.outputs.incomplete-legs != ''
        run: |
          echo "::warning::These mutation legs did not complete and carry no score tonight: ${{ steps.status.outputs.incomplete-legs }}. The run is published for the rest and the gate job fails it."

      - name: Summarize + regression check (canonical row to stdout)
        id: summarize
        if: steps.status.outputs.complete-legs != ''
        env:
          GITHUB_SHA: ${{ github.sha }}
          MUTATION_LANGUAGES: ${{ steps.status.outputs.complete-legs }}
        # Exit 1 is a regression, captured so the alert step runs; exit 2 is malformed input and
        # fails at once. The final step re-applies exit 1.
        run: |
          set -euo pipefail
          set +e
          OUTPUT="$(./scripts/mutation-summarize.sh 2>&1)"
          SUMMARY_STATUS=$?
          set -e

          echo "$OUTPUT"
          echo "--- end ---"

          case "$SUMMARY_STATUS" in
            0) REGRESSION=0 ;;
            1) REGRESSION=1 ;;
            2)
              echo "regression=0" >> "$GITHUB_OUTPUT"
              echo "::error::Mutation summary input missing or invalid; at least one language artifact is absent or malformed. This is an incomplete mutation run, not a score regression."
              exit 2
              ;;
            *)
              echo "regression=0" >> "$GITHUB_OUTPUT"
              echo "::error::mutation-summarize.sh failed with unexpected exit ${SUMMARY_STATUS}"
              exit "$SUMMARY_STATUS"
              ;;
          esac

          echo "regression=$REGRESSION" >> "$GITHUB_OUTPUT"
          # Extract the canonical row (last JSON line that begins with `{`)
          CANONICAL_ROW="$(printf '%s\n' "$OUTPUT" | grep -E '^\{' | tail -n 1 || true)"
          if [ -z "$CANONICAL_ROW" ]; then
            echo "::error::mutation-summarize.sh produced no canonical JSON row"
            exit 2
          fi
          echo "$CANONICAL_ROW" > canonical-row.json
          # Extract Telegram-friendly text from REGRESSION_ALERT: lines
          ALERT_TEXT="$(printf '%s\n' "$OUTPUT" | grep '^REGRESSION_ALERT:' | sed 's/^REGRESSION_ALERT://' || true)"
          {
            echo "alert_text<<EOF"
            echo "$ALERT_TEXT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload canonical row as artifact
        if: steps.status.outputs.complete-legs != ''
        uses: actions/upload-artifact@v7
        with:
          name: mutation-canonical-row
          path: canonical-row.json
          retention-days: 90
          if-no-files-found: error

      - name: Push to VictoriaMetrics
        if: steps.status.outputs.complete-legs != '' && (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch')
        run: ./scripts/mutation-vm-push.sh canonical-row.json

      - name: Write GITHUB_STEP_SUMMARY
        if: steps.status.outputs.complete-legs != ''
        run: |
          {
            echo "# Mutation testing run"
            echo ""
            echo "Commit: \`${{ github.sha }}\`"
            echo ""
            echo "## Canonical row"
            echo '```json'
            python3 -m json.tool < canonical-row.json || cat canonical-row.json
            echo '```'
            echo ""
            echo "## Per-language scores"
            echo "| Lang | Killed | Survived | NoCov | Score |"
            echo "|---|---|---|---|---|"
            # Only the legs the row carries. A leg that did not run has no score,
            # and printing it as a row of dashes reads as a measurement.
            jq -r '
              .scores | to_entries[]
              | "| \(.key) | \(.value.killed) | \(.value.survived) | \(.value.no_coverage // "—") | \(.value.score_pct)% |"
            ' canonical-row.json
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Send Telegram alert
        # Runs after any outcome and names which of the three happened. A refused delivery fails the
        # job, and the verdict is read by a separate job, so an outage hides nothing.
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.DEPLOY_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.DEPLOY_TELEGRAM_CHAT_ID }}
          FINDING: ${{ steps.summarize.outputs.regression }}
          ALERT_TEXT: ${{ steps.summarize.outputs.alert_text }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = "success" ] && [ "${FINDING:-0}" != "1" ]; then
            echo "No alert sent: the run finished and found nothing."
            exit 0
          fi
          if [ "${FINDING:-0}" = "1" ]; then
            MSG="$(printf '%s\n\nRun: %s\nTrend: Grafana dashboard "Mutation Testing Trend" (opengate-mutation-trend)' "$ALERT_TEXT" "$RUN_URL")"
          else
            MSG="$(printf 'Mutation run: the night did not finish (%s), so nothing was measured.\n\nRun: %s' \
              "$JOB_STATUS" "$RUN_URL")"
          fi
          scripts/telegram-alert.sh "$MSG"

      - name: Remove OCI credentials
        if: always()
        uses: ./.github/actions/oci-kube-teardown

  # Separate from publish so a Telegram outage cannot suppress the failure signal and the score
  # verdict is not recorded against the observability environment.
  gate:
    name: Mutation score gate
    needs: [publish]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Fail workflow red on regression
        run: |
          if [ "${{ needs.publish.result }}" != "success" ]; then
            echo "::error::Mutation results were not published; see the publish job."
            exit 1
          fi
          # An incomplete night is a red night, after the finished legs were published and checked.
          if [ "${{ needs.publish.outputs.complete }}" != "true" ]; then
            echo "::error::Mutation legs incomplete tonight: ${{ needs.publish.outputs.incomplete-legs }}. The complete legs were published; this run is red for the ones that were not."
            exit 1
          fi
          if [ "${{ needs.publish.outputs.regression }}" = "1" ]; then
            echo "::error::Mutation score regression — see workflow summary and Telegram alert (if delivered)."
            exit 1
          fi
          echo "No mutation score regression."
