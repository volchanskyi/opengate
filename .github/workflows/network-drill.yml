name: Network Drill

# The drill runs its machines through an unprivileged pod that shapes the link, because the
# worker node ships no kernel network emulator. It reports and trends and does not gate a deploy.
on:
  schedule:
    # Runs after the load test; both claim the staging namespace and the later arrival waits.
    - cron: '0 6 * * *'
  workflow_dispatch:
    inputs:
      scenarios:
        description: "Scenarios to run, in order"
        required: false
        default: "s1 s2 s3 s4"

concurrency:
  group: network-drill
  cancel-in-progress: false

env:
  NAMESPACE: opengate-staging
  RELEASE: opengate-staging
  # The release step matches on this identity.
  STAGING_LEASE_HOLDER: network-drill-${{ github.run_id }}-${{ github.run_attempt }}
  # The administrator the enrolment token is minted against; the deployment seeds it.
  DRILL_SERVICE_ACCOUNT: opengate-service@service.invalid
  DRILL_MEASUREMENTS: /tmp/netdrill/measurements.jsonl
  DRILL_EVIDENCE: /tmp/netdrill/evidence
  # Twenty machines in one tenant queue against the four concurrent drains admitted per customer.
  DRILL_FLEET_AGENTS: "20"
  # A prefix of its own lets the drill count its herd apart from the load run's.
  DRILL_FLEET_PREFIX: netdrill-fleet

permissions:
  contents: read

jobs:
  network-drill:
    name: Network drill (four scenarios, two victims)
    runs-on: ubuntu-24.04
    # Covers the scenarios, setup, teardown and the wait for the namespace lease.
    timeout-minutes: 60
    # No `environment: staging`: its required reviewers would stall a scheduled run.
    permissions:
      contents: read
      actions: read
    outputs:
      started_at: ${{ steps.started.outputs.at }}
      measured: ${{ steps.summarize.outputs.measured }}
    steps:
      # Every sample of the night carries this time, so a re-run of failed jobs writes the same point.
      - name: Record when the run started
        id: started
        run: echo "at=$(date -u +%s)" >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-pinned-tools
      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: server/go.sum

      - name: OCI + kubeconfig setup
        uses: ./.github/actions/oci-kube-setup
        with:
          oci-tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci-user: ${{ secrets.OCI_USER_OCID }}
          oci-fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          oci-private-key: ${{ secrets.OCI_PRIVATE_KEY }}
          oci-region: ${{ secrets.OCI_REGION }}
          cluster-id: ${{ secrets.OKE_CLUSTER_ID }}

      # A holder renews its claim while it works, so waiting is the only way past it.
      # Thirty minutes covers the staging deploy and the load run inside this job's hour.
      - name: Take the staging namespace
        env:
          STAGING_LEASE_WAIT_SECONDS: "1800"
        run: scripts/staging-lease.sh acquire "$STAGING_LEASE_HOLDER"

      - name: Resolve the staging target
        run: |
          set -euo pipefail
          kubectl -n "$NAMESPACE" rollout status "deploy/${RELEASE}-server" --timeout=300s
          SERVER_POD="$(kubectl -n "$NAMESPACE" get pods \
            -l "app.kubernetes.io/instance=${RELEASE},app.kubernetes.io/component=server" \
            -o jsonpath='{.items[0].metadata.name}')"
          SERVER_POD_IP="$(kubectl -n "$NAMESPACE" get pod "$SERVER_POD" -o jsonpath='{.status.podIP}')"
          SERVER_NODE="$(kubectl -n "$NAMESPACE" get pod "$SERVER_POD" -o jsonpath='{.spec.nodeName}')"
          NODE_ARCH="$(kubectl get node "$SERVER_NODE" -o jsonpath='{.status.nodeInfo.architecture}')"
          case "$NODE_ARCH" in
            arm64) AGENT_TARGET=aarch64-unknown-linux-musl ;;
            amd64) AGENT_TARGET=x86_64-unknown-linux-musl ;;
            *) echo "::error::Unsupported OKE node architecture: $NODE_ARCH"; exit 1 ;;
          esac
          test -n "$SERVER_POD_IP"
          {
            echo "SERVER_POD=$SERVER_POD"
            echo "SERVER_POD_IP=$SERVER_POD_IP"
            echo "NODE_ARCH=$NODE_ARCH"
            echo "AGENT_TARGET=$AGENT_TARGET"
            # The fully-qualified name resolves to the Service while the short name goes to the shaper.
            echo "DRILL_ENROLL_URL=http://${RELEASE}-server.${NAMESPACE}.svc.cluster.local:8080"
            echo "DRILL_API_URL=http://${RELEASE}-server.${NAMESPACE}.svc.cluster.local:8080"
          } >>"$GITHUB_ENV"

      # The node's lack of a kernel network emulator is re-read every night and recorded.
      - name: Record what the node's kernel offers
        run: |
          set -euo pipefail
          . scripts/lib/kubectl-retry.sh
          mkdir -p "$DRILL_EVIDENCE"
          EXPORTER="$(kubectl_retry -n monitoring get pods -l app.kubernetes.io/component=node-exporter \
            -o jsonpath='{.items[0].metadata.name}')"
          if [ -z "$EXPORTER" ]; then
            echo "::error::there is no node-exporter pod to read the node's kernel through, so the drill cannot say what the node offers" >&2
            exit 1
          fi
          # A container shares its node's kernel, so the exporter reports the node's release.
          K="$(kubectl_retry -n monitoring exec "$EXPORTER" -- uname -r)"
          if [ -z "$K" ]; then
            echo "::error::the node exporter reported no kernel release" >&2
            exit 1
          fi
          CONFIG="/host/root/boot/config-${K}"
          MODULES="/host/root/lib/modules/${K}"
          NETEM_CONFIG="$(kubectl_retry -n monitoring exec "$EXPORTER" -- \
            grep -E '^(# )?CONFIG_NET_SCH_NETEM[= ]' "$CONFIG")"
          NETEM_FILES="$(kubectl_retry -n monitoring exec "$EXPORTER" -- \
            sh -c "test -r ${MODULES}/modules.dep && find ${MODULES} -name '*netem*' | wc -l")"
          NETEM_DEPS="$(kubectl_retry -n monitoring exec "$EXPORTER" -- \
            sh -c "test -r ${MODULES}/modules.dep && { grep -c netem ${MODULES}/modules.dep || true; }")"
          {
            echo "kernel=$K"
            echo "$NETEM_CONFIG"
            echo "netem-files=$NETEM_FILES"
            echo "netem-in-modules-dep=$NETEM_DEPS"
          } >"$DRILL_EVIDENCE/node-kernel.txt"
          cat "$DRILL_EVIDENCE/node-kernel.txt"

      - name: Build the link shaper and the fleet harness
        working-directory: server
        run: |
          set -euo pipefail
          GOARCH_FOR_NODE="$NODE_ARCH"
          CGO_ENABLED=0 GOOS=linux GOARCH="$GOARCH_FOR_NODE" \
            go build -trimpath -o /tmp/netfault ./tests/netfault/
          CGO_ENABLED=0 GOOS=linux GOARCH="$GOARCH_FOR_NODE" \
            go build -trimpath -o /tmp/loadtest ./tests/loadtest/

      # The agent binary is taken from the staging build; an aarch64 build would not fit the hour.
      # A run that cannot resolve one is inconclusive and emits no rows.
      - name: Resolve the agent built for the staging node
        id: agent-build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          ARTIFACT="mesh-agent-${AGENT_TARGET}"
          SINCE="$(date -u -d '21 days ago' +%Y-%m-%d)"
          RUN_ID="$(gh api -X GET --paginate \
            "/repos/$REPO/actions/workflows/build-image.yml/runs" \
            -f "created=>=$SINCE" -f "branch=main" -f "status=success" -F per_page=100 \
            --jq '[.workflow_runs[].id] | first // empty')"
          if [ -z "$RUN_ID" ]; then
            echo "::warning::no successful build-image run on main inside the artifact retention window"
            echo "resolved=0" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          PRESENT="$(gh api --paginate "/repos/$REPO/actions/runs/$RUN_ID/artifacts" \
            --jq '.artifacts[] | select(.expired == false) | .name')"
          if ! printf '%s\n' "$PRESENT" | grep -qFx "$ARTIFACT"; then
            echo "::warning::${ARTIFACT} is absent from image-build run ${RUN_ID}"
            echo "resolved=0" >>"$GITHUB_OUTPUT"
            exit 0
          fi
          {
            echo "resolved=1"
            echo "run_id=$RUN_ID"
          } >>"$GITHUB_OUTPUT"
          echo "Taking $ARTIFACT from image-build run $RUN_ID"

      - name: Stop the run when there is no machine to measure
        if: steps.agent-build.outputs.resolved != '1'
        run: |
          echo "::error::no agent binary for ${AGENT_TARGET}; this run is inconclusive and pushes no rows"
          exit 1

      - name: Download the agent
        uses: actions/download-artifact@v8
        with:
          name: mesh-agent-${{ env.AGENT_TARGET }}
          path: /tmp/agent-artifact
          run-id: ${{ steps.agent-build.outputs.run_id }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

      - name: Make the agent executable
        run: install -m 0755 /tmp/agent-artifact/mesh-agent /tmp/mesh-agent

      - name: Seed the drill's administrator and mint a credential
        run: |
          set -euo pipefail
          PASSWORD="$(kubectl -n "$NAMESPACE" get secret \
            "${RELEASE}-loadtest-account" -o jsonpath='{.data.password}' | base64 -d)"
          test -n "$PASSWORD"
          echo "::add-mask::$PASSWORD"
          echo "DRILL_SERVICE_PASSWORD=$PASSWORD" >>"$GITHUB_ENV"
          # The statements go over stdin because a psql argv is visible in the pod and exec audit.
          # Not retried: a dropped connection cannot say whether the statements landed.
          ACCOUNT_EMAIL="$DRILL_SERVICE_ACCOUNT" ACCOUNT_PASSWORD="$PASSWORD" \
            deploy/scripts/loadtest-account-sql.sh \
            | kubectl -n "$NAMESPACE" exec -i "statefulset/${RELEASE}-postgres" -- \
                psql -U opengate -d opengate -v ON_ERROR_STOP=1 -q

      # One in-cluster client carries every request, so no port-forward stays open across scenarios.
      - name: Stand up the in-cluster client
        run: |
          set -euo pipefail
          PROBE_POD="netdrill-probe-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "PROBE_POD=$PROBE_POD" >>"$GITHUB_ENV"
          kubectl -n "$NAMESPACE" run "$PROBE_POD" \
            --image=docker.io/curlimages/curl:8.11.1 \
            --restart=Never \
            --overrides='{"spec":{"containers":[{"name":"'"$PROBE_POD"'","image":"docker.io/curlimages/curl:8.11.1","command":["sleep","3000"],"resources":{"requests":{"cpu":"10m","memory":"32Mi"},"limits":{"cpu":"100m","memory":"64Mi"}}}]}}' \
            --command -- sleep 3000
          deploy/scripts/wait-for-pod-ready.sh "$PROBE_POD" 120

      - name: Mint the enrolment credential the machines spend
        run: |
          set -euo pipefail
          # Asked again only when the request never reached the probe pod.
          . scripts/lib/kubectl-retry.sh
          probe() { kubectl_retry --unstarted -n "$NAMESPACE" exec "$PROBE_POD" -- curl -sS --max-time 20 "$@"; }

          TOKEN="$(probe -X POST "$DRILL_API_URL/api/v1/auth/login" \
            -H 'Content-Type: application/json' \
            -d "{\"email\":\"$DRILL_SERVICE_ACCOUNT\",\"password\":\"$DRILL_SERVICE_PASSWORD\"}" \
            | jq -r '.token // empty')"
          test -n "$TOKEN" || { echo "::error::could not sign in as the drill's administrator"; exit 1; }
          echo "::add-mask::$TOKEN"
          echo "DRILL_API_TOKEN=$TOKEN" >>"$GITHUB_ENV"

          # The token comes from the public endpoint an installer uses and expires within the hour.
          # The certificate authority's key stays in the cluster: it mints a trusted machine.
          ENROLMENT="$(probe -X POST "$DRILL_API_URL/api/v1/enrollment-tokens" \
            -H 'Content-Type: application/json' \
            -H "Authorization: Bearer $TOKEN" \
            -d '{"label":"nightly network drill","max_uses":0,"expires_in_hours":1}' \
            | jq -r '.token // empty')"
          test -n "$ENROLMENT" || { echo "::error::could not mint an enrolment token"; exit 1; }
          echo "::add-mask::$ENROLMENT"
          echo "DRILL_ENROLMENT_TOKEN=$ENROLMENT" >>"$GITHUB_ENV"

          kubectl -n "$NAMESPACE" create secret generic opengate-netdrill-enrolment \
            --from-literal=token="$ENROLMENT" \
            --dry-run=client -o yaml | kubectl -n "$NAMESPACE" apply -f -

      - name: Start the link shaper
        run: |
          set -euo pipefail
          . scripts/lib/kubectl-retry.sh
          SHAPER_POD="netdrill-shaper-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "SHAPER_POD=$SHAPER_POD" >>"$GITHUB_ENV"
          # The seed is recorded in the evidence so a night can be compared with the one before.
          echo "SHAPER_SEED=$GITHUB_RUN_ID" >>"$GITHUB_ENV"

          MACHINE="$SHAPER_POD" RELEASE="$RELEASE" NODE_ARCH="$NODE_ARCH" \
            SERVER_POD_IP="$SERVER_POD_IP" SHAPER_SEED="$GITHUB_RUN_ID" \
            deploy/scripts/netfault-shaper-pod.sh \
            | kubectl -n "$NAMESPACE" apply -f -
          deploy/scripts/wait-for-pod-ready.sh "$SHAPER_POD" 180
          # All three calls are short and idempotent, so asking twice is safe.
          kubectl_retry -n "$NAMESPACE" cp /tmp/netfault "$SHAPER_POD:/tmp/netfault"
          kubectl_retry -n "$NAMESPACE" exec "$SHAPER_POD" -- chmod 0755 /tmp/netfault
          kubectl_retry -n "$NAMESPACE" exec "$SHAPER_POD" -- touch /tmp/ready

          SHAPER_IP="$(kubectl -n "$NAMESPACE" get pod "$SHAPER_POD" -o jsonpath='{.status.podIP}')"
          test -n "$SHAPER_IP"
          echo "SHAPER_IP=$SHAPER_IP" >>"$GITHUB_ENV"
          echo "SHAPER_URL=http://${SHAPER_IP}:9091" >>"$GITHUB_ENV"

          for _ in $(seq 1 60); do
            # Not retried: the surrounding loop is the retry, and a nested retry multiplies the wait.
            if kubectl -n "$NAMESPACE" exec "$PROBE_POD" -- \
              curl -sS --max-time 5 "http://${SHAPER_IP}:9091/healthz" >/dev/null 2>&1; then
              echo "the shaper is answering"
              exit 0
            fi
            sleep 2
          done
          echo "::error::the shaper never answered on its control endpoint"
          exit 1

      # Both machines dial the certificate's name, which the alias resolves to the shaper.
      # Enrolment takes the fully-qualified Service name, which the alias skips.
      - name: Start the real machine, with its path through the shaper
        run: |
          set -euo pipefail
          . scripts/lib/kubectl-retry.sh
          MACHINE_POD="netdrill-machine-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "MACHINE_POD=$MACHINE_POD" >>"$GITHUB_ENV"

          MACHINE="$MACHINE_POD" RELEASE="$RELEASE" NODE_ARCH="$NODE_ARCH" \
            SERVER_POD_IP="$SHAPER_IP" \
            ENROLMENT_SECRET=opengate-netdrill-enrolment \
            OPENGATE_ENROLL_URL="$DRILL_ENROLL_URL" \
            deploy/scripts/e2e-machine-pod.sh \
            | kubectl -n "$NAMESPACE" apply -f -

          deploy/scripts/wait-for-pod-ready.sh "$MACHINE_POD" 180
          kubectl_retry -n "$NAMESPACE" exec "$MACHINE_POD" -- mkdir -p /tmp/agent
          kubectl_retry -n "$NAMESPACE" cp /tmp/mesh-agent "$MACHINE_POD:/tmp/mesh-agent"
          kubectl_retry -n "$NAMESPACE" exec "$MACHINE_POD" -- chmod 0755 /tmp/mesh-agent
          kubectl_retry -n "$NAMESPACE" exec "$MACHINE_POD" -- touch /tmp/ready

      - name: Wait for the machine to arrive, and learn which one it is
        run: |
          set -euo pipefail
          # Asked again only when the request never reached the probe pod.
          . scripts/lib/kubectl-retry.sh
          probe() { kubectl_retry --unstarted -n "$NAMESPACE" exec "$PROBE_POD" -- curl -sS --max-time 20 "$@"; }
          for _ in $(seq 1 60); do
            DEVICE_ID="$(probe "$DRILL_API_URL/api/v1/devices" \
              -H "Authorization: Bearer $DRILL_API_TOKEN" \
              | jq -r --arg h "$MACHINE_POD" \
                  '[.[] | select(.hostname == $h and .status == "online") | .id] | first // empty')"
            if [ -n "$DEVICE_ID" ]; then
              echo "DEVICE_ID=$DEVICE_ID" >>"$GITHUB_ENV"
              echo "the drill's machine is online as $DEVICE_ID"
              exit 0
            fi
            sleep 5
          done
          echo "::error::the drill's machine never came online through the shaper — the enrolment split may have been missed"
          exit 1

      # The simulated fleet makes the thin-uplink scenario a herd of twenty machines in one tenant.
      - name: Start the simulated fleet behind the same shaper
        run: |
          set -euo pipefail
          . scripts/lib/kubectl-retry.sh
          FLEET_POD="netdrill-fleet-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          echo "FLEET_POD=$FLEET_POD" >>"$GITHUB_ENV"

          # The request is sized to twenty simulated machines because the node is mostly claimed.
          kubectl -n "$NAMESPACE" run "$FLEET_POD" \
            --image=docker.io/library/alpine:3.21.3 \
            --restart=Never \
            --overrides='{"spec":{"hostAliases":[{"ip":"'"$SHAPER_IP"'","hostnames":["'"${RELEASE}"'-server"]}],"containers":[{"name":"'"$FLEET_POD"'","image":"docker.io/library/alpine:3.21.3","command":["sleep","2700"],"resources":{"requests":{"cpu":"25m","memory":"128Mi"},"limits":{"cpu":"400m","memory":"384Mi"}}}]}}' \
            --command -- sleep 2700
          deploy/scripts/wait-for-pod-ready.sh "$FLEET_POD" 120
          kubectl_retry -n "$NAMESPACE" cp /tmp/loadtest "$FLEET_POD:/tmp/loadtest"
          kubectl_retry -n "$NAMESPACE" exec "$FLEET_POD" -- chmod 0755 /tmp/loadtest

          # The fleet is held for the whole drill, so every scenario finds the herd in place.
          # The hold covers all four scenarios plus the herd's head start.
          LOADTEST_POD="$FLEET_POD" \
          scripts/loadtest-quic-incluster.sh start -- \
            /tmp/loadtest \
              -agents="$DRILL_FLEET_AGENTS" \
              -addr="${RELEASE}-server:9090" \
              -enroll-url="$DRILL_ENROLL_URL" \
              -enroll-token="$DRILL_ENROLMENT_TOKEN" \
              -hostname-prefix="$DRILL_FLEET_PREFIX" \
              -reconnect \
              -retry-deferred \
              -default-telemetry \
              -backfill-batches=4 \
              -backfill-samples=1000 \
              -hold=35m

      - name: Run the scenarios
        id: scenarios
        env:
          NETDRILL_RUN_SCENARIOS: ${{ inputs.scenarios || 's1 s2 s3 s4' }}
        run: |
          set -uo pipefail
          mkdir -p "$DRILL_EVIDENCE" "$(dirname "$DRILL_MEASUREMENTS")"
          : >"$DRILL_MEASUREMENTS"
          inconclusive=0
          # errexit is off around the scenario because exit code 2 means it could not observe.
          set +e
          for scenario in $NETDRILL_RUN_SCENARIOS; do
            echo "::group::$scenario"
            NAMESPACE="$NAMESPACE" \
            PROBE_POD="$PROBE_POD" \
            SHAPER_POD="$SHAPER_POD" \
            SHAPER_URL="$SHAPER_URL" \
            SERVER_URL="$DRILL_API_URL" \
            DEVICE_ID="$DEVICE_ID" \
            MACHINE_POD="$MACHINE_POD" \
            FLEET_PREFIX="$DRILL_FLEET_PREFIX" \
            SHAPER_SEED="$SHAPER_SEED" \
            API_TOKEN="$DRILL_API_TOKEN" \
            EVIDENCE_DIR="$DRILL_EVIDENCE" \
            MEASUREMENTS_FILE="$DRILL_MEASUREMENTS" \
              scripts/fault/network-drill.sh "$scenario"
            rc=$?
            echo "::endgroup::"
            # A scenario that could not observe the system contributes no row; the run says so.
            if [ "$rc" -eq 2 ]; then
              echo "::warning::$scenario was inconclusive and contributed no measurement"
              inconclusive=$((inconclusive + 1))
            elif [ "$rc" -ne 0 ]; then
              echo "::error::$scenario failed to run (exit $rc)"
              inconclusive=$((inconclusive + 1))
            fi
          done
          set -e
          echo "inconclusive=$inconclusive" >>"$GITHUB_OUTPUT"

      # The herd's verdict is written to a file inside the fleet pod and read for its count.
      # Twenty machines reporting a severance is the expected result of a blackholed link.
      - name: Read the herd's own verdict
        if: always()
        run: |
          set -uo pipefail
          mkdir -p "$DRILL_EVIDENCE"
          [ -n "${FLEET_POD:-}" ] || exit 0
          LOADTEST_POD="$FLEET_POD" \
            scripts/loadtest-quic-incluster.sh collect \
            >"$DRILL_EVIDENCE/fleet-verdict.txt" 2>&1 || true
          tail -30 "$DRILL_EVIDENCE/fleet-verdict.txt" || true

      - name: Collect the evidence
        if: always()
        run: |
          set -uo pipefail
          mkdir -p "$DRILL_EVIDENCE"
          cp "$DRILL_MEASUREMENTS" "$DRILL_EVIDENCE/measurements.jsonl" 2>/dev/null || true
          kubectl -n "$NAMESPACE" get events --sort-by=.lastTimestamp \
            >"$DRILL_EVIDENCE/events.txt" 2>&1 || true
          kubectl -n "$NAMESPACE" get pods -o wide >"$DRILL_EVIDENCE/pods.txt" 2>&1 || true
          for pod in "${SHAPER_POD:-}" "${MACHINE_POD:-}" "${FLEET_POD:-}"; do
            [ -n "$pod" ] || continue
            kubectl -n "$NAMESPACE" logs "$pod" --tail=2000 \
              >"$DRILL_EVIDENCE/${pod}.log" 2>&1 || true
          done

      - name: Build the canonical rows
        id: summarize
        run: |
          set -uo pipefail
          if scripts/network-drill-summarize.sh "$DRILL_MEASUREMENTS" >/tmp/netdrill-summary.json; then
            echo "measured=1" >>"$GITHUB_OUTPUT"
            cp /tmp/netdrill-summary.json "$DRILL_EVIDENCE/netdrill-summary.json"
            jq -r '.[] | "\(.scenario)/\(.victim) \(.metric) = \(.value)"' /tmp/netdrill-summary.json
          else
            echo "measured=0" >>"$GITHUB_OUTPUT"
            echo "::warning::this run measured nothing, so it pushes no rows"
          fi

      - name: Upload the evidence bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: netdrill-evidence
          path: /tmp/netdrill/evidence
          # An empty bundle would leave a run looking collected when nothing was.
          if-no-files-found: error
          retention-days: 14

      - name: Upload the canonical rows
        if: steps.summarize.outputs.measured == '1'
        uses: actions/upload-artifact@v7
        with:
          name: netdrill-summary
          path: /tmp/netdrill-summary.json
          if-no-files-found: error
          retention-days: 14

      # The enrolled machines are deleted through a technician's delete call, before the probe
      # pod goes, because every request travels through it.
      - name: Remove every machine the drill enrolled
        if: always()
        run: |
          set -uo pipefail
          if [ -z "${PROBE_POD:-}" ] || [ -z "${DRILL_API_TOKEN:-}" ]; then
            echo "no in-cluster client or credential; the machines are left for the next deploy's reset"
            exit 0
          fi
          # Asked again only when the request never reached the probe pod.
          . scripts/lib/kubectl-retry.sh
          probe() { kubectl_retry --unstarted -n "$NAMESPACE" exec "$PROBE_POD" -- curl -sS --max-time 20 "$@"; }

          MINE="$(probe "$DRILL_API_URL/api/v1/devices" \
            -H "Authorization: Bearer $DRILL_API_TOKEN" \
            | jq -r --arg p "${DRILL_FLEET_PREFIX}-" --arg m "${MACHINE_POD:-}" \
                '.[] | select((.hostname // "") | startswith($p) or . == $m) | .id' || true)"

          REMOVED=0
          for id in $MINE; do
            probe -o /dev/null -X DELETE "$DRILL_API_URL/api/v1/devices/$id" \
              -H "Authorization: Bearer $DRILL_API_TOKEN" >/dev/null 2>&1 \
              && REMOVED=$((REMOVED + 1))
          done
          echo "removed $REMOVED machine(s) the drill enrolled"

          LEFT="$(probe "$DRILL_API_URL/api/v1/devices" \
            -H "Authorization: Bearer $DRILL_API_TOKEN" \
            | jq -r --arg p "${DRILL_FLEET_PREFIX}-" --arg m "${MACHINE_POD:-}" \
                '[ .[] | select((.hostname // "") | startswith($p) or . == $m) ] | length' || echo unknown)"
          if [ "$LEFT" != "0" ]; then
            echo "::warning::the drill left ${LEFT} of its machines behind"
          else
            echo "the drill left none of its machines behind"
          fi

      - name: Remove every pod the drill created, and prove none remains
        if: always()
        run: |
          set -uo pipefail
          for pod in "${SHAPER_POD:-}" "${MACHINE_POD:-}" "${FLEET_POD:-}" "${PROBE_POD:-}"; do
            [ -n "$pod" ] || continue
            kubectl -n "$NAMESPACE" delete pod "$pod" --ignore-not-found --wait=true --timeout=120s || true
          done
          kubectl -n "$NAMESPACE" delete secret opengate-netdrill-enrolment --ignore-not-found || true
          LEFT="$(kubectl -n "$NAMESPACE" get pods -o name 2>/dev/null \
            | grep -E "netdrill-(shaper|machine|fleet|probe)-${GITHUB_RUN_ID}-" || true)"
          if [ -n "$LEFT" ]; then
            echo "::error::the drill left pods behind: $LEFT"
            exit 1
          fi
          echo "the drill left nothing behind"

      - name: Release the staging namespace
        if: always()
        run: scripts/staging-lease.sh release "$STAGING_LEASE_HOLDER"

      - name: Remove OCI credentials
        if: always()
        uses: ./.github/actions/oci-kube-teardown

  publish:
    name: Publish the network-drill trend
    needs: [network-drill]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # The job result is the observability environment's deployment status: it reports only
    # whether the trend was published, and the regression verdict is the job below.
    environment: observability
    permissions:
      contents: read
    outputs:
      regression: ${{ steps.check.outputs.regression }}
    env:
      VM_RUN_STARTED_AT: ${{ needs.network-drill.outputs.started_at }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-pinned-tools
      - name: OCI + kubeconfig setup
        uses: ./.github/actions/oci-kube-setup
        with:
          oci-tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci-user: ${{ secrets.OCI_USER_OCID }}
          oci-fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          oci-private-key: ${{ secrets.OCI_PRIVATE_KEY }}
          oci-region: ${{ secrets.OCI_REGION }}
          cluster-id: ${{ secrets.OKE_CLUSTER_ID }}

      # A run that measured nothing publishes nothing, since rows of zeroes pull a median down.
      - name: Read whether the run measured anything at all
        run: |
          set -euo pipefail
          if [ "${{ needs.network-drill.outputs.measured }}" != "1" ]; then
            echo "::warning::the drill measured nothing this night; no rows enter the trend"
            echo "NETDRILL_MEASURED=0" >>"$GITHUB_ENV"
          else
            echo "NETDRILL_MEASURED=1" >>"$GITHUB_ENV"
          fi

      - name: Download the canonical rows
        if: needs.network-drill.outputs.measured == '1'
        uses: actions/download-artifact@v8
        with:
          name: netdrill-summary
          path: artifacts/netdrill

      - name: Check for a regression
        id: check
        if: needs.network-drill.outputs.measured == '1'
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          # errexit is off around the capture because the check exits 1 on a regression.
          set +e
          OUT="$(scripts/network-drill-regression-check.sh artifacts/netdrill/netdrill-summary.json netdrill-table.md 2>&1)"
          rc=$?
          set -e
          printf '%s\n' "$OUT"
          if [ "$rc" -eq 1 ]; then
            echo "regression=1" >>"$GITHUB_OUTPUT"
            {
              echo 'alert_text<<NETDRILL'
              printf '%s\n' "$OUT"
              echo 'NETDRILL'
            } >>"$GITHUB_OUTPUT"
          else
            echo "regression=0" >>"$GITHUB_OUTPUT"
          fi

      - name: Push the rows to VictoriaMetrics
        if: needs.network-drill.outputs.measured == '1'
        run: scripts/network-drill-vm-push.sh artifacts/netdrill/netdrill-summary.json

      - name: Write the run summary
        if: always()
        run: |
          set -uo pipefail
          {
            echo "## Network drill"
            echo
            if [ "${{ needs.network-drill.outputs.measured }}" != "1" ]; then
              echo "This run measured nothing; no rows entered the trend."
            elif [ -s netdrill-table.md ]; then
              # The check that judged the readings wrote this, so page and verdict share a floor.
              cat netdrill-table.md
            else
              echo "The readings could not be checked, so there is no table; see the check step."
            fi
          } >>"$GITHUB_STEP_SUMMARY"

      - name: Send Telegram alert
        # Runs whatever happened above, and the message names which of the three it was.
        # A refused delivery fails the step; a separate job reads the verdict.
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.DEPLOY_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.DEPLOY_TELEGRAM_CHAT_ID }}
          FINDING: ${{ steps.check.outputs.regression }}
          ALERT_TEXT: ${{ steps.check.outputs.alert_text }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = "success" ] && [ "${FINDING:-0}" != "1" ]; then
            echo "No alert sent: the run finished and found nothing."
            exit 0
          fi
          if [ "${FINDING:-0}" = "1" ]; then
            MSG="$(printf '%s\n\nRun: %s\nTrend: Grafana dashboard "Network Drill Trends" (opengate-network-drill-trend)' "$ALERT_TEXT" "$RUN_URL")"
          else
            MSG="$(printf 'Network drill: the night did not finish (%s), so nothing was measured.\n\nRun: %s' \
              "$JOB_STATUS" "$RUN_URL")"
          fi
          scripts/telegram-alert.sh "$MSG"

      - name: Remove OCI credentials
        if: always()
        uses: ./.github/actions/oci-kube-teardown

  gate:
    name: Network-drill regression gate
    needs: [publish]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      # The drill does not block a deploy; this job decides whether the nightly goes red.
      - name: Fail the workflow red on a regression
        run: |
          if [ "${{ needs.publish.result }}" != "success" ]; then
            echo "::error::Network-drill trend publishing did not succeed; see the publish job."
            exit 1
          fi
          if [ "${{ needs.publish.outputs.regression }}" = "1" ]; then
            echo "::error::Network-drill regression — see the workflow summary and the Telegram alert (if delivered)."
            exit 1
          fi
          echo "No network-drill regression."
