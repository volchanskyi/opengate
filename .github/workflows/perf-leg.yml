name: Performance leg

# One leg of a performance domain, as up to four tries in a row: a refused runner's processor asks
# for a fresh runner, and four refusals skip the leg with the reason recorded.

on:
  workflow_call:
    inputs:
      leg:
        description: "The leg's name, which names its bundle directory, artifact and trend series"
        required: true
        type: string
      title:
        description: "The leg's name in its summary"
        required: true
        type: string
      profile:
        description: "The profile the harness and the technicians walk"
        required: true
        type: string
      agents:
        description: "Machines in the leg's fleet"
        required: true
        type: string
      hold:
        description: "How long the harness holds the fleet"
        required: true
        type: string
      minutes:
        description: "The leg's job timeout"
        required: true
        type: number
      arm:
        description: "Runs the leg on GitHub's ARM runner"
        required: false
        type: boolean
        default: false
      server-cpus:
        description: "The server's processor share"
        required: false
        type: string
        default: '1.0'
      server-memory:
        description: "The server's memory limit, as compose spells it"
        required: false
        type: string
        default: 1g
      server-memory-bytes:
        description: "The server's memory limit in bytes, which the harness records as the target's"
        required: false
        type: string
        default: '1073741824'
      generator-cpus:
        description: "The harness's processor allowance"
        required: false
        type: string
        default: '1.0'
      generator-memory:
        description: "The harness's memory allowance"
        required: false
        type: string
        default: 10G
      technician-cpus:
        description: "A processor allowance of the technicians' own; empty shares the harness's"
        required: false
        type: string
        default: ''
      technician-memory:
        description: "A memory allowance of the technicians' own, beside technician-cpus"
        required: false
        type: string
        default: ''
      weigh:
        description: "Weighs the fixture the fleet built and folds the weight into the bundle"
        required: false
        type: boolean
        default: false
      catch-up:
        description: "Runs the store probe first, and walks the fleet back after an hour away"
        required: false
        type: boolean
        default: false
      burst:
        description: "Installs the fleet first, so its walk is a return, with live minutes and no gap"
        required: false
        type: boolean
        default: false
      journeys:
        description: "The technician scenarios k6 runs beside the fleet, separated by spaces"
        required: false
        type: string
        default: api-baseline relay-throughput
    secrets:
      DOCKERHUB_USERNAME:
        required: true
      DOCKERHUB_TOKEN:
        required: true

permissions:
  contents: read

jobs:
  try-1:
    name: Try 1
    uses: ./.github/workflows/perf-leg-try.yml
    with:
      leg: ${{ inputs.leg }}
      title: ${{ inputs.title }}
      profile: ${{ inputs.profile }}
      agents: ${{ inputs.agents }}
      hold: ${{ inputs.hold }}
      minutes: ${{ inputs.minutes }}
      arm: ${{ inputs.arm }}
      server-cpus: ${{ inputs.server-cpus }}
      server-memory: ${{ inputs.server-memory }}
      server-memory-bytes: ${{ inputs.server-memory-bytes }}
      generator-cpus: ${{ inputs.generator-cpus }}
      generator-memory: ${{ inputs.generator-memory }}
      technician-cpus: ${{ inputs.technician-cpus }}
      technician-memory: ${{ inputs.technician-memory }}
      weigh: ${{ inputs.weigh }}
      catch-up: ${{ inputs.catch-up }}
      burst: ${{ inputs.burst }}
      journeys: ${{ inputs.journeys }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  try-2:
    name: Try 2
    needs: [try-1]
    if: ${{ !cancelled() && needs.try-1.outputs.refused == 'true' }}
    uses: ./.github/workflows/perf-leg-try.yml
    with:
      leg: ${{ inputs.leg }}
      title: ${{ inputs.title }}
      profile: ${{ inputs.profile }}
      agents: ${{ inputs.agents }}
      hold: ${{ inputs.hold }}
      minutes: ${{ inputs.minutes }}
      arm: ${{ inputs.arm }}
      server-cpus: ${{ inputs.server-cpus }}
      server-memory: ${{ inputs.server-memory }}
      server-memory-bytes: ${{ inputs.server-memory-bytes }}
      generator-cpus: ${{ inputs.generator-cpus }}
      generator-memory: ${{ inputs.generator-memory }}
      technician-cpus: ${{ inputs.technician-cpus }}
      technician-memory: ${{ inputs.technician-memory }}
      weigh: ${{ inputs.weigh }}
      catch-up: ${{ inputs.catch-up }}
      burst: ${{ inputs.burst }}
      journeys: ${{ inputs.journeys }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  try-3:
    name: Try 3
    needs: [try-2]
    if: ${{ !cancelled() && needs.try-2.outputs.refused == 'true' }}
    uses: ./.github/workflows/perf-leg-try.yml
    with:
      leg: ${{ inputs.leg }}
      title: ${{ inputs.title }}
      profile: ${{ inputs.profile }}
      agents: ${{ inputs.agents }}
      hold: ${{ inputs.hold }}
      minutes: ${{ inputs.minutes }}
      arm: ${{ inputs.arm }}
      server-cpus: ${{ inputs.server-cpus }}
      server-memory: ${{ inputs.server-memory }}
      server-memory-bytes: ${{ inputs.server-memory-bytes }}
      generator-cpus: ${{ inputs.generator-cpus }}
      generator-memory: ${{ inputs.generator-memory }}
      technician-cpus: ${{ inputs.technician-cpus }}
      technician-memory: ${{ inputs.technician-memory }}
      weigh: ${{ inputs.weigh }}
      catch-up: ${{ inputs.catch-up }}
      burst: ${{ inputs.burst }}
      journeys: ${{ inputs.journeys }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  try-4:
    name: Try 4
    needs: [try-3]
    if: ${{ !cancelled() && needs.try-3.outputs.refused == 'true' }}
    uses: ./.github/workflows/perf-leg-try.yml
    with:
      leg: ${{ inputs.leg }}
      title: ${{ inputs.title }}
      profile: ${{ inputs.profile }}
      agents: ${{ inputs.agents }}
      hold: ${{ inputs.hold }}
      minutes: ${{ inputs.minutes }}
      arm: ${{ inputs.arm }}
      server-cpus: ${{ inputs.server-cpus }}
      server-memory: ${{ inputs.server-memory }}
      server-memory-bytes: ${{ inputs.server-memory-bytes }}
      generator-cpus: ${{ inputs.generator-cpus }}
      generator-memory: ${{ inputs.generator-memory }}
      technician-cpus: ${{ inputs.technician-cpus }}
      technician-memory: ${{ inputs.technician-memory }}
      weigh: ${{ inputs.weigh }}
      catch-up: ${{ inputs.catch-up }}
      burst: ${{ inputs.burst }}
      journeys: ${{ inputs.journeys }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # The trend lists the reason on the night's summary and in its alert.
  skipped:
    name: Record a leg skipped after four refused runners
    needs: [try-1, try-2, try-3, try-4]
    if: ${{ !cancelled() && needs.try-4.outputs.refused == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Write why the leg was skipped
        env:
          TITLE: ${{ inputs.title }}
          LEG: ${{ inputs.leg }}
          TRY_1: ${{ needs.try-1.outputs.processor }}
          TRY_2: ${{ needs.try-2.outputs.processor }}
          TRY_3: ${{ needs.try-3.outputs.processor }}
          TRY_4: ${{ needs.try-4.outputs.processor }}
        run: |
          set -euo pipefail
          mkdir -p perf-skipped
          REASON="$TITLE skipped: four runners in a row had a refused processor ($TRY_1; $TRY_2; $TRY_3; $TRY_4)"
          printf '%s\n' "$REASON" >"perf-skipped/skipped-$LEG.txt"
          printf -- '- %s\n' "$REASON" >>"$GITHUB_STEP_SUMMARY"

      - name: Upload the leg's skip record
        uses: actions/upload-artifact@v7
        with:
          name: perf-skipped-${{ inputs.leg }}
          path: perf-skipped/skipped-${{ inputs.leg }}.txt
          if-no-files-found: error
