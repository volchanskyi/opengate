name: Performance Stack (legs in turn on one runner)

# Runs the scaling family once per leg, the legs in turn on one runner, so two server commits or two
# generator allowances compare on one machine; a leg names its server's commit and allowance.

on:
  workflow_dispatch:
    inputs:
      legs:
        description: 'Space-separated <server-commit>:<shared|separate> legs, run in order; HEAD is this commit'
        required: true
        default: 'c09372bf:shared HEAD:shared HEAD:separate'
      cpus:
        description: 'The server processor allowance every leg runs at'
        required: true
        default: '0.25'

# Shares the nightly's group, so a dispatch never runs beside it.
concurrency:
  group: perf-stack
  cancel-in-progress: false

permissions:
  contents: read

env:
  COMPOSE_FILE: deploy/docker-compose.perf.yml
  K6_VERSION: v1.6.1
  K6_SUMMARY_TREND_STATS: avg,min,med,p(50),p(95),p(99),max,count
  PERF_BUNDLE_DIR: perf-bundles
  # The harness records these caps as the target's fingerprint, so they match the container.
  PERF_SERVER_MEMORY: 1g
  PERF_SERVER_MEMORY_BYTES: '1073741824'
  PERF_GENERATOR_CPUS: '1.0'
  PERF_GENERATOR_MEMORY: '10G'

jobs:
  legs:
    name: Scaling legs in turn (${{ inputs.cpus }} processors)
    runs-on: ubuntu-24.04
    timeout-minutes: 150
    steps:
      # A leg's server may be built from an earlier commit, so the whole history is fetched.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: ./.github/actions/setup-pinned-tools

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: server/go.sum

      # Docker Hub's anonymous pull rate is shared across a runner's network, so pulls use the mirror.
      - uses: ./.github/actions/docker-hub-mirror
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      # The transport asks for more receive buffer than a runner allows a socket.
      - name: Give the machine-facing path production's buffers
        run: scripts/perf-stack-quic.sh raise-buffers

      - name: Install k6
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-amd64.tar.gz" \
            | tar -xz -C /tmp
          install -m 0755 "/tmp/k6-${K6_VERSION}-linux-amd64/k6" /tmp/k6

      # Every leg runs the same harness, built once from this commit; only the server changes.
      - name: Run every leg in turn
        env:
          LEGS: ${{ inputs.legs }}
          PERF_SERVER_CPUS: ${{ inputs.cpus }}
          LOADTEST_BASE_URL: http://127.0.0.1:8080
          LOADTEST_PROFILE: load/profiles/scaling.yaml
          K6_BIN: /tmp/k6
          RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}
          # The stack is per-run and reachable only from the runner; the password is generated per run.
          PERF_FIXTURE_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-Perf!
        run: |
          set -euo pipefail
          DOCKER_CONFIG="$(./scripts/docker-credstore-guard.sh)"
          export DOCKER_CONFIG
          go build -C server -trimpath -o /tmp/loadtest ./tests/loadtest/
          read -r -a legs <<<"$LEGS"
          n=0
          broke=""
          for leg in "${legs[@]}"; do
            n=$((n + 1))
            commit="${leg%%:*}"
            allowance="${leg#*:}"
            case "$allowance" in
              shared) machines=opengate-generator.slice technicians=opengate-generator.slice ;;
              separate) machines=opengate-generator-machines.slice technicians=opengate-generator-technicians.slice ;;
              *)
                echo "::error::leg $leg names allowance '$allowance'; a leg is <commit>:shared or <commit>:separate." >&2
                exit 1
                ;;
            esac
            sha="$(git rev-parse --verify "$commit^{commit}")"
            tree="$RUNNER_TEMP/server-$n"
            git worktree add --detach "$tree" "$sha"
            printf 'services:\n  server:\n    build:\n      context: %s\n' "$tree" >"$RUNNER_TEMP/leg-$n.yml"
            echo "::group::leg $n: server at $sha, generators $allowance"
            scripts/perf-stack-pull.sh "$COMPOSE_FILE"
            docker compose -f "$COMPOSE_FILE" -f "$RUNNER_TEMP/leg-$n.yml" up --build --wait --wait-timeout 300
            GITHUB_ENV="$RUNNER_TEMP/leg-$n.env" scripts/perf-stack-quic.sh map-server
            counters="$(sed -n 's/^PERF_TARGET_NET_COUNTERS=//p' "$RUNNER_TEMP/leg-$n.env")"
            server_cgroup="$(scripts/database-levels.sh cgroup-of opengate-perf-server)"
            scripts/perf-runner-record.sh snapshot "$server_cgroup" "/tmp/runner-before-$n.json"
            mkdir -p "$PERF_BUNDLE_DIR" "/tmp/perf-k6-$n"
            LOADTEST_RUN_ID="$RUN_ID-leg$n" LOADTEST_K6_SUMMARY_DIR="/tmp/perf-k6-$n" \
              LOADTEST_GENERATOR_SLICE="$technicians" \
              scripts/loadtest-generator-share.sh "$PERF_GENERATOR_CPUS" "$PERF_GENERATOR_MEMORY" -- \
              scripts/loadtest-k6-alongside.sh "/tmp/perf-quic-$n.txt" api-baseline relay-throughput &
            k6_leg=$!
            # Exit 1 is a partly arrived fleet, which is a measurement; the verdict says what it was.
            set +e
            LOADTEST_RUN_ID="$RUN_ID-leg$n" LOADTEST_GENERATOR_SLICE="$machines" \
              scripts/loadtest-quic-run.sh "/tmp/perf-quic-$n.txt" -- \
              scripts/loadtest-generator-share.sh "$PERF_GENERATOR_CPUS" "$PERF_GENERATOR_MEMORY" -- \
              /tmp/loadtest \
                -agents=2000 \
                -addr=server:9090 \
                -target-net-counters="$counters" \
                -default-telemetry \
                -hold=5m \
                -profile=load/profiles/scaling.yaml \
                -commit="$sha" \
                -target-cpus="$PERF_SERVER_CPUS" \
                -target-memory-bytes="$PERF_SERVER_MEMORY_BYTES" \
                -target-description="compose stack, $PERF_SERVER_CPUS processors, leg $n" \
                -enroll-url=http://127.0.0.1:8080 \
                -metrics-url=http://127.0.0.1:8081 \
                -fixture-account=perf-admin@opengate-loadtest.invalid \
                -fixture-password="$PERF_FIXTURE_PASSWORD" \
                -fixture-bootstrap \
                -fixture-seed=1 \
                -relay-sessions \
                -bundle="$PERF_BUNDLE_DIR/leg-$n"
            walk=$?
            set -e
            wait "$k6_leg"
            if [ "$walk" -gt 1 ]; then
              echo "::error::leg $n: the harness did not complete a run (exit $walk)." >&2
              exit "$walk"
            fi
            scripts/perf-runner-record.sh snapshot "$server_cgroup" "/tmp/runner-after-$n.json"
            scripts/perf-runner-record.sh delta "/tmp/runner-before-$n.json" "/tmp/runner-after-$n.json" \
              >"/tmp/runner-$n.json"
            bundle="$PERF_BUNDLE_DIR/leg-$n/bundle.json"
            scripts/loadtest-bundle-merge.sh "$bundle" --runner "/tmp/runner-$n.json" \
              --journeys "/tmp/perf-k6-$n/api-baseline.json" --journeys "/tmp/perf-k6-$n/relay-throughput.json"
            verdict="$(jq -r '.verdict.result' "$bundle")"
            jq -r --arg leg "$n" --arg sha "$sha" --arg allowance "$allowance" --arg verdict "$verdict" \
              '"Leg \($leg): server \($sha[0:12]), generators \($allowance), verdict \($verdict); \(.runner.processor_model), the server throttled in \(.runner.server_throttled_periods) of \(.runner.server_periods) periods"' \
              "$bundle" | tee -a "$GITHUB_STEP_SUMMARY"
            # A leg past a limit stopped working; every leg still runs, and the job fails after them.
            limits=0
            scripts/perf-bundle-limits.sh "$LOADTEST_PROFILE" "$bundle" "/tmp/rows-$n.json" || limits=$?
            if [ "$limits" -gt 1 ]; then
              echo "::error::leg $n: its limits could not be read (exit $limits)." >&2
              exit "$limits"
            fi
            if [ "$limits" = 1 ]; then broke="$broke $n"; fi
            scripts/run-summary.sh render --title "Leg $n" --profile "$LOADTEST_PROFILE" \
              --rows "/tmp/rows-$n.json" --bundle "$bundle" >>"$GITHUB_STEP_SUMMARY"
            docker compose -f "$COMPOSE_FILE" -f "$RUNNER_TEMP/leg-$n.yml" down -v
            git worktree remove --force "$tree"
            echo "::endgroup::"
          done
          if [ -n "$broke" ]; then
            echo "::error::leg(s)$broke tripped a limit the profile holds every leg to; the summary gives each reading." >&2
            exit 1
          fi

      - name: Tear the stack down
        if: always()
        run: |
          DOCKER_CONFIG="$(./scripts/docker-credstore-guard.sh)"
          export DOCKER_CONFIG
          docker compose -f "$COMPOSE_FILE" down -v

      - name: Upload every leg's bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-one-runner-legs
          path: ${{ env.PERF_BUNDLE_DIR }}
          if-no-files-found: error
          retention-days: 90
