name: Performance shapes

# The load shapes: a busy morning, a site whose link came back, and a ladder raised until it
# gives, each on a runner of its own and compared with its own nights.

on:
  schedule:
    # The hour decides queue order: a scheduled run starts hours after the time it names.
    - cron: '10 7 * * *'
  workflow_dispatch:

concurrency:
  group: perf-shapes
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  # The start time is taken once so every sample of the night carries the same date.
  started:
    name: Record when the run started
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      started_at: ${{ steps.started.outputs.at }}
    steps:
      - name: Record when the run started
        id: started
        run: echo "at=$(date -u +%s)" >>"$GITHUB_OUTPUT"

  # One job over a matrix: the legs differ only in the profile and the estate size it draws from.
  shapes:
    name: ${{ matrix.title }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: peak
            # The path is literal so sweeps that read the workflow as text can see it.
            path: load/profiles/peak.yaml
            title: Busy morning (peak)
            # The estate covers the profile's highest level.
            agents: '2000'
            hold: 8m
            minutes: 45
          - profile: spike
            path: load/profiles/spike.yaml
            title: Link came back (spike)
            agents: '2000'
            hold: 7m
            minutes: 45
          - profile: breakpoint
            path: load/profiles/breakpoint.yaml
            title: Raise it until it gives (breakpoint)
            # The harness and the technicians hold allowances of their own, so either running short is
            # judged apart; the server, database and store hold 2.5 of the runner's 4 processors.
            generator_cpus: '0.75'
            generator_memory: '4G'
            technician_cpus: '0.75'
            technician_memory: '4G'
            # About 150 KB of harness memory per machine puts the top rung near 2.4 GB.
            agents: '16000'
            # The ladder runs six five-minute steps, a one-minute drain and a five-minute recovery.
            hold: 40m
            minutes: 90
    uses: ./.github/workflows/perf-leg.yml
    with:
      leg: ${{ matrix.profile }}
      title: ${{ matrix.title }}
      profile: ${{ matrix.path }}
      agents: ${{ matrix.agents }}
      hold: ${{ matrix.hold }}
      minutes: ${{ matrix.minutes }}
      generator-cpus: ${{ matrix.generator_cpus || '1.0' }}
      generator-memory: ${{ matrix.generator_memory || '10G' }}
      technician-cpus: ${{ matrix.technician_cpus || '' }}
      technician-memory: ${{ matrix.technician_memory || '' }}
    secrets:
      DOCKERHUB_USERNAME: ${{ secrets.DOCKERHUB_USERNAME }}
      DOCKERHUB_TOKEN: ${{ secrets.DOCKERHUB_TOKEN }}

  # Runs after a cancel or a timeout too, so a night that died is alerted on.
  trend:
    name: Alert if the run did not finish, and publish the trend
    needs: [started, shapes]
    if: always()
    uses: ./.github/workflows/perf-trend.yml
    with:
      domain: shapes
      started-at: ${{ needs.started.outputs.started_at }}
      results: >-
        started=${{ needs.started.result }}
        shapes=${{ needs.shapes.result }}
    secrets:
      OCI_TENANCY_OCID: ${{ secrets.OCI_TENANCY_OCID }}
      OCI_WORKFLOW_USER_OCID: ${{ secrets.OCI_WORKFLOW_USER_OCID }}
      OCI_WORKFLOW_FINGERPRINT: ${{ secrets.OCI_WORKFLOW_FINGERPRINT }}
      OCI_WORKFLOW_PRIVATE_KEY: ${{ secrets.OCI_WORKFLOW_PRIVATE_KEY }}
      OCI_REGION: ${{ secrets.OCI_REGION }}
      OKE_CLUSTER_ID: ${{ secrets.OKE_CLUSTER_ID }}
      DEPLOY_TELEGRAM_BOT_TOKEN: ${{ secrets.DEPLOY_TELEGRAM_BOT_TOKEN }}
      DEPLOY_TELEGRAM_CHAT_ID: ${{ secrets.DEPLOY_TELEGRAM_CHAT_ID }}
