name: Performance Stack (volume + scaling + shapes)

# Runs the volume, scaling and shape families on a runner that brings its own disk and processors.
# A runner is x86_64 and production is ARM64, so results compare legs and give no absolute capacity.

on:
  schedule:
    # The hour decides queue order: a scheduled run starts hours after the time it names.
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: perf-stack
  cancel-in-progress: false

permissions:
  contents: read

env:
  COMPOSE_FILE: deploy/docker-compose.perf.yml
  K6_VERSION: v1.6.1
  K6_SUMMARY_TREND_STATS: avg,min,med,p(50),p(95),p(99),max,count
  PERF_BUNDLE_DIR: perf-bundles
  # The harness records these caps as the target's fingerprint, so they match the container.
  PERF_SERVER_MEMORY: 1g
  PERF_SERVER_MEMORY_BYTES: '1073741824'
  # The volume family holds this processor share constant; the scaling family overrides it per leg.
  PERF_SERVER_CPUS: '1.0'
  # An explicit generator allowance lets the harness measure its room against the allowance.
  PERF_GENERATOR_CPUS: '1.0'
  # Sixteen thousand machines cost about 400 KB each over a 1.25 GiB baseline.
  PERF_GENERATOR_MEMORY: '10G'

jobs:
  # The start time is taken once so every sample of the night carries the same date.
  started:
    name: Record when the run started
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      started_at: ${{ steps.started.outputs.at }}
    steps:
      - name: Record when the run started
        id: started
        run: echo "at=$(date -u +%s)" >>"$GITHUB_OUTPUT"

  scaling:
    name: Scaling sweep (${{ matrix.cpus }} processors)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # The rungs sit below what the runner leaves after the database, metrics store and generator.
      matrix:
        cpus: ["0.25", "0.5", "1", "2"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: server/go.sum

      # Docker Hub's anonymous pull rate is shared across a runner's network, so pulls use the mirror.
      - uses: ./.github/actions/docker-hub-mirror
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      # The free disk column is what binds; the harness reads all three figures itself.
      - name: Record what this runner actually is
        run: |
          set -euo pipefail
          printf 'processors: %s\n' "$(nproc)"
          printf 'memory:     %s KB\n' "$(awk '/MemTotal/ {print $2}' /proc/meminfo)"
          printf 'free disk:  %s KB\n' "$(df -k --output=avail / | tail -n1 | tr -d ' ')"

      # The transport asks for more receive buffer than a runner allows a socket.
      - name: Give the machine-facing path production's buffers
        run: scripts/perf-stack-quic.sh raise-buffers

      - name: Bring the performance stack up
        id: stack
        env:
          PERF_SERVER_CPUS: ${{ matrix.cpus }}
        run: |
          set -euo pipefail
          DOCKER_CONFIG="$(./scripts/docker-credstore-guard.sh)"
          export DOCKER_CONFIG
          scripts/perf-stack-pull.sh "$COMPOSE_FILE"
          docker compose -f "$COMPOSE_FILE" up --build --wait --wait-timeout 300
          # The database's cgroup is sampled for the job's duration for the leg's summary.
          DB_CGROUP="$(scripts/database-levels.sh cgroup-of opengate-perf-postgres)"
          nohup scripts/database-levels.sh sample "$DB_CGROUP" /tmp/db-samples.tsv >/dev/null 2>&1 &

      # The generator dials the name on the server's certificate, mapped to the container's address.
      - name: Dial the server by its certificate's name
        run: scripts/perf-stack-quic.sh map-server

      - name: Install k6
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-amd64.tar.gz" \
            | tar -xz -C /tmp
          install -m 0755 "/tmp/k6-${K6_VERSION}-linux-amd64/k6" /tmp/k6

      # Paths are named from the repository root and the build uses -C, so no step changes directory.
      - name: Run the scaling profile, building its fleet first
        env:
          LOADTEST_BASE_URL: http://127.0.0.1:8080
          LOADTEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-cpus${{ matrix.cpus }}
          LOADTEST_PROFILE: load/profiles/scaling.yaml
          LOADTEST_K6_SUMMARY_DIR: /tmp/perf-k6
          K6_BIN: /tmp/k6
          # The stack is per-run and reachable only from the runner; the password is generated per run.
          PERF_FIXTURE_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-Perf!
        run: |
          set -euo pipefail
          mkdir -p "$PERF_BUNDLE_DIR" "$LOADTEST_K6_SUMMARY_DIR"
          go build -C server -trimpath -o /tmp/loadtest ./tests/loadtest/
          scripts/loadtest-k6-alongside.sh /tmp/perf-quic.txt api-baseline relay-throughput &
          K6_LEG=$!
          # Exit 1 is a partly arrived fleet, which is a measurement; the verdict step judges it.
          set +e
          scripts/loadtest-quic-run.sh /tmp/perf-quic.txt -- \
            scripts/loadtest-generator-share.sh "$PERF_GENERATOR_CPUS" "$PERF_GENERATOR_MEMORY" -- \
            /tmp/loadtest \
              -agents=2000 \
              -addr=server:9090 \
              -target-net-counters="$PERF_TARGET_NET_COUNTERS" \
              -default-telemetry \
              -hold=5m \
              -profile=load/profiles/scaling.yaml \
              -commit="$GITHUB_SHA" \
              -target-cpus="${{ matrix.cpus }}" \
              -target-memory-bytes="$PERF_SERVER_MEMORY_BYTES" \
              -target-description="compose stack, ${{ matrix.cpus }} processors" \
              -enroll-url=http://127.0.0.1:8080 \
              -metrics-url=http://127.0.0.1:8081 \
              -fixture-account=perf-admin@opengate-loadtest.invalid \
              -fixture-password="$PERF_FIXTURE_PASSWORD" \
              -fixture-bootstrap \
              -fixture-seed=1 \
              -relay-sessions \
              -bundle="$PERF_BUNDLE_DIR/scaling-${{ matrix.cpus }}"
          walk=$?
          set -e
          wait "$K6_LEG"
          if [ "$walk" -gt 1 ]; then
            echo "::error::the harness did not complete a run (exit $walk)." >&2
            exit "$walk"
          fi

      # The technician numbers are timed by a separate generator and merged into the leg's bundle.
      - name: Fold the technician journeys into the leg
        run: |
          set -euo pipefail
          scripts/loadtest-bundle-merge.sh \
            "$PERF_BUNDLE_DIR/scaling-${{ matrix.cpus }}/bundle.json" \
            --journeys /tmp/perf-k6/api-baseline.json \
            --journeys /tmp/perf-k6/relay-throughput.json

      # A short receive buffer on either end means datagrams were lost before either process saw them.
      - name: Refuse a run whose ends ran short of receive buffer
        run: scripts/perf-stack-quic.sh check /tmp/perf-quic.txt

      - name: Read the verdict the run wrote about itself
        if: always() && steps.stack.outcome == 'success'
        run: scripts/perf-bundle-verdict.sh "$PERF_BUNDLE_DIR/scaling-${{ matrix.cpus }}/bundle.json"

      # The verdict says whether the run measured the system; the limits say whether it was fast enough.
      - name: Read the profile's limits against the run's own rows
        if: always() && steps.stack.outcome == 'success'
        run: |
          set -euo pipefail
          scripts/perf-bundle-limits.sh load/profiles/scaling.yaml \
            "$PERF_BUNDLE_DIR/scaling-${{ matrix.cpus }}/bundle.json" /tmp/scaling-rows.json

      - name: Write the leg's summary
        if: always() && steps.stack.outcome == 'success'
        run: |
          set -euo pipefail
          BUNDLE="$PERF_BUNDLE_DIR/scaling-${{ matrix.cpus }}/bundle.json"
          if [ ! -s "$BUNDLE" ] || [ ! -s "/tmp/scaling-rows.json" ]; then
            echo "The leg wrote no rows, so its summary is the verdict above."
            exit 0
          fi
          read -r FROM TO <<<"$(scripts/run-summary.sh window "load/profiles/scaling.yaml" "$BUNDLE")"
          scripts/database-levels.sh average /tmp/db-samples.tsv "$FROM" "$TO" >/tmp/db-levels.json
          scripts/run-summary.sh render --title "Scaling sweep (${{ matrix.cpus }} processors)" --profile "load/profiles/scaling.yaml" \
            --rows "/tmp/scaling-rows.json" --bundle "$BUNDLE" --database /tmp/db-levels.json >>"$GITHUB_STEP_SUMMARY"

      - name: Tear the stack down
        if: always()
        run: |
          DOCKER_CONFIG="$(./scripts/docker-credstore-guard.sh)"
          export DOCKER_CONFIG
          docker compose -f "$COMPOSE_FILE" down -v

      - name: Upload the scaling bundle
        if: always() && steps.stack.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: perf-scaling-${{ matrix.cpus }}
          path: ${{ env.PERF_BUNDLE_DIR }}
          if-no-files-found: error
          retention-days: 90

  volume:
    name: Volume family (${{ matrix.agents }} machines)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # Each leg varies the count of machines that actually enrolled, with the profile path spelled out.
      matrix:
        include:
          - agents: '500'
            path: load/profiles/volume-500.yaml
          - agents: '2000'
            path: load/profiles/volume-2000.yaml
          - agents: '8000'
            path: load/profiles/volume-8000.yaml
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: server/go.sum

      # Docker Hub's anonymous pull rate is shared across a runner's network, so pulls use the mirror.
      - uses: ./.github/actions/docker-hub-mirror
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      # The transport asks for more receive buffer than a runner allows a socket.
      - name: Give the machine-facing path production's buffers
        run: scripts/perf-stack-quic.sh raise-buffers

      - name: Bring the performance stack up
        id: stack
        run: |
          set -euo pipefail
          DOCKER_CONFIG="$(./scripts/docker-credstore-guard.sh)"
          export DOCKER_CONFIG
          scripts/perf-stack-pull.sh "$COMPOSE_FILE"
          docker compose -f "$COMPOSE_FILE" up --build --wait --wait-timeout 300
          # The database's cgroup is sampled for the job's duration for the leg's summary.
          DB_CGROUP="$(scripts/database-levels.sh cgroup-of opengate-perf-postgres)"
          nohup scripts/database-levels.sh sample "$DB_CGROUP" /tmp/db-samples.tsv >/dev/null 2>&1 &

      # The generator dials the name on the server's certificate, mapped to the container's address.
      - name: Dial the server by its certificate's name
        run: scripts/perf-stack-quic.sh map-server

      # The fixture's weight is the difference between this baseline and the reading taken afterwards.
      - name: Read the empty stack's size
        run: |
          set -euo pipefail
          mkdir -p "$PERF_BUNDLE_DIR"
          bash scripts/perf-weigh-fixture.sh baseline /tmp/fixture-baseline.json

      - name: Install k6
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-amd64.tar.gz" \
            | tar -xz -C /tmp
          install -m 0755 "/tmp/k6-${K6_VERSION}-linux-amd64/k6" /tmp/k6

      # On an empty stack the first account the server sees becomes its administrator.
      - name: Run the volume profile, building its fleet first
        run: |
          set -euo pipefail
          mkdir -p "$LOADTEST_K6_SUMMARY_DIR"
          go build -C server -trimpath -o /tmp/loadtest ./tests/loadtest/
          scripts/loadtest-k6-alongside.sh /tmp/perf-quic.txt api-baseline relay-throughput &
          K6_LEG=$!
          # Exit 1 is a partly arrived fleet, which is a measurement; the verdict step judges it.
          set +e
          scripts/loadtest-quic-run.sh /tmp/perf-quic.txt -- \
            scripts/loadtest-generator-share.sh "$PERF_GENERATOR_CPUS" "$PERF_GENERATOR_MEMORY" -- \
            /tmp/loadtest \
              -agents="${{ matrix.agents }}" \
              -addr=server:9090 \
              -target-net-counters="$PERF_TARGET_NET_COUNTERS" \
              -default-telemetry \
              -hold=5m \
              -profile="${{ matrix.path }}" \
              -commit="$GITHUB_SHA" \
              -target-cpus="$PERF_SERVER_CPUS" \
              -target-memory-bytes="$PERF_SERVER_MEMORY_BYTES" \
              -target-description="compose stack, $PERF_SERVER_CPUS processors" \
              -enroll-url=http://127.0.0.1:8080 \
              -metrics-url=http://127.0.0.1:8081 \
              -fixture-account=perf-admin@opengate-loadtest.invalid \
              -fixture-password="$PERF_FIXTURE_PASSWORD" \
              -fixture-bootstrap \
              -fixture-seed=1 \
              -relay-sessions \
              -bundle="$PERF_BUNDLE_DIR/volume-${{ matrix.agents }}"
          walk=$?
          set -e
          wait "$K6_LEG"
          if [ "$walk" -gt 1 ]; then
            echo "::error::the harness did not complete a run (exit $walk)." >&2
            exit "$walk"
          fi
        env:
          LOADTEST_BASE_URL: http://127.0.0.1:8080
          LOADTEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-volume${{ matrix.agents }}
          LOADTEST_PROFILE: ${{ matrix.path }}
          LOADTEST_K6_SUMMARY_DIR: /tmp/perf-k6
          K6_BIN: /tmp/k6
          # The stack is per-run and reachable only from the runner; the password is generated per run.
          PERF_FIXTURE_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-Perf!

      # The technician numbers are timed by a separate generator and merged into the leg's bundle.
      - name: Fold the technician journeys into the leg
        run: |
          set -euo pipefail
          scripts/loadtest-bundle-merge.sh \
            "$PERF_BUNDLE_DIR/volume-${{ matrix.agents }}/bundle.json" \
            --journeys /tmp/perf-k6/api-baseline.json \
            --journeys /tmp/perf-k6/relay-throughput.json

      # A short receive buffer on either end means datagrams were lost before either process saw them.
      - name: Refuse a run whose ends ran short of receive buffer
        run: scripts/perf-stack-quic.sh check /tmp/perf-quic.txt

      - name: Read the verdict the run wrote about itself
        if: always() && steps.stack.outcome == 'success'
        run: scripts/perf-bundle-verdict.sh "$PERF_BUNDLE_DIR/volume-${{ matrix.agents }}/bundle.json"

      - name: Read the profile's limits against the run's own rows
        if: always() && steps.stack.outcome == 'success'
        run: |
          set -euo pipefail
          scripts/perf-bundle-limits.sh "${{ matrix.path }}" \
            "$PERF_BUNDLE_DIR/volume-${{ matrix.agents }}/bundle.json" /tmp/volume-rows.json

      - name: Write the leg's summary
        if: always() && steps.stack.outcome == 'success'
        run: |
          set -euo pipefail
          BUNDLE="$PERF_BUNDLE_DIR/volume-${{ matrix.agents }}/bundle.json"
          if [ ! -s "$BUNDLE" ] || [ ! -s "/tmp/volume-rows.json" ]; then
            echo "The leg wrote no rows, so its summary is the verdict above."
            exit 0
          fi
          read -r FROM TO <<<"$(scripts/run-summary.sh window "${{ matrix.path }}" "$BUNDLE")"
          scripts/database-levels.sh average /tmp/db-samples.tsv "$FROM" "$TO" >/tmp/db-levels.json
          scripts/run-summary.sh render --title "Volume family (${{ matrix.agents }} machines)" --profile "${{ matrix.path }}" \
            --rows "/tmp/volume-rows.json" --bundle "$BUNDLE" --database /tmp/db-levels.json >>"$GITHUB_STEP_SUMMARY"

      # The fixture weight is folded into the bundle so it outlives the metrics store.
      - name: Weigh what the fleet actually cost, and fold it into the evidence
        if: always() && steps.stack.outcome == 'success'
        run: |
          set -euo pipefail
          bash scripts/perf-weigh-fixture.sh weigh /tmp/fixture-baseline.json \
            "$PERF_BUNDLE_DIR/fixture-weight.json"
          cat "$PERF_BUNDLE_DIR/fixture-weight.json"
          scripts/loadtest-bundle-merge.sh "$PERF_BUNDLE_DIR/volume-${{ matrix.agents }}/bundle.json" \
            --weight "$PERF_BUNDLE_DIR/fixture-weight.json"

      - name: Tear the stack down
        if: always()
        run: |
          DOCKER_CONFIG="$(./scripts/docker-credstore-guard.sh)"
          export DOCKER_CONFIG
          docker compose -f "$COMPOSE_FILE" down -v

      - name: Upload the volume bundle
        if: always() && steps.stack.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: perf-volume-${{ matrix.agents }}
          path: ${{ env.PERF_BUNDLE_DIR }}
          if-no-files-found: error
          retention-days: 90

  # Compares the volume legs, which hold different data under the same technician load.
  # The curve is published and not gated, since one night is one sample per leg.
  volume-curve:
    name: Volume family, read together
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: volume
    # A leg that failed leaves a hole in the curve, which the script reports.
    if: always()
    steps:
      - uses: actions/checkout@v7

      - name: Collect every leg of the sweep
        uses: actions/download-artifact@v8
        with:
          pattern: perf-volume-*
          path: perf-legs

      - name: Publish the curve, and refuse a sweep that measured nothing
        run: |
          set -euo pipefail
          scripts/perf-volume-curve.sh perf-legs | tee -a "$GITHUB_STEP_SUMMARY"

  # One job over a matrix: the legs differ only in the profile and the estate size it draws from.
  shapes:
    name: ${{ matrix.title }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: peak
            # The path is literal so sweeps that read the workflow as text can see it.
            path: load/profiles/peak.yaml
            title: Busy morning (peak)
            # Declares held technician sessions and a rate of screens opened.
            journeys: true
            # The estate covers the profile's highest level.
            agents: '2000'
            hold: 8m
            minutes: 45
          - profile: spike
            path: load/profiles/spike.yaml
            title: Link came back (spike)
            journeys: true
            agents: '2000'
            hold: 7m
            minutes: 45
          - profile: breakpoint
            path: load/profiles/breakpoint.yaml
            title: Raise it until it gives (breakpoint)
            # The breakpoint ladder holds sessions without journeys, so no k6 leg runs.
            journeys: false
            # About 400 KB of generator memory per machine over a 1.25 GiB baseline is roughly 7.7 GB.
            agents: '16000'
            # The ladder runs six five-minute steps, a one-minute drain and a five-minute recovery.
            hold: 40m
            minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: server/go.sum

      # Docker Hub's anonymous pull rate is shared across a runner's network, so pulls use the mirror.
      - uses: ./.github/actions/docker-hub-mirror
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Record what this runner actually is
        run: |
          set -euo pipefail
          printf 'processors: %s\n' "$(nproc)"
          printf 'memory:     %s KB\n' "$(awk '/MemTotal/ {print $2}' /proc/meminfo)"
          printf 'free disk:  %s KB\n' "$(df -k --output=avail / | tail -n1 | tr -d ' ')"

      # The transport asks for more receive buffer than a runner allows a socket.
      - name: Give the machine-facing path production's buffers
        run: scripts/perf-stack-quic.sh raise-buffers

      - name: Bring the performance stack up
        id: stack
        run: |
          set -euo pipefail
          DOCKER_CONFIG="$(./scripts/docker-credstore-guard.sh)"
          export DOCKER_CONFIG
          scripts/perf-stack-pull.sh "$COMPOSE_FILE"
          docker compose -f "$COMPOSE_FILE" up --build --wait --wait-timeout 300
          # The database's cgroup is sampled for the job's duration for the leg's summary.
          DB_CGROUP="$(scripts/database-levels.sh cgroup-of opengate-perf-postgres)"
          nohup scripts/database-levels.sh sample "$DB_CGROUP" /tmp/db-samples.tsv >/dev/null 2>&1 &

      # The generator dials the name on the server's certificate, mapped to the container's address.
      - name: Dial the server by its certificate's name
        run: scripts/perf-stack-quic.sh map-server

      # The k6 leg is the browser-side half of the load; the harness answers and echoes its sessions.
      - name: Install k6
        if: matrix.journeys
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-amd64.tar.gz" \
            | tar -xz -C /tmp
          install -m 0755 "/tmp/k6-${K6_VERSION}-linux-amd64/k6" /tmp/k6

      - name: Walk the ${{ matrix.profile }} profile, building its fleet first
        run: |
          set -euo pipefail
          mkdir -p "$PERF_BUNDLE_DIR" "$LOADTEST_K6_SUMMARY_DIR"
          go build -C server -trimpath -o /tmp/loadtest ./tests/loadtest/
          K6_LEG=""
          if [ "${JOURNEYS:-false}" = "true" ]; then
            scripts/loadtest-k6-alongside.sh /tmp/perf-quic.txt api-baseline relay-throughput &
            K6_LEG=$!
          fi
          # Exit 1 is a partly arrived fleet, which is a measurement; the verdict step judges it.
          set +e
          scripts/loadtest-quic-run.sh /tmp/perf-quic.txt -- \
            scripts/loadtest-generator-share.sh "$PERF_GENERATOR_CPUS" "$PERF_GENERATOR_MEMORY" -- \
            /tmp/loadtest \
              -agents="${{ matrix.agents }}" \
              -addr=server:9090 \
              -target-net-counters="$PERF_TARGET_NET_COUNTERS" \
              -default-telemetry \
              -hold="${{ matrix.hold }}" \
              -profile="${{ matrix.path }}" \
              -commit="$GITHUB_SHA" \
              -target-cpus="$PERF_SERVER_CPUS" \
              -target-memory-bytes="$PERF_SERVER_MEMORY_BYTES" \
              -target-description="compose stack, $PERF_SERVER_CPUS processors" \
              -enroll-url=http://127.0.0.1:8080 \
              -metrics-url=http://127.0.0.1:8081 \
              -fixture-account=perf-admin@opengate-loadtest.invalid \
              -fixture-password="$PERF_FIXTURE_PASSWORD" \
              -fixture-bootstrap \
              -fixture-seed=1 \
              -relay-sessions="${JOURNEYS:-false}" \
              -bundle="$PERF_BUNDLE_DIR/${{ matrix.profile }}"
          walk=$?
          set -e
          [ -z "$K6_LEG" ] || wait "$K6_LEG"
          if [ "$walk" -gt 1 ]; then
            echo "::error::the harness did not complete a run (exit $walk)." >&2
            exit "$walk"
          fi
        env:
          # The stack is per-run and reachable only from the runner; the password is generated per run.
          PERF_FIXTURE_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-Perf!
          # The browser-side generator joins the same profile the harness walks.
          LOADTEST_PROFILE: ${{ matrix.path }}
          LOADTEST_BASE_URL: http://127.0.0.1:8080
          LOADTEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-${{ matrix.profile }}
          LOADTEST_K6_SUMMARY_DIR: /tmp/perf-k6
          K6_BIN: /tmp/k6
          JOURNEYS: ${{ matrix.journeys }}

      # The technician numbers are timed by a separate generator and merged into the leg's bundle.
      - name: Fold the technician journeys into the leg
        if: matrix.journeys
        run: |
          set -euo pipefail
          scripts/loadtest-bundle-merge.sh \
            "$PERF_BUNDLE_DIR/${{ matrix.profile }}/bundle.json" \
            --journeys /tmp/perf-k6/api-baseline.json \
            --journeys /tmp/perf-k6/relay-throughput.json

      # A short receive buffer on either end means datagrams were lost before either process saw them.
      - name: Refuse a run whose ends ran short of receive buffer
        run: scripts/perf-stack-quic.sh check /tmp/perf-quic.txt

      - name: Read the verdict the run wrote about itself
        if: always() && steps.stack.outcome == 'success'
        run: scripts/perf-bundle-verdict.sh "$PERF_BUNDLE_DIR/${{ matrix.profile }}/bundle.json"

      - name: Read the profile's limits against the run's own rows
        if: always() && steps.stack.outcome == 'success'
        run: |
          set -euo pipefail
          scripts/perf-bundle-limits.sh "${{ matrix.path }}" \
            "$PERF_BUNDLE_DIR/${{ matrix.profile }}/bundle.json" /tmp/${{ matrix.profile }}-rows.json

      - name: Write the leg's summary
        if: always() && steps.stack.outcome == 'success'
        run: |
          set -euo pipefail
          BUNDLE="$PERF_BUNDLE_DIR/${{ matrix.profile }}/bundle.json"
          if [ ! -s "$BUNDLE" ] || [ ! -s "/tmp/${{ matrix.profile }}-rows.json" ]; then
            echo "The leg wrote no rows, so its summary is the verdict above."
            exit 0
          fi
          read -r FROM TO <<<"$(scripts/run-summary.sh window "${{ matrix.path }}" "$BUNDLE")"
          scripts/database-levels.sh average /tmp/db-samples.tsv "$FROM" "$TO" >/tmp/db-levels.json
          scripts/run-summary.sh render --title "${{ matrix.title }}" --profile "${{ matrix.path }}" \
            --rows "/tmp/${{ matrix.profile }}-rows.json" --bundle "$BUNDLE" --database /tmp/db-levels.json >>"$GITHUB_STEP_SUMMARY"

      - name: Tear the stack down
        if: always()
        run: |
          DOCKER_CONFIG="$(./scripts/docker-credstore-guard.sh)"
          export DOCKER_CONFIG
          docker compose -f "$COMPOSE_FILE" down -v

      - name: Upload the ${{ matrix.profile }} bundle
        if: always() && steps.stack.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: perf-${{ matrix.profile }}
          path: ${{ env.PERF_BUNDLE_DIR }}
          if-no-files-found: error
          retention-days: 90

  # Compares the scaling legs. The curve is published and not gated: one night is one sample per rung.
  scaling-curve:
    name: Scaling sweep, read together
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: scaling
    # A leg that failed leaves a hole in the curve, which the script reports.
    if: always()
    steps:
      - uses: actions/checkout@v7

      - name: Collect every leg of the sweep
        uses: actions/download-artifact@v8
        with:
          pattern: perf-scaling-*
          path: perf-legs

      - name: Publish the curve, and refuse a sweep that measured nothing
        run: |
          set -euo pipefail
          scripts/perf-scaling-curve.sh perf-legs | tee -a "$GITHUB_STEP_SUMMARY"

  # Pushes every leg's rows into the trend and compares each leg with the nights before it.
  publish:
    name: Publish the performance trend
    needs: [started, scaling, volume, shapes]
    if: always() && needs.started.result == 'success'
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: observability
    permissions:
      contents: read
    outputs:
      regression: ${{ steps.check.outputs.regression }}
    env:
      # When the run started, which every sample of the night carries.
      VM_RUN_STARTED_AT: ${{ needs.started.outputs.started_at }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-pinned-tools

      - name: Collect every leg's bundle
        uses: actions/download-artifact@v8
        with:
          pattern: perf-*
          path: perf-legs

      - name: OCI + kubeconfig setup
        uses: ./.github/actions/oci-kube-setup
        with:
          oci-tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci-user: ${{ secrets.OCI_USER_OCID }}
          oci-fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          oci-private-key: ${{ secrets.OCI_PRIVATE_KEY }}
          oci-region: ${{ secrets.OCI_REGION }}
          cluster-id: ${{ secrets.OKE_CLUSTER_ID }}

      # A leg is named by its bundle's directory; a leg that did not measure the system is pushed nowhere.
      - name: Compare each leg with the nights before it
        id: check
        run: |
          set -euo pipefail
          mapfile -t BUNDLES < <(find perf-legs -name bundle.json | sort)
          if [ "${#BUNDLES[@]}" -eq 0 ]; then
            echo "::error::no leg wrote a bundle, so there is nothing to compare or publish."
            exit 1
          fi
          set +e
          scripts/perf-regression-check.sh "${BUNDLES[@]}" >perf-regression.out 2>&1
          CHECK_STATUS=$?
          set -e
          cat perf-regression.out
          case "$CHECK_STATUS" in
            0) echo "regression=0" >>"$GITHUB_OUTPUT" ;;
            1) echo "regression=1" >>"$GITHUB_OUTPUT" ;;
            *)
              echo "regression=0" >>"$GITHUB_OUTPUT"
              echo "::error::the legs could not be compared with their nights (exit $CHECK_STATUS)."
              exit "$CHECK_STATUS"
              ;;
          esac
          {
            echo "alert_text<<EOF"
            grep '^REGRESSION_ALERT:' perf-regression.out | sed 's/^REGRESSION_ALERT://' || true
            echo "EOF"
          } >>"$GITHUB_OUTPUT"

      - name: Push to VictoriaMetrics
        run: |
          set -euo pipefail
          mapfile -t BUNDLES < <(find perf-legs -name bundle.json | sort)
          scripts/perf-vm-push.sh "${BUNDLES[@]}"

      - name: Send Telegram alert
        # Runs whatever happened above it, and says which of the three it was.
        # A refused send reddens this job; the finding is read by the gate below.
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.DEPLOY_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.DEPLOY_TELEGRAM_CHAT_ID }}
          FINDING: ${{ steps.check.outputs.regression }}
          ALERT_TEXT: ${{ steps.check.outputs.alert_text }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = "success" ] && [ "${FINDING:-0}" != "1" ]; then
            echo "No alert sent: the legs were published and none is past its nights."
            exit 0
          fi
          if [ "${FINDING:-0}" = "1" ]; then
            MSG="$(printf '%s\n\nRun: %s\nTrend: Grafana dashboard "Performance Stack Trends" (opengate-perf-stack-trend)' "$ALERT_TEXT" "$RUN_URL")"
          else
            MSG="$(printf 'Performance stack trend: the legs were not published (%s).\n\nRun: %s' "$JOB_STATUS" "$RUN_URL")"
          fi
          scripts/telegram-alert.sh "$MSG"

      - name: Remove OCI credentials
        if: always()
        uses: ./.github/actions/oci-kube-teardown

  gate:
    name: Performance regression gate
    needs: [publish]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Fail workflow red on a leg past its nights
        run: |
          if [ "${{ needs.publish.result }}" != "success" ]; then
            echo "::error::the performance trend was not published; see the publish job."
            exit 1
          fi
          if [ "${{ needs.publish.outputs.regression }}" = "1" ]; then
            echo "::error::a leg that holds its load is past the nights before it — see the publish job's summary and the Telegram alert."
            exit 1
          fi
          echo "No leg is past the nights before it."

  # Alerts when a job in the run dies, is cancelled, or is killed at its timeout.
  alert:
    name: Alert if the run did not finish
    # A job on a fresh runner still runs when an upstream job was killed at its own timeout.
    needs: [scaling, scaling-curve, shapes, volume, volume-curve]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: observability
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-pinned-tools

      - name: Send Telegram alert
        # The needs result is a fact about the named job and distinguishes a cancel from a failure.
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.DEPLOY_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.DEPLOY_TELEGRAM_CHAT_ID }}
          RESULTS: scaling=${{ needs.scaling.result }} scaling-curve=${{ needs['scaling-curve'].result }} shapes=${{ needs.shapes.result }} volume=${{ needs.volume.result }} volume-curve=${{ needs['volume-curve'].result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          LOST=""
          for entry in $RESULTS; do
            name="${entry%%=*}"
            result="${entry#*=}"
            case "$result" in
              success | skipped) ;;
              *) LOST="${LOST}  - ${name}: ${result}"$'\n' ;;
            esac
          done
          if [ -z "$LOST" ]; then
            echo "No alert sent: every job finished."
            exit 0
          fi
          scripts/telegram-alert.sh "$(printf 'The performance stack did not finish:\n\n%s\nRun: %s' "$LOST" "$RUN_URL")"
