name: Performance Stack (volume + scaling)

# The two families that cannot honestly run on the shared cluster.
#
# The volume family varies how much data is already there, and staging's
# database writes into the same node root production depends on. The scaling
# family varies how many processors the server has, and the cluster offers one
# figure. A runner brings its own disk and its own processors, is thrown away at
# the end of the job, and is the only place the generator and the target hold
# genuinely separate boundaries.
#
# A runner is x86_64 and production is ARM64, so what this produces is a
# comparison — between fixture sizes, or between processor counts — and never an
# absolute capacity claim about production hardware.

on:
  schedule:
    # 07:00 rather than the crowded early slots. The account's twenty-job pool is
    # held from 03:00 to about 05:30 by the mutation matrix and the load test
    # follows it at 05:00, so a job scheduled beside them queues behind thirty
    # others instead of running.
    - cron: '0 7 * * *'
  workflow_dispatch:
    inputs:
      agents:
        description: "Machines to hold connected while the profile runs"
        required: false
        default: "500"

concurrency:
  group: perf-stack
  cancel-in-progress: false

permissions:
  contents: read

env:
  COMPOSE_FILE: deploy/docker-compose.perf.yml
  PERF_BUNDLE_DIR: perf-bundles

jobs:
  # The sweep's points are stated rather than assumed: a comparison between
  # processor counts is only a comparison if the counts are recorded beside the
  # numbers they produced.
  scaling:
    name: Scaling sweep (${{ matrix.cpus }} processors)
    runs-on: ubuntu-latest
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        cpus: ["0.5", "1", "2", "4"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: server/go.sum

      # Docker Hub's anonymous pull rate is shared across a runner's whole
      # network, so a pull here goes through the mirror the rest of the
      # pipelines use.
      - uses: ./.github/actions/docker-hub-mirror
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Record what this runner actually is
        run: |
          set -euo pipefail
          # Step 8's own finding: the runner's shape was never measured, so it
          # is measured here and travels in the bundle rather than being assumed.
          {
            echo "PERF_RUNNER_CPUS=$(nproc)"
            echo "PERF_RUNNER_MEMORY_KB=$(awk '/MemTotal/ {print $2}' /proc/meminfo)"
            echo "PERF_RUNNER_DISK_KB=$(df -k --output=size / | tail -n1 | tr -d ' ')"
          } >>"$GITHUB_ENV"

      - name: Bring the performance stack up
        env:
          PERF_SERVER_CPUS: ${{ matrix.cpus }}
        run: |
          set -euo pipefail
          DOCKER_CONFIG="$(./scripts/docker-credstore-guard.sh)"
          export DOCKER_CONFIG
          docker compose -f "$COMPOSE_FILE" up --build --wait --wait-timeout 300

      # Every path below is named from the repository root, and the build is
      # pointed at server/ with -C. A step that changes directory instead cannot
      # see the scripts and profiles it names, and fails after the stack is
      # already up.
      - name: Run the scaling profile
        run: |
          set -euo pipefail
          mkdir -p "$PERF_BUNDLE_DIR"
          go build -C server -trimpath -o /tmp/loadtest ./tests/loadtest/
          scripts/loadtest-quic-run.sh /tmp/perf-quic.txt -- \
            /tmp/loadtest \
              -agents="${{ inputs.agents || '500' }}" \
              -addr=127.0.0.1:9090 \
              -default-telemetry \
              -hold=3m \
              -profile=load/profiles/scaling.yaml \
              -metrics-url=http://127.0.0.1:8080 \
              -bundle="$PERF_BUNDLE_DIR/scaling-${{ matrix.cpus }}"

      - name: Tear the stack down
        if: always()
        run: |
          DOCKER_CONFIG="$(./scripts/docker-credstore-guard.sh)"
          export DOCKER_CONFIG
          docker compose -f "$COMPOSE_FILE" down -v

      - name: Upload the scaling bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-scaling-${{ matrix.cpus }}
          path: ${{ env.PERF_BUNDLE_DIR }}
          if-no-files-found: warn
          retention-days: 90

  # Nobody has weighed a fixture. Production's database holds 66 MB after seven
  # weeks with four real machines, and the cluster node has around nine gigabytes
  # of margin before the kubelet starts evicting — so whether a two-thousand
  # machine fixture fits inside that margin is a fact one measurement settles.
  # Until it exists, no storage decision is made either way.
  volume:
    name: Volume family (weigh the fixture, then load it)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: server/go.sum

      # Docker Hub's anonymous pull rate is shared across a runner's whole
      # network, so a pull here goes through the mirror the rest of the
      # pipelines use.
      - uses: ./.github/actions/docker-hub-mirror
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Bring the performance stack up
        run: |
          set -euo pipefail
          DOCKER_CONFIG="$(./scripts/docker-credstore-guard.sh)"
          export DOCKER_CONFIG
          docker compose -f "$COMPOSE_FILE" up --build --wait --wait-timeout 300

      # The empty size, before anything is built. The fixture's own weight is the
      # difference between this and the size after — two readings taken back to
      # back always differ by nothing, which is a measurement that cannot fail
      # and cannot inform, and that is what this used to be.
      - name: Read the empty stack's size
        run: |
          set -euo pipefail
          mkdir -p "$PERF_BUNDLE_DIR"
          echo "PERF_BASELINE_BYTES=$(bash scripts/perf-weigh-fixture.sh baseline)" >>"$GITHUB_ENV"

      # Everything a fleet is made of goes through the same interface a
      # technician uses. The stack starts empty, so the first account the server
      # sees becomes its administrator — which is how a fresh install bootstraps.
      - name: Run the volume profile, building its fleet first
        run: |
          set -euo pipefail
          go build -C server -trimpath -o /tmp/loadtest ./tests/loadtest/
          scripts/loadtest-quic-run.sh /tmp/perf-quic.txt -- \
            /tmp/loadtest \
              -agents="${{ inputs.agents || '500' }}" \
              -addr=127.0.0.1:9090 \
              -default-telemetry \
              -hold=3m \
              -profile=load/profiles/volume.yaml \
              -enroll-url=http://127.0.0.1:8080 \
              -metrics-url=http://127.0.0.1:8080 \
              -fixture-account=perf-admin@opengate-loadtest.invalid \
              -fixture-password="$PERF_FIXTURE_PASSWORD" \
              -fixture-bootstrap \
              -fixture-seed=1 \
              -bundle="$PERF_BUNDLE_DIR/volume"
        env:
          # The stack is created by this job and thrown away at the end of it, is
          # reachable only from inside the runner, and holds nothing but the
          # fleet this run invented. The password is generated per run all the
          # same, so nothing fixed is ever written down.
          PERF_FIXTURE_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-Perf!

      - name: Weigh what the fleet actually cost
        if: always()
        run: |
          set -euo pipefail
          bash scripts/perf-weigh-fixture.sh weigh "$PERF_BASELINE_BYTES" \
            "$PERF_BUNDLE_DIR/fixture-weight.json"
          cat "$PERF_BUNDLE_DIR/fixture-weight.json"

      - name: Tear the stack down
        if: always()
        run: |
          DOCKER_CONFIG="$(./scripts/docker-credstore-guard.sh)"
          export DOCKER_CONFIG
          docker compose -f "$COMPOSE_FILE" down -v

      - name: Upload the volume bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-volume
          path: ${{ env.PERF_BUNDLE_DIR }}
          if-no-files-found: warn
          retention-days: 90
