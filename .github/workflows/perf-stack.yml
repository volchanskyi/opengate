name: Performance Stack (volume + scaling + shapes)

# The families that cannot honestly run on the shared cluster.
#
# The volume family varies how much data is already there, and staging's
# database writes into the same node root production depends on. The scaling
# family varies how many processors the server has, and the cluster offers one
# figure. The three shape families — a busy morning, a site's link coming back,
# and the load raised until something gives — ask for two and four thousand
# machines, and the cluster node has 150 millicores left to reserve. A runner
# brings its own disk and its own processors, is thrown away at the end of the
# job, and is the only place the generator and the target hold genuinely
# separate boundaries.
#
# A runner is x86_64 and production is ARM64, so what this produces is a
# comparison — between fixture sizes, or between processor counts — and never an
# absolute capacity claim about production hardware.

on:
  schedule:
    # Last of the night's runs, which is what this cron buys: a scheduled run
    # starts four and a half to six and a half hours after the time it names, so
    # the hour here decides the order and nothing else. The mutation matrix, the
    # browser suite, the benchmark and the load test all sit in front of it, and
    # a run scheduled beside them queues behind the whole batch on a twenty-job
    # pool rather than running.
    #
    # Nothing here needs the staging namespace, so nothing serialises this
    # against the runs that do. It brings its own stack on the runner.
    - cron: '0 7 * * *'
  workflow_dispatch:

concurrency:
  group: perf-stack
  cancel-in-progress: false

permissions:
  contents: read

env:
  COMPOSE_FILE: deploy/docker-compose.perf.yml
  K6_VERSION: v1.6.1
  K6_SUMMARY_TREND_STATS: avg,min,med,p(50),p(95),p(99),max,count
  PERF_BUNDLE_DIR: perf-bundles
  # What the system under test is capped at. It is declared here rather than
  # left to the compose file's own default because the harness records it as the
  # target's fingerprint, and a fingerprint that disagrees with the container it
  # describes is worse than no fingerprint: every latency figure in the bundle
  # is a property of that pair.
  PERF_SERVER_MEMORY: 1g
  PERF_SERVER_MEMORY_BYTES: '1073741824'
  # The processor share the volume family holds constant while it varies the
  # data. The scaling family overrides it per leg — that is its whole subject.
  PERF_SERVER_CPUS: '1.0'
  # What the generator itself may use. It declared nothing and took whatever the
  # stack's own services left, so at the top of the sweep the server claimed the
  # runner and the generator ran unbounded beside it — and the two measured each
  # other. Declaring it is also what lets the harness measure its room against
  # an allowance rather than against the box, which is the only reading that can
  # say a run measured the generator.
  PERF_GENERATOR_CPUS: '1.0'
  # Enough for the largest fleet any leg offers: sixteen thousand machines cost
  # about 400 KB each over a 1.25 GiB baseline, measured on the peak and
  # breakpoint bundles at two and four thousand.
  PERF_GENERATOR_MEMORY: '10G'

jobs:
  # The sweep's points are stated rather than assumed: a comparison between
  # processor counts is only a comparison if the counts are recorded beside the
  # numbers they produced.
  scaling:
    name: Scaling sweep (${{ matrix.cpus }} processors)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      # The rungs sit below what the rest of the stack leaves. The runner has
      # four processors, the database holds one and the metrics store half, and
      # the generator now holds one of its own — so a server given four took
      # everything and left the generator less than nothing, and the generator's
      # share shrank as the server's grew. Two things that move together cannot
      # be told apart, and a flat curve was attributable to neither.
      matrix:
        cpus: ["0.25", "0.5", "1", "2"]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: server/go.sum

      # Docker Hub's anonymous pull rate is shared across a runner's whole
      # network, so a pull here goes through the mirror the rest of the
      # pipelines use.
      - uses: ./.github/actions/docker-hub-mirror
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      # The disk column is the free one, not the partition's size. A runner's
      # root filesystem is 144 GiB and roughly 14 GB of that is room a job can
      # use, the rest being the preinstalled toolchain — so the one figure ever
      # taken to answer "does this fixture fit" reported ten times the number
      # that binds. The harness reads all three itself and puts them in the
      # bundle; these are printed so a run's log says what it was measured on.
      - name: Record what this runner actually is
        run: |
          set -euo pipefail
          printf 'processors: %s\n' "$(nproc)"
          printf 'memory:     %s KB\n' "$(awk '/MemTotal/ {print $2}' /proc/meminfo)"
          printf 'free disk:  %s KB\n' "$(df -k --output=avail / | tail -n1 | tr -d ' ')"

      - name: Bring the performance stack up
        env:
          PERF_SERVER_CPUS: ${{ matrix.cpus }}
        run: |
          set -euo pipefail
          DOCKER_CONFIG="$(./scripts/docker-credstore-guard.sh)"
          export DOCKER_CONFIG
          docker compose -f "$COMPOSE_FILE" up --build --wait --wait-timeout 300

      # Every path below is named from the repository root, and the build is
      # pointed at server/ with -C. A step that changes directory instead cannot
      # see the scripts and profiles it names, and fails after the stack is
      # already up.
      #
      # The machines enrol the way an installer does, through the server's own
      # endpoint: they keep their private keys and send signing requests, and
      # what comes back is a certificate plus the authority to verify the server
      # with. A harness signing for itself owns a different authority from the
      # one the server created in its container, and every dial is then refused
      # at the handshake against an authority of the same name.
      #
      # Building the fleet is also what makes this a scaling sweep: the family
      # holds the load and the data constant and varies the processors, and its
      # profile names the fixture it holds constant.
      - name: Install k6
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-amd64.tar.gz" \
            | tar -xz -C /tmp
          install -m 0755 "/tmp/k6-${K6_VERSION}-linux-amd64/k6" /tmp/k6

      # The technician load runs beside the fleet, from the profile, so the sweep
      # holds it constant while it varies the processors. It used to hold none:
      # no browser-side generator ran on this venue at all, so what the sweep
      # varied processors against was five hundred machines arriving, which is
      # the cheapest thing the server does — and that is why its curve was flat
      # from one processor upwards.
      - name: Run the scaling profile, building its fleet first
        env:
          LOADTEST_BASE_URL: http://127.0.0.1:8080
          LOADTEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-cpus${{ matrix.cpus }}
          LOADTEST_PROFILE: load/profiles/scaling.yaml
          LOADTEST_K6_SUMMARY_DIR: /tmp/perf-k6
          K6_BIN: /tmp/k6
          # The stack is created by this job and thrown away at the end of it, is
          # reachable only from inside the runner, and holds nothing but the
          # fleet this run invented. The password is generated per run all the
          # same, so nothing fixed is ever written down.
          PERF_FIXTURE_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-Perf!
        run: |
          set -euo pipefail
          mkdir -p "$PERF_BUNDLE_DIR" "$LOADTEST_K6_SUMMARY_DIR"
          go build -C server -trimpath -o /tmp/loadtest ./tests/loadtest/
          scripts/loadtest-k6-alongside.sh /tmp/perf-quic.txt api-baseline &
          K6_LEG=$!
          # The harness's own exit code, read rather than acted on: 1 is a fleet
          # that half arrived, which is a measurement. What judges it is the
          # verdict step below, and failing here on the count is a second
          # verdict nobody wrote down.
          set +e
          scripts/loadtest-quic-run.sh /tmp/perf-quic.txt -- \
            scripts/loadtest-generator-share.sh "$PERF_GENERATOR_CPUS" "$PERF_GENERATOR_MEMORY" -- \
            /tmp/loadtest \
              -agents=2000 \
              -addr=127.0.0.1:9090 \
              -default-telemetry \
              -hold=5m \
              -profile=load/profiles/scaling.yaml \
              -commit="$GITHUB_SHA" \
              -target-cpus="${{ matrix.cpus }}" \
              -target-memory-bytes="$PERF_SERVER_MEMORY_BYTES" \
              -target-description="compose stack, ${{ matrix.cpus }} processors" \
              -enroll-url=http://127.0.0.1:8080 \
              -metrics-url=http://127.0.0.1:8081 \
              -fixture-account=perf-admin@opengate-loadtest.invalid \
              -fixture-password="$PERF_FIXTURE_PASSWORD" \
              -fixture-bootstrap \
              -fixture-seed=1 \
              -bundle="$PERF_BUNDLE_DIR/scaling-${{ matrix.cpus }}"
          walk=$?
          set -e
          wait "$K6_LEG"
          if [ "$walk" -gt 1 ]; then
            echo "::error::the harness did not complete a run (exit $walk)." >&2
            exit "$walk"
          fi

      # The technician numbers are timed by a generator in another process and
      # written to a file of its own. Folding them into the leg is what gives
      # them a reader: the curve is built from the bundles, and a measurement
      # nobody reads is a run that happens to share a profile.
      - name: Fold the technician journeys into the leg
        run: |
          set -euo pipefail
          scripts/loadtest-bundle-merge.sh \
            "$PERF_BUNDLE_DIR/scaling-${{ matrix.cpus }}/bundle.json" \
            --journeys /tmp/perf-k6/api-baseline.json

      - name: Read the verdict the run wrote about itself
        if: always()
        run: scripts/perf-bundle-verdict.sh "$PERF_BUNDLE_DIR/scaling-${{ matrix.cpus }}/bundle.json"

      - name: Tear the stack down
        if: always()
        run: |
          DOCKER_CONFIG="$(./scripts/docker-credstore-guard.sh)"
          export DOCKER_CONFIG
          docker compose -f "$COMPOSE_FILE" down -v

      - name: Upload the scaling bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-scaling-${{ matrix.cpus }}
          path: ${{ env.PERF_BUNDLE_DIR }}
          if-no-files-found: error
          retention-days: 90

  # Nobody has weighed a fixture. Production's database holds 66 MB after seven
  # weeks with four real machines, and the cluster node has around nine gigabytes
  # of margin before the kubelet starts evicting — so whether a two-thousand
  # machine fixture fits inside that margin is a fact one measurement settles.
  # Until it exists, no storage decision is made either way.
  volume:
    name: Volume family (${{ matrix.agents }} machines)
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    strategy:
      fail-fast: false
      # The sweep varies machines that actually enrolled, not fixture names. The
      # large and lopsided fixtures plan the same count and differ only in how
      # the fleet is distributed, so a sweep over the three names was two points
      # and a broken third. The paths are spelled out rather than assembled from
      # the count above, because every sweep that asks which profiles a workflow
      # runs reads the workflow as text.
      matrix:
        include:
          - agents: '500'
            path: load/profiles/volume-500.yaml
          - agents: '2000'
            path: load/profiles/volume-2000.yaml
          - agents: '8000'
            path: load/profiles/volume-8000.yaml
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: server/go.sum

      # Docker Hub's anonymous pull rate is shared across a runner's whole
      # network, so a pull here goes through the mirror the rest of the
      # pipelines use.
      - uses: ./.github/actions/docker-hub-mirror
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Bring the performance stack up
        run: |
          set -euo pipefail
          DOCKER_CONFIG="$(./scripts/docker-credstore-guard.sh)"
          export DOCKER_CONFIG
          docker compose -f "$COMPOSE_FILE" up --build --wait --wait-timeout 300

      # The empty size, before anything is built. The fixture's own weight is the
      # difference between this and the size after — two readings taken back to
      # back always differ by nothing, which is a measurement that cannot fail
      # and cannot inform, and that is what this used to be.
      - name: Read the empty stack's size
        run: |
          set -euo pipefail
          mkdir -p "$PERF_BUNDLE_DIR"
          echo "PERF_BASELINE_BYTES=$(bash scripts/perf-weigh-fixture.sh baseline)" >>"$GITHUB_ENV"

      # Everything a fleet is made of goes through the same interface a
      # technician uses. The stack starts empty, so the first account the server
      # sees becomes its administrator — which is how a fresh install bootstraps.
      - name: Run the volume profile, building its fleet first
        run: |
          set -euo pipefail
          go build -C server -trimpath -o /tmp/loadtest ./tests/loadtest/
          # The harness's own exit code, read rather than acted on: 1 is a fleet
          # that half arrived, which is a measurement. What judges it is the
          # verdict step below, and failing here on the count is a second
          # verdict nobody wrote down.
          set +e
          scripts/loadtest-quic-run.sh /tmp/perf-quic.txt -- \
            scripts/loadtest-generator-share.sh "$PERF_GENERATOR_CPUS" "$PERF_GENERATOR_MEMORY" -- \
            /tmp/loadtest \
              -agents="${{ matrix.agents }}" \
              -addr=127.0.0.1:9090 \
              -default-telemetry \
              -hold=5m \
              -profile="${{ matrix.path }}" \
              -commit="$GITHUB_SHA" \
              -target-cpus="$PERF_SERVER_CPUS" \
              -target-memory-bytes="$PERF_SERVER_MEMORY_BYTES" \
              -target-description="compose stack, $PERF_SERVER_CPUS processors" \
              -enroll-url=http://127.0.0.1:8080 \
              -metrics-url=http://127.0.0.1:8081 \
              -fixture-account=perf-admin@opengate-loadtest.invalid \
              -fixture-password="$PERF_FIXTURE_PASSWORD" \
              -fixture-bootstrap \
              -fixture-seed=1 \
              -bundle="$PERF_BUNDLE_DIR/volume-${{ matrix.agents }}"
          walk=$?
          set -e
          if [ "$walk" -gt 1 ]; then
            echo "::error::the harness did not complete a run (exit $walk)." >&2
            exit "$walk"
          fi
        env:
          # The stack is created by this job and thrown away at the end of it, is
          # reachable only from inside the runner, and holds nothing but the
          # fleet this run invented. The password is generated per run all the
          # same, so nothing fixed is ever written down.
          PERF_FIXTURE_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-Perf!

      - name: Read the verdict the run wrote about itself
        if: always()
        run: scripts/perf-bundle-verdict.sh "$PERF_BUNDLE_DIR/volume-${{ matrix.agents }}/bundle.json"

      # The volume family's whole finding is this number, and it was written into
      # a file beside the bundle that nothing downstream opened. Folding it in is
      # what puts it where a reader looks after the metrics store has forgotten
      # the night.
      - name: Weigh what the fleet actually cost, and fold it into the evidence
        if: always()
        run: |
          set -euo pipefail
          bash scripts/perf-weigh-fixture.sh weigh "$PERF_BASELINE_BYTES" \
            "$PERF_BUNDLE_DIR/fixture-weight.json"
          cat "$PERF_BUNDLE_DIR/fixture-weight.json"
          scripts/loadtest-bundle-merge.sh "$PERF_BUNDLE_DIR/volume-${{ matrix.agents }}/bundle.json" \
            --weight "$PERF_BUNDLE_DIR/fixture-weight.json"

      - name: Tear the stack down
        if: always()
        run: |
          DOCKER_CONFIG="$(./scripts/docker-credstore-guard.sh)"
          export DOCKER_CONFIG
          docker compose -f "$COMPOSE_FILE" down -v

      - name: Upload the volume bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-volume-${{ matrix.agents }}
          path: ${{ env.PERF_BUNDLE_DIR }}
          if-no-files-found: error
          retention-days: 90

  # The three shapes an estate actually takes, none of which the everyday run
  # produces: the busiest ordinary morning, a site whose link came back, and the
  # load raised until something gives.
  #
  # They are one job over a matrix rather than three jobs, because they differ
  # only in the profile they walk and the size of the estate that profile draws
  # from. The stack around them is identical, and three copies of it is three
  # places for it to drift.
  shapes:
    name: ${{ matrix.title }}
    runs-on: ubuntu-24.04
    timeout-minutes: ${{ matrix.minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - profile: peak
            # The path is spelled out rather than built from the name above.
            # Every sweep that asks which profiles a workflow runs — whether a
            # limit names a measurement this venue can produce, whether a
            # profile is scheduled anywhere at all — reads the workflow as text,
            # and a path assembled at run time is invisible to all of them.
            path: load/profiles/peak.yaml
            title: Busy morning (peak)
            # The estate the profile draws from. It has to cover the profile's
            # own highest level: a machine that cannot be given an identity has
            # not arrived, and a run short of the level it declared is a
            # mis-sized run rather than a finding about the system.
            agents: '2000'
            hold: 8m
            minutes: 45
          - profile: spike
            path: load/profiles/spike.yaml
            title: Link came back (spike)
            agents: '2000'
            hold: 7m
            minutes: 45
          - profile: breakpoint
            path: load/profiles/breakpoint.yaml
            title: Raise it until it gives (breakpoint)
            # The ladder now reaches sixteen thousand, so the estate has to. At
            # about 400 KB of generator memory a machine over a 1.25 GiB
            # baseline — measured on the peak and breakpoint bundles — that is
            # roughly 7.7 GB, inside the allowance the generator is given.
            agents: '16000'
            # Seven steps of five minutes, and every machine is held for the
            # whole walk.
            hold: 40m
            minutes: 90
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: server/go.sum

      # Docker Hub's anonymous pull rate is shared across a runner's whole
      # network, so a pull here goes through the mirror the rest of the
      # pipelines use.
      - uses: ./.github/actions/docker-hub-mirror
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Record what this runner actually is
        run: |
          set -euo pipefail
          printf 'processors: %s\n' "$(nproc)"
          printf 'memory:     %s KB\n' "$(awk '/MemTotal/ {print $2}' /proc/meminfo)"
          printf 'free disk:  %s KB\n' "$(df -k --output=avail / | tail -n1 | tr -d ' ')"

      - name: Bring the performance stack up
        run: |
          set -euo pipefail
          DOCKER_CONFIG="$(./scripts/docker-credstore-guard.sh)"
          export DOCKER_CONFIG
          docker compose -f "$COMPOSE_FILE" up --build --wait --wait-timeout 300

      # The generator and the target share this box on purpose — it is the only
      # venue with enough processors to offer four thousand machines at all — so
      # the figure that says whether the load was actually offered is the
      # fleet's own account of what arrived, and the harness reads its own
      # headroom beside it. A leg whose generator ran out reports that and is
      # marked invalid rather than answering wrongly.
      - name: Walk the ${{ matrix.profile }} profile, building its fleet first
        run: |
          set -euo pipefail
          mkdir -p "$PERF_BUNDLE_DIR"
          go build -C server -trimpath -o /tmp/loadtest ./tests/loadtest/
          # The harness's own exit code, read rather than acted on: 1 is a fleet
          # that half arrived, which is a measurement. What judges it is the
          # verdict step below, and failing here on the count is a second
          # verdict nobody wrote down.
          set +e
          scripts/loadtest-quic-run.sh /tmp/perf-quic.txt -- \
            scripts/loadtest-generator-share.sh "$PERF_GENERATOR_CPUS" "$PERF_GENERATOR_MEMORY" -- \
            /tmp/loadtest \
              -agents="${{ matrix.agents }}" \
              -addr=127.0.0.1:9090 \
              -default-telemetry \
              -hold="${{ matrix.hold }}" \
              -profile="${{ matrix.path }}" \
              -commit="$GITHUB_SHA" \
              -target-cpus="$PERF_SERVER_CPUS" \
              -target-memory-bytes="$PERF_SERVER_MEMORY_BYTES" \
              -target-description="compose stack, $PERF_SERVER_CPUS processors" \
              -enroll-url=http://127.0.0.1:8080 \
              -metrics-url=http://127.0.0.1:8081 \
              -fixture-account=perf-admin@opengate-loadtest.invalid \
              -fixture-password="$PERF_FIXTURE_PASSWORD" \
              -fixture-bootstrap \
              -fixture-seed=1 \
              -bundle="$PERF_BUNDLE_DIR/${{ matrix.profile }}"
          walk=$?
          set -e
          if [ "$walk" -gt 1 ]; then
            echo "::error::the harness did not complete a run (exit $walk)." >&2
            exit "$walk"
          fi
        env:
          # The stack is created by this job and thrown away at the end of it, is
          # reachable only from inside the runner, and holds nothing but the
          # fleet this run invented. The password is generated per run all the
          # same, so nothing fixed is ever written down.
          PERF_FIXTURE_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-Perf!

      - name: Read the verdict the run wrote about itself
        if: always()
        run: scripts/perf-bundle-verdict.sh "$PERF_BUNDLE_DIR/${{ matrix.profile }}/bundle.json"

      - name: Tear the stack down
        if: always()
        run: |
          DOCKER_CONFIG="$(./scripts/docker-credstore-guard.sh)"
          export DOCKER_CONFIG
          docker compose -f "$COMPOSE_FILE" down -v

      - name: Upload the ${{ matrix.profile }} bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: perf-${{ matrix.profile }}
          path: ${{ env.PERF_BUNDLE_DIR }}
          if-no-files-found: error
          retention-days: 90

  # The sweep's legs, read together.
  #
  # Four bundles a night were produced and nothing had ever compared them: the
  # jobs above read none of each other's output, there was no publish step, no
  # trend and no gate. A sweep nobody reads is four runs that happen to share a
  # profile, and the 2026-09-05 night — four legs with identical phase results
  # and a target fingerprint of one processor on every rung — passed in exactly
  # that state.
  #
  # What it enforces is the sweep's ability to measure at all, and what it
  # publishes is the shape. A curve that fails to rise is not failed here: one
  # night is one sample per rung, and the two nights on record disagreed about
  # the shape from the same code and the same profile.
  scaling-curve:
    name: Scaling sweep, read together
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    needs: scaling
    # Every leg that ran is worth reading, including on a night one of them
    # failed — a hole in the curve is itself the finding, and the script says so.
    if: always()
    steps:
      - uses: actions/checkout@v7

      - name: Collect every leg of the sweep
        uses: actions/download-artifact@v8
        with:
          pattern: perf-scaling-*
          path: perf-legs

      - name: Publish the curve, and refuse a sweep that measured nothing
        run: |
          set -euo pipefail
          scripts/perf-scaling-curve.sh perf-legs | tee -a "$GITHUB_STEP_SUMMARY"
