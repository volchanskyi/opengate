name: PMAT Quality Trend

# Nightly full-repo run that pushes the repo score and below-B+ count to VictoriaMetrics.
# It does not block merges or deploys; a regression raises a Telegram alert and a red run.

on:
  schedule:
    - cron: '0 4 * * *'  # after the 03:00 observability batch
  workflow_dispatch:

concurrency:
  group: pmat-trend
  cancel-in-progress: false

permissions:
  contents: read

env:
  RUST_VERSION: stable
  PMAT_VERSION: 3.17.0  # shared with .mcp.json and scripts/pmat-precommit.sh
jobs:
  pmat-trend:
    name: PMAT trend + alert on regression
    runs-on: ubuntu-24.04
    timeout-minutes: 40  # a cold `cargo install pmat` compiles from source
    permissions:
      contents: read
    outputs:
      regression: ${{ steps.summarize.outputs.regression }}
    steps:
      # Every sample of the night carries this time, so a re-run writes the same point.
      - name: Record when the run started
        id: started
        run: echo "at=$(date -u +%s)" >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@v7
        with:
          fetch-depth: 1

      - uses: ./.github/actions/setup-pinned-tools
      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          toolchain: ${{ env.RUST_VERSION }}
      - name: Cache pmat binary
        id: cache-pmat
        uses: actions/cache@v6
        with:
          path: ~/.cargo/bin/pmat
          key: pmat-${{ runner.os }}-${{ env.PMAT_VERSION }}
      - name: Install pmat
        if: steps.cache-pmat.outputs.cache-hit != 'true'
        run: cargo install --locked --version "${PMAT_VERSION}" pmat
      - name: Verify pmat version
        run: |
          set -euo pipefail
          got="$(pmat --version)"
          if [ "$got" != "pmat ${PMAT_VERSION}" ]; then
            echo "::error::pmat version drift: '$got' != 'pmat ${PMAT_VERSION}'"
            exit 1
          fi

      - name: Run pmat repo-score + tdg check-quality
        run: |
          set -uo pipefail
          # check-quality prints a banner before its JSON; the summarizer slices from the first '{'.
          pmat repo-score --format json > repo-score.json 2>/dev/null
          pmat tdg check-quality -p . --min-grade B+ --format json > tdg-check.json 2>/dev/null || true
          echo "repo-score (head):"; head -c 160 repo-score.json; echo

      - name: OCI + kubeconfig setup
        id: infra
        uses: ./.github/actions/oci-kube-setup
        with:
          oci-tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci-user: ${{ secrets.OCI_USER_OCID }}
          oci-fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          oci-private-key: ${{ secrets.OCI_PRIVATE_KEY }}
          oci-region: ${{ secrets.OCI_REGION }}
          cluster-id: ${{ secrets.OKE_CLUSTER_ID }}

      - name: Read previous values from VictoriaMetrics (day-over-day baseline)
        id: prev
        env:
          VM_RUN_STARTED_AT: ${{ steps.started.outputs.at }}
        run: |
          set -uo pipefail
          {
            echo "repo_score=$(./scripts/pmat-vm-query.sh repo_score)"
            echo "below_bplus=$(./scripts/pmat-vm-query.sh below_bplus)"
          } >> "$GITHUB_OUTPUT"

      - name: Summarize + regression check
        id: summarize
        env:
          GITHUB_SHA: ${{ github.sha }}
          PREV_REPO_SCORE: ${{ steps.prev.outputs.repo_score }}
          PREV_BELOW_BPLUS: ${{ steps.prev.outputs.below_bplus }}
        run: |
          set -uo pipefail
          OUTPUT="$(./scripts/pmat-summarize.sh 2>&1)" && REGRESSION=0 || REGRESSION=1
          echo "$OUTPUT"
          echo "--- end ---"
          echo "regression=$REGRESSION" >> "$GITHUB_OUTPUT"
          CANONICAL_ROW="$(echo "$OUTPUT" | grep -E '^\{' | tail -n 1)"
          echo "$CANONICAL_ROW" > canonical-row.json
          ALERT_TEXT="$(echo "$OUTPUT" | grep '^REGRESSION_ALERT:' | sed 's/^REGRESSION_ALERT://' || true)"
          {
            echo "alert_text<<EOF"
            echo "$ALERT_TEXT"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      - name: Upload canonical row artifact
        uses: actions/upload-artifact@v7
        with:
          name: pmat-canonical-row
          path: canonical-row.json
          retention-days: 90

      - name: Push to VictoriaMetrics
        env:
          VM_RUN_STARTED_AT: ${{ steps.started.outputs.at }}
        run: ./scripts/pmat-vm-push.sh canonical-row.json

      - name: Write GITHUB_STEP_SUMMARY
        run: |
          {
            echo "# PMAT quality run"
            echo ""
            echo "Commit: \`${{ github.sha }}\`"
            echo ""
            echo "## Canonical row"
            echo '```json'
            python3 -m json.tool < canonical-row.json || cat canonical-row.json
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Send Telegram alert
        # Runs whatever happened above, and the message names which of the three it was.
        # A refused delivery fails the step; the gate job reads the verdict.
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.DEPLOY_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.DEPLOY_TELEGRAM_CHAT_ID }}
          FINDING: ${{ steps.summarize.outputs.regression }}
          ALERT_TEXT: ${{ steps.summarize.outputs.alert_text }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = "success" ] && [ "${FINDING:-0}" != "1" ]; then
            echo "No alert sent: the run finished and found nothing."
            exit 0
          fi
          if [ "${FINDING:-0}" = "1" ]; then
            MSG="$(printf '%s\n\nRun: %s\nTrend: Grafana dashboard "PMAT Quality Trend" (opengate-pmat-trend)' "$ALERT_TEXT" "$RUN_URL")"
          else
            MSG="$(printf 'Code-quality trend: the night did not finish (%s), so nothing was measured.\n\nRun: %s' \
              "$JOB_STATUS" "$RUN_URL")"
          fi
          scripts/telegram-alert.sh "$MSG"

      - name: Remove OCI credentials
        if: always()
        uses: ./.github/actions/oci-kube-teardown

  # A job of its own keeps a refused delivery from taking the night's verdict with it.
  gate:
    name: Code-quality regression gate
    needs: [pmat-trend]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Fail workflow red on regression
        run: |
          set -euo pipefail
          if [ "${{ needs['pmat-trend'].result }}" != "success" ]; then
            echo "::error::The code-quality trend did not finish; see that job."
            exit 1
          fi
          if [ "${{ needs['pmat-trend'].outputs.regression }}" = "1" ]; then
            echo "::error::Code-quality regression — see the workflow summary and the Telegram alert."
            exit 1
          fi
          echo "No code-quality regression."
