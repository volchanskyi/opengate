name: Cache Scope Probe

# One arm of a two-candidate question: is a `workflow_run` job's cache token
# read-only because of how deep it sits in a cascade, or because the run it
# follows is on the default branch? This arm is depth 1 with an upstream event
# of `push` on the default branch, which separates the two.
#
# A cache save reports success whether or not the write landed, so the verdict
# comes from asking the cache API whether the key exists.
on:
  workflow_run:
    workflows: [Cache Scope Probe Upstream]
    types: [completed]
    branches: [main]

permissions: {}

jobs:
  probe:
    name: Write a cache entry and read it back
    runs-on: ubuntu-latest
    permissions:
      actions: read
    steps:
      - name: State what this run follows
        env:
          UPSTREAM_EVENT: ${{ github.event.workflow_run.event }}
          UPSTREAM_BRANCH: ${{ github.event.workflow_run.head_branch }}
          UPSTREAM_CONCLUSION: ${{ github.event.workflow_run.conclusion }}
        run: |
          set -euo pipefail
          echo "upstream event=$UPSTREAM_EVENT branch=$UPSTREAM_BRANCH conclusion=$UPSTREAM_CONCLUSION"

      - name: Produce something to cache
        run: date -u +%FT%TZ > probe-payload.txt

      - uses: actions/cache/save@v6
        with:
          path: probe-payload.txt
          key: cache-scope-probe-${{ github.run_id }}

      - name: Ask the cache API whether the key exists
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          KEY: cache-scope-probe-${{ github.run_id }}
        run: |
          set -euo pipefail
          FOUND="$(gh api --paginate "/repos/$REPO/actions/caches" \
            --jq '.actions_caches[].key' | grep -cFx "$KEY" || true)"
          if [ "$FOUND" -gt 0 ]; then
            VERDICT="WRITES — the upstream event is the discriminator"
          else
            VERDICT="DENIED — the upstream branch is the discriminator"
          fi
          echo "::notice::cache-scope probe: $VERDICT"
          echo "cache-scope probe: $VERDICT" >> "$GITHUB_STEP_SUMMARY"
