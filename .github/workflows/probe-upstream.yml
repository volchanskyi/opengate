name: Cache Scope Probe Upstream

# Fires on the push `merge-to-main` makes, so the probe below has an upstream
# whose event is `push` and whose branch is the default branch. Nothing here
# writes: this run exists only to be something a `workflow_run` can follow.
on:
  push:
    branches: [main]

permissions: {}

jobs:
  announce:
    name: Announce the run a probe will follow
    runs-on: ubuntu-latest
    permissions: {}
    steps:
      - name: State the event and ref this run carries
        env:
          EVENT: ${{ github.event_name }}
          REF: ${{ github.ref }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          echo "event=$EVENT ref=$REF sha=$SHA"
