name: Release Agent

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build and release (e.g., v0.1.0)"
        required: true
        type: string

# A job without its own permissions block inherits no token scopes.
permissions: {}

jobs:
  check-agent-changed:
    name: Check agent/ changed since previous tag
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    outputs:
      agent_changed: ${{ steps.gate.outputs.agent_changed }}
      prev_tag: ${{ steps.gate.outputs.prev_tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}
          fetch-depth: 0
          fetch-tags: true
      # A diff against the previous v* tag with no agent/** entries skips build and release,
      # so /releases/latest keeps pointing at the latest release that carries binaries.
      - name: Gate on agent/ diff
        id: gate
        run: ./scripts/release-agent-gate.sh "${{ inputs.tag || github.ref_name }}" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.target }}
    needs: check-agent-changed
    if: needs.check-agent-changed.outputs.agent_changed == 'true'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-musl
            artifact: mesh-agent-linux-amd64
          - target: aarch64-unknown-linux-musl
            artifact: mesh-agent-linux-arm64
    defaults:
      run:
        working-directory: agent
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.tag || github.ref }}

      - uses: dtolnay/rust-toolchain@29eef336d9b2848a0b548edc03f92a220660cdb8 # stable
        with:
          targets: ${{ matrix.target }}

      - name: Install musl tools
        run: |
          sudo apt-get update
          sudo apt-get install -y musl-tools

      - name: Install cross tools
        if: matrix.target == 'aarch64-unknown-linux-musl'
        run: |
          # The rev pin gives the cross-build the main-branch tree it needs, tested at that rev.
          cargo install --locked cross \
            --git https://github.com/cross-rs/cross --rev 8c1a8aa4b661711f4b7b6ac07c2e8929ce2f7d27

      - uses: Swatinem/rust-cache@f0d9c3887740aee45f6153b24b3a6b815192ec16 # v2
        with:
          workspaces: agent
          key: ${{ matrix.target }}

      - name: Determine version
        id: version
        run: |
          TAG="${{ inputs.tag || github.ref_name }}"
          VERSION="${TAG#v}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "Agent version: $VERSION"

      - name: Build release binary (native)
        if: matrix.target == 'x86_64-unknown-linux-musl'
        env:
          OPENGATE_VERSION: ${{ steps.version.outputs.version }}
        run: cargo build --release --target ${{ matrix.target }} -p mesh-agent

      - name: Build release binary (cross)
        if: matrix.target == 'aarch64-unknown-linux-musl'
        env:
          OPENGATE_VERSION: ${{ steps.version.outputs.version }}
        run: cross build --release --target ${{ matrix.target }} -p mesh-agent

      - name: Prepare artifact
        run: |
          cp target/${{ matrix.target }}/release/mesh-agent ${{ matrix.artifact }}
          sha256sum ${{ matrix.artifact }} > ${{ matrix.artifact }}.sha256

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.artifact }}
          path: |
            agent/${{ matrix.artifact }}
            agent/${{ matrix.artifact }}.sha256
          retention-days: 20

  release:
    name: Create Release
    needs: build
    runs-on: ubuntu-24.04
    # Write scope sits on this job alone, so the gate and build jobs keep the read-only token.
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3
        with:
          tag_name: ${{ inputs.tag || github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/mesh-agent-*
