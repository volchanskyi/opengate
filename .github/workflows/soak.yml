name: Endurance Soak

# Five-hour leak hunt: the fleet churns so the run completes many operations per machine.
# It runs on a runner the job owns and destroys, so a debugger can follow a held object.

on:
  schedule:
    # Weekly on Sunday: a slope needs an unbroken run, and the hour only sets the queue position.
    - cron: '0 7 * * 0'
  workflow_dispatch:

concurrency:
  group: soak
  cancel-in-progress: false

permissions:
  contents: read

env:
  COMPOSE_FILE: deploy/docker-compose.perf.yml
  SOAK_BUNDLE_DIR: soak-bundle
  # Production's memory ceiling, so a leak that kills the real server kills this one.
  PERF_SERVER_MEMORY: 384m
  PERF_SERVER_MEMORY_BYTES: '402653184'
  PERF_SERVER_CPUS: '0.25'
  # An empty value keeps the symbol table and debug info so a core dump resolves to types.
  PERF_SERVER_GO_LDFLAGS: ''
  # Interval between the two profile readings, and where the walk writes its findings.
  SOAK_SNAPSHOT_EVERY: 5m
  SOAK_WALK_DIR: soak-bundle/reference-walk
  # The encrypted core dump sits beside the bundle and is uploaded as its own artifact.
  SOAK_DUMP_DIR: soak-dump
  # The browser-side generator's inputs; its exports land inside the bundle directory.
  K6_VERSION: v1.6.1
  K6_BIN: /tmp/k6
  LOADTEST_BASE_URL: http://127.0.0.1:8080
  LOADTEST_PROFILE: load/profiles/soak.yaml
  LOADTEST_K6_SUMMARY_DIR: soak-bundle/k6

jobs:
  soak:
    name: Five hours with churn
    runs-on: ubuntu-24.04
    env:
      # The private half stays on the maintainer's laptop, so no workflow can open a dump it wrote.
      SOAK_DUMP_AGE_RECIPIENT: ${{ secrets.SOAK_DUMP_AGE_RECIPIENT }}
    # The walk takes 4h44m; the stack build, fixture and teardown fit under the six-hour kill.
    timeout-minutes: 340
    outputs:
      started_at: ${{ steps.started.outputs.at }}
    steps:
      # Every sample of the run carries this time, so the run is one point on one date.
      - name: Record when the run started
        id: started
        run: echo "at=$(date -u +%s)" >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.27'
          cache-dependency-path: server/go.sum

      # Docker Hub's anonymous pull rate is shared across the runner's network, so pulls use the mirror.
      - uses: ./.github/actions/docker-hub-mirror
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      # gdb provides gcore, viewcore reads the core as a Go heap, and zstd and age pack it.
      # Installing them and checking the key before the walk surfaces an unreadable dump early.
      - name: Install what takes, reads and encrypts a core dump
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdb
          scripts/install-viewcore.sh "$(go env GOPATH)/bin/viewcore"
          echo "$(go env GOPATH)/bin" >>"$GITHUB_PATH"
          scripts/install-dump-tools.sh
          echo "$HOME/.local/bin" >>"$GITHUB_PATH"

      - name: Refuse a dump nobody could open
        run: scripts/loadtest-reference-walk.sh --check-recipient

      # The generator for the technician load is fetched before the five-hour walk.
      - name: Install k6
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-amd64.tar.gz" \
            | tar -xz -C /tmp
          install -m 0755 "/tmp/k6-${K6_VERSION}-linux-amd64/k6" /tmp/k6

      - name: Record what this runner actually is
        run: |
          set -euo pipefail
          printf 'processors: %s\n' "$(nproc)"
          printf 'memory:     %s KB\n' "$(awk '/MemTotal/ {print $2}' /proc/meminfo)"
          printf 'free disk:  %s KB\n' "$(df -k --output=avail / | tail -n1 | tr -d ' ')"

      # The transport asks for more receive buffer than a runner allows a socket; the ceilings
      # are production's and host-wide, so the server's container gets them too.
      - name: Give the machine-facing path production's buffers
        run: scripts/perf-stack-quic.sh raise-buffers

      - name: Bring the performance stack up
        id: stack
        run: |
          set -euo pipefail
          DOCKER_CONFIG="$(./scripts/docker-credstore-guard.sh)"
          export DOCKER_CONFIG
          scripts/perf-stack-pull.sh "$COMPOSE_FILE"
          docker compose -f "$COMPOSE_FILE" up --build --wait --wait-timeout 300
          # The database's own accounting is sampled for the whole job for the leg's summary.
          DB_CGROUP="$(scripts/database-levels.sh cgroup-of opengate-perf-postgres)"
          nohup scripts/database-levels.sh sample "$DB_CGROUP" /tmp/db-samples.tsv >/dev/null 2>&1 &

      # The generator dials the name on the server's certificate, mapped to the container's address.
      - name: Dial the server by its certificate's name
        run: scripts/perf-stack-quic.sh map-server

      # Every cycle reconnects the same five hundred machines; relay sessions opened beside them
      # are the operation the leak attaches to, and they add to the completed-operation count.
      - name: Walk the soak profile, building its fleet first
        env:
          LOADTEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-soak
          # The stack is reachable only inside the runner and holds invented data; the password is per run.
          SOAK_FIXTURE_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-Soak!
        run: |
          set -euo pipefail
          mkdir -p "$SOAK_BUNDLE_DIR" "$LOADTEST_K6_SUMMARY_DIR"
          go build -C server -trimpath -o /tmp/loadtest ./tests/loadtest/
          scripts/loadtest-k6-alongside.sh /tmp/soak-quic.txt api-baseline relay-throughput &
          K6_LEG=$!
          # Exit 1 is a partial fleet, a measurement the verdict step below judges.
          # Errexit is off around the harness so its status can be read.
          set +e
          scripts/loadtest-quic-run.sh /tmp/soak-quic.txt -- \
            /tmp/loadtest \
              -agents=500 \
              -addr=server:9090 \
              -target-net-counters="$PERF_TARGET_NET_COUNTERS" \
              -default-telemetry \
              -hold=5h \
              -profile=load/profiles/soak.yaml \
              -commit="$GITHUB_SHA" \
              -target-cpus="$PERF_SERVER_CPUS" \
              -target-memory-bytes="$PERF_SERVER_MEMORY_BYTES" \
              -target-description="compose stack, $PERF_SERVER_CPUS processors, production's memory ceiling" \
              -enroll-url=http://127.0.0.1:8080 \
              -metrics-url=http://127.0.0.1:8081 \
              -fixture-account=soak-admin@opengate-loadtest.invalid \
              -fixture-password="$SOAK_FIXTURE_PASSWORD" \
              -fixture-bootstrap \
              -fixture-seed=1 \
              -relay-sessions \
              -leak-snapshot-every="$SOAK_SNAPSHOT_EVERY" \
              -bundle="$SOAK_BUNDLE_DIR/soak"
          walk=$?
          set -e
          wait "$K6_LEG"
          if [ "$walk" -gt 1 ]; then
            echo "::error::the harness did not complete a run (exit $walk)." >&2
            exit "$walk"
          fi

      # Other processes time the technician numbers into files of their own; the merge puts them
      # in the bundle, which outlives the runner.
      - name: Fold the technician numbers into the run's evidence
        run: |
          set -euo pipefail
          scripts/loadtest-bundle-merge.sh \
            "$SOAK_BUNDLE_DIR/soak/bundle.json" \
            --journeys "$LOADTEST_K6_SUMMARY_DIR/api-baseline.json" \
            --journeys "$LOADTEST_K6_SUMMARY_DIR/relay-throughput.json"

      # Either end asking for more receive buffer than the kernel gave loses datagrams unseen.
      - name: Refuse a run whose ends ran short of receive buffer
        run: scripts/perf-stack-quic.sh check /tmp/soak-quic.txt

      - name: Read the verdict the run wrote about itself
        if: always() && steps.stack.outcome == 'success'
        run: scripts/perf-bundle-verdict.sh "$SOAK_BUNDLE_DIR/soak/bundle.json"

      # The rows are the machine side the limits are held against; technician numbers are
      # folded into the bundle and reported without a gate.
      - name: Read the profile's limits against the run's own rows
        if: always() && steps.stack.outcome == 'success'
        run: |
          set -euo pipefail
          scripts/perf-bundle-limits.sh load/profiles/soak.yaml \
            "$SOAK_BUNDLE_DIR/soak/bundle.json" /tmp/soak-rows.json

      - name: Write the leg's summary
        if: always() && steps.stack.outcome == 'success'
        run: |
          set -euo pipefail
          BUNDLE="$SOAK_BUNDLE_DIR/soak/bundle.json"
          if [ ! -s "$BUNDLE" ] || [ ! -s "/tmp/soak-rows.json" ]; then
            echo "The leg wrote no rows, so its summary is the verdict above."
            exit 0
          fi
          read -r FROM TO <<<"$(scripts/run-summary.sh window "load/profiles/soak.yaml" "$BUNDLE")"
          scripts/database-levels.sh average /tmp/db-samples.tsv "$FROM" "$TO" >/tmp/db-levels.json
          scripts/run-summary.sh render --title "Endurance soak" --profile "load/profiles/soak.yaml" \
            --rows "/tmp/soak-rows.json" --bundle "$BUNDLE" --database /tmp/db-levels.json >>"$GITHUB_STEP_SUMMARY"

      # Names what still points at the heaviest objects; runs after a failed walk, before teardown.
      # The core is encrypted before it is read, and the plain copy stays in the runner's temp dir.
      - name: Follow what holds the heaviest objects
        id: walk
        if: always() && steps.stack.outcome == 'success'
        run: scripts/loadtest-reference-walk.sh opengate-perf-server /usr/local/bin/meshserver "$SOAK_WALK_DIR" "$SOAK_DUMP_DIR"

      - name: Tear the stack down
        if: always()
        run: |
          DOCKER_CONFIG="$(./scripts/docker-credstore-guard.sh)"
          export DOCKER_CONFIG
          docker compose -f "$COMPOSE_FILE" down -v

      - name: Upload the soak bundle
        if: always() && steps.stack.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: soak-bundle
          path: ${{ env.SOAK_BUNDLE_DIR }}
          if-no-files-found: error
          retention-days: 90

      # Opened only with the maintainer's private key:
      # age -d -i ~/.config/age/opengate-soak-dump.key <file> | zstd -d
      - name: Upload the encrypted core dump
        if: always() && steps.stack.outcome == 'success'
        uses: actions/upload-artifact@v7
        with:
          name: soak-dump
          path: ${{ env.SOAK_DUMP_DIR }}
          if-no-files-found: error
          retention-days: 90

  # Publishes the run's rows into the trend and compares them with the weeks before.
  # This job's result says whether the trend was published; the gate below reads what it found.
  publish:
    name: Publish the endurance trend
    needs: [soak]
    if: always() && needs.soak.outputs.started_at != ''
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    permissions:
      contents: read
    outputs:
      regression: ${{ steps.check.outputs.regression }}
    env:
      # Every sample of the run carries its start time.
      VM_RUN_STARTED_AT: ${{ needs.soak.outputs.started_at }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-pinned-tools

      - name: Collect the run's bundle
        uses: actions/download-artifact@v8
        with:
          name: soak-bundle
          path: soak-legs

      - name: OCI + kubeconfig setup
        uses: ./.github/actions/oci-kube-setup
        with:
          oci-tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci-user: ${{ secrets.OCI_USER_OCID }}
          oci-fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          oci-private-key: ${{ secrets.OCI_PRIVATE_KEY }}
          oci-region: ${{ secrets.OCI_REGION }}
          cluster-id: ${{ secrets.OKE_CLUSTER_ID }}

      - name: Compare the run with the weeks before it
        id: check
        run: |
          set -euo pipefail
          set +e
          scripts/perf-regression-check.sh soak-legs/soak/bundle.json >soak-regression.out 2>&1
          CHECK_STATUS=$?
          set -e
          cat soak-regression.out
          case "$CHECK_STATUS" in
            0) echo "regression=0" >>"$GITHUB_OUTPUT" ;;
            1) echo "regression=1" >>"$GITHUB_OUTPUT" ;;
            *)
              echo "regression=0" >>"$GITHUB_OUTPUT"
              echo "::error::the run could not be compared with the weeks before it (exit $CHECK_STATUS)."
              exit "$CHECK_STATUS"
              ;;
          esac
          {
            echo "alert_text<<EOF"
            grep '^REGRESSION_ALERT:' soak-regression.out | sed 's/^REGRESSION_ALERT://' || true
            echo "EOF"
          } >>"$GITHUB_OUTPUT"

      - name: Push to VictoriaMetrics
        run: scripts/perf-vm-push.sh soak-legs/soak/bundle.json

      - name: Send Telegram alert
        # Runs whatever happened above it, and says which of the three it was.
        # A refused send reddens this job; the finding is read by the gate below.
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.DEPLOY_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.DEPLOY_TELEGRAM_CHAT_ID }}
          FINDING: ${{ steps.check.outputs.regression }}
          ALERT_TEXT: ${{ steps.check.outputs.alert_text }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = "success" ] && [ "${FINDING:-0}" != "1" ]; then
            echo "No alert sent: the run was published and is not past the weeks before it."
            exit 0
          fi
          if [ "${FINDING:-0}" = "1" ]; then
            MSG="$(printf '%s\n\nRun: %s\nTrend: Grafana dashboard "Endurance Soak Trends" (opengate-soak-trend)' "$ALERT_TEXT" "$RUN_URL")"
          else
            MSG="$(printf 'Endurance trend: the run was not published (%s).\n\nRun: %s' "$JOB_STATUS" "$RUN_URL")"
          fi
          scripts/telegram-alert.sh "$MSG"

      - name: Remove OCI credentials
        if: always()
        uses: ./.github/actions/oci-kube-teardown

  gate:
    name: Endurance regression gate
    needs: [publish]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Fail workflow red on a run past the weeks before it
        run: |
          if [ "${{ needs.publish.result }}" != "success" ]; then
            echo "::error::the endurance trend was not published; see the publish job."
            exit 1
          fi
          if [ "${{ needs.publish.outputs.regression }}" = "1" ]; then
            echo "::error::the endurance run is past the weeks before it — see the publish job's summary and the Telegram alert."
            exit 1
          fi
          echo "The endurance run is not past the weeks before it."

  # Alerts on a run that died, was cancelled or was killed at its timeout.
  alert:
    name: Alert if the run did not finish
    # A job killed at its timeout may run no step, so the alert is a job of its own.
    needs: [soak]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-pinned-tools

      - name: Send Telegram alert
        # `needs.<job>.result` is a fact about the named job and tells a cancel from a failure.
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.DEPLOY_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.DEPLOY_TELEGRAM_CHAT_ID }}
          RESULTS: soak=${{ needs.soak.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          LOST=""
          for entry in $RESULTS; do
            name="${entry%%=*}"
            result="${entry#*=}"
            case "$result" in
              success | skipped) ;;
              *) LOST="${LOST}  - ${name}: ${result}"$'\n' ;;
            esac
          done
          if [ -z "$LOST" ]; then
            echo "No alert sent: every job finished."
            exit 0
          fi
          scripts/telegram-alert.sh "$(printf 'The endurance run did not finish:\n\n%s\nRun: %s' "$LOST" "$RUN_URL")"
