name: Endurance Soak

# The run that exists to find what leaks.
#
# The defect this family is written for stranded two goroutines per finished
# session, forever. Staging walked 29 to 334 MiB across four nightly load runs
# and was killed against its memory limit, and every liveness number the server
# published read healthy the whole time — because the code that decrements those
# numbers ran. Nothing shorter than hours can see a slope like that.
#
# Five hours with the fleet coming and going, rather than eight holding still.
# Holding a connection is not work: an unchanging fleet finishes one operation
# per machine for the whole run, which leaves a leak detector almost nothing to
# divide by. The profile's ten cycles end and restart two hundred and fifty
# machines each, so five hours finish ten times what eight idle ones would.
#
# It runs on a runner rather than on the cluster. Five hours of a cluster node is
# five hours of production's neighbour being driven, and the run owns this
# machine and destroys it — which is what makes following a held object with a
# debugger possible at all, where the staging pod drops every capability, runs as
# a non-root user and has a read-only filesystem.

on:
  schedule:
    # Weekly, not nightly. Five hours of one is worth more than a fifth of five
    # nightly hours, because a slope needs an unbroken run to be a slope; and an
    # endurance run repeated every night would be five hours of a shared job
    # pool for a question that changes slowly.
    #
    # The hour buys a place in the order rather than a start time — every
    # scheduled run begins four and a half to six and a half hours after the
    # time it names — and Sunday is what keeps it clear of the weekday batch.
    - cron: '0 7 * * 0'
  workflow_dispatch:

concurrency:
  group: soak
  cancel-in-progress: false

permissions:
  contents: read

env:
  COMPOSE_FILE: deploy/docker-compose.perf.yml
  SOAK_BUNDLE_DIR: soak-bundle
  # Production's own memory ceiling, so the eviction case is reproduced rather
  # than lost. A leak that would kill the real server has to be able to kill
  # this one.
  PERF_SERVER_MEMORY: 384m
  PERF_SERVER_MEMORY_BYTES: '402653184'
  PERF_SERVER_CPUS: '0.25'
  # The target keeps its symbol table and its debugging information here, and
  # nowhere else. A core dump is addresses until something can resolve them back
  # to types and frames, and the release link drops exactly the tables that do
  # it. No generated code changes.
  PERF_SERVER_GO_LDFLAGS: ''
  # How often both profiles are taken, and where the walk writes what it found.
  # Five minutes over a four-hour-forty-four-minute walk is about sixty readings
  # of each, roughly fifteen megabytes, which is an artifact rather than a
  # problem.
  SOAK_SNAPSHOT_EVERY: 5m
  SOAK_WALK_DIR: soak-bundle/reference-walk
  # The browser-side generator, and everything it refuses to run without. The
  # exports land inside the bundle directory so the raw readings travel with the
  # evidence they were folded into, rather than in a temp directory the job
  # destroys. Two steps read these — the one that starts the generator and the
  # one that folds what it wrote — so they are declared once here.
  K6_VERSION: v1.6.1
  K6_BIN: /tmp/k6
  LOADTEST_BASE_URL: http://127.0.0.1:8080
  LOADTEST_PROFILE: load/profiles/soak.yaml
  LOADTEST_K6_SUMMARY_DIR: soak-bundle/k6

jobs:
  soak:
    name: Five hours with churn
    runs-on: ubuntu-24.04
    # The walk is four hours and forty-four minutes; the stack build, the fixture
    # and the teardown are the rest. A scheduled job is killed at six hours, so
    # the slack is stated here rather than discovered as a run cut off inside its
    # last cycle.
    timeout-minutes: 340
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-go@v7
        with:
          go-version: '1.26'
          cache-dependency-path: server/go.sum

      # Docker Hub's anonymous pull rate is shared across a runner's whole
      # network, so a pull here goes through the mirror the rest of the
      # pipelines use.
      - uses: ./.github/actions/docker-hub-mirror
        with:
          dockerhub-username: ${{ secrets.DOCKERHUB_USERNAME }}
          dockerhub-token: ${{ secrets.DOCKERHUB_TOKEN }}

      # gdb brings gcore, which takes a core off the running server without
      # stopping it; viewcore reads that core as a Go heap. Both are installed
      # before the five-hour walk rather than after it, so a run that cannot be
      # followed says so now instead of at the end of an afternoon.
      - name: Install what reads a core dump
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends gdb
          go install golang.org/x/debug/cmd/viewcore@v0.0.0-20260908162731-ac862fd6552b
          echo "$(go env GOPATH)/bin" >>"$GITHUB_PATH"

      # The technician load runs beside the fleet, so the generator that offers
      # it is fetched before the five-hour walk rather than after it.
      - name: Install k6
        run: |
          set -euo pipefail
          curl -fsSL \
            "https://github.com/grafana/k6/releases/download/${K6_VERSION}/k6-${K6_VERSION}-linux-amd64.tar.gz" \
            | tar -xz -C /tmp
          install -m 0755 "/tmp/k6-${K6_VERSION}-linux-amd64/k6" /tmp/k6

      - name: Record what this runner actually is
        run: |
          set -euo pipefail
          printf 'processors: %s\n' "$(nproc)"
          printf 'memory:     %s KB\n' "$(awk '/MemTotal/ {print $2}' /proc/meminfo)"
          printf 'free disk:  %s KB\n' "$(df -k --output=avail / | tail -n1 | tr -d ' ')"

      - name: Bring the performance stack up
        id: stack
        run: |
          set -euo pipefail
          DOCKER_CONFIG="$(./scripts/docker-credstore-guard.sh)"
          export DOCKER_CONFIG
          docker compose -f "$COMPOSE_FILE" up --build --wait --wait-timeout 300

      # The estate is five hundred machines and the profile never asks for more,
      # so every cycle brings the same machines back rather than enrolling new
      # ones over them. A run that grew its own fleet for five hours would be
      # answering the volume question and the endurance one at once, and neither
      # of them cleanly.
      #
      # The technician load the profile declares runs beside the fleet: three
      # journeys a second and three sessions held open through each busy phase.
      # It used to run nowhere, so those numbers described an intention rather
      # than a fact — and the sessions are the half that matters here, because
      # the leak this family exists for stranded two goroutines on a *finished*
      # relay session. Five hours of churn that opens no session never performs
      # the operation the leak attaches to.
      #
      # The generator picks the machines it will open sessions against once, from
      # the fleet as it stands when the estate is filed — which is the first
      # phase's level — and a wind-down takes the machines asked for last, so
      # what it picked is what stays connected for the whole walk. The handful
      # that arrive in the seconds between the estate being filed and the
      # generator reading it are wound down at the first quiet phase, and a
      # session asked for against one of those is refused; it moves nothing this
      # run is judged on. The order that rests on is held by
      # server/tests/loadtest/quic_fleet_test.go rather than assumed.
      #
      # It is also the denominator. The harness counts the machine sides it
      # answers as completed operations beside the machine-lives, so the
      # conservation reading the whole family is judged by goes from dividing by
      # a few thousand arrivals to dividing by those plus every session opened
      # and closed across the walk.
      #
      # The generator is not given a processor allowance of its own. The stack's
      # three services declare well under half the runner's processors between
      # them, the load offered here is three journeys a second and three
      # sessions, and the harness holding this fleet is the same one that holds
      # sixteen times as many inside a single processor on the sweep venue.
      # What the run reports about its own room is in the bundle's headroom
      # either way, so a generator that did run short says so rather than being
      # assumed not to have.
      - name: Walk the soak profile, building its fleet first
        env:
          LOADTEST_RUN_ID: ${{ github.run_id }}-${{ github.run_attempt }}-soak
          # The stack is created by this job and thrown away at the end of it, is
          # reachable only from inside the runner, and holds nothing but the
          # fleet this run invented. The password is generated per run all the
          # same, so nothing fixed is ever written down.
          SOAK_FIXTURE_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}-Soak!
        run: |
          set -euo pipefail
          mkdir -p "$SOAK_BUNDLE_DIR" "$LOADTEST_K6_SUMMARY_DIR"
          go build -C server -trimpath -o /tmp/loadtest ./tests/loadtest/
          scripts/loadtest-k6-alongside.sh /tmp/soak-quic.txt api-baseline relay-throughput &
          K6_LEG=$!
          # The harness's own exit code, read rather than acted on: 1 is a fleet
          # that half arrived, which is a measurement. What judges it is the
          # verdict step below, and failing here on the count is a second
          # verdict nobody wrote down. Errexit is turned off around it because a
          # status read after an unguarded command is a branch nothing reaches.
          set +e
          scripts/loadtest-quic-run.sh /tmp/soak-quic.txt -- \
            /tmp/loadtest \
              -agents=500 \
              -addr=127.0.0.1:9090 \
              -default-telemetry \
              -hold=5h \
              -profile=load/profiles/soak.yaml \
              -commit="$GITHUB_SHA" \
              -target-cpus="$PERF_SERVER_CPUS" \
              -target-memory-bytes="$PERF_SERVER_MEMORY_BYTES" \
              -target-description="compose stack, $PERF_SERVER_CPUS processors, production's memory ceiling" \
              -enroll-url=http://127.0.0.1:8080 \
              -metrics-url=http://127.0.0.1:8081 \
              -fixture-account=soak-admin@opengate-loadtest.invalid \
              -fixture-password="$SOAK_FIXTURE_PASSWORD" \
              -fixture-bootstrap \
              -fixture-seed=1 \
              -relay-sessions \
              -leak-snapshot-every="$SOAK_SNAPSHOT_EVERY" \
              -bundle="$SOAK_BUNDLE_DIR/soak"
          walk=$?
          set -e
          wait "$K6_LEG"
          if [ "$walk" -gt 1 ]; then
            echo "::error::the harness did not complete a run (exit $walk)." >&2
            exit "$walk"
          fi

      # The technician numbers are timed by generators in other processes and
      # written to files of their own. Folding them in is what gives them a
      # reader: the bundle is the artifact that outlives this machine, and a
      # measurement nobody reads is a run that happens to share a profile.
      - name: Fold the technician numbers into the run's evidence
        run: |
          set -euo pipefail
          scripts/loadtest-bundle-merge.sh \
            "$SOAK_BUNDLE_DIR/soak/bundle.json" \
            --journeys "$LOADTEST_K6_SUMMARY_DIR/api-baseline.json" \
            --journeys "$LOADTEST_K6_SUMMARY_DIR/relay-throughput.json"

      - name: Read the verdict the run wrote about itself
        if: always()
        run: scripts/perf-bundle-verdict.sh "$SOAK_BUNDLE_DIR/soak/bundle.json"

      # And the numbers the profile says this run is judged by, read off its own
      # evidence. The rows that reader builds are the machine side, which is
      # what the limits below are held against; the technician numbers beside
      # them are folded into the bundle and reported rather than gated.
      - name: Read the profile's limits against the run's own rows
        if: always()
        run: |
          set -euo pipefail
          scripts/perf-bundle-limits.sh load/profiles/soak.yaml \
            "$SOAK_BUNDLE_DIR/soak/bundle.json" /tmp/soak-rows.json

      # What holds what the profiles say grew. The heap profiles name where an
      # object was born; this names what is still pointing at it, which is the
      # half no profiler can answer.
      #
      # It runs whenever the stack came up, including after a failed walk — a run
      # that went red is the run whose heap is most worth reading — and before
      # the teardown, because it needs the server alive. The core itself is read
      # here and deleted here; only the text travels.
      - name: Follow what holds the heaviest objects
        if: always() && steps.stack.outcome == 'success'
        run: scripts/loadtest-reference-walk.sh opengate-perf-server /usr/local/bin/meshserver "$SOAK_WALK_DIR"

      - name: Tear the stack down
        if: always()
        run: |
          DOCKER_CONFIG="$(./scripts/docker-credstore-guard.sh)"
          export DOCKER_CONFIG
          docker compose -f "$COMPOSE_FILE" down -v

      - name: Upload the soak bundle
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: soak-bundle
          path: ${{ env.SOAK_BUNDLE_DIR }}
          if-no-files-found: error
          retention-days: 90

  # Say so when the night was lost.
  #
  # Every nightly here published its verdict into its own result and nothing
  # read it: a run that died, was cancelled, or was killed at its timeout went
  # red on a page nobody opens. The alert path is the part that makes a red run
  # a thing somebody knows about.
  alert:
    name: Say so if the night was lost
    # The run is one job with a timeout barely over what it takes, and a job
    # killed at its timeout may run no step at all — which is precisely the
    # night worth alerting on. So the alert is a job of its own, on a runner of
    # its own, reading the result rather than sitting inside it.
    needs: [soak]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    environment: observability
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-pinned-tools

      - name: Say what this night was
        # `needs.<job>.result` rather than `failure()`: the result is a fact
        # about the job named, and it is what the repository's other gate jobs
        # already read. It also tells a cancel from a failure, which matters —
        # one of them is somebody's decision and the other is a lost night.
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.DEPLOY_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.DEPLOY_TELEGRAM_CHAT_ID }}
          RESULTS: soak=${{ needs.soak.result }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          set -euo pipefail
          LOST=""
          for entry in $RESULTS; do
            name="${entry%%=*}"
            result="${entry#*=}"
            case "$result" in
              success | skipped) ;;
              *) LOST="${LOST}  - ${name}: ${result}"$'\n' ;;
            esac
          done
          if [ -z "$LOST" ]; then
            echo "Nothing to say: every job finished."
            exit 0
          fi
          scripts/telegram-alert.sh "$(printf 'The endurance run did not finish:\n\n%s\nRun: %s' "$LOST" "$RUN_URL")"
