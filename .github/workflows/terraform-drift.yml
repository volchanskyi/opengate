name: terraform-drift

# Nightly drift detection — catches out-of-band changes to OCI resources
# (operator clicks in the console, cd.yml runtime NSG mutations, manual
# security-list edits) by running `terraform plan -refresh-only -detailed-exitcode`
# against the remote backend.
#
# Plan: .claude/plans/terraform-test-and-remote-state.md (PR T4)
# Same pattern as .github/workflows/mutation.yml — observability, not auto-remediation.
#
# Authentication: a separate read-only IAM user `tf-drift-reader` (inspect-only
# on the compartment + read-only on the tfstate bucket). The new OCI_DRIFT_*
# secrets gate this — distinct from the CD deploy user.

on:
  schedule:
    - cron: '0 3 * * *'  # nightly 03:00 UTC (same slot as mutation.yml; both are observability)
  workflow_dispatch: {}

concurrency:
  group: terraform-drift
  cancel-in-progress: false

permissions:
  contents: read

env:
  TERRAFORM_VERSION: 1.9.x
jobs:
  drift:
    name: Refresh-only plan + alert
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    # See mutation.yml for the rationale on the `observability` environment.
    # This job needs DEPLOY_TELEGRAM_BOT_TOKEN / DEPLOY_TELEGRAM_CHAT_ID to
    # fire the drift alert and must run unattended on the nightly cron;
    # `observability` provides the secrets without the required_reviewers
    # gate that `staging` / `production` have.
    environment: observability
    outputs:
      drift: ${{ steps.plan.outputs.exitcode }}
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-pinned-tools
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4
        with:
          terraform_version: ${{ env.TERRAFORM_VERSION }}

      - name: Write OCI provider API key
        env:
          OCI_DRIFT_PRIVATE_KEY: ${{ secrets.OCI_DRIFT_PRIVATE_KEY }}
        run: |
          mkdir -p ~/.oci
          printf '%s' "$OCI_DRIFT_PRIVATE_KEY" > ~/.oci/drift.pem
          chmod 600 ~/.oci/drift.pem

      - name: Write backend config
        env:
          OCI_TFSTATE_NAMESPACE: ${{ secrets.OCI_TFSTATE_NAMESPACE }}
          OCI_REGION: ${{ secrets.OCI_REGION }}
        run: |
          # The S3 bucket lives in the same region as the rest of the infra;
          # the endpoint is reconstructed from the OCI namespace + region.
          # Credentials env vars (AWS_ACCESS_KEY_ID / AWS_SECRET_ACCESS_KEY)
          # are passed at init/plan time below.
          cat > /tmp/backend.tfbackend <<EOF
          endpoints = {
            s3 = "https://${OCI_TFSTATE_NAMESPACE}.compat.objectstorage.${OCI_REGION}.oraclecloud.com"
          }
          EOF

      - name: Verify OCI endpoint reachability + credential shape
        uses: ./.github/actions/verify-oci-tfstate-creds
        with:
          oci-tfstate-namespace: ${{ secrets.OCI_TFSTATE_NAMESPACE }}
          oci-region: ${{ secrets.OCI_REGION }}
          tfstate-s3-access-key: ${{ secrets.TFSTATE_S3_ACCESS_KEY }}
          tfstate-s3-secret-key: ${{ secrets.TFSTATE_S3_SECRET_KEY }}
          oci-tenancy-ocid: ${{ secrets.OCI_TENANCY_OCID }}
          oci-user-ocid: ${{ secrets.OCI_DRIFT_USER_OCID }}
          oci-fingerprint: ${{ secrets.OCI_DRIFT_FINGERPRINT }}
          oci-private-key: ${{ secrets.OCI_DRIFT_PRIVATE_KEY }}

      - name: Terraform init (S3 backend, with retry)
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TFSTATE_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TFSTATE_S3_SECRET_KEY }}
          # AWS SDK v2 defaults to a flexible-checksum chunked upload that OCI's
          # S3-compat rejects with `501 NotImplemented: AWS chunked encoding not
          # supported`. Forcing `when_required` skips it. Required on every
          # terraform invocation against this backend.
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
        # init reaches two flaky externals: the S3-compat backend endpoint
        # `<ns>.compat.objectstorage.<region>.oraclecloud.com` (occasional GHA DNS
        # miss — `dial tcp: lookup …: no such host`, 2026-05-15) and the Terraform
        # provider registry, which redirects to github.com for the oracle/oci
        # provider and can return `504 Gateway Timeout` during a GitHub blip
        # (2026-06-08 — outlasted the old 3-attempt/~90s window and false-failed
        # the nightly). Widen to 5 attempts with longer backoff (~5 min total) so a
        # transient registry/DNS outage rides through instead of red-flagging drift.
        run: |
          set -e
          for attempt in 1 2 3 4 5; do
            if terraform -chdir=deploy/terraform init -backend-config=/tmp/backend.tfbackend -input=false; then
              exit 0
            fi
            echo "::warning::terraform init attempt $attempt/5 failed; retrying in $((attempt * 20))s"
            sleep $((attempt * 20))
          done
          echo "::error::terraform init failed after 5 attempts"
          exit 1

      - name: Terraform plan (refresh-only, detailed exit)
        id: plan
        env:
          AWS_ACCESS_KEY_ID: ${{ secrets.TFSTATE_S3_ACCESS_KEY }}
          AWS_SECRET_ACCESS_KEY: ${{ secrets.TFSTATE_S3_SECRET_KEY }}
          AWS_REQUEST_CHECKSUM_CALCULATION: when_required
          TF_VAR_tenancy_ocid: ${{ secrets.OCI_TENANCY_OCID }}
          TF_VAR_user_ocid: ${{ secrets.OCI_DRIFT_USER_OCID }}
          TF_VAR_fingerprint: ${{ secrets.OCI_DRIFT_FINGERPRINT }}
          TF_VAR_private_key_path: /home/runner/.oci/drift.pem
          TF_VAR_region: ${{ secrets.OCI_REGION }}
          # refresh-only does not compare config to state, but variables still
          # have to satisfy their validation blocks. Any non-`0.0.0.0/0` CIDR
          # satisfies the ssh_allowed_cidr validation.
          TF_VAR_ssh_allowed_cidr: 203.0.113.0/24
          TF_VAR_ssh_public_key_path: /dev/null
        run: |
          set +e
          terraform -chdir=deploy/terraform plan \
            -refresh-only -detailed-exitcode \
            -out=drift.tfplan 2>&1 | tee drift.txt
          ec=${PIPESTATUS[0]}
          echo "exitcode=$ec" >> "$GITHUB_OUTPUT"
          # 0 = no drift, 2 = drift, anything else = real error
          if [ "$ec" != "0" ] && [ "$ec" != "2" ]; then exit "$ec"; fi

      - name: Drift summary JSON
        if: steps.plan.outputs.exitcode == '0' || steps.plan.outputs.exitcode == '2'
        run: |
          terraform -chdir=deploy/terraform show -json drift.tfplan > drift.json
          ./scripts/terraform-drift-summarize.sh drift.json > drift-summary.json
          cat drift-summary.json

      - name: Upload drift artifacts
        if: steps.plan.outputs.exitcode == '2'
        uses: actions/upload-artifact@v7
        with:
          name: terraform-drift
          path: |
            drift.txt
            drift.json
            drift-summary.json
          retention-days: 30

      # Trend pushes run against in-cluster Services via kubectl (the cluster API
      # endpoint is reachable without a JIT NSG rule, so no firewall teardown).
      - name: OCI + kubeconfig setup
        if: steps.plan.outputs.exitcode == '0' || steps.plan.outputs.exitcode == '2'
        id: infra
        uses: ./.github/actions/oci-kube-setup
        with:
          oci-tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci-user: ${{ secrets.OCI_USER_OCID }}
          oci-fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          oci-private-key: ${{ secrets.OCI_PRIVATE_KEY }}
          oci-region: ${{ secrets.OCI_REGION }}
          cluster-id: ${{ secrets.OKE_CLUSTER_ID }}

      - name: Push to VictoriaMetrics
        if: steps.plan.outputs.exitcode == '0' || steps.plan.outputs.exitcode == '2'
        run: ./scripts/terraform-drift-vm-push.sh drift-summary.json

      - name: Say what this night was
        # Runs whatever happened above it, and the message names which of the
        # three it was. The shape this replaces was gated on the plan's own exit
        # code, so a night that died before the plan ran said nothing at all:
        # the louder the failure, the more certain the silence.
        #
        # And the send below reports a refused delivery rather than swallowing
        # it. It can afford to — the verdict is read by a job of its own now, so
        # a Telegram outage reddens this job and hides nothing.
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.DEPLOY_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.DEPLOY_TELEGRAM_CHAT_ID }}
          FINDING: ${{ steps.plan.outputs.exitcode }}
          RUN: ${{ github.run_id }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = "success" ] && [ "${FINDING:-0}" != "2" ]; then
            echo "Nothing to say: the plan ran and the infrastructure matches what is declared."
            exit 0
          fi
          if [ "${FINDING:-0}" = "2" ]; then
            MSG="$(printf 'Terraform drift on dev (run %s):\n\n%s\n\nRun: %s' \
              "$RUN" "$(cat drift.txt 2>/dev/null || echo '(the plan output did not survive)')" "$RUN_URL")"
          else
            MSG="$(printf 'Infrastructure drift: the night did not finish (%s), so nothing was compared.\n\nRun: %s' \
              "$JOB_STATUS" "$RUN_URL")"
          fi
          scripts/telegram-alert.sh "$MSG"

      - name: Remove OCI credentials
        if: always()
        uses: ./.github/actions/oci-kube-teardown

  # What the cluster was actually given, against what this repository declares.
  #
  # The monitoring stack's ConfigMaps carry every alert rule, every dashboard and
  # every scrape target. Two of them were created once by hand and re-created by
  # nothing, and the third belongs to a chart that had not been upgraded in over
  # a hundred days. So the cluster evaluated seven of the thirteen rules declared
  # here, served nine of thirteen dashboards, and scraped none of the
  # per-container series — including the ones the rule written to detect exactly
  # that gap reads. A rule could be added, pinned by a gate, reviewed, merged,
  # and never exist.
  #
  # This job is that comparison, in the workflow whose subject is already the
  # deployed state drifting from the declared one.
  monitoring-config:
    name: The configuration the cluster holds
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    environment: observability
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v7

      - uses: ./.github/actions/setup-pinned-tools

      - name: OCI + kubeconfig setup
        uses: ./.github/actions/oci-kube-setup
        with:
          oci-tenancy: ${{ secrets.OCI_TENANCY_OCID }}
          oci-user: ${{ secrets.OCI_USER_OCID }}
          oci-fingerprint: ${{ secrets.OCI_FINGERPRINT }}
          oci-private-key: ${{ secrets.OCI_PRIVATE_KEY }}
          oci-region: ${{ secrets.OCI_REGION }}
          cluster-id: ${{ secrets.OKE_CLUSTER_ID }}

      - name: Give the cluster what this commit declares, then ask for it back
        env:
          TELEGRAM_CHAT_ID: ${{ secrets.DEPLOY_TELEGRAM_CHAT_ID }}
        run: deploy/scripts/monitoring-config-apply.sh

      # The destination is provisioned from a file, so it survives a pod being
      # rescheduled. Whether a message actually arrives is a different fact, and
      # it is the only one worth trusting: the configuration above can be right
      # in every particular and still reach nobody.
      #
      # It runs whatever happened above it, because proving the channel does not
      # depend on the configuration being current — the send goes to Telegram
      # directly. And this job cannot alert through the channel it is testing, so
      # the workflow's own result is the signal that survives a send nobody got.
      - name: Send a message through the channel the alerts use
        if: always()
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.DEPLOY_TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.DEPLOY_TELEGRAM_CHAT_ID }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          JOB_STATUS: ${{ job.status }}
        run: |
          set -euo pipefail
          if [ "$JOB_STATUS" = "success" ]; then
            MSG="$(printf 'The nightly alert channel is alive, and the cluster holds the monitoring configuration this commit declares.\n\nRun: %s' "$RUN_URL")"
          else
            MSG="$(printf 'Monitoring configuration: the check did not finish (%s). Either the cluster holds something other than what is declared, or this channel is the thing that is broken.\n\nRun: %s' \
              "$JOB_STATUS" "$RUN_URL")"
          fi
          scripts/telegram-alert.sh "$MSG"

      - name: Remove OCI credentials
        if: always()
        uses: ./.github/actions/oci-kube-teardown

  # Separate from the job that sends, so a refused delivery cannot take the
  # night's verdict with it.
  gate:
    name: Infrastructure drift gate
    needs: [drift, monitoring-config]
    if: always()
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Fail workflow red on drift
        run: |
          set -euo pipefail
          if [ "${{ needs.drift.result }}" != "success" ]; then
            echo "::error::The drift plan did not finish; see that job."
            exit 1
          fi
          if [ "${{ needs['monitoring-config'].result }}" != "success" ]; then
            echo "::error::The cluster's monitoring configuration is not the one this commit declares; see that job."
            exit 1
          fi
          if [ "${{ needs.drift.outputs.drift }}" = "2" ]; then
            echo "::error::Terraform drift detected — see the run's artifacts and the Telegram alert."
            exit 1
          fi
          echo "No drift, and the cluster holds what this commit declares."
