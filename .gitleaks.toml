# Gitleaks configuration read by `make secrets-scan`, the ci.yml config-lint job and the gauntlet.
# The built-in detectors apply; the allowlist carves out intentional fake values.

[extend]
useDefault = true

[allowlist]
description = "OpenGate-wide allowlist: test fixtures, example placeholders, golden files."

# Paths that are documentation, example templates, or deliberate negative fixtures.
paths = [
  # Example files hold placeholder-shaped strings that detectors are meant to flag.
  '''(^|/)\.env\.example$''',
  '''(^|/)terraform\.tfvars\.example$''',
  '''(^|/)backend\.tfbackend\.example$''',

  # Golden fixtures hold msgpack payloads whose high entropy shape-matches generic detectors.
  '''(^|/)testdata/golden/.*''',

  # Deliberate-leak canary for the scanner's own test; its token is a documented fake.
  '''(^|/)deploy/tests/fixtures/leaked-secret\.txt$''',

  # Test files feed mock tokens, fake PEM blocks and synthetic API keys to production code.
  '''(^|/)[^/]+_test\.go$''',
  '''(^|/)[^/]+\.test\.(ts|tsx|js|jsx)$''',
  '''(^|/)[^/]+\.spec\.(ts|tsx|js|jsx)$''',
  # Rust integration tests and benches carry synthetic JWTs, API keys and connection strings.
  '''(^|/)benches/[^/]+\.rs$''',
  '''(^|/)tests/[^/]+_test\.rs$''',

  # Lockfile checksum hashes look like high-entropy secrets to generic detectors.
  '''(^|/)Cargo\.lock$''',
  '''(^|/)go\.sum$''',
  '''(^|/)package-lock\.json$''',
  '''(^|/)agent/.terraform.lock\.hcl$''',
  '''(^|/)deploy/terraform/(modules/[^/]+/)?\.terraform\.lock\.hcl$''',
]

# Path-independent carve-outs; each pattern is anchored because the gate trusts it.
regexes = [
  # Dummy OCIDs with the literal aaaaaaaa prefix used in tftest mock_provider blocks.
  '''ocid1\.[a-z]+\.oc1\.\.aaaaaaaa[a-z0-9]{20,80}''',
  # Placeholder values (`dummy`, `ci-dummy`, `e2e-test-password`) in compose config smoke tests.
  '''(JWT_SECRET|AMT_PASS|VAPID_CONTACT|POSTGRES_PASSWORD|STAGING_JWT_SECRET|STAGING_POSTGRES_PASSWORD)\s*=\s*(["']?)(dummy|ci-dummy|e2e-test-password)\b''',
]

# Per-rule allowlists for known false-positive sources.
[[rules]]
id = "generic-api-key"
[rules.allowlist]
regexes = [
  # Tftest fake fingerprints are hash-shaped and carry no credential.
  '''fingerprint\s*=\s*"([0-9a-f]{2}:){15}[0-9a-f]{2}"''',
]
