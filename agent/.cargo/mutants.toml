# cargo-mutants configuration for the agent workspace.
#
# Run `make mutate-rust` from the repo root, or `cargo mutants --package <crate>`
# from `agent/` with the env var `OPENGATE_GOLDEN_DIR=<repo>/testdata/golden`
# set so golden file tests resolve their fixtures inside the temp tree.
#
# cargo-mutants runs the mutated package's whole test suite once per mutant, so
# the suite's slowest test is paid by every mutant in its package. In
# mesh-agent-core that is the reach measurement in `tests/reach_test.rs`, which
# drives three stores to eviction through the production write path and takes
# ~25 seconds — roughly 90% of the package's test time, multiplied by its ~1400
# mutants. Its assertions are about storage density, not about code the mutation
# score tracks, and the behavior it touches is covered by `ml_store_test`, so it
# is skipped here and runs at full strength under a plain `cargo test`.
# Build with the workspace's `mutants` profile (agent/Cargo.toml): the same
# `test` build without debug info, which nothing here reads and which dominates
# the per-mutant rebuild.
profile = "mutants"

additional_cargo_test_args = [
    "--",
    "--skip",
    "the_minute_tier_reaches_back_far_enough_to_be_worth_scanning",
]
#
# exclude_globs carves out genuinely-untestable code:
#   * platform shims (Wayland/X11 bridges with no in-tree harness)
#   * the agent binary entry point (`mesh-agent/src/main.rs`) — async wiring
#     and process lifecycle exercised only by E2E
#   * SELinux restorecon match guards in `update.rs` — depend on a privileged
#     subprocess (system integration, not unit-testable)
#   * WebRTC peer connection (`mesh-agent-core/src/webrtc.rs`) — RTCPeerConnection
#     / ICE agent / data-channel callback wiring; webrtc-rs only exercises this
#     against a live STUN/network stack. The web side carves out the same class
#     of code in `use-remote-desktop.ts` and `use-terminal.ts`, where the logic
#     runs only against a real DOM (see `web/stryker.config.json`).

#   * WebRTC handler (`mesh-agent-core/src/session/handlers/webrtc.rs`) owns the
#     SwitchToWebRTC offer/answer + IceCandidate forwarding logic. It is the same
#     live-STUN/network-stack class as `webrtc.rs` above: `handle_offer` needs a
#     valid SDP offer + ICE gathering, and `handle_candidate`'s peer-present path
#     needs a remote description set (only `handle_offer` does that). The
#     no-peer branches are unit-tested (webrtc_handler_test.rs) for regression;
#     mutation tracking is excluded for the same reason webrtc.rs is.

exclude_globs = [
    "crates/platform-linux/**",
    "crates/mesh-agent/src/main.rs",
    "crates/mesh-agent-core/src/webrtc.rs",
    "crates/mesh-agent-core/src/session/handlers/webrtc.rs",
]

# Skip `restore_selinux_context` — the only mutants here are guards on
# `restorecon` exit status / error kinds, which require a real privileged
# subprocess to test. Verified manually on Fedora during the migration.
exclude_re = [
    "restore_selinux_context",
]

# Equivalent mutant, deferred — NOT excluded (no per-match-arm exclusion
# exists): the `FileUploadRequest` arm in session/handler.rs dispatches to
# FileHandler::handle_upload, which today only logs "not yet implemented".
# Deleting the arm is observationally identical to the `_ => debug!`
# fallthrough, so its match-arm-deletion mutant cannot be killed until upload
# gains an observable effect (an ack frame). The companion SwitchToWebRTC /
# IceCandidate arm mutants ARE killed: those arms route through the
# WebRtcDispatch seam, which a recording mock observes in session/handler.rs
# tests (the live delegation lives in the excluded handlers/webrtc.rs).
