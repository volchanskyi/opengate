# cargo-mutants configuration for the agent workspace, run by `make mutate-rust`.
# OPENGATE_GOLDEN_DIR=<repo>/testdata/golden resolves golden fixtures inside the temp tree.

# The `mutants` profile is the `test` build without debug info, which dominates the rebuild.
# The reach measurement is skipped below; it costs ~25 s a mutant.
profile = "mutants"

additional_cargo_test_args = [
    "--",
    "--skip",
    "the_minute_tier_reaches_back_far_enough_to_be_worth_scanning",
]

# exclude_globs holds code with no in-tree harness: Wayland/X11 bridges, E2E-only process wiring
# and live-ICE peer code; and code no customer runs: the substrates behind the `bakeoff` feature.
exclude_globs = [
    "crates/platform-linux/**",
    "crates/mesh-agent/src/main.rs",
    "crates/mesh-agent-core/src/webrtc.rs",
    "crates/mesh-agent-core/src/session/handlers/webrtc.rs",
    "crates/edge-tsdb/src/append_only.rs",
    "crates/edge-tsdb/src/baseline.rs",
    "crates/edge-tsdb/src/crc.rs",
    "crates/edge-tsdb/src/fault.rs",
    "crates/edge-tsdb/src/frame.rs",
    "crates/edge-tsdb/src/redb_backend.rs",
    "crates/edge-tsdb/src/redb_compact.rs",
    "crates/edge-tsdb/src/redb_store.rs",
    "crates/edge-tsdb/src/substrate.rs",
]

# exclude_re holds functions that cross a privileged `restorecon`, the host journal or /proc,
# so they answer with whatever the host holds.
exclude_re = [
    "restore_selinux_context",
    "collect_host_logs",
    "list_units",
    "run_journalctl",
    "collect_journald",
    "list_journald_units",
    "poll_once",
    "collect_ports",
    "build_inode_proc_map",
]

# The `FileUploadRequest` arm in session/handler.rs only logs, so deleting it matches the
# `_ => debug!` fallthrough and its mutant survives until upload has an observable effect.

# compact.rs `bytes.len() < 21` and `< 8` equal `<=`: both fail with CorruptBlock.

# compact.rs `s.value.abs() < INT_SAFE` and `fixed.len() < best.len()` give equal output at `<=`.

# compact.rs `b | 0x80` equals `b ^ 0x80` in `put_uvarint` because `b` is masked to seven bits.

# store/mod.rs `format_version` equals the constant `1`, and `v < CURRENT_FORMAT` equals `<=`.

# store/mod.rs the second `||` in `commit`'s retain guard sees equal terms after `write_all`.

# store/blocks.rs `newv.len() < val.len()` equals `<=`: an equal-length rewrite changes no read.

# store/blocks.rs `decode_tier_deflate` mutants sit on the `cold-deflate`-off arm the build skips.

# `attempt - 1` read as `attempt + 1` or `attempt / 1` in `reconnect_with_backoff` only shifts a
# delay drawn from `rand::rng()`, and the two distributions overlap too much to assert on.
