[workspace]
resolver = "2"
members = ["crates/*"]

[workspace.package]
edition = "2021"
license = "Apache-2.0"
publish = false  # internal workspace crates; ship via GitHub Releases, not crates.io

[workspace.lints.clippy]
let_underscore_must_use = "warn"
let_underscore_future = "warn"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
rmp-serde = "1"
bytes = "1"
thiserror = "2"
uuid = { version = "1", features = ["v4", "serde"] }
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
anyhow = "1"
rand = "0.10"
# Pure-Rust DEFLATE (miniz_oxide). The alert-evidence codec on the wire and the
# edge TSDB cold tier share it; Go reads both with stdlib compress/flate.
flate2 = "1"
async-trait = "0.1"

quinn = "0.11.9"
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
rcgen = "0.14"
rustls-pemfile = "2"
# Reads the device number, dates and issuer a certificate carries; rtc already builds this version.
x509-parser = "0.18"

tokio-tungstenite = { version = "0.30", features = ["rustls-tls-webpki-roots"] }
futures-util = "0.3"
# TCP_NOTSENT_LOWAT on the relay socket is behind the "all" feature.
socket2 = { version = "0.6", features = ["all"] }
# The relay socket's unacknowledged and delivered bytes are read through SIOCOUTQ and TCP_INFO.
libc = "0.2"
portable-pty = "0.9"
url = "2"
webrtc = "0.21"
# webrtc keeps rtc private; its SCTP message-size setting is named from here, at the same version.
rtc = "0.21"

gethostname = "1.1"
sysinfo = "0.40"
ed25519-dalek = { version = "2", features = ["std"] }
sha2 = "0.11"
hex = "0.4"
reqwest = { version = "0.12", default-features = false, features = ["rustls-tls", "json"] }
serde_json = "1"

semver = "1"
# JPEG is the only format the desktop session encodes, so the other codecs —
# and the dependency trees behind them — stay out of the agent.
image = { version = "0.25", default-features = false, features = ["jpeg"] }
tracing-appender = "0.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Dev dependencies
proptest = "1"
tempfile = "3"
mockito = "1"
criterion = { version = "0.8", default-features = false, features = ["cargo_bench_support"] }

# rtc 0.21 with SCTP's time-based loss detection and fair queueing, until a release carries them;
# every rtc crate comes from the one commit, so the build holds one copy of each.
[patch.crates-io]
rtc = { git = "https://github.com/volchanskyi/rtc", rev = "bb228c7d4d4aa792f01147da55f4316aee76e031" }
rtc-crypto = { git = "https://github.com/volchanskyi/rtc", rev = "bb228c7d4d4aa792f01147da55f4316aee76e031" }
rtc-datachannel = { git = "https://github.com/volchanskyi/rtc", rev = "bb228c7d4d4aa792f01147da55f4316aee76e031" }
rtc-dtls = { git = "https://github.com/volchanskyi/rtc", rev = "bb228c7d4d4aa792f01147da55f4316aee76e031" }
rtc-ice = { git = "https://github.com/volchanskyi/rtc", rev = "bb228c7d4d4aa792f01147da55f4316aee76e031" }
rtc-interceptor = { git = "https://github.com/volchanskyi/rtc", rev = "bb228c7d4d4aa792f01147da55f4316aee76e031" }
rtc-mdns = { git = "https://github.com/volchanskyi/rtc", rev = "bb228c7d4d4aa792f01147da55f4316aee76e031" }
rtc-media = { git = "https://github.com/volchanskyi/rtc", rev = "bb228c7d4d4aa792f01147da55f4316aee76e031" }
rtc-rtcp = { git = "https://github.com/volchanskyi/rtc", rev = "bb228c7d4d4aa792f01147da55f4316aee76e031" }
rtc-rtp = { git = "https://github.com/volchanskyi/rtc", rev = "bb228c7d4d4aa792f01147da55f4316aee76e031" }
rtc-sctp = { git = "https://github.com/volchanskyi/rtc", rev = "bb228c7d4d4aa792f01147da55f4316aee76e031" }
rtc-sdp = { git = "https://github.com/volchanskyi/rtc", rev = "bb228c7d4d4aa792f01147da55f4316aee76e031" }
rtc-shared = { git = "https://github.com/volchanskyi/rtc", rev = "bb228c7d4d4aa792f01147da55f4316aee76e031" }
rtc-srtp = { git = "https://github.com/volchanskyi/rtc", rev = "bb228c7d4d4aa792f01147da55f4316aee76e031" }
rtc-stun = { git = "https://github.com/volchanskyi/rtc", rev = "bb228c7d4d4aa792f01147da55f4316aee76e031" }
rtc-turn = { git = "https://github.com/volchanskyi/rtc", rev = "bb228c7d4d4aa792f01147da55f4316aee76e031" }

# Dropping debug info shortens the per-mutant rebuild; .cargo/mutants.toml selects this profile.
[profile.mutants]
inherits = "test"
debug = false
