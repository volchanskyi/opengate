[package]
name = "edge-tsdb"
version = "0.1.0"
edition.workspace = true
license.workspace = true
publish.workspace = true

[features]
default = ["bakeoff", "cold-deflate"]
# Bake-off substrates, fault harness and measurement corpus helpers.
bakeoff = []
# Cold-tier DEFLATE of sealed T1/T2 blocks through pure-Rust flate2.
cold-deflate = ["dep:flate2"]

[dependencies]
thiserror.workspace = true
redb = "4"
flate2 = { workspace = true, optional = true }

[dev-dependencies]
tempfile.workspace = true
proptest.workspace = true
criterion = { workspace = true }

[[bench]]
name = "tsdb_bench"
harness = false

[lints]
workspace = true
