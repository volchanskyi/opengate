# A standalone workspace keeps libFuzzer's nightly-only build out of the stable agent workspace.
[package]
name = "mesh-protocol-fuzz"
version = "0.0.0"
publish = false
edition = "2021"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"

[dependencies.mesh-protocol]
path = "../crates/mesh-protocol"

[[bin]]
name = "decode"
path = "fuzz_targets/decode.rs"
test = false
doc = false
bench = false

[workspace]
