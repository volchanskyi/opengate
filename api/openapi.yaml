openapi: "3.0.3"
info:
  title: OpenGate API
  version: "1.0.0"
  description: Remote device management and relay API

servers:
  - url: /

security: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: string

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
        display_name:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1

    TokenResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string

    ClientErrorReport:
      type: object
      required: [message]
      description: >-
        Browser-side error report for server-side log ingestion. Must never
        contain tokens, credentials, or PII; the stack is truncated client-side.
      properties:
        message:
          type: string
          maxLength: 1000
        source:
          type: string
          maxLength: 200
        stack:
          type: string
          maxLength: 500
        url:
          type: string
          maxLength: 500
        user_agent:
          type: string
          maxLength: 300

    User:
      type: object
      required: [id, email, display_name, is_admin, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string
        is_admin:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Organization:
      type: object
      required: [id, name, created_at, updated_at]
      description: >-
        One customer inside a tenant. The tenant is the boundary the database
        enforces; an organization is who the work is for, and every device
        belongs to exactly one. Names are unique within a tenant.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        archived_at:
          type: string
          format: date-time
          description: >-
            Set when the customer is retired. An archived organization keeps its
            devices and its history and is simply out of the working set.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateOrganizationRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string

    UpdateOrganizationRequest:
      type: object
      description: >-
        A rename, an archive/restore, or both. An omitted field is left alone.
      properties:
        name:
          type: string
        archived:
          type: boolean

    MoveDeviceOrganizationRequest:
      type: object
      required: [organization_id]
      properties:
        organization_id:
          type: string
          format: uuid

    Device:
      type: object
      required: [id, organization_id, site_id, hostname, os, agent_version, capabilities, status, last_seen, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
          description: >-
            The customer this device belongs to. Never absent: a device written
            without one named takes its tenant's own organization.
        site_id:
          type: string
          format: uuid
        hostname:
          type: string
        os:
          type: string
        os_display:
          type: string
        agent_version:
          type: string
        capabilities:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [online, offline, connecting]
        last_seen:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        anomaly_rate:
          type: number
          description: >-
            Latest edge-node anomaly rate in [0,1] from telemetry, for the fleet
            health badge. Omitted when the device has no recent sample.
        maintenance_on:
          type: boolean
          description: >-
            Whether the device is in maintenance mode: a server-authoritative
            suppression state an administrator toggles while doing disruptive
            host work. Telemetry and alerting are suppressed; remote management
            stays available. Defaults to false (Active).
        maintenance_since:
          type: string
          format: date-time
          description: >-
            When the device entered maintenance. Present only while
            maintenance_on is true.
        maintenance_by:
          type: string
          format: uuid
          description: >-
            Id of the user who set the current maintenance state. Present only
            while maintenance_on is true.
        maintenance_reason:
          type: string
          description: >-
            Operator-supplied reason for the current maintenance window. Present
            only while maintenance_on is true.
        amt:
          $ref: "#/components/schemas/DeviceAMT"

    DeviceAMT:
      type: object
      required: [available]
      description: >-
        The device's Intel AMT property, read alongside the device row. Omitted
        entirely when the device neither supports AMT nor has an AMT connection.
      properties:
        available:
          type: boolean
          description: >-
            Whether the hardware supports Intel AMT, as reported by the agent
            from the host's Management Engine interface. Independent of
            connection state, so the AMT badge never flickers.
        status:
          type: string
          enum: [online, offline]
          description: >-
            CIRA connection state. Absent until an AMT connection has been linked
            to this device.
        uuid:
          type: string
          format: uuid
          description: >-
            The AMT device's CIRA identity, which power commands address. Absent
            until an AMT connection has been linked to this device.

    SetMaintenanceRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: Desired maintenance state — true to suppress, false to resume.
        reason:
          type: string
          description: Optional operator note recorded while entering maintenance.

    DeviceSummary:
      type: object
      description: >-
        Fixed-size fleet rollup for the dashboard tiles. Always describes the
        caller's own tenant, administrators included, so the status counts
        and the health bands cover one device set.
      required: [total, online, offline, maintenance, health]
      properties:
        total:
          type: integer
          description: Devices in the tenant.
        online:
          type: integer
          description: Devices with a live agent connection.
        offline:
          type: integer
          description: total − online; a connecting device counts as offline.
        maintenance:
          type: integer
          description: Devices currently in maintenance mode.
        health:
          $ref: "#/components/schemas/FleetHealthCounts"

    FleetHealthCounts:
      type: object
      description: >-
        Devices per edge-health band, classified by the latest node anomaly
        rate. unknown is total minus the three measured bands — the devices that
        reported no rate in the badge lookback window.
      required: [anomalous, watch, healthy, unknown]
      properties:
        anomalous:
          type: integer
        watch:
          type: integer
        healthy:
          type: integer
        unknown:
          type: integer

    PurgeJob:
      type: object
      description: >-
        Progress of a right-to-be-forgotten telemetry purge. "Logical" states
        mean ingest is blocked and the subject is no longer queryable; physical
        VictoriaMetrics compaction and offline-edge erasure complete later.
      required: [id, tenant_id, scope, state, vm_deleted, object_deleted, pg_deleted, verified, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        device_id:
          type: string
          format: uuid
          description: Absent for a tenant-wide purge.
        scope:
          type: string
          enum: [device, tenant]
        state:
          type: string
          enum:
            - requested
            - central-logical-complete
            - central-physical-compaction-pending
            - object-delete-pending
            - edge-erase-pending
            - complete
        vm_deleted:
          type: boolean
        object_deleted:
          type: boolean
        pg_deleted:
          type: boolean
        verified:
          type: boolean
        last_error:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time

    RestartDeviceRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 512
          description: >-
            Why the agent is being restarted, recorded in the audit trail and
            forwarded to the agent. Omit the field to use the server default; a
            supplied reason must carry at least one non-whitespace character.

    MetricSeries:
      type: object
      required: [name, avg, min_max_source]
      properties:
        name:
          type: string
          description: Numeric dimension name (e.g. cpu.util). Never a process basename or cmdline.
        avg:
          type: array
          items:
            type: number
            format: double
            nullable: true
          description: Central average per bucket, aligned 1:1 with the response t array; null for a bucket with no sample.
        min:
          type: array
          items:
            type: number
            format: double
            nullable: true
          description: Lower band per bucket, aligned with t. Present only when min_max_source is not none.
        max:
          type: array
          items:
            type: number
            format: double
            nullable: true
          description: Upper band per bucket, aligned with t. Present only when min_max_source is not none.
        min_max_source:
          type: string
          enum: [local, avg_of_60s, none]
          description: >-
            Provenance of the band. local = true host min/max from an on-demand
            local-history pull; avg_of_60s = min/max across the 60 s averages in
            the bucket (not host extrema); none = avg line only, no band.

    MetricRangeResponse:
      type: object
      required: [t, series, downsampled, bucket_s]
      properties:
        t:
          type: array
          items:
            type: integer
            format: int64
          description: >-
            Bucket timestamps in unix seconds, ascending, evenly spaced by
            bucket_s. Aligns 1:1 with each series. The axis comes from the
            requested window, not from what the store holds: it always carries
            (to - from) / bucket_s buckets, so a window over a device with
            little data renders that window with nulls rather than collapsing to
            the few buckets that had a value. The end instant is exclusive.
        series:
          type: array
          items:
            $ref: "#/components/schemas/MetricSeries"
        downsampled:
          type: boolean
          description: True when the server collapsed raw samples into buckets to honor max_points.
        bucket_s:
          type: integer
          description: Bucket width in seconds (the query step) chosen to keep points within max_points.

    HistoryPoint:
      type: object
      required: [ts, value]
      properties:
        ts:
          type: integer
          format: int64
          description: Sample timestamp in unix seconds.
        value:
          type: number
          format: double
          description: The full-resolution sample value at ts.

    DeviceHistoryResponse:
      type: object
      required: [dim, points, truncated]
      properties:
        dim:
          type: string
          description: The dimension this history slice is for.
        points:
          type: array
          items:
            $ref: "#/components/schemas/HistoryPoint"
          description: Full-resolution points in ascending timestamp order.
        truncated:
          type: boolean
          description: True when the window held more than max_points samples and the response was capped.

    DeviceHardware:
      type: object
      required: [device_id, cpu_model, cpu_cores, ram_total_mb, disk_total_mb, disk_free_mb, network_interfaces, updated_at]
      properties:
        device_id:
          type: string
          format: uuid
        cpu_model:
          type: string
        cpu_cores:
          type: integer
        ram_total_mb:
          type: integer
          format: int64
        disk_total_mb:
          type: integer
          format: int64
        disk_free_mb:
          type: integer
          format: int64
        network_interfaces:
          type: array
          items:
            $ref: "#/components/schemas/NetworkInterfaceInfo"
        updated_at:
          type: string
          format: date-time
        amt_available:
          type: boolean
          description: Whether the host exposes an Intel Management Engine interface.
        amt_version:
          type: string
          description: ME/AMT firmware version read by the agent over the MEI interface.
        amt_model:
          type: string
          description: Machine model read from the device over its AMT connection.
        amt_firmware:
          type: string
          description: AMT firmware version read from the device over its AMT connection.

    NetworkInterfaceInfo:
      type: object
      required: [name, mac, ipv4, ipv6]
      properties:
        name:
          type: string
        mac:
          type: string
        ipv4:
          type: array
          items:
            type: string
        ipv6:
          type: array
          items:
            type: string

    DeviceInventory:
      type: object
      required: [device_id, items]
      properties:
        device_id:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: "#/components/schemas/InventoryItem"

    InventoryItem:
      type: object
      required: [kind, name, version, port, proto, state, runtime, image, first_seen, last_seen]
      properties:
        kind:
          type: string
          enum: [port, service, db_engine, container, package]
        name:
          type: string
          description: >-
            Primary label — owning process (port), unit (service), engine
            (db_engine), or the name (container / package).
        version:
          type: string
        port:
          type: integer
          description: Listening or engine port; 0 when not applicable to the kind.
        proto:
          type: string
        state:
          type: string
        runtime:
          type: string
        image:
          type: string
        first_seen:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time

    DeviceLogsResponse:
      type: object
      required: [entries, total, has_more]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/DeviceLogEntry"
        total:
          type: integer
        has_more:
          type: boolean
        available_units:
          type: array
          description: >-
            Distinct emitting units the host source offers for the unit filter
            dropdown (systemd units). Empty for the agent's own files and where
            no host source exists.
          items:
            type: string

    DeviceLogEntry:
      type: object
      required: [timestamp, level, target, message]
      properties:
        timestamp:
          type: string
        level:
          type: string
        target:
          type: string
        message:
          type: string

    UpdateDeviceRequest:
      type: object
      properties:
        site_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            Destination site for the device, which must belong to the device's
            own customer. The all-zeros UUID unfiles the device, leaving it in
            its customer with no site.

    CreateSiteRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        organization_id:
          type: string
          format: uuid
          description: >-
            The customer this site belongs to. Omitted, the site goes under the
            tenant's own customer — the same no-orphan rule a device write
            follows.

    Site:
      type: object
      description: >-
        A location or department inside one customer — the narrowest level
        above the machine itself. A site is a targeting level, not an access
        boundary: the tenant scopes visibility, so every member of a tenant
        sees every site in it.
      required: [id, organization_id, name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Permissions:
      type: object
      properties:
        desktop:
          type: boolean
        terminal:
          type: boolean
        file_read:
          type: boolean
        file_write:
          type: boolean
        input:
          type: boolean

    CreateSessionRequest:
      type: object
      required: [device_id]
      properties:
        device_id:
          type: string
          format: uuid
        permissions:
          $ref: "#/components/schemas/Permissions"

    CreateSessionResponse:
      type: object
      required: [token, relay_url]
      properties:
        token:
          type: string
        relay_url:
          type: string
        ice_servers:
          type: array
          items:
            $ref: "#/components/schemas/ICEServer"

    ICEServer:
      type: object
      required: [urls]
      properties:
        urls:
          type: array
          items:
            type: string
        username:
          type: string
        credential:
          type: string

    AgentSession:
      type: object
      required: [token, device_id, user_id, created_at]
      properties:
        token:
          type: string
        device_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time

    WebPushSubscribeRequest:
      type: object
      required: [endpoint, p256dh, auth]
      properties:
        endpoint:
          type: string
        p256dh:
          type: string
        auth:
          type: string

    WebPushUnsubscribeRequest:
      type: object
      required: [endpoint]
      properties:
        endpoint:
          type: string

    VapidKeyResponse:
      type: object
      required: [public_key]
      properties:
        public_key:
          type: string

    AuditEvent:
      type: object
      required: [id, user_id, action, target, details, created_at]
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: string
          format: uuid
        action:
          type: string
        target:
          type: string
        details:
          type: string
        created_at:
          type: string
          format: date-time

    UpdateUserRequest:
      type: object
      properties:
        is_admin:
          type: boolean
        display_name:
          type: string

    AMTPowerRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [power_on, power_cycle, soft_off, hard_reset]

    AgentManifest:
      type: object
      required: [version, os, arch, url, sha256, signature, created_at]
      properties:
        version:
          type: string
        os:
          type: string
        arch:
          type: string
        url:
          type: string
        sha256:
          type: string
        signature:
          type: string
        created_at:
          type: string
          format: date-time

    PublishUpdateRequest:
      type: object
      required: [version, os, arch, url, sha256]
      properties:
        version:
          type: string
        os:
          type: string
        arch:
          type: string
        url:
          type: string
        sha256:
          type: string

    PushUpdateRequest:
      type: object
      required: [version, os, arch]
      properties:
        version:
          type: string
        os:
          type: string
        arch:
          type: string
        device_ids:
          type: array
          items:
            type: string
            format: uuid

    PushUpdateResponse:
      type: object
      required: [pushed_count]
      properties:
        pushed_count:
          type: integer

    DeviceUpdate:
      type: object
      required: [id, device_id, version, status, error, pushed_at]
      properties:
        id:
          type: integer
          format: int64
        device_id:
          type: string
          format: uuid
        version:
          type: string
        status:
          type: string
          enum: [pending, success, failed]
        error:
          type: string
        pushed_at:
          type: string
          format: date-time
        acked_at:
          type: string
          format: date-time

    EnrollmentToken:
      type: object
      required: [id, token, label, created_by, max_uses, use_count, expires_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        token:
          type: string
        label:
          type: string
        created_by:
          type: string
          format: uuid
        max_uses:
          type: integer
        use_count:
          type: integer
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    CreateEnrollmentTokenRequest:
      type: object
      properties:
        label:
          type: string
          default: ""
        max_uses:
          type: integer
          default: 0
        expires_in_hours:
          type: integer
          default: 24

    EnrollRequest:
      type: object
      required: [csr_pem]
      properties:
        csr_pem:
          type: string
          description: PEM-encoded PKCS#10 certificate signing request

    EnrollResponse:
      type: object
      required: [ca_pem, server_addr, server_domain]
      properties:
        ca_pem:
          type: string
        cert_pem:
          type: string
          description: PEM-encoded agent certificate signed by the server CA
        server_addr:
          type: string
        server_domain:
          type: string
        update_signing_key:
          type: string
          description: Hex-encoded Ed25519 public key for verifying update signatures

    CACertResponse:
      type: object
      required: [pem]
      properties:
        pem:
          type: string

    SecurityGroup:
      type: object
      required: [id, name, description, is_system, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        is_system:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SecurityGroupWithMembers:
      type: object
      required: [id, name, description, is_system, created_at, updated_at, members]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        is_system:
          type: boolean
        members:
          type: array
          items:
            $ref: "#/components/schemas/User"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateSecurityGroupRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
          default: ""

    AddSecurityGroupMemberRequest:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
          format: uuid

    IncidentSeverity:
      type: string
      description: How bad an incident or one of its alerts is.
      enum: [info, warning, critical]

    IncidentStatus:
      type: string
      description: >-
        Where an incident stands. An incident in `new` is the triage queue,
        which is why there is no separate promotion state.
      enum: [new, acknowledged, investigating, resolved]

    IncidentScope:
      type: string
      description: >-
        How wide an incident is — the rung its grouping key names. The customer
        is the broadest there is: folding across customers would put two
        estates' unrelated events in one room with no correct assignee.
      enum: [device, site, organization]

    IncidentCauseCode:
      type: string
      description: >-
        A person's answer for why an incident ended, required when resolving
        one. `false_positive` is the channel that says which curated rule needs
        its threshold moved.
      enum:
        [
          resolved_self,
          fixed_by_tech,
          hardware_fault,
          expected_load,
          false_positive,
          duplicate,
          wont_fix,
        ]

    Incident:
      type: object
      description: One room a customer's alerts are investigated in.
      required:
        [
          id,
          organization_id,
          rule_id,
          scope,
          scope_key,
          severity,
          status,
          opened_at,
          first_seen,
          last_seen,
          occurrences,
          device_count,
        ]
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        rule_id:
          type: string
          description: >-
            The rule that raised it, never the rule version — upgrading a rule
            while an incident is open must not fork the room somebody is
            working in.
        scope:
          $ref: "#/components/schemas/IncidentScope"
        scope_key:
          type: string
          format: uuid
          description: What the incident is about at that rung.
        severity:
          $ref: "#/components/schemas/IncidentSeverity"
        status:
          $ref: "#/components/schemas/IncidentStatus"
        assignee_id:
          type: string
          format: uuid
          nullable: true
          description: Who is working it, absent when nobody has taken it.
        cause_code:
          allOf:
            - $ref: "#/components/schemas/IncidentCauseCode"
          nullable: true
          description: Absent while open, and when the system closed it.
        opened_at:
          type: string
          format: date-time
        first_seen:
          type: string
          format: date-time
          description: >-
            Event time, not receipt time — a retroactive finding belongs where
            it happened.
        last_seen:
          type: string
          format: date-time
        resolved_at:
          type: string
          format: date-time
          nullable: true
        occurrences:
          type: integer
          description: How many alerts have folded in.
        device_count:
          type: integer
          description: Across how many machines.

    IncidentPage:
      type: object
      description: One page of the triage queue, and where the next one starts.
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Incident"
        next_cursor:
          type: string
          description: >-
            Pass as `cursor` to read on. Absent when the page reached the end of
            the queue. The queue is paged by position rather than by offset,
            because an offset over a queue that is being written to skips rows
            silently.

    IncidentAlert:
      type: object
      description: >-
        One alert as its incident lists it. The evidence blob is deliberately
        not here — it is tens of kilobytes per alert and an incident holds
        hundreds — so this says what evidence exists and what fetching it costs.
      required:
        [
          id,
          device_id,
          rule_id,
          rule_version,
          severity,
          observed_at,
          received_at,
          window_start,
          window_end,
          backfilled,
          evidence_bytes,
        ]
      properties:
        id:
          type: string
          format: uuid
        device_id:
          type: string
          format: uuid
        rule_id:
          type: string
        rule_version:
          type: integer
        severity:
          $ref: "#/components/schemas/IncidentSeverity"
        metric:
          type: string
          description: Empty for a rule that fires on an event rather than a reading.
        value:
          type: number
          format: double
          nullable: true
        window_start:
          type: string
          format: date-time
        window_end:
          type: string
          format: date-time
        observed_at:
          type: string
          format: date-time
        received_at:
          type: string
          format: date-time
        backfilled:
          type: boolean
          description: A finding a retroactive scan produced over local history.
        evidence_codec:
          type: string
          description: How the evidence is compressed, empty when there is none.
        evidence_bytes:
          type: integer
          description: Compressed weight of the evidence, zero when there is none.

    IncidentEvent:
      type: object
      description: >-
        One line of an incident's history. The incident's own fields say where
        it stands; these say how it got there, which is what a handover between
        two technicians reads.
      required: [id, at, kind, body]
      properties:
        id:
          type: string
          format: uuid
        at:
          type: string
          format: date-time
        kind:
          type: string
          enum:
            [
              alert_folded,
              status_change,
              assignment,
              comment,
              device_offline,
              resolution,
            ]
        actor_id:
          type: string
          format: uuid
          nullable: true
          description: Who did it, absent when the system did.
        body:
          type: object
          additionalProperties: true
          description: What the line says, in the shape its kind defines.

    IncidentDetail:
      type: object
      description: The whole of one incident, as somebody opening it sees it.
      required:
        [incident, alerts, alerts_total, events, events_total]
      properties:
        incident:
          $ref: "#/components/schemas/Incident"
        alerts:
          type: array
          items:
            $ref: "#/components/schemas/IncidentAlert"
          description: The most recent alerts, bounded.
        alerts_total:
          type: integer
          description: How many there are altogether, so a bounded page says what it is a page of.
        events:
          type: array
          items:
            $ref: "#/components/schemas/IncidentEvent"
          description: The history, in the order it happened.
        events_total:
          type: integer

    SetIncidentStatusRequest:
      type: object
      required: [status]
      properties:
        status:
          $ref: "#/components/schemas/IncidentStatus"
        cause_code:
          allOf:
            - $ref: "#/components/schemas/IncidentCauseCode"
          description: >-
            Required when resolving, refused otherwise. A resolution that skips
            it spends the feedback the rule pack is tuned from.

    SetIncidentAssigneeRequest:
      type: object
      properties:
        assignee_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            Who takes it. Null hands it back to the queue, which is the move a
            technician going off shift makes.

    AddIncidentCommentRequest:
      type: object
      required: [body]
      properties:
        body:
          type: string
          minLength: 1
          maxLength: 4096

    EvidencePoint:
      type: object
      required: [ts, value]
      properties:
        ts:
          type: integer
          format: int64
        value:
          type: number
          format: double

    EvidenceRankedDim:
      type: object
      description: One dimension the machine's own correlation ranked, and how badly it broke pattern.
      required: [dim, score]
      properties:
        dim:
          type: string
        score:
          type: number
          format: double

    EvidenceSeries:
      type: object
      description: >-
        One dimension's readings either side of the event, at the resolution
        only the machine holds.
      required: [dim, points]
      properties:
        dim:
          type: string
        points:
          type: array
          items:
            $ref: "#/components/schemas/EvidencePoint"

    EvidenceProcess:
      type: object
      description: One process at the event instant.
      required: [rank, basename, pid, cpu, mem]
      properties:
        rank:
          type: integer
        basename:
          type: string
        pid:
          type: integer
        cpu:
          type: number
          format: double
        mem:
          type: number
          format: double

    AlertEvidence:
      type: object
      description: >-
        Everything the machine knew about why an alert fired, frozen at write
        time. Nothing can be fetched from the machine afterwards, so what is not
        here about an event is not recorded anywhere.
      required: [ranked, series, processes, log_samples, truncated]
      properties:
        ranked:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceRankedDim"
        series:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceSeries"
        processes:
          type: array
          items:
            $ref: "#/components/schemas/EvidenceProcess"
        log_samples:
          type: array
          items:
            type: string
          description: Host log lines, redacted on the machine before they were sent.
        truncated:
          type: boolean
          description: >-
            Whether the size cap cost this evidence anything, so "nothing was
            dropped" and "nobody checked" never look alike.

    RuleCoverage:
      type: object
      description: >-
        How much of a customer's estate one rule is actually watching. The four
        states always add up to the fleet — three of them would make a rule look
        like it was watching a smaller estate than it is.
      required: [active, throttled, unsupported, unknown]
      properties:
        active:
          type: integer
          description: Machines evaluating the rule.
        throttled:
          type: integer
          description: Machines that stopped evaluating it because it cost more than its allowance.
        unsupported:
          type: integer
          description: Machines that cannot evaluate it at all — a standing hole in the monitoring.
        unknown:
          type: integer
          description: Machines that have reported nothing.

    RuleParameterBounds:
      type: object
      description: How far a customer may retune one parameter.
      required: [min, max, shipped]
      properties:
        min:
          type: number
          format: double
        max:
          type: number
          format: double
        shipped:
          type: number
          format: double
          description: The value the catalogue ships.

    Rule:
      type: object
      description: >-
        One curated rule as the fleet runs it. Definitions are compiled into the
        server and are not editable here — what a customer may change is the
        numbers each rule declares tunable, and whether it is rolled out.
      required:
        [
          id,
          version,
          summary,
          metric,
          comparator,
          threshold,
          group_by,
          group_window_secs,
          evidence,
          coverage_requires,
          tunable,
          rollout,
          coverage,
          noise,
        ]
      properties:
        id:
          type: string
        version:
          type: integer
        summary:
          type: string
          description: What the rule is for, in an operator's words.
        metric:
          type: string
        comparator:
          type: string
          enum: [gt, lt, gte, lte]
        threshold:
          type: number
          format: double
        sustain_secs:
          type: integer
        group_by:
          type: array
          items:
            type: string
        group_window_secs:
          type: integer
          description: How long firings on one key stay one incident, and the hold before an idle one resolves itself.
        evidence:
          type: array
          items:
            type: string
        coverage_requires:
          type: array
          items:
            type: string
          description: What a machine must be able to read for this rule to be evaluable on it.
        tunable:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/RuleParameterBounds"
        rollout:
          $ref: "#/components/schemas/RuleRollout"
        coverage:
          $ref: "#/components/schemas/RuleCoverage"
        noise:
          $ref: "#/components/schemas/RuleNoise"

    RuleNoiseLevel:
      type: string
      description: >-
        How a rule's recent count compares with its own usual rate. Relative to
        the rule rather than to a shared threshold, so a rule meant to be chatty
        does not sit permanently red; a rule with no history yet is unknown
        rather than alarming.
      enum: [unknown, quiet, usual, elevated, high]

    RuleNoise:
      type: object
      description: How much this rule has been raising lately, for the selected customer.
      required: [recent, baseline_per_hour, level]
      properties:
        recent:
          type: integer
          description: Alerts the rule raised in the last hour.
        baseline_per_hour:
          type: number
          format: double
          description: The rule's own usual hourly rate for this customer.
        level:
          $ref: "#/components/schemas/RuleNoiseLevel"

    RuleStage:
      type: string
      description: How far along a rollout is.
      enum: [off, canary, staged, full]

    RuleRollout:
      type: object
      description: How far a rule has reached across a customer's estate.
      required:
        [
          enabled,
          rollout_percent,
          kill,
          stage,
          canary_percent,
          staged_percent,
          canary_hold_secs,
          staged_hold_secs,
        ]
      properties:
        enabled:
          type: boolean
        canary_group:
          type: string
        rollout_percent:
          type: integer
        kill:
          type: boolean
          description: The switch that stops a rule without a deploy.
        stage:
          $ref: "#/components/schemas/RuleStage"
        canary_percent:
          type: integer
          description: The share of the estate the first stage reaches.
        staged_percent:
          type: integer
          description: The share of the estate the second stage reaches.
        canary_hold_secs:
          type: integer
          description: How long the first stage is held before it may advance.
        staged_hold_secs:
          type: integer
          description: How long the second stage is held before it may advance.

    RuleRolloutInput:
      type: object
      description: >-
        What an administrator may change about a rollout. There is deliberately
        nothing here for the automatic pull-back: it is the mitigation for a bad
        rule degrading an estate, so it is not configuration.
      required:
        [enabled, canary_percent, staged_percent, canary_hold_secs, staged_hold_secs]
      properties:
        enabled:
          type: boolean
        canary_percent:
          type: integer
        staged_percent:
          type: integer
        canary_hold_secs:
          type: integer
        staged_hold_secs:
          type: integer

    RuleBindingLevel:
      type: string
      description: The rung of the tenancy ladder a tuned value is filed on.
      enum: [device, site, organization, tenant]

    RuleBinding:
      type: object
      description: >-
        One tuned value, filed on a rung and optionally narrowed to the machines
        a label picks out. The narrower rung always wins; precedence only settles
        ties between two labels at one rung.
      required: [id, level, level_key, selector, precedence, params, updated_by]
      properties:
        id:
          type: string
          format: uuid
        level:
          $ref: "#/components/schemas/RuleBindingLevel"
        level_key:
          type: string
          format: uuid
          description: The machine, office or customer the value is filed against.
        selector:
          type: object
          additionalProperties:
            type: string
          description: The labels a machine must carry for this value to apply.
        precedence:
          type: integer
          description: Which of two labels at one rung wins. Higher takes it.
        params:
          type: object
          additionalProperties:
            type: number
            format: double
        updated_by:
          type: string

    RuleBindingInput:
      type: object
      description: A tuned value as an administrator states it.
      required: [level, level_key, params]
      properties:
        id:
          type: string
          format: uuid
          description: Omit to file a new value; name one to retune it.
        level:
          $ref: "#/components/schemas/RuleBindingLevel"
        level_key:
          type: string
          format: uuid
        selector:
          type: object
          additionalProperties:
            type: string
        precedence:
          type: integer
        params:
          type: object
          additionalProperties:
            type: number
            format: double

    RuleClamp:
      type: object
      description: >-
        A tuned value a new version of the rule no longer allows, moved to the
        nearest one it does. The rule keeps firing at the moved value; the move
        stays on the screen until an administrator acknowledges it.
      required:
        [id, binding_id, rule_id, rule_version, param, from_value, to_value, clamped_at]
      properties:
        id:
          type: string
          format: uuid
        binding_id:
          type: string
          format: uuid
        rule_id:
          type: string
        rule_version:
          type: integer
        param:
          type: string
        from_value:
          type: number
          format: double
        to_value:
          type: number
          format: double
        clamped_at:
          type: string
          format: date-time

    RuleDetail:
      type: object
      description: One rule as its page shows it.
      required: [rule, bindings, clamps]
      properties:
        rule:
          $ref: "#/components/schemas/Rule"
        bindings:
          type: array
          items:
            $ref: "#/components/schemas/RuleBinding"
        clamps:
          type: array
          items:
            $ref: "#/components/schemas/RuleClamp"

    ResolvedRuleParameter:
      type: object
      description: >-
        One parameter as it applies to one machine, and where the value came
        from — which is the whole answer to "why is this machine at 95?".
      required: [value, level, source]
      properties:
        value:
          type: number
          format: double
        level:
          type: string
          description: The rung the value came from, or shipped when nothing overrode it.
          enum: [device, site, organization, tenant, shipped]
        source:
          type: string
          description: The tuned value that decided it, in words — a rung, a label, or the pack.

    ResolvedRule:
      type: object
      description: A rule as one named machine is actually running it.
      required: [rule_id, device_id, delivered, params]
      properties:
        rule_id:
          type: string
        device_id:
          type: string
          format: uuid
        delivered:
          type: boolean
          description: Whether the machine is getting the rule at all.
        params:
          type: object
          additionalProperties:
            $ref: "#/components/schemas/ResolvedRuleParameter"

    RuleStopScope:
      type: string
      description: >-
        Who a stop reaches. The customer scope stops one customer's estate; the
        tenant scope stops every customer at once, for a rule that is misbehaving
        everywhere.
      enum: [organization, tenant]

    RuleStopInput:
      type: object
      description: Stopping a rule, or lifting a stop.
      required: [scope, stopped]
      properties:
        scope:
          $ref: "#/components/schemas/RuleStopScope"
        stopped:
          type: boolean

    AlertLimits:
      type: object
      description: >-
        A customer's alert budget, and how far each half of it may be raised. The
        maxima are the code's, not the customer's — a limit an operator can raise
        is not a limit.
      required:
        [
          organization_hourly,
          device_hourly,
          max_organization_hourly,
          max_device_hourly,
          updated_by,
        ]
      properties:
        organization_hourly:
          type: integer
          description: Alerts this customer may store in a rolling hour, across every machine.
        device_hourly:
          type: integer
          description: >-
            Alerts one of their machines may raise in a rolling hour. Enforced on
            the machine, so it travels down with the rules.
        max_organization_hourly:
          type: integer
        max_device_hourly:
          type: integer
        updated_by:
          type: string

    AlertLimitsInput:
      type: object
      description: A customer's alert budget as an administrator states it.
      required: [organization_hourly, device_hourly]
      properties:
        organization_hourly:
          type: integer
        device_hourly:
          type: integer

    DeviceTagLabel:
      type: object
      description: >-
        One entry in a customer's label list. Labels cut across the tenancy
        ladder — the file servers are in four offices — which is exactly the set
        a threshold is usually meant for and the set no rung names.
      required: [id, key, value, created_by]
      properties:
        id:
          type: string
          format: uuid
        key:
          type: string
        value:
          type: string
        created_by:
          type: string

    DeviceTagLabelInput:
      type: object
      required: [key, value]
      properties:
        key:
          type: string
        value:
          type: string

    DeviceTagAssignment:
      type: object
      description: One machine and the labels it carries.
      required: [device_id, tags]
      properties:
        device_id:
          type: string
          format: uuid
        tags:
          type: object
          additionalProperties:
            type: string

    DeviceTagCatalogue:
      type: object
      description: A customer's label list and who carries what.
      required: [labels, assignments]
      properties:
        labels:
          type: array
          items:
            $ref: "#/components/schemas/DeviceTagLabel"
        assignments:
          type: array
          items:
            $ref: "#/components/schemas/DeviceTagAssignment"

    DeviceTagAssignmentInput:
      type: object
      description: >-
        Giving one label to a set of machines at once, which is how an estate is
        labelled without visiting every machine's page.
      required: [device_ids, label_id]
      properties:
        device_ids:
          type: array
          items:
            type: string
            format: uuid
        label_id:
          type: string
          format: uuid

    RuleCatalogue:
      type: object
      description: The curated pack and what each rule is watching.
      required: [fleet_size, rules]
      properties:
        fleet_size:
          type: integer
          description: >-
            How many machines the coverage counts were taken against. Every
            rule's four coverage states add up to this.
        rules:
          type: array
          items:
            $ref: "#/components/schemas/Rule"

paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/client-errors:
    post:
      operationId: reportClientError
      summary: Report a browser-side error for server-side log ingestion
      description: >-
        Unauthenticated, rate-limited endpoint that records frontend crashes in
        the server log (Loki) so production client errors are observable. The
        body is size-bounded; payloads must carry no token, credential, or PII.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientErrorReport"
      responses:
        "204":
          description: Error recorded
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/auth/register:
    post:
      operationId: register
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/auth/login:
    post:
      operationId: login
      summary: Authenticate user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many failed login attempts for this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/users/me:
    get:
      operationId: getMe
      summary: Get current user
      security:
        - bearerAuth: []
      responses:
        "200":
          description: Current user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/users:
    get:
      operationId: listUsers
      summary: List all users (admin only)
      security:
        - bearerAuth: []
      responses:
        "200":
          description: List of users
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/users/{id}:
    delete:
      operationId: deleteUser
      summary: Delete user (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: User deleted
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    patch:
      operationId: updateUser
      summary: Update user (admin only)
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UpdateUserRequest"
      responses:
        "200":
          description: Updated user
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: User not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/push/subscribe:
    post:
      operationId: subscribePush
      summary: Save browser push subscription
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebPushSubscribeRequest"
      responses:
        "204":
          description: Subscription saved
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: unsubscribePush
      summary: Remove push subscription
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/WebPushUnsubscribeRequest"
      responses:
        "204":
          description: Subscription removed
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/push/vapid-key:
    get:
      operationId: getVapidKey
      summary: Get server VAPID public key
