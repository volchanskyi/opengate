                $ref: "#/components/schemas/ApiError"
        "404":
          description: Device not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/devices/{id}/restart:
    post:
      operationId: restartDevice
      summary: Restart agent on device
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
