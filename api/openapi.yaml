        site_id narrows to one location inside it. Both narrow together, and
        omitting both returns the whole tenant.
      security:
        - bearerAuth: []
      parameters:
        - name: site_id
          in: query
          required: false
          schema:
            type: string
            format: uuid
        - name: organization_id
          in: query
          required: false
          description: Narrow the list to one customer.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of devices
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Device"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/devices/{id}:
    get:
      operationId: getDevice
      summary: Get device details
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Device details
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "401":
