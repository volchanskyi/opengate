      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CreateSiteRequest"
      responses:
        "201":
          description: Site created
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Site"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    get:
      operationId: listSites
      summary: List the tenant's sites, optionally narrowed by customer
      description: >-
        Returns every site in the caller's tenant. organization_id narrows to
        one customer; omitting it returns the whole tenant.
      security:
        - bearerAuth: []
      parameters:
        - name: organization_id
          in: query
          required: false
          description: Narrow the list to one customer.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: List of sites
          content:
            application/json:
              schema:
                type: array
                items:
