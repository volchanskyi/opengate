  /api/v1/investigations:
    get:
      operationId: listInvestigations
      summary: The triage queue
      description: >-
        Incidents in the caller's tenant, most recent activity first. Every
        parameter narrows; omitting all of them returns every customer in the
        tenant. Paged by cursor rather than by offset, because a queue that is
        being written to silently loses rows under an offset.
      security:
        - bearerAuth: []
      parameters:
        - name: organization_id
          in: query
          description: Narrow to one customer.
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          description: Narrow to a set of statuses.
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/IncidentStatus"
        - name: severity
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/IncidentSeverity"
        - name: rule_id
          in: query
          schema:
            type: string
            maxLength: 64
        - name: device_id
          in: query
          description: Narrow to the incidents holding an alert this machine raised.
          schema:
            type: string
            format: uuid
        - name: assignee_id
          in: query
          schema:
            type: string
            format: uuid
        - name: cursor
          in: query
          description: Where the previous page ended, from that page's next_cursor.
          schema:
            type: string
            maxLength: 128
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: One page of the queue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentPage"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
