  /api/v1/investigations/{id}/comments:
    post:
      operationId: addInvestigationComment
      summary: Add a note to an incident's history
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: organization_id
          in: query
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AddIncidentCommentRequest"
      responses:
        "201":
          description: The line that was added
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentEvent"
        "400":
          description: A comment that says nothing or weighs more than one
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Incident not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/investigations/{id}/alerts/{alertId}/evidence:
    get:
      operationId: getAlertEvidence
      summary: What the machine knew about why one alert fired
      description: >-
        The stored blob is decompressed and decoded by the server. Evidence
        under a codec this build does not read is reported as such rather than
        handed back as bytes.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: alertId
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: organization_id
          in: query
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertEvidence"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Incident or alert not found, or the alert carries no evidence
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "422":
          description: The evidence cannot be read by this build
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/devices/{id}/incidents:
    get:
      operationId: listDeviceIncidents
      summary: The incidents one machine is caught up in
      description: >-
        The same queue read, narrowed to the incidents holding an alert this
        machine raised — including the customer-wide ones it is one of forty
        machines in.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: status
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              $ref: "#/components/schemas/IncidentStatus"
        - name: cursor
          in: query
          schema:
            type: string
            maxLength: 128
        - name: limit
          in: query
          schema:
            type: integer
            default: 50
            minimum: 1
            maximum: 200
      responses:
        "200":
          description: One page of the machine's incidents
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/IncidentPage"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Device not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/rules:
    get:
      operationId: listRules
      summary: The curated rule pack, and how much of the estate each rule watches
      description: >-
        Definitions are compiled into the server; this read shows what each rule
        watches, how far it has rolled out, and its coverage split. The four
        coverage states always add up to the fleet size, so a rule with a
        standing blind spot says so rather than looking healthy.
      security:
        - bearerAuth: []
      parameters:
        - name: organization_id
          in: query
          description: Whose estate the coverage counts are taken against.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The catalogue
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleCatalogue"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/rules/{rule_id}:
    get:
      operationId: getRule
      summary: One rule, its tuning, and anything a version change moved
      description: >-
        The definition is read-only description — a rule's logic is compiled into
        the server and there is no authoring surface. What comes back beside it
        is what may change: the tuned values down the tenancy ladder, and any
        value a new version of the rule had to move.
      security:
        - bearerAuth: []
      parameters:
        - name: rule_id
          in: path
          required: true
          schema:
            type: string
        - name: organization_id
          in: query
          description: Whose tuning and coverage this is.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleDetail"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such rule in the pack this server runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/rules/{rule_id}/resolved:
    get:
      operationId: getResolvedRule
      summary: The rule as one named machine is actually running it
      description: >-
        Answers "why is this machine at 95?" — every parameter, the value in
        force, and which tuned value decided it.
      security:
        - bearerAuth: []
      parameters:
        - name: rule_id
          in: path
          required: true
          schema:
            type: string
        - name: device_id
          in: query
          required: true
          description: The machine to resolve against.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The resolved rule
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ResolvedRule"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such rule, or no such machine in this tenant
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/rules/{rule_id}/bindings:
    put:
      operationId: putRuleBinding
      summary: File or retune one value
      description: >-
        Requires administrator access. A value outside the rule's declared range,
        or one for something the rule does not offer, is refused here — where
        somebody can still see why — rather than reaching an estate.
      security:
        - bearerAuth: []
      parameters:
        - name: rule_id
          in: path
          required: true
          schema:
            type: string
        - name: organization_id
          in: query
          description: Whose tuning this is.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleBindingInput"
      responses:
        "200":
          description: The stored value
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleBinding"
        "400":
          description: Outside the rule's bounds, or not something it offers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such rule in the pack this server runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/rules/{rule_id}/bindings/{binding_id}:
    delete:
      operationId: deleteRuleBinding
      summary: Remove one tuned value
      description: >-
        Requires administrator access. The machines it covered fall back to the
        next rung up, which is the whole point of removing it.
      security:
        - bearerAuth: []
      parameters:
        - name: rule_id
          in: path
          required: true
          schema:
            type: string
        - name: binding_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Removed
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/rules/{rule_id}/rollout:
    put:
      operationId: putRuleRollout
      summary: How far and how fast a rule spreads
      description: >-
        Requires administrator access. Sets whether the customer gets the rule,
        the population each stage reaches, and how long each is held. The
        automatic pull-back is not settable through this or any other route.
      security:
        - bearerAuth: []
      parameters:
        - name: rule_id
          in: path
          required: true
          schema:
            type: string
        - name: organization_id
          in: query
          description: Whose rollout this is.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleRolloutInput"
      responses:
        "200":
          description: The stored rollout
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleRollout"
        "400":
          description: A population or waiting period outside its bounds
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such rule in the pack this server runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/rules/{rule_id}/stop:
    post:
      operationId: stopRule
      summary: Stop a rule, for one customer or for every customer at once
      description: >-
        Requires administrator access. Deliberately separate from switching a
        rule off: that is an ordinary choice, this is an intervention, and
        afterwards the two have to be tellable apart. Effective without a
        release, including on machines that are offline when it is used — they
        are stopped when they come back.
      security:
        - bearerAuth: []
      parameters:
        - name: rule_id
          in: path
          required: true
          schema:
            type: string
        - name: organization_id
          in: query
          description: Which customer, when the scope is one customer.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleStopInput"
      responses:
        "204":
          description: Stopped, or the stop lifted
        "400":
          description: Not a scope this rule can be stopped at
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such rule in the pack this server runs
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/rules/{rule_id}/clamps/{clamp_id}:
    post:
      operationId: acknowledgeRuleClamp
      summary: Acknowledge a value a new rule version had to move
      description: Requires administrator access.
      security:
        - bearerAuth: []
      parameters:
        - name: rule_id
          in: path
          required: true
          schema:
            type: string
        - name: clamp_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Acknowledged
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Nothing outstanding under that id
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/alert-limits:
    get:
      operationId: getAlertLimits
      summary: A customer's alert budget
      security:
        - bearerAuth: []
      parameters:
        - name: organization_id
          in: query
          description: Whose budget this is.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The budget
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertLimits"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      operationId: putAlertLimits
      summary: Move a customer's alert budget
      description: >-
        Requires administrator access. Neither half may pass the maximum the code
        allows, and neither may be set to nothing — that would silence the
        customer's detection outright.
      security:
        - bearerAuth: []
      parameters:
        - name: organization_id
          in: query
          description: Whose budget this is.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlertLimitsInput"
      responses:
        "200":
          description: The stored budget
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AlertLimits"
        "400":
          description: Past the maximum, or nothing at all
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/device-tags:
    get:
      operationId: listDeviceTags
      summary: A customer's label list and who carries what
      security:
        - bearerAuth: []
      parameters:
        - name: organization_id
          in: query
          description: Whose labels these are.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: The labels
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceTagCatalogue"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/device-tags/labels:
    post:
      operationId: createDeviceTagLabel
      summary: Add a label to a customer's list
      description: Requires administrator access.
      security:
        - bearerAuth: []
      parameters:
        - name: organization_id
          in: query
          description: Whose list this is.
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceTagLabelInput"
      responses:
        "201":
          description: The label
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceTagLabel"
        "400":
          description: Outside its bounds, or already on the list
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/device-tags/labels/{label_id}:
    delete:
      operationId: deleteDeviceTagLabel
      summary: Remove a label from a customer's list
      description: >-
        Requires administrator access. Refused while a rule is aimed at the
        label: removing it then would take a tuned value off every machine that
        carried it, which reads as a threshold quietly widening across an estate
        rather than as a deletion.
      security:
        - bearerAuth: []
      parameters:
        - name: label_id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "204":
          description: Removed
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: No such label
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: A rule is aimed at this label
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/device-tags/assignments:
    put:
      operationId: assignDeviceTag
      summary: Give one label to a set of machines
      description: >-
        Requires administrator access. A machine already carrying a different
        value for the same key takes the new one — a machine that answered a
        question twice would match every selector asking it.
      security:
        - bearerAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DeviceTagAssignmentInput"
      responses:
        "204":
          description: Assigned
        "400":
          description: A machine and a label belonging to different customers
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
    delete:
      operationId: clearDeviceTag
      summary: Take one label key off one machine
      description: Requires administrator access.
      security:
        - bearerAuth: []
      parameters:
        - name: device_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
        - name: key
          in: query
          required: true
          schema:
            type: string
      responses:
        "204":
          description: Cleared
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
