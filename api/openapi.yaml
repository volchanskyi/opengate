            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Device not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Agent not connected
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/devices/summary:
    get:
      operationId: getDeviceSummary
      summary: Fleet rollup for the dashboard
      description: >-
        Returns a fixed-size count of the caller's tenant — status tiles
        plus edge-health bands — in one aggregate row and one instant telemetry
        query. The response size does not grow with the fleet. organization_id
        narrows the rollup to one customer, so the tiles and the device list
        always describe the same set.
      security:
        - bearerAuth: []
      parameters:
        - name: organization_id
          in: query
          required: false
          description: Narrow the rollup to one customer.
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Fleet summary
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceSummary"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/devices/{id}/maintenance:
    post:
      operationId: setDeviceMaintenance
      summary: Enter or exit maintenance mode for a device
      description: >-
        Sets the server-authoritative maintenance state for a device. The state
        is persisted and pushed to the agent over the control channel; because
        maintenance is a desired state rather than a live command, this succeeds
        even when the agent is offline and reconciles on its next connect. Every
        change is audited. Requires administrator access.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SetMaintenanceRequest"
      responses:
        "200":
          description: Updated device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Device"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Device not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/devices/{id}/hardware:
    get:
      operationId: getDeviceHardware
      summary: Get hardware info for a device
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Hardware info
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceHardware"
        "202":
          description: Hardware report requested, poll again shortly
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Device or hardware info not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/devices/{id}/logs:
    get:
      operationId: getDeviceLogs
      summary: Broker an on-demand raw-log pull from a device
      description: >-
        Streams a bounded, redacted, audited snapshot of the device's raw logs
        straight from the connected agent. Nothing is persisted centrally; the
        request blocks until the agent responds or times out. Reading raw logs
        is an elevated action restricted to administrators.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: level
          in: query
          schema:
            type: string
            enum: ["", "TRACE", "DEBUG", "INFO", "WARN", "ERROR"]
        - name: from
          in: query
          schema:
            type: string
        - name: to
          in: query
          schema:
            type: string
        - name: search
          in: query
          schema:
            type: string
        - name: source
          in: query
          description: >-
            Log source: "self" (or omitted) reads the agent's own files; "host"
            auto-resolves the platform system log (journald on Linux). A host
            with no reader for the requested source answers with an error naming
            it, not an empty page.
          schema:
            type: string
            enum: ["self", "host"]
            default: "self"
        - name: unit
          in: query
          description: >-
            Narrows host logs to one emitting unit (systemd unit). Ignored for
            the agent's own files.
          schema:
            type: string
        - name: offset
          in: query
          schema:
            type: integer
            default: 0
        - name: limit
          in: query
          schema:
            type: integer
            default: 300
            maximum: 1000
      responses:
        "200":
          description: Log entries
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceLogsResponse"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Forbidden — administrator access required
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Device not found or offline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: A log request is already in progress for this device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "504":
          description: Device did not return logs in time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/devices/{id}/metrics:
    get:
      operationId: getDeviceMetrics
      summary: Downsampled numeric telemetry for a device window
      description: >-
        Returns column-oriented numeric telemetry for the device over the
        window, read tenant-scoped from VictoriaMetrics. The server picks a
        bucket width so the point count stays within max_points regardless of
        window span, then answers on the grid that width implies — every bucket
        of the requested window is present, and one the device did not report is
        null, mapping 1:1 to a client charting engine's aligned data. Charts
        numeric dimensions only; process basenames and cmdlines are never
        returned here.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: dims
          in: query
          description: Numeric dimension names to fetch. Omit for all recorded dimensions.
          schema:
            type: array
            items:
              type: string
          style: form
          explode: false
        - name: max_points
          in: query
          description: Upper bound on buckets per series (approximately the chart pixel width).
          schema:
            type: integer
            default: 1000
            minimum: 10
            maximum: 2000
        - name: band
          in: query
          description: Band provenance to compute alongside the avg line.
          schema:
            type: string
            enum: [none, avg_of_60s]
            default: avg_of_60s
      responses:
        "200":
          description: Downsampled telemetry window
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MetricRangeResponse"
        "400":
          description: Invalid window or parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Forbidden
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Device not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Telemetry unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/devices/{id}/history:
    get:
      operationId: getDeviceHistory
      summary: On-demand full-resolution local history for one dimension
      description: >-
        Brokers a bounded, full-resolution history pull for a single numeric
        dimension from the connected agent's local store — the deep history that
        central VictoriaMetrics (avg-only) does not keep. Single-host and
        server-mediated: no browser-to-agent access and no fan-out. The window is
        bounded and the point count is capped by max_points.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
        - name: dim
          in: query
          required: true
          description: The numeric dimension whose full-resolution history to pull.
          schema:
            type: string
        - name: from
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: to
          in: query
          required: true
          schema:
            type: string
            format: date-time
        - name: max_points
          in: query
          description: Upper bound on returned points; the response is truncated past it.
          schema:
            type: integer
            default: 1000
            minimum: 10
            maximum: 20000
      responses:
        "200":
          description: Full-resolution history slice
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceHistoryResponse"
        "400":
          description: Invalid window or parameters
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Device not found or offline
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: A history request is already in progress for this device
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: History unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "504":
          description: Agent did not return history in time
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/devices/{id}/inventory:
    get:
      operationId: getDeviceInventory
      summary: Discovered software and service inventory for a device
      description: >-
        Returns the device's current auto-discovered footprint — listening
        ports, host services, database engines, containers, and installed
        packages — from the tenant-scoped inventory store. Descriptive
        attack-surface data only; never a credential or connection string.
        Visible to any device viewer in the tenant.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        "200":
          description: Discovered inventory
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DeviceInventory"
        "401":
          description: Unauthorized
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Device not found
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "503":
          description: Inventory unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/organizations:
    get:
      operationId: listOrganizations
      summary: List the tenant's customers
      description: >-
        Every member of a tenant sees every customer in it — the organization is
