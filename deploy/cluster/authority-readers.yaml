---
# Refuses any pod in the release's namespace that reads the master key's secret, unless it is the
# server: its own account, and every container on the server's image.
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: opengate-authority-readers
spec:
  failurePolicy: Fail
  matchConstraints:
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods", "pods/ephemeralcontainers"]
  variables:
    - name: secret
      expression: "'opengate-authority'"
    - name: containers
      expression: >-
        object.spec.containers
        + (has(object.spec.initContainers) ? object.spec.initContainers : [])
        + (has(object.spec.ephemeralContainers) ? object.spec.ephemeralContainers : [])
    - name: mountsKey
      expression: >-
        has(object.spec.volumes) && object.spec.volumes.exists(v,
        (has(v.secret) && has(v.secret.secretName) && v.secret.secretName == variables.secret)
        || (has(v.projected) && has(v.projected.sources) && v.projected.sources.exists(s,
        has(s.secret) && has(s.secret.name) && s.secret.name == variables.secret)))
    - name: envReadsKey
      expression: >-
        variables.containers.exists(c,
        (has(c.env) && c.env.exists(e, has(e.valueFrom) && has(e.valueFrom.secretKeyRef)
        && e.valueFrom.secretKeyRef.name == variables.secret))
        || (has(c.envFrom) && c.envFrom.exists(f, has(f.secretRef)
        && f.secretRef.name == variables.secret)))
    - name: isServer
      expression: >-
        has(object.spec.serviceAccountName) && object.spec.serviceAccountName == 'opengate'
        && variables.containers.all(c,
        c.image.startsWith('ghcr.io/volchanskyi/opengate-server:')
        || c.image.startsWith('ghcr.io/volchanskyi/opengate-server@'))
  validations:
    - expression: "!(variables.mountsKey || variables.envReadsKey) || variables.isServer"
      message: "Only the OpenGate server's own pods may read the opengate-authority secret."
      reason: Forbidden
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: opengate-authority-readers
spec:
  policyName: opengate-authority-readers
  validationActions: [Deny]
  matchResources:
    namespaceSelector:
      matchLabels:
        kubernetes.io/metadata.name: opengate
