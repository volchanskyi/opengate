services:
  postgres:
    image: postgres:17-alpine
    container_name: opengate-test-postgres
    environment:
      - POSTGRES_USER=opengate
      - POSTGRES_PASSWORD=e2e-test-password
      - POSTGRES_DB=opengate
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opengate -d opengate"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  server:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: opengate-test-server
    environment:
      - JWT_SECRET=e2e-test-secret-minimum-32-bytes!
      - DATABASE_URL=postgres://opengate:e2e-test-password@postgres:5432/opengate?sslmode=disable
      # The name machines dial; it is the machine certificate's subject name and enrolment address.
      - OPENGATE_QUIC_HOST=server
    # The QUIC listener is published because enrolled machines connect over QUIC.
    command:
      - "-listen"
      - ":8080"
      - "-internal-listen"
      - ":8081"
      - "-quic-listen"
      - ":9090"
      - "-data-dir"
      - "/data"
      - "-web-dir"
      - "/srv/web"
    ports:
      - "8080:8080"
      - "8081:8081"
      - "9090:9090/udp"
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    tmpfs:
      - /data:mode=1777
    depends_on:
      postgres:
        condition: service_healthy

  # agent-b is the expendable machine; the pinned hostnames are the names the device list shows.
  agent-a:
    build:
      context: ..
      dockerfile: deploy/agent.Dockerfile
    container_name: opengate-test-agent-a
    hostname: agent-a
    env_file:
      # The enrolment token is a per-bring-up credential, optional so `docker compose config`
      # validates without it.
      - path: .e2e-agent.env
        required: false
    environment:
      - OPENGATE_SERVER_ADDR=server:9090
      - OPENGATE_SERVER_CA=/var/lib/mesh-agent/ca.pem
      - OPENGATE_ENROLL_URL=http://server:8080
      - RUST_LOG=info
    tmpfs:
      - /var/lib/mesh-agent:mode=1777,uid=100,gid=101
      - /var/log/mesh-agent:mode=1777,uid=100,gid=101
    depends_on:
      server:
        condition: service_healthy

  agent-b:
    build:
      context: ..
      dockerfile: deploy/agent.Dockerfile
    container_name: opengate-test-agent-b
    hostname: agent-b
    env_file:
      - path: .e2e-agent.env
        required: false
    environment:
      - OPENGATE_SERVER_ADDR=server:9090
      - OPENGATE_SERVER_CA=/var/lib/mesh-agent/ca.pem
      - OPENGATE_ENROLL_URL=http://server:8080
      - RUST_LOG=info
    tmpfs:
      - /var/lib/mesh-agent:mode=1777,uid=100,gid=101
      - /var/log/mesh-agent:mode=1777,uid=100,gid=101
    depends_on:
      server:
        condition: service_healthy
