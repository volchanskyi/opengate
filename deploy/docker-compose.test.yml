# Three networks stand in for where sessions meet: `default` is the internet, holding the server,
# agent-b and each router's outer side; agent-a sits in an office and a browser at home.
networks:
  default:
    driver_opts:
      # The host checks each packet bound here against its arrival bridge; one a router forwards
      # from the office or home bridge is let through.
      com.docker.network.bridge.trusted_host_interfaces: "og-office:og-home"
      # The host translates no address here, so a router's flows reach the far side as it sent them.
      com.docker.network.bridge.enable_ip_masquerade: "false"
    ipam:
      config:
        # Containers with no pinned address take the upper half, clear of the pinned ones.
        - subnet: 10.77.0.0/24
          gateway: 10.77.0.1
          ip_range: 10.77.0.128/25
  # The office and home bridges hold no host address, so their router is the only way out.
  office:
    driver_opts:
      com.docker.network.bridge.name: og-office
      com.docker.network.bridge.inhibit_ipv4: "true"
    ipam:
      config:
        - subnet: 10.77.1.0/24
          gateway: 10.77.1.1
  home:
    driver_opts:
      com.docker.network.bridge.name: og-home
      com.docker.network.bridge.inhibit_ipv4: "true"
    ipam:
      config:
        - subnet: 10.77.2.0/24
          gateway: 10.77.2.1

services:
  postgres:
    image: postgres:17-alpine
    container_name: opengate-test-postgres
    environment:
      - POSTGRES_USER=opengate
      - POSTGRES_PASSWORD=e2e-test-password
      - POSTGRES_DB=opengate
    tmpfs:
      - /var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U opengate -d opengate"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  # Holds the machines' numeric telemetry; deleting a device erases its series here.
  metrics:
    image: victoriametrics/victoria-metrics:v1.114.0
    container_name: opengate-test-metrics
    command:
      - -storageDataPath=/victoria-metrics-data
      - -retentionPeriod=1d
    tmpfs:
      - /victoria-metrics-data
    healthcheck:
      # The store listens on IPv4 alone, and the image resolves localhost to ::1 first.
      test: ["CMD", "wget", "--spider", "-q", "http://127.0.0.1:8428/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 5s

  server:
    build:
      context: ..
      dockerfile: Dockerfile
    container_name: opengate-test-server
    environment:
      - JWT_SECRET=e2e-test-secret-minimum-32-bytes!
      - DATABASE_URL=postgres://opengate:e2e-test-password@postgres:5432/opengate?sslmode=disable
      # The name machines dial; it is the machine certificate's subject name and enrolment address.
      - OPENGATE_QUIC_HOST=server
      # Machines dial the relay on the stack's network; a browser uses the address it reached.
      - OPENGATE_AGENT_RELAY_URL=ws://server:8080
      # The helper shares the QUIC port at the server's fixed address, which every network reaches.
      - OPENGATE_ICE_SERVERS=stun:10.77.0.10:9090
      - OPENGATE_VICTORIAMETRICS_URL=http://metrics:8428
    # The QUIC listener is published because enrolled machines connect over QUIC.
    command:
      - "-listen"
      - ":8080"
      - "-internal-listen"
      - ":8081"
      - "-quic-listen"
      - ":9090"
      - "-data-dir"
      - "/data"
      - "-web-dir"
      - "/srv/web"
    ports:
      # IPv4 alone: Firefox offers no direct-link address on a page it reached over ::1.
      - "0.0.0.0:8080:8080"
      - "8081:8081"
      - "9090:9090/udp"
    networks:
      default:
        ipv4_address: 10.77.0.10
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8080/api/v1/health"]
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
    tmpfs:
      - /data:mode=1777
    depends_on:
      postgres:
        condition: service_healthy
      metrics:
        condition: service_healthy

  # Each router translates the network behind it to its outer address and passes back only replies;
  # specs change its rules with `docker exec <router> router.sh …`.
  router-office:
    build:
      context: router
    container_name: opengate-test-router-office
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW]
    sysctls:
      - net.ipv4.ip_forward=1
    environment:
      - ROUTER_LAN_ADDR=10.77.1.2
      - ROUTER_WAN_ADDR=10.77.0.2
      - ROUTER_LAN_GATEWAY=10.77.1.1
      - ROUTER_HELPER=10.77.0.10:9090
    networks:
      default:
        ipv4_address: 10.77.0.2
        gw_priority: 1
      office:
        ipv4_address: 10.77.1.2

  router-home:
    build:
      context: router
    container_name: opengate-test-router-home
    cap_drop: [ALL]
    cap_add: [NET_ADMIN, NET_RAW]
    sysctls:
      - net.ipv4.ip_forward=1
    environment:
      - ROUTER_LAN_ADDR=10.77.2.2
      - ROUTER_WAN_ADDR=10.77.0.3
      - ROUTER_LAN_GATEWAY=10.77.2.1
      - ROUTER_HELPER=10.77.0.10:9090
      # The test runner reaches the browser server through the home router's outer address.
      - ROUTER_FORWARD=3000:10.77.2.30
    networks:
      default:
        ipv4_address: 10.77.0.3
        gw_priority: 1
      home:
        ipv4_address: 10.77.2.2

  # agent-a sits behind the office router; agent-b, the expendable machine, on the internet network.
  # The pinned hostnames are the names the device list shows.
  agent-a:
    build:
      context: ..
      dockerfile: deploy/agent.Dockerfile
    container_name: opengate-test-agent-a
    hostname: agent-a
    environment:
      - OPENGATE_SERVER_ADDR=server:9090
      - OPENGATE_SERVER_CA=/var/lib/mesh-agent/ca.pem
      - RUST_LOG=info
    volumes:
      # The install note e2e-stack-up.sh writes per bring-up; the start step copies it in once.
      - type: bind
        source: .e2e-agent-note.json
        target: /run/opengate/install-note.json
        read_only: true
        bind:
          create_host_path: false
    # Sent from several CPUs, its packets cross the host's per-CPU queues out of order, and the
    # direct link reads each reordering as a loss and halves its rate. CPU 0 exists everywhere.
    cpuset: "0"
    networks:
      office:
        ipv4_address: 10.77.1.20
    # The office network carries no name service for the internet network's containers.
    extra_hosts:
      - "server:10.77.0.10"
    tmpfs:
      - /var/lib/mesh-agent:mode=1777,uid=100,gid=101
      - /var/log/mesh-agent:mode=1777,uid=100,gid=101
    depends_on:
      server:
        condition: service_healthy
      router-office:
        condition: service_healthy

  agent-b:
    build:
      context: ..
      dockerfile: deploy/agent.Dockerfile
    container_name: opengate-test-agent-b
    hostname: agent-b
    environment:
      - OPENGATE_SERVER_ADDR=server:9090
      - OPENGATE_SERVER_CA=/var/lib/mesh-agent/ca.pem
      - RUST_LOG=info
    volumes:
      # The install note e2e-stack-up.sh writes per bring-up; the start step copies it in once.
      - type: bind
        source: .e2e-agent-note.json
        target: /run/opengate/install-note.json
        read_only: true
        bind:
          create_host_path: false
    # Sent from several CPUs, its packets cross the host's per-CPU queues out of order, and the
    # direct link reads each reordering as a loss and halves its rate. CPU 0 exists everywhere.
    cpuset: "0"
    networks:
      default:
        ipv4_address: 10.77.0.21
    tmpfs:
      - /var/lib/mesh-agent:mode=1777,uid=100,gid=101
      - /var/log/mesh-agent:mode=1777,uid=100,gid=101
    depends_on:
      server:
        condition: service_healthy

  # agent-c's data folder is a named volume, so its identity survives a stop and a start; the
  # machine-lifecycle spec deletes, reinstalls and copies it. The bring-up creates it stopped.
  agent-c:
    build:
      context: ..
      dockerfile: deploy/agent.Dockerfile
    container_name: opengate-test-agent-c
    # As the installed service: restarted after a failure or a start-over, left down after a removal.
    restart: on-failure
    hostname: agent-c
    environment:
      - OPENGATE_SERVER_ADDR=server:9090
      - OPENGATE_SERVER_CA=/var/lib/mesh-agent/ca.pem
      - RUST_LOG=info
    networks:
      default:
        ipv4_address: 10.77.0.22
    volumes:
      - agent-c-data:/var/lib/mesh-agent
      - type: bind
        source: .e2e-agent-note.json
        target: /run/opengate/install-note.json
        read_only: true
        bind:
          create_host_path: false
    tmpfs:
      - /var/log/mesh-agent:mode=1777,uid=100,gid=101
    depends_on:
      server:
        condition: service_healthy

  # A second machine started from a copy of agent-c's data folder, as a cloned disk would be.
  agent-c-copy:
    build:
      context: ..
      dockerfile: deploy/agent.Dockerfile
    container_name: opengate-test-agent-c-copy
    # As the installed service: restarted after a failure or a start-over, left down after a removal.
    restart: on-failure
    hostname: agent-c-copy
    environment:
      - OPENGATE_SERVER_ADDR=server:9090
      - OPENGATE_SERVER_CA=/var/lib/mesh-agent/ca.pem
      - RUST_LOG=info
    networks:
      default:
        ipv4_address: 10.77.0.23
    volumes:
      - agent-c-copy-data:/var/lib/mesh-agent
    tmpfs:
      - /var/log/mesh-agent:mode=1777,uid=100,gid=101
    depends_on:
      server:
        condition: service_healthy

  # Playwright's browser server, behind the home router, for the specs that put both sides behind
  # routers. e2e-stack-up.sh passes the suite's Playwright version.
  browser:
    build:
      context: browser
      args:
        PLAYWRIGHT_VERSION: ${PLAYWRIGHT_VERSION:-}
    container_name: opengate-test-browser
    init: true
    shm_size: 1gb
    networks:
      home:
        ipv4_address: 10.77.2.30
    extra_hosts:
      - "server:10.77.0.10"
    depends_on:
      router-home:
        condition: service_healthy

volumes:
  agent-c-data:
  agent-c-copy-data:
