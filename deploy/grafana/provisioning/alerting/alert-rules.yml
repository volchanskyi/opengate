apiVersion: 1

groups:
  - orgId: 1
    name: OpenGate Critical
    folder: OpenGate
    interval: 1m
    rules:
      - uid: health-check-failing
        title: Health check failing
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: VictoriaMetrics
            model:
              expr: up{job="opengate-server"}
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "OpenGate server health check is failing"
          description: "The server has been unreachable for more than 1 minute."

      - uid: disk-usage-critical
        title: Disk usage > 90%
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: VictoriaMetrics
            model:
              expr: >-
                100 - (node_filesystem_avail_bytes{mountpoint="/"} /
                node_filesystem_size_bytes{mountpoint="/"} * 100)
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [90]
        for: 1m
        labels:
          severity: critical
        annotations:
          summary: "Disk usage is above 90%"
          description: "Root filesystem usage has exceeded 90%. Immediate action required."

  - orgId: 1
    name: OpenGate Warning
    folder: OpenGate
    interval: 1m
    rules:
      - uid: high-latency-p99
        title: "p99 latency > 2s"
        noDataState: OK
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: VictoriaMetrics
            model:
              expr: >-
                histogram_quantile(0.99,
                sum(rate(opengate_http_request_duration_seconds_bucket[5m])) by (le))
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [2]
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "p99 HTTP latency exceeds 2 seconds"
          description: "The 99th percentile request duration has been above 2s for 5 minutes."

      - uid: high-error-rate
        title: "HTTP error rate > 5%"
        noDataState: OK
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: VictoriaMetrics
            model:
              expr: >-
                sum(rate(opengate_http_requests_total{status_code=~"5.."}[5m])) /
                sum(rate(opengate_http_requests_total[5m])) * 100
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [5]
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "HTTP 5xx error rate exceeds 5%"
          description: "More than 5% of HTTP requests are returning 5xx errors."

      - uid: disk-usage-warning
        title: Disk usage > 75%
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: VictoriaMetrics
            model:
              expr: >-
                100 - (node_filesystem_avail_bytes{mountpoint="/"} /
                node_filesystem_size_bytes{mountpoint="/"} * 100)
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [75]
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Disk usage is above 75%"
          description: "Root filesystem usage has exceeded 75%. Plan cleanup or expansion."

      - uid: memory-usage-high
        title: Memory usage > 80%
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: VictoriaMetrics
            model:
              expr: >-
                100 - (node_memory_MemAvailable_bytes /
                node_memory_MemTotal_bytes * 100)
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [80]
        for: 5m
        labels:
          severity: warning
        annotations:
          summary: "Memory usage is above 80%"
          description: "System memory utilization has exceeded 80%."

      - uid: server-process-restarted
        title: "OpenGate server process restarted"
        noDataState: OK
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: VictoriaMetrics
            model:
              expr: >-
                sum(changes(process_start_time_seconds{job="opengate-server"}[15m]))
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        for: 0m
        labels:
          severity: warning
        annotations:
          summary: "The OpenGate server process was replaced"
          description: >-
            process_start_time_seconds moved, so the server is a different
            process than it was fifteen minutes ago. A rolling deploy is the
            expected cause and needs no action. Anything else is a crash or an
            out-of-memory kill, and it resets every device to offline and
            severs every live remote session. Read
            container_oom_events_total for the namespace to tell the two
            apart, and the container memory alert for whether it was walking
            up to its limit beforehand.

      - uid: container-memory-against-limit
        title: "Container memory is above 80% of its own limit"
        noDataState: OK
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: VictoriaMetrics
            model:
              expr: >-
                max by (namespace, pod, container) (
                  container_memory_working_set_bytes{container!="",container!="POD"}
                  /
                  container_spec_memory_limit_bytes{container!="",container!="POD"} > 0
                )
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0.8]
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "A container is walking up to its memory limit"
          description: >-
            The container's working set has been above 80% of its own cgroup
            limit for ten minutes. The node may have memory to spare and this
            container still be minutes from being killed, which is why the
            reading is the container against its own ceiling rather than the
            node against its total. A container that stays here without a
            matching rise in load is retaining something it is not giving back.

      - uid: container-oom-killed
        title: "Container killed for memory"
        noDataState: OK
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: VictoriaMetrics
            model:
              expr: >-
                sum by (namespace, pod, container) (
                  increase(container_oom_events_total{container!=""}[15m])
                )
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        for: 0m
        labels:
          severity: critical
        annotations:
          summary: "A container was killed for exceeding its memory limit"
          description: >-
            The kernel took this container for memory. The series names which
            one, which is the question that otherwise costs hours: a node-wide
            kill counter says a kill happened somewhere. For the server
            container this also resets every device to offline and severs every
            live remote session, so the fleet re-registers at once.

      - uid: edge-telemetry-drop-ratio
        title: "Edge telemetry drop ratio > 5%"
        noDataState: OK
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: VictoriaMetrics
            model:
              expr: >-
                sum(rate(opengate_edge_telemetry_drops_total[10m])) /
                clamp_min(sum(rate(opengate_edge_telemetry_ingested_total[10m])), 1) * 100
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [5]
        for: 10m
        labels:
          severity: warning
        annotations:
          summary: "Edge-Sentinel telemetry drop ratio exceeds 5%"
          description: >-
            Server-side telemetry bounds are dropping more than 5% of accepted
            messages over 10 minutes; anomaly summaries or host windows may be
            silently lost.

      - uid: rule-pack-alert-rate-high
        title: "Rule pack raising more than 5 alerts / device / day"
        noDataState: OK
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: VictoriaMetrics
            model:
              expr: >-
                sum(rate(opengate_alerts_created_total[30m])) * 86400 /
                clamp_min(max(sum by (rule_id) (opengate_rule_coverage)), 1)
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [5]
        for: 30m
        labels:
          severity: warning
        annotations:
          summary: "The curated rule pack is raising far more alerts than its ceilings are sized for"
          description: >-
            Stored alerts per device per day are above 5, projected from the last
            30 minutes. At that rate a large customer's hourly ceiling starts
            refusing detection nobody can reconstruct afterwards, and the triage
            queue stops being readable. Open the Rule Rollout And Triage dashboard
            and read the per-rule panel: a single rule_id carrying the rise is a
            rule whose thresholds need moving, and a rise across the pack is a
            rollout that has reached more machines than it was staged for.

      - uid: rule-pack-detection-refused
        title: "A customer's hourly alert ceiling is refusing detection"
        noDataState: OK
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: VictoriaMetrics
            model:
              expr: >-
                sum(rate(opengate_alerts_suppressed_total{reason="organization_ceiling"}[15m]))
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        for: 15m
        labels:
          severity: warning
        annotations:
          summary: "Alerts are being refused past a customer's hourly ceiling"
          description: >-
            An alert is the only carrier of the detail behind a signal — there is
            no path for asking the endpoint again — so every refusal here is an
            incident that cannot be reconstructed. The customer's storm incident
            carries the count of what was lost. Check the Rule Rollout And Triage
            dashboard for which rule is driving the volume.
