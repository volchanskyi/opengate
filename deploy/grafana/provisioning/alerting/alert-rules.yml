apiVersion: 1

groups:
  - orgId: 1
    name: OpenGate Critical
    folder: OpenGate
    interval: 1m
    rules:
      - uid: health-check-failing
        title: Health check failing
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: VictoriaMetrics
            model:
              expr: up{job="opengate-server",namespace="opengate"}
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            relativeTimeRange:
              from: 300
              to: 0
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
        for: 1m
        labels:
          severity: critical
          watches: production
        annotations:
          summary: "OpenGate server health check is failing"
          observed: '{{ with $values.B }}up = {{ printf "%.0f" .Value }} (fires below 1){{ end }}'
          check: >-
            kubectl -n opengate get pods -l app.kubernetes.io/component=server, then kubectl -n opengate logs
            deploy/opengate-server --previous
          description: "The server has been unreachable for more than 1 minute."

      - uid: disk-usage-critical
        title: Disk usage > 90%
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: VictoriaMetrics
            model:
              expr: >-
                100 - (node_filesystem_avail_bytes{mountpoint="/"} /
                node_filesystem_size_bytes{mountpoint="/"} * 100)
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [90]
        for: 1m
        labels:
          severity: critical
          watches: shared
        annotations:
          summary: "Disk usage is above 90%"
          observed: '{{ with $values.B }}root filesystem {{ printf "%.1f" .Value }}% used (fires above 90%){{ end }}'
          check: >-
            on the node: du -xh --max-depth=2 / | sort -h | tail; container images and logs are the usual growth
          description: "Root filesystem usage has exceeded 90%. Immediate action required."

  - orgId: 1
    name: OpenGate Warning
    folder: OpenGate
    interval: 1m
    rules:
      - uid: high-latency-p99
        title: "p99 latency > 2s"
        noDataState: OK
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: VictoriaMetrics
            model:
              expr: >-
                histogram_quantile(0.99,
                sum(rate(opengate_http_request_duration_seconds_bucket{namespace="opengate"}[5m])) by (le))
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [2]
        for: 5m
        labels:
          severity: warning
          watches: production
        annotations:
          summary: "p99 HTTP latency exceeds 2 seconds"
          observed: '{{ with $values.B }}p99 request time {{ printf "%.2f" .Value }}s (fires above 2s){{ end }}'
          check: >-
            the OpenGate Overview dashboard, latency by route; then the Postgres dashboard for slow queries
          description: "The 99th percentile request duration has been above 2s for 5 minutes."

      - uid: high-error-rate
        title: "HTTP error rate > 5%"
        noDataState: OK
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: VictoriaMetrics
            model:
              expr: >-
                sum(rate(opengate_http_requests_total{namespace="opengate",status_code=~"5.."}[5m])) /
                sum(rate(opengate_http_requests_total{namespace="opengate"}[5m])) * 100
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [5]
        for: 5m
        labels:
          severity: warning
          watches: production
        annotations:
          summary: "HTTP 5xx error rate exceeds 5%"
          observed: '{{ with $values.B }}{{ printf "%.1f" .Value }}% of requests answered 5xx (fires above 5%){{ end }}'
          check: >-
            kubectl -n opengate logs deploy/opengate-server --since=15m | grep -i error
          description: "More than 5% of HTTP requests are returning 5xx errors."

      - uid: disk-usage-warning
        title: Disk usage > 75%
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: VictoriaMetrics
            model:
              expr: >-
                100 - (node_filesystem_avail_bytes{mountpoint="/"} /
                node_filesystem_size_bytes{mountpoint="/"} * 100)
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [75]
        for: 5m
        labels:
          severity: warning
          watches: shared
        annotations:
          summary: "Disk usage is above 75%"
          observed: '{{ with $values.B }}root filesystem {{ printf "%.1f" .Value }}% used (fires above 75%){{ end }}'
          check: >-
            on the node: du -xh --max-depth=2 / | sort -h | tail; container images and logs are the usual growth
          description: "Root filesystem usage has exceeded 75%. Plan cleanup or expansion."

      - uid: memory-usage-high
        title: Memory usage > 80%
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: VictoriaMetrics
            model:
              expr: >-
                100 - (node_memory_MemAvailable_bytes /
                node_memory_MemTotal_bytes * 100)
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [80]
        for: 5m
        labels:
          severity: warning
          watches: shared
        annotations:
          summary: "Memory usage is above 80%"
          observed: '{{ with $values.B }}{{ printf "%.1f" .Value }}% of node memory in use (fires above 80%){{ end }}'
          check: >-
            kubectl top pods -A --sort-by=memory | head
          description: "System memory utilization has exceeded 80%."

      - uid: server-process-restarted
        title: "OpenGate server process restarted"
        noDataState: OK
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: VictoriaMetrics
            model:
              # Seconds since the newest server process started, from its start-time series.
              expr: >-
                time() - max(process_start_time_seconds{job="opengate-server",namespace="opengate"})
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [900]
        for: 0m
        labels:
          severity: warning
          watches: production
        annotations:
          summary: "The OpenGate server process was replaced"
          observed: >-
            {{ with $values.B }}the server process started {{ printf "%.0f" .Value }} seconds ago (fires below
            900){{ end }}
          check: >-
            kubectl -n opengate get pods -l app.kubernetes.io/component=server and read Last State; OOMKilled is a
            memory kill, Completed with a new ReplicaSet is a deploy
          description: >-
            The server process started less than fifteen minutes ago, so it is
            a different process than it was. A rolling deploy is the
            expected cause and needs no action. Anything else is a crash or an
            out-of-memory kill, and it resets every device to offline and
            severs every live remote session. Read
            container_oom_events_total for the namespace to tell the two
            apart, and the container memory alert for whether it was walking
            up to its limit beforehand.

      - uid: cadvisor-scrape-unreachable
        title: "Container metrics are not being collected"
        noDataState: Alerting
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: VictoriaMetrics
            model:
              expr: >-
                sum(up{job="kubernetes-cadvisor"})
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: lt
                    params: [1]
        for: 15m
        labels:
          severity: warning
          watches: shared
        annotations:
          summary: "The kubelet's container metrics are not reaching the store"
          observed: '{{ with $values.B }}{{ printf "%.0f" .Value }} kubelet scrapes answering (fires below 1){{ end }}'
          check: >-
            the VictoriaMetrics targets page (/targets) for the kubernetes-cadvisor job and its last error; a 403 is
            the nodes/metrics authorisation
          description: >-
            Nothing is answering the cAdvisor scrape, so the two alerts below
            this one have no data to fire on and would stay silent through
            exactly the condition they exist for. The usual cause is the
            scraper's authorisation: it reaches each kubelet directly, and the
            kubelet checks that request against the nodes/metrics subresource.
            This rule alerts on no data as well as on a failing scrape, because
            an absent series and a refused one are the same outcome here.

      - uid: container-memory-against-limit
        title: "Container memory is above 80% of its own limit"
        noDataState: OK
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: VictoriaMetrics
            model:
              # Resident memory against the container limit; a working set also counts reclaimable
              # file cache, and this node reports no per-program memory-pressure reading.
              expr: >-
                max by (namespace, pod, container) (
                  container_memory_rss{container!="",container!="POD"}
                  /
                  (container_spec_memory_limit_bytes{container!="",container!="POD"} > 0)
                )
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                # Once firing, the alert holds until the container is back under 70%.
                - evaluator:
                    type: gt
                    params: [0.8]
                  unloadEvaluator:
                    type: lt
                    params: [0.7]
        for: 10m
        labels:
          severity: warning
          watches: shared
        annotations:
          summary: "A container is walking up to its memory limit"
          observed: >-
            {{ with $values.B }}the program holds {{ humanizePercentage .Value }} of its memory limit (fires above 80%,
            clears below 70%){{ end }}
          check: >-
            kubectl -n {{ $labels.namespace }} top pod {{ $labels.pod }} --containers, and whether the rise follows load
          description: >-
            The memory the container's program holds has been above 80% of its
            own cgroup limit for ten minutes, and the alert stays until it is
            back under 70%. File cache the kernel can reclaim is not counted;
            the container is killed for memory only once it can reclaim no
            more, and that is the alert below this one. The node may have memory to spare and this container still be
            minutes from being killed, which is why the reading is the
            container against its own ceiling rather than the node against its
            total. A container with no limit is left out: it has no ceiling to
            walk up to. A container that stays here without a matching rise in
            load is retaining something it is not giving back.

      - uid: container-oom-killed
        title: "Container killed for memory"
        noDataState: OK
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 900
              to: 0
            datasourceUid: VictoriaMetrics
            model:
              expr: >-
                sum by (namespace, pod, container) (
                  increase(container_oom_events_total{container!=""}[15m])
                )
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        for: 0m
        labels:
          severity: critical
          watches: shared
        annotations:
          summary: "A container was killed for exceeding its memory limit"
          observed: >-
            {{ with $values.B }}{{ printf "%.0f" .Value }} memory kills in the last 15 minutes (fires above 0){{ end
            }}
          check: >-
            kubectl -n {{ $labels.namespace }} describe pod {{ $labels.pod }}: Last State and the limit it was killed at
          description: >-
            The kernel took this container for memory. The series names which
            one, which is the question that otherwise costs hours: a node-wide
            kill counter says a kill happened somewhere. For the server
            container this also resets every device to offline and severs every
            live remote session, so the fleet re-registers at once.

      - uid: edge-telemetry-drop-ratio
        title: "Edge telemetry drop ratio > 5%"
        noDataState: OK
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 600
              to: 0
            datasourceUid: VictoriaMetrics
            model:
              expr: >-
                sum(rate(opengate_edge_telemetry_drops_total{namespace="opengate"}[10m])) /
                clamp_min(sum(rate(opengate_edge_telemetry_ingested_total{namespace="opengate"}[10m])), 1) * 100
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [5]
        for: 10m
        labels:
          severity: warning
          watches: production
        annotations:
          summary: "Edge-Sentinel telemetry drop ratio exceeds 5%"
          observed: >-
            {{ with $values.B }}{{ printf "%.1f" .Value }}% of edge telemetry dropped over 10 minutes (fires above
            5%){{ end }}
          check: >-
            opengate_edge_telemetry_drops_total by reason, to see which bound is refusing
          description: >-
            Server-side telemetry bounds are dropping more than 5% of accepted
            messages over 10 minutes; anomaly summaries or host windows may be
            silently lost.

      - uid: rule-pack-alert-rate-high
        title: "Rule pack raising more than 5 alerts / device / day"
        noDataState: OK
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 3600
              to: 0
            datasourceUid: VictoriaMetrics
            model:
              expr: >-
                sum(rate(opengate_alerts_created_total{namespace="opengate"}[30m])) * 86400 /
                clamp_min(max(sum by (rule_id) (opengate_rule_coverage{namespace="opengate"})), 1)
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [5]
        for: 30m
        labels:
          severity: warning
          watches: production
        annotations:
          summary: "The curated rule pack is raising far more alerts than its ceilings are sized for"
          observed: '{{ with $values.B }}{{ printf "%.1f" .Value }} alerts per device per day (fires above 5){{ end }}'
          check: >-
            the Rule Rollout And Triage dashboard, per-rule panel: one rule_id carrying the rise, or the whole pack
          description: >-
            Stored alerts per device per day are above 5, projected from the last
            30 minutes. At that rate a large customer's hourly ceiling starts
            refusing detection nobody can reconstruct afterwards, and the triage
            queue stops being readable. Open the Rule Rollout And Triage dashboard
            and read the per-rule panel: a single rule_id carrying the rise is a
            rule whose thresholds need moving, and a rise across the pack is a
            rollout that has reached more machines than it was staged for.

      - uid: rule-pack-detection-refused
        title: "A customer's hourly alert ceiling is refusing detection"
        noDataState: OK
        condition: C
        data:
          - refId: A
            relativeTimeRange:
              from: 1800
              to: 0
            datasourceUid: VictoriaMetrics
            model:
              expr: >-
                sum(rate(opengate_alerts_suppressed_total{namespace="opengate",reason="organization_ceiling"}[15m]))
              intervalMs: 1000
              maxDataPoints: 43200
          - refId: B
            datasourceUid: __expr__
            model:
              type: reduce
              expression: A
              reducer: last
          - refId: C
            datasourceUid: __expr__
            model:
              type: threshold
              expression: B
              conditions:
                - evaluator:
                    type: gt
                    params: [0]
        for: 15m
        labels:
          severity: warning
          watches: production
        annotations:
          summary: "Alerts are being refused past a customer's hourly ceiling"
          observed: >-
            {{ with $values.B }}{{ printf "%.3f" .Value }} alerts a second refused past a ceiling (fires above 0){{
            end }}
          check: >-
            the Rule Rollout And Triage dashboard for which rule is driving the volume
          description: >-
            An alert is the only carrier of the detail behind a signal — there is
            no path for asking the endpoint again — so every refusal here is an
            incident that cannot be reconstructed. The customer's storm incident
            carries the count of what was lost. Check the Rule Rollout And Triage
            dashboard for which rule is driving the volume.
