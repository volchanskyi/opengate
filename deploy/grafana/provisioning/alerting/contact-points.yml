# monitoring-config-apply.sh substitutes the chat id as a quoted literal, since an
# environment variable would be read as a JSON number.
apiVersion: 1

contactPoints:
  - orgId: 1
    name: telegram
    receivers:
      - uid: telegram-nightlies
        type: telegram
        settings:
          bottoken: $TELEGRAM_BOT_TOKEN
          chatid: "__TELEGRAM_CHAT_ID__"
          disable_web_page_preview: true
          # Sent as plain text because summaries carry '>' and '&', which break HTML parsing.
          message: '{{ template "opengate.telegram" . }}'
          parse_mode: None
