# Every alert goes to the Telegram chat the nightlies report into.
#
# One route, no matchers: a rule that fires is a rule somebody should see, and a
# tree of exceptions is how a destination comes to be one nothing reaches.
# Grouping is by rule, so every series one rule fires for arrives in one
# message, each printed with its own labels. A rule that reads no data arrives
# under Grafana's own name for that, with the rule's title in `rulename`, so the
# grouping reads both: every rule's no-data alert is a message of its own.
#
# While a test holds the staging claim, the rules labelled `watches: shared` are
# silenced by scripts/alert-quiet-period.sh; that silence is the only one this
# deployment creates.
apiVersion: 1

policies:
  - orgId: 1
    receiver: telegram
    group_by:
      - alertname
      - rulename
      - grafana_folder
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
