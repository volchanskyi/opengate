# One matcher-free route sends every alert to Telegram, grouped by alertname and rulename.
# alert-quiet-period.sh silences `watches: shared` rules while a test holds staging.
apiVersion: 1

policies:
  - orgId: 1
    receiver: telegram
    group_by:
      - alertname
      - rulename
      - grafana_folder
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
