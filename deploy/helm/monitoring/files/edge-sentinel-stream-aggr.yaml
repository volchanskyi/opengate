# Central rollups emit avg only: each aggregate is a series, and chart bands come from the
# raw 10 s samples, so min/max/last would only add active series.
- name: edge-sentinel-1m
  match: '{__name__=~"opengate_edge_.*"}'
  interval: 1m
  outputs: [avg]

- name: edge-sentinel-1h
  match: '{__name__=~"opengate_edge_.*"}'
  interval: 1h
  outputs: [avg]
