{{- $name := include "mon.componentName" (list . "victoriametrics") -}}
{{- $scrape := .Files.Get "files/vmagent-scrape.yaml" -}}
{{- $streamAggr := .Files.Get "files/edge-sentinel-stream-aggr.yaml" -}}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ $name }}
  labels:
    {{- include "mon.labels" . | nindent 4 }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: {{ $name }}
  labels:
    {{- include "mon.labels" . | nindent 4 }}
rules:
  # Discovery in vmagent-scrape.yaml needs read-only list/watch on pods, endpoints, services, nodes.
  - apiGroups: [""]
    resources: [pods, endpoints, services, nodes]
    verbs: [get, list, watch]
  # The kubelet authorises /metrics/cadvisor against nodes/metrics; nodes/proxy would let its
  # holder relay arbitrary requests through the kubelet.
  - apiGroups: [""]
    resources: [nodes/metrics]
    verbs: [get]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: {{ $name }}
  labels:
    {{- include "mon.labels" . | nindent 4 }}
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: {{ $name }}
subjects:
  - kind: ServiceAccount
    name: {{ $name }}
    namespace: {{ .Release.Namespace }}
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: {{ $name }}-scrape
  labels:
    {{- include "mon.labels" . | nindent 4 }}
data:
  scrape.yml: |
{{ $scrape | indent 4 }}
  stream-aggr.yml: |
{{ $streamAggr | indent 4 }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  labels:
    {{- include "mon.labels" . | nindent 4 }}
spec:
  selector:
    {{- include "mon.selectorLabels" (list . "victoriametrics") | nindent 4 }}
  ports:
    - name: http
      port: 8428
      targetPort: http
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ $name }}
  labels:
    {{- include "mon.labels" . | nindent 4 }}
spec:
  serviceName: {{ $name }}
  replicas: 1
  selector:
    matchLabels:
      {{- include "mon.selectorLabels" (list . "victoriametrics") | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "mon.selectorLabels" (list . "victoriametrics") | nindent 8 }}
      annotations:
        # A changed configuration restarts the store onto the new file.
        checksum/config: {{ print $scrape $streamAggr | sha256sum }}
        # The store's own disk and series readings feed the soak dashboard.
        prometheus.io/scrape: "true"
        prometheus.io/port: "8428"
    spec:
      # Binds the ServiceAccount so kubernetes_sd can authenticate; automountServiceAccountToken
      # keeps its default because an explicit true trips Sonar S6865.
      serviceAccountName: {{ $name }}
      securityContext:
        runAsNonRoot: true
        runAsUser: 65534
        fsGroup: 65534
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: victoriametrics
          image: {{ .Values.victoriametrics.image }}
          args:
            - "-storageDataPath=/storage"
            - "-retentionPeriod={{ .Values.victoriametrics.retention }}"
            - "-promscrape.config=/etc/victoriametrics/scrape.yml"
            - "-streamAggr.config=/etc/victoriametrics/stream-aggr.yml"
            - "-streamAggr.keepInput"
            - "-httpListenAddr=:8428"
          ports:
            - name: http
              containerPort: 8428
          livenessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 15
          readinessProbe:
            httpGet: { path: /health, port: http }
            initialDelaySeconds: 5
          resources:
            {{- toYaml .Values.victoriametrics.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: [ALL]
          volumeMounts:
            - name: storage
              mountPath: /storage
            - name: scrape
              mountPath: /etc/victoriametrics
              readOnly: true
      volumes:
        - name: scrape
          configMap:
            name: {{ $name }}-scrape
  volumeClaimTemplates:
    - metadata:
        name: storage
      spec:
        accessModes: [ReadWriteOnce]
        storageClassName: {{ .Values.storageClass }}
        resources:
          requests:
            storage: {{ .Values.victoriametrics.storage }}
