# Monitoring stack values — the Kubernetes deployment of Grafana,
# VictoriaMetrics, Loki, Promtail, and the exporters. Resource limits are tuned
# per component below.

nameOverride: ""
fullnameOverride: ""

# Public hostname, matched to the app chart's `domain`. Used to derive Grafana's
# root URL (GF_SERVER_ROOT_URL). Grafana itself stays internal — reach it via
# `kubectl port-forward` / the OCI Bastion, never an ingress (same posture as the
# compose 127.0.0.1:3000 bind). Public uptime monitoring is an external SaaS
# (ADR-035), so this chart exposes no ingress.
domain: opengate.example.com

# Secret (created out-of-band) with keys: GF_SECURITY_ADMIN_PASSWORD,
# POSTGRES_PASSWORD, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID.
existingSecret: opengate-monitoring-secrets

# In-cluster Postgres the postgres-exporter scrapes (the app chart's headless svc).
postgresHost: opengate-postgres.opengate.svc

storageClass: oci-bv

victoriametrics:
  image: docker.io/victoriametrics/victoria-metrics:v1.114.0
  # Single global retention: OSS VictoriaMetrics has no per-series window, so raw
  # samples and the avg rollups share this one. It is the only input to the
  # rendered -retentionPeriod argument, pinned by
  # scripts/tests/monitoring-retention.test.sh.
  retention: 30d
  # What the StatefulSet's volume template asks for, which cannot change once the
  # set exists. The oci-bv class provisions its 50 GB minimum whatever is asked,
  # so the disk behind this is 50 GB either way.
  storage: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

loki:
  image: docker.io/grafana/loki:3.5.0
  storage: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 256Mi

grafana:
  image: docker.io/grafana/grafana-oss:11.6.0
  # No PVC: /var/lib/grafana is an emptyDir. Every piece of configuration is
  # provisioned from a ConfigMap and re-read on every start, so what a restart
  # loses is what Grafana wrote about itself — annotations and alert-state
  # history.
  rootUrl: ""    # set to https://<domain>/grafana when fronted by an ingress
  # Dashboard JSONs are NOT duplicated into the chart. The ConfigMap is rendered
  # from the canonical files and read back by
  # deploy/scripts/monitoring-config-apply.sh, which the nightly drift workflow
  # runs — so what the cluster holds is what the repository declares, checked
  # rather than assumed.
  dashboardsConfigMap: grafana-dashboards
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

promtail:
  image: docker.io/grafana/promtail:3.5.0
  # promtail reads node pod logs. Where the node OS makes /var/log/pods
  # root-only it runs as root; values-production.yaml sets that for OKE.
  runAsRoot: false
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 250m
      memory: 128Mi

nodeExporter:
  image: docker.io/prom/node-exporter:v1.9.1
  resources:
    requests:
      cpu: 50m
      memory: 16Mi
    limits:
      cpu: 250m
      memory: 64Mi

postgresExporter:
  image: docker.io/prometheuscommunity/postgres-exporter:v0.16.0
  resources:
    requests:
      cpu: 50m
      memory: 16Mi
    limits:
      cpu: 250m
      memory: 64Mi

# Uptime monitoring is an external SaaS (ADR-035) — UptimeRobot/Better Stack
# probing https://<domain>/healthz from off-cluster (also catches whole-node
# outages an in-cluster monitor is blind to). No in-cluster uptime-kuma pod/PVC,
# and this chart exposes no ingress.
