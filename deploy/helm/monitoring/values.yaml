nameOverride: ""
fullnameOverride: ""

# Public hostname matching the app chart's `domain`; it derives Grafana's root URL.
# Grafana stays internal, reached by port-forward, so the chart exposes no ingress.
domain: opengate.example.com

# Out-of-band Secret keys: GF_SECURITY_ADMIN_PASSWORD, TELEGRAM_BOT_TOKEN, TELEGRAM_CHAT_ID.
existingSecret: opengate-monitoring-secrets

storageClass: oci-bv

victoriametrics:
  image: docker.io/victoriametrics/victoria-metrics:v1.114.0
  # One global retention, since OSS VictoriaMetrics has no per-series window; it alone
  # feeds -retentionPeriod.
  retention: 30d
  # The volume template size is fixed once the set exists; the oci-bv class provisions 50 GB minimum.
  storage: 10Gi
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: 500m
      memory: 512Mi

loki:
  image: docker.io/grafana/loki:3.5.0
  storage: 10Gi
  # Loki holds about 150 MiB; its working set also counts reclaimable chunk-file cache,
  # so the memory alert reads resident memory.
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

grafana:
  image: docker.io/grafana/grafana-oss:11.6.0
  # /var/lib/grafana is an emptyDir; a restart loses only annotations and alert-state history.
  rootUrl: ""    # set to https://<domain>/grafana when fronted by an ingress
  # The ConfigMap is rendered from the canonical dashboard files and read back by
  # deploy/scripts/monitoring-config-apply.sh.
  dashboardsConfigMap: grafana-dashboards
  resources:
    requests:
      cpu: 50m
      memory: 64Mi
    limits:
      cpu: 500m
      memory: 256Mi

promtail:
  image: docker.io/grafana/promtail:3.5.0
  # Runs as root where /var/log/pods is root-only; values-production.yaml sets that for OKE.
  runAsRoot: false
  # The working set runs 90–110 MiB, under the 70% line where the memory alert clears.
  resources:
    requests:
      cpu: 50m
      memory: 128Mi
    limits:
      cpu: 250m
      memory: 256Mi

nodeExporter:
  image: docker.io/prom/node-exporter:v1.9.1
  resources:
    requests:
      cpu: 50m
      memory: 16Mi
    limits:
      cpu: 250m
      memory: 64Mi

# Uptime monitoring is external, probing /healthz from off-cluster, so the chart has no uptime pod.
