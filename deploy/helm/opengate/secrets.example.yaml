# Example only: the chart references an existing Secret (server.existingSecret) created
# out-of-band; never commit real values or `helm install` this file.
apiVersion: v1
kind: Secret
metadata:
  name: opengate-secrets
  namespace: opengate
type: Opaque
stringData:
  JWT_SECRET: "CHANGE_ME"
  POSTGRES_PASSWORD: "CHANGE_ME"
  POSTGRES_APP_PASSWORD: "CHANGE_ME"
  AMT_PASS: "CHANGE_ME"
  VAPID_CONTACT: "mailto:ops@example.com"
  # Write-only OCI Object Storage pre-authenticated request base URL ending in /o/, needed only
  # when postgres.backup.enabled.
  BACKUP_PAR_URL: "CHANGE_ME"
