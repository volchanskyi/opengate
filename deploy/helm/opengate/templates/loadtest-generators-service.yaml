{{- if .Values.loadTest.generators.enabled -}}
# Names a load run's generator pods so the server can trust their presented addresses by service.
# The port is declared because a service with none publishes no endpoints.
apiVersion: v1
kind: Service
metadata:
  name: {{ include "opengate.fullname" . }}-loadtest-generators
  labels:
    {{- include "opengate.labels" . | nindent 4 }}
    app.kubernetes.io/component: loadtest-generators
spec:
  type: ClusterIP
  selector:
    {{ .Values.loadTest.generators.label }}: "true"
  ports:
    - name: unused
      port: 1
      targetPort: 1
      protocol: TCP
{{- end }}
