{{- if .Values.loadTest.serviceAccount.enabled -}}
# An administrator a load run's cleanup does not remove.
#
# Every account in the staging database is made by a load run, and the run that
# follows removes them all. The enrollment token a run mints has to be created
# by an administrator, and picking "the oldest administrator in the table" picks
# one of those — so the night after a cleanup finally works, there is nobody to
# mint against and the machine half of the run spends a token that was never
# written.
#
# This account is outside that cycle. No run creates it, the cleanup is written
# to leave it alone, and the deployment puts it back on every upgrade, which
# matters here because the staging database rides an emptyDir and starts empty
# whenever its pod restarts.
#
# It signs in. A fixture is built through the same interface a technician uses,
# and creating a customer, a site or an enrollment token is administrator work,
# so a run has to hold an administrator session. The password is generated by the
# chart into a secret beside this job, is stable for the life of the release, and
# is written down nowhere — the hash stored here is computed inside the database
# from that secret and the plaintext never leaves the cluster except into a
# masked workflow variable.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "opengate.fullname" . }}-loadtest-account
  labels:
    {{- include "opengate.labels" . | nindent 4 }}
    app.kubernetes.io/component: loadtest-account
  annotations:
    # After the server, because the server owns the schema: the users table does
    # not exist until it has run its migrations.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  # The hook holds the release open while it runs, so it is bounded.
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "opengate.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: loadtest-account
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: {{ .Values.postgres.image }}
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.existingSecret }}
                  key: POSTGRES_PASSWORD
            - name: PGHOST
              value: {{ include "opengate.postgres.fullname" . }}
            - name: ACCOUNT_EMAIL
              value: {{ .Values.loadTest.serviceAccount.email | quote }}
            - name: ACCOUNT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "opengate.fullname" . }}-loadtest-account
                  key: password
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              # The server migrates on start and this hook can win the race, so
              # it waits for the table rather than failing on its absence.
              i=0
              until psql -U opengate -d opengate -tAc \
                "SELECT to_regclass('public.users') IS NOT NULL" | grep -q '^t$'; do
                i=$((i + 1))
                if [ "$i" -ge 60 ]; then
                  echo "users table never appeared; the server has not migrated" >&2
                  exit 1
                fi
                sleep 2
              done

              psql -U opengate -d opengate -v ON_ERROR_STOP=1 -q \
                -v email="$ACCOUNT_EMAIL" <<'SQL'
              \getenv account_password ACCOUNT_PASSWORD

              -- The server hashes with bcrypt at cost 10, and pgcrypto's 'bf'
              -- produces exactly that, so the hash written here is one the
              -- server's own comparison accepts. Hashing inside the database
              -- keeps the plaintext off every command line in this pod.
              CREATE EXTENSION IF NOT EXISTS pgcrypto;

              -- The well-known ids the server itself uses: the default tenant
              -- and the Administrators group. Membership of that group is what
              -- makes an account an administrator; users.is_admin mirrors it.
              INSERT INTO users (id, tenant_id, email, password_hash, display_name, is_admin)
              VALUES (
                '00000000-0000-0000-0000-00000000000a',
                '00000000-0000-0000-0000-000000000002',
                :'email',
                crypt(:'account_password', gen_salt('bf', 10)),
                'Load-test service account',
                TRUE
              )
              ON CONFLICT (email) DO UPDATE
                SET password_hash = crypt(:'account_password', gen_salt('bf', 10)),
                    is_admin      = TRUE;

              INSERT INTO security_group_members (group_id, user_id, tenant_id)
              SELECT '00000000-0000-0000-0000-000000000001', u.id, u.tenant_id
              FROM users u
              WHERE u.email = :'email'
              ON CONFLICT DO NOTHING;
              SQL

              echo "load-test service account present: $ACCOUNT_EMAIL"
          resources:
            {{- toYaml .Values.loadTest.serviceAccount.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
{{- end }}
