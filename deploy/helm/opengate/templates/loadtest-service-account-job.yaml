{{- if .Values.loadTest.serviceAccount.enabled -}}
# An administrator outside the load-run cleanup cycle, reseeded on every upgrade from
# files/loadtest-account.sql; the hash is computed in the database from a chart-generated secret.
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "opengate.fullname" . }}-loadtest-account
  labels:
    {{- include "opengate.labels" . | nindent 4 }}
    app.kubernetes.io/component: loadtest-account
  annotations:
    # Runs after the release's resources are created, on install and on upgrade.
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation,hook-succeeded
spec:
  backoffLimit: 3
  # The hook holds the release open while it runs, so it is bounded.
  activeDeadlineSeconds: 300
  template:
    metadata:
      labels:
        {{- include "opengate.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: loadtest-account
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: seed
          image: {{ .Values.postgres.image }}
          env:
            - name: PGPASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.existingSecret }}
                  key: POSTGRES_PASSWORD
            - name: PGHOST
              value: {{ include "opengate.postgres.fullname" . }}
            - name: ACCOUNT_EMAIL
              value: {{ .Values.loadTest.serviceAccount.email | quote }}
            - name: ACCOUNT_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ include "opengate.fullname" . }}-loadtest-account
                  key: password
          command:
            - /bin/sh
            - -c
            - |
              set -eu

              # The server migrates on start and this hook can win the race,
              # so it waits until the users table exists.
              i=0
              until psql -U opengate -d opengate -tAc \
                "SELECT to_regclass('public.users') IS NOT NULL" | grep -q '^t$'; do
                i=$((i + 1))
                if [ "$i" -ge 60 ]; then
                  echo "users table never appeared; the server has not migrated" >&2
                  exit 1
                fi
                sleep 2
              done

              psql -U opengate -d opengate -v ON_ERROR_STOP=1 -q <<'SQL'
              \getenv email ACCOUNT_EMAIL
              \getenv account_password ACCOUNT_PASSWORD
{{ .Files.Get "files/loadtest-account.sql" | indent 14 }}
              SQL

              echo "load-test service account present: $ACCOUNT_EMAIL"
          resources:
            {{- toYaml .Values.loadTest.serviceAccount.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
{{- end }}
