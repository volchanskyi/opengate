{{- if .Values.loadTest.serviceAccount.enabled -}}
# The password for the account the job beside this one seeds.
#
# Generated here rather than written down anywhere: the chart makes one on first
# install and reads the existing one back on every upgrade, so it is stable for
# as long as the release lives and appears in no file, no repository and no
# person's notes. A load run reads it from this secret; nothing else does.
#
# It exists because a fixture is built through the same interface a technician
# uses, and creating a customer, a site or an enrollment token is administrator
# work. A run therefore has to sign in, and signing in needs a password.
{{- $name := printf "%s-loadtest-account" (include "opengate.fullname" .) }}
{{- $existing := lookup "v1" "Secret" .Release.Namespace $name }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}
  labels:
    {{- include "opengate.labels" . | nindent 4 }}
    app.kubernetes.io/component: loadtest-account
type: Opaque
data:
  {{- if and $existing $existing.data.password }}
  password: {{ $existing.data.password }}
  {{- else }}
  password: {{ randAlphaNum 40 | b64enc | quote }}
  {{- end }}
{{- end }}
