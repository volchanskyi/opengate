{{- if .Values.postgres.backup.enabled -}}
# Streams the dump off-cluster to object storage through a write-only pre-authenticated URL.
# An init container dumps and the main container uploads, sharing an emptyDir.
apiVersion: batch/v1
kind: CronJob
metadata:
  name: {{ include "opengate.postgres.fullname" . }}-backup
  labels:
    {{- include "opengate.labels" . | nindent 4 }}
    app.kubernetes.io/component: postgres-backup
spec:
  schedule: {{ .Values.postgres.backup.schedule | quote }}
  concurrencyPolicy: Forbid
  successfulJobsHistoryLimit: 3
  failedJobsHistoryLimit: 3
  jobTemplate:
    spec:
      backoffLimit: 2
      template:
        metadata:
          labels:
            {{- include "opengate.selectorLabels" . | nindent 12 }}
            app.kubernetes.io/component: postgres-backup
        spec:
          restartPolicy: Never
          automountServiceAccountToken: false
          securityContext:
            runAsNonRoot: true
            runAsUser: 70
            runAsGroup: 70
            fsGroup: 70
            seccompProfile:
              type: RuntimeDefault
          initContainers:
            # Dumps and gzips into the shared emptyDir; the postgres image has no curl.
            - name: dump
              image: {{ .Values.postgres.image }}
              env:
                - name: PGPASSWORD
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.server.existingSecret }}
                      key: POSTGRES_PASSWORD
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  pg_dump -h {{ include "opengate.postgres.fullname" . }} -U opengate opengate | gzip > /work/opengate.sql.gz
                  echo "dump complete: $(ls -l /work/opengate.sql.gz)"
              resources:
                {{- toYaml .Values.postgres.backup.resources | nindent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: work
                  mountPath: /work
          containers:
            # The upload URL is write-only, so a leaked token cannot read existing backups.
            - name: upload
              image: {{ .Values.postgres.backup.uploadImage }}
              env:
                - name: BACKUP_PAR_URL
                  valueFrom:
                    secretKeyRef:
                      name: {{ .Values.server.existingSecret }}
                      key: BACKUP_PAR_URL
              command:
                - /bin/sh
                - -c
                - |
                  set -eu
                  OBJ="opengate-$(date -u +%Y%m%d-%H%M%S).sql.gz"
                  curl -fsS --retry 3 --retry-connrefused \
                    -H "Content-Type: application/gzip" \
                    --upload-file /work/opengate.sql.gz \
                    "${BACKUP_PAR_URL}${OBJ}"
                  echo "uploaded: ${OBJ}"
              resources:
                {{- toYaml .Values.postgres.backup.resources | nindent 16 }}
              securityContext:
                allowPrivilegeEscalation: false
                readOnlyRootFilesystem: true
                capabilities:
                  drop:
                    - ALL
              volumeMounts:
                - name: work
                  mountPath: /work
          volumes:
            - name: work
              emptyDir: {}
{{- end }}
