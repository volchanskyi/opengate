apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "opengate.fullname" . }}-server
  labels:
    {{- include "opengate.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  replicas: {{ .Values.server.replicas }}
  strategy:
    {{- if and .Values.server.sharedKeys.enabled (not .Values.server.hostPortL4) }}
    type: RollingUpdate
    {{- else }}
    # Recreate releases the old pod first: hostPort binds and an RWO PVC cannot be shared by two pods.
    type: Recreate
    {{- end }}
  selector:
    matchLabels:
      {{- include "opengate.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: server
  template:
    metadata:
      labels:
        {{- include "opengate.selectorLabels" . | nindent 8 }}
        app.kubernetes.io/component: server
    spec:
      serviceAccountName: {{ include "opengate.serviceAccountName" . }}
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 65532
        runAsGroup: 65532
        fsGroup: 65532
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: server
          image: "{{ .Values.image.repository }}:{{ .Values.image.tag }}"
          imagePullPolicy: {{ .Values.image.pullPolicy }}
          args:
            - "-listen"
            - ":{{ .Values.server.httpPort }}"
            - "-internal-listen"
            - ":{{ .Values.server.metricsPort }}"
            - "-quic-listen"
            - ":{{ .Values.server.quicPort }}"
            - "-mps-listen"
            - ":{{ .Values.server.mpsPort }}"
            - "-data-dir"
            - "/data"
            - "-web-dir"
            - "{{ .Values.server.webDir }}"
            - "-amt-user"
            - "{{ .Values.server.amtUser }}"
            - "-amt-pass"
            - "$(AMT_PASS)"
            - "-vapid-contact"
            - "$(VAPID_CONTACT)"
          env:
            # POSTGRES_APP_PASSWORD precedes DATABASE_URL so Kubernetes resolves the reference.
            - name: POSTGRES_APP_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.existingSecret }}
                  key: POSTGRES_APP_PASSWORD
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.existingSecret }}
                  key: JWT_SECRET
            - name: AMT_PASS
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.existingSecret }}
                  key: AMT_PASS
            - name: VAPID_CONTACT
              valueFrom:
                secretKeyRef:
                  name: {{ .Values.server.existingSecret }}
                  key: VAPID_CONTACT
            {{- if .Values.server.githubRepo }}
            - name: OPENGATE_GITHUB_REPO
              value: {{ .Values.server.githubRepo | quote }}
            {{- end }}
            # Added to the server certificate SAN; defaults to the Service name in-cluster agents dial.
            - name: OPENGATE_QUIC_HOST
              value: {{ .Values.server.quicHost | default (printf "%s-server" (include "opengate.fullname" .)) | quote }}
            {{- if .Values.server.baseURL }}
            - name: OPENGATE_BASE_URL
              value: {{ .Values.server.baseURL | quote }}
            {{- end }}
            {{- if .Values.server.trustedProxies }}
            # Peers whose X-Forwarded-For is trusted, joined into one comma-separated variable.
            - name: OPENGATE_TRUSTED_PROXIES
              value: {{ join "," .Values.server.trustedProxies | quote }}
            {{- end }}
            {{- if .Values.server.logLevel }}
            - name: LOG_LEVEL
              value: {{ .Values.server.logLevel | quote }}
            {{- end }}
            {{- if .Values.server.victoriaMetricsURL }}
            - name: OPENGATE_VICTORIAMETRICS_URL
              value: {{ .Values.server.victoriaMetricsURL | quote }}
            {{- end }}
            # The environment the server stamps onto every reading it writes to the shared store.
            - name: OPENGATE_NAMESPACE
              valueFrom:
                fieldRef:
                  fieldPath: metadata.namespace
            - name: DATABASE_URL
              value: "postgres://opengate_app:$(POSTGRES_APP_PASSWORD)@{{ include "opengate.postgres.fullname" . }}:5432/opengate?sslmode=disable"
          ports:
            - name: http
              containerPort: {{ .Values.server.httpPort }}
              protocol: TCP
            - name: metrics
              containerPort: {{ .Values.server.metricsPort }}
              protocol: TCP
            - name: quic
              containerPort: {{ .Values.server.quicPort }}
              protocol: UDP
              {{- if .Values.server.hostPortL4 }}
              hostPort: {{ .Values.server.quicPort }}
              {{- end }}
            - name: mps
              containerPort: {{ .Values.server.mpsPort }}
              protocol: TCP
              {{- if .Values.server.hostPortL4 }}
              hostPort: {{ .Values.server.mpsPort }}
              {{- end }}
          livenessProbe:
            httpGet:
              path: /healthz
              port: http
            initialDelaySeconds: 10
            periodSeconds: 30
          readinessProbe:
            httpGet:
              path: /api/v1/health
              port: http
            initialDelaySeconds: 5
            periodSeconds: 10
          resources:
            {{- toYaml .Values.server.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          volumeMounts:
            - name: data
              mountPath: /data
            {{- if .Values.server.sharedKeys.enabled }}
            # Shared keypairs mount read-only over /data so every replica serves the same keys.
            - name: keys
              mountPath: /data/ca.crt
              subPath: ca.crt
              readOnly: true
            - name: keys
              mountPath: /data/ca.key
              subPath: ca.key
              readOnly: true
            - name: keys
              mountPath: /data/vapid.json
              subPath: vapid.json
              readOnly: true
            - name: keys
              mountPath: /data/update-signing.json
              subPath: update-signing.json
              readOnly: true
            {{- end }}
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          {{- if or .Values.server.sharedKeys.enabled (not .Values.server.dataVolume.persistent) }}
          # An emptyDir holds /data when keys come from a Secret or persistence is off.
          emptyDir: {}
          {{- else }}
          persistentVolumeClaim:
            claimName: {{ include "opengate.fullname" . }}-server-data
          {{- end }}
        {{- if .Values.server.sharedKeys.enabled }}
        - name: keys
          secret:
            secretName: {{ .Values.server.existingSecret }}
            items:
              - key: ca.crt
                path: ca.crt
              - key: ca.key
                path: ca.key
              - key: vapid.json
                path: vapid.json
              - key: update-signing.json
                path: update-signing.json
        {{- end }}
        - name: tmp
          emptyDir: {}
