apiVersion: v1
kind: Service
metadata:
  name: {{ include "opengate.fullname" . }}-server
  labels:
    {{- include "opengate.labels" . | nindent 4 }}
    app.kubernetes.io/component: server
spec:
  type: ClusterIP
  selector:
    {{- include "opengate.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: server
  ports:
    - name: http
      port: {{ .Values.server.httpPort }}
      targetPort: http
      protocol: TCP
    # The exposition and the profiler. The Service publishes them so a scraper
    # and a port-forward can reach them; the Ingress routes only the http port,
    # which is what keeps them off the public edge.
    - name: metrics
      port: {{ .Values.server.metricsPort }}
      targetPort: metrics
      protocol: TCP
