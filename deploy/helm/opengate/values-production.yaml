# Production overlay: real domain, HSTS on and the Let's Encrypt production issuer.

domain: opengate.cloudisland.net

server:
  # Requests equal limits, which puts this pod last in the kubelet's eviction order.
  resources:
    requests:
      cpu: 250m
      memory: 384Mi
    limits:
      cpu: 250m
      memory: 384Mi
  # The CA, VAPID and signing keys come from existingSecret, so every replica and redeploy
  # serves the same material and enrolled agents keep mTLS.
  sharedKeys:
    enabled: true
  # Agents dial quicHost:quicPort directly, bypassing the CDN, and validate the certificate.
  quicHost: quic.opengate.cloudisland.net
  baseURL: https://opengate.cloudisland.net

ingress:
  tls: true
  hsts: true

certManager:
  issuerName: letsencrypt-prod
  server: https://acme-v02.api.letsencrypt.org/directory

postgres:
  # Memory requests equal limits for last-in-line eviction; the CPU ceiling is a whole
  # processor because its bursts were throttled under a 250m cap.
  resources:
    requests:
      cpu: 175m
      memory: 384Mi
    limits:
      cpu: "1"
      memory: 384Mi
  backup:
    enabled: true
    keepDays: 7
