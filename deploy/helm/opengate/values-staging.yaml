# Staging overlay: a separate release and namespace beside production.

domain: staging.opengate.example.com

ingress:
  tls: false
  hsts: false

certManager:
  issuerName: letsencrypt-staging
  server: https://acme-staging-v02.api.letsencrypt.org/directory

server:
  # Production already binds the QUIC and MPS hostPorts on the shared node, so a second
  # pod would stay Pending; staging is reached by port-forward instead.
  hostPortL4: false
  # The edge, and the load-run generator service, which exists in this environment alone.
  trustedProxies:
    - ingress-nginx-controller.ingress-nginx
    - opengate-staging-loadtest-generators.opengate-staging
  # Production's own shape, with requests equal to limits so the pod is not evicted early
  # during a load run.
  resources:
    requests:
      cpu: 250m
      memory: 384Mi
    limits:
      cpu: 250m
      memory: 384Mi
  dataVolume:
    # /data rides an emptyDir; e2e and smoke re-enroll against the fresh CA each run.
    persistent: false
    size: 1Gi

postgres:
  # Production's processor shape: a 250m ceiling throttled this database during load runs.
  resources:
    requests:
      cpu: 175m
    limits:
      cpu: "1"
      memory: 384Mi
  storage:
    # The database rides an emptyDir; e2e and smoke seed their own fixtures.
    persistent: false
    size: 5Gi
  backup:
    enabled: false

# The database starts empty on every pod restart, so the account is re-seeded on each deployment.
loadTest:
  generators:
    enabled: true
  serviceAccount:
    enabled: true
