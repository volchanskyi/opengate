# Default values for the opengate chart; secrets come from `existingSecret`, never from here.

nameOverride: ""
fullnameOverride: ""

# Public hostname the ingress answers on. Overridden per environment.
domain: opengate.example.com

image:
  repository: ghcr.io/volchanskyi/opengate-server
  # Overridden by CD (`--set image.tag=sha-…`). Concrete tags only — the k8s
  # policy (policy/k8s/security.rego) denies `:latest`.
  tag: v0.24.0
  pullPolicy: IfNotPresent

serviceAccount:
  create: true
  name: ""

server:
  replicas: 1
  httpPort: 8080            # HTTP API + SPA (behind ingress)
  metricsPort: 8081         # Prometheus exposition + pprof (ClusterIP only, never the ingress)
  quicPort: 9090            # QUIC agent transport (UDP, L4)
  mpsPort: 4433            # Intel AMT CIRA / MPS (TCP, L4)
  webDir: /srv/web          # server serves the SPA itself (api.go os.OpenRoot)
  amtUser: admin
  # The repository whose releases feed the agent-update manifests and the served install.sh.
  githubRepo: volchanskyi/opengate
  # Public hostname of the QUIC listener, added to the server certificate SAN.
  # Empty leaves a localhost-only certificate that agents reject.
  quicHost: ""
  # Proxies whose X-Forwarded-For picks the rate-limit identity: a "<service>.<namespace>" or a range.
  # A service name tracks the controller pod across replacements; empty trusts no proxy.
  trustedProxies:
    - ingress-nginx-controller.ingress-nginx
  # Public base URL baked into the served install.sh as SERVER_URL.
  baseURL: ""
  # Server log verbosity; "debug" enables verbose logging, anything else is info.
  logLevel: ""
  # VictoriaMetrics base URL for Edge Sentinel numeric telemetry ingestion.
  # Empty disables numeric writes; process snapshots still use Postgres RLS.
  victoriaMetricsURL: "http://monitoring-victoriametrics.monitoring.svc:8428"
  # Binds QUIC and MPS to the node through hostPort, which preserves the client source IP.
  hostPortL4: true
  # Secret holding JWT_SECRET, POSTGRES_PASSWORD, POSTGRES_APP_PASSWORD, AMT_PASS and VAPID_CONTACT.
  existingSecret: opengate-secrets
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  # /data holds the CA, VAPID and signing keys; `persistent: false` swaps its PVC for an emptyDir.
  dataVolume:
    persistent: true
    storageClass: oci-bv
    size: 1Gi
  # Every replica serves the same CA, VAPID and signing keys, mounted read-only from existingSecret.
  # Enabling it makes /data an emptyDir and the rollout a RollingUpdate.
  sharedKeys:
    enabled: false

postgres:
  # Fully-qualified registry path: cri-o nodes run short-name-mode=enforcing and reject bare names.
  image: docker.io/library/postgres:17-alpine
  resources:
    requests:
      cpu: 100m
      memory: 128Mi
    limits:
      cpu: "1"
      memory: 512Mi
  # Runs in a pod of its own in the same namespace, so readings carry the environment name.
  exporter:
    image: docker.io/prometheuscommunity/postgres-exporter:v0.20.1
    resources:
      requests:
        cpu: 5m
        memory: 16Mi
      limits:
        cpu: 100m
        memory: 32Mi
  storage:
    # `persistent: false` swaps the volumeClaimTemplate for an emptyDir that resets on restart.
    persistent: true
    storageClass: oci-bv
    size: 10Gi
  backup:
    enabled: true
    schedule: "@daily"
    # The upload container image; the dump runs in the postgres image, which has no curl.
    uploadImage: docker.io/curlimages/curl:8.11.1
    # Retention is a lifecycle policy on the bucket; keepDays records its threshold.
    keepDays: 7
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 250m
        memory: 64Mi

ingress:
  enabled: true
  className: nginx
  tls: true
  hsts: true
  # Folded to stay under the yamllint line-length cap; breaks fall on single spaces.
  csp: >-
    default-src 'self'; script-src 'self' 'wasm-unsafe-eval';
    style-src 'self' 'unsafe-inline'; img-src 'self' data: https:;
    font-src 'self'; connect-src 'self' wss:; frame-ancestors 'none'
  permissionsPolicy: "camera=(), microphone=(), geolocation=(), payment=()"

certManager:
  create: true
  issuerName: letsencrypt-prod
  email: admin@opengate.example.com   # ACME registration contact; override per environment
  server: https://acme-v02.api.letsencrypt.org/directory

# The account a nightly load run mints its enrollment token against; on only where a run may write.
loadTest:
  # Generators are named by a service because the run creates and destroys their pods.
  generators:
    enabled: false
    label: opengate.io/loadtest-generator
  serviceAccount:
    enabled: false
    email: opengate-service@service.invalid
    resources:
      requests:
        cpu: 50m
        memory: 32Mi
      limits:
        cpu: 200m
        memory: 64Mi
