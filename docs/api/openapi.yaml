openapi: "3.0.3"
info:
  title: OpenGate API
  version: "1.0.0"
  description: Remote device management and relay API

servers:
  - url: /

security: []

components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT

  schemas:
    ApiError:
      type: object
      required: [error]
      properties:
        error:
          type: string

    RegisterRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1
        display_name:
          type: string

    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email:
          type: string
          format: email
        password:
          type: string
          minLength: 1

    TokenResponse:
      type: object
      required: [token]
      properties:
        token:
          type: string

    ClientErrorReport:
      type: object
      required: [message]
      description: >-
        Browser-side error report for server-side log ingestion. Must never
        contain tokens, credentials, or PII; the stack is truncated client-side.
      properties:
        message:
          type: string
          maxLength: 1000
        source:
          type: string
          maxLength: 200
        stack:
          type: string
          maxLength: 500
        url:
          type: string
          maxLength: 500
        user_agent:
          type: string
          maxLength: 300

    User:
      type: object
      required: [id, email, display_name, is_admin, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        email:
          type: string
        display_name:
          type: string
        is_admin:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Organization:
      type: object
      required: [id, name, created_at, updated_at]
      description: >-
        One customer inside a tenant. The tenant is the boundary the database
        enforces; an organization is who the work is for, and every device
        belongs to exactly one. Names are unique within a tenant.
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        archived_at:
          type: string
          format: date-time
          description: >-
            Set when the customer is retired. An archived organization keeps its
            devices and its history and is simply out of the working set.
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateOrganizationRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string

    UpdateOrganizationRequest:
      type: object
      description: >-
        A rename, an archive/restore, or both. An omitted field is left alone.
      properties:
        name:
          type: string
        archived:
          type: boolean

    MoveDeviceOrganizationRequest:
      type: object
      required: [organization_id]
      properties:
        organization_id:
          type: string
          format: uuid

    Device:
      type: object
      required: [id, organization_id, site_id, hostname, os, agent_version, capabilities, status, last_seen, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
          description: >-
            The customer this device belongs to. Never absent: a device written
            without one named takes its tenant's own organization.
        site_id:
          type: string
          format: uuid
        hostname:
          type: string
        os:
          type: string
        os_display:
          type: string
        agent_version:
          type: string
        capabilities:
          type: array
          items:
            type: string
        status:
          type: string
          enum: [online, offline, connecting]
        last_seen:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        anomaly_rate:
          type: number
          description: >-
            Latest edge-node anomaly rate in [0,1] from telemetry, for the fleet
            health badge. Omitted when the device has no recent sample.
        maintenance_on:
          type: boolean
          description: >-
            Whether the device is in maintenance mode: a server-authoritative
            suppression state an administrator toggles while doing disruptive
            host work. Telemetry and alerting are suppressed; remote management
            stays available. Defaults to false (Active).
        maintenance_since:
          type: string
          format: date-time
          description: >-
            When the device entered maintenance. Present only while
            maintenance_on is true.
        maintenance_by:
          type: string
          format: uuid
          description: >-
            Id of the user who set the current maintenance state. Present only
            while maintenance_on is true.
        maintenance_reason:
          type: string
          description: >-
            Operator-supplied reason for the current maintenance window. Present
            only while maintenance_on is true.
        amt:
          $ref: "#/components/schemas/DeviceAMT"

    DeviceAMT:
      type: object
      required: [available]
      description: >-
        The device's Intel AMT property, read alongside the device row. Omitted
        entirely when the device neither supports AMT nor has an AMT connection.
      properties:
        available:
          type: boolean
          description: >-
            Whether the hardware supports Intel AMT, as reported by the agent
            from the host's Management Engine interface. Independent of
            connection state, so the AMT badge never flickers.
        status:
          type: string
          enum: [online, offline]
          description: >-
            CIRA connection state. Absent until an AMT connection has been linked
            to this device.
        uuid:
          type: string
          format: uuid
          description: >-
            The AMT device's CIRA identity, which power commands address. Absent
            until an AMT connection has been linked to this device.

    SetMaintenanceRequest:
      type: object
      required: [enabled]
      properties:
        enabled:
          type: boolean
          description: Desired maintenance state — true to suppress, false to resume.
        reason:
          type: string
          description: Optional operator note recorded while entering maintenance.

    DeviceSummary:
      type: object
      description: >-
        Fixed-size fleet rollup for the dashboard tiles. Always describes the
        caller's own tenant, administrators included, so the status counts
        and the health bands cover one device set.
      required: [total, online, offline, maintenance, health]
      properties:
        total:
          type: integer
          description: Devices in the tenant.
        online:
          type: integer
          description: Devices with a live agent connection.
        offline:
          type: integer
          description: total − online; a connecting device counts as offline.
        maintenance:
          type: integer
          description: Devices currently in maintenance mode.
        health:
          $ref: "#/components/schemas/FleetHealthCounts"

    FleetHealthCounts:
      type: object
      description: >-
        Devices per edge-health band, classified by the latest node anomaly
        rate. unknown is total minus the three measured bands — the devices that
        reported no rate in the badge lookback window.
      required: [anomalous, watch, healthy, unknown]
      properties:
        anomalous:
          type: integer
        watch:
          type: integer
        healthy:
          type: integer
        unknown:
          type: integer

    PurgeJob:
      type: object
      description: >-
        Progress of a right-to-be-forgotten telemetry purge. "Logical" states
        mean ingest is blocked and the subject is no longer queryable; physical
        VictoriaMetrics compaction and offline-edge erasure complete later.
      required: [id, tenant_id, scope, state, vm_deleted, object_deleted, pg_deleted, verified, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        tenant_id:
          type: string
          format: uuid
        device_id:
          type: string
          format: uuid
          description: Absent for a tenant-wide purge.
        scope:
          type: string
          enum: [device, tenant]
        state:
          type: string
          enum:
            - requested
            - central-logical-complete
            - central-physical-compaction-pending
            - object-delete-pending
            - edge-erase-pending
            - complete
        vm_deleted:
          type: boolean
        object_deleted:
          type: boolean
        pg_deleted:
          type: boolean
        verified:
          type: boolean
        last_error:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time
        completed_at:
          type: string
          format: date-time

    RestartDeviceRequest:
      type: object
      properties:
        reason:
          type: string
          minLength: 1
          maxLength: 512
          description: >-
            Why the agent is being restarted, recorded in the audit trail and
            forwarded to the agent. Omit the field to use the server default; a
            supplied reason must carry at least one non-whitespace character.

    MetricSeries:
      type: object
      required: [name, avg, min_max_source]
      properties:
        name:
          type: string
          description: Numeric dimension name (e.g. cpu.util). Never a process basename or cmdline.
        avg:
          type: array
          items:
            type: number
            format: double
            nullable: true
          description: Central average per bucket, aligned 1:1 with the response t array; null for a bucket with no sample.
        min:
          type: array
          items:
            type: number
            format: double
            nullable: true
          description: Lower band per bucket, aligned with t. Present only when min_max_source is not none.
        max:
          type: array
          items:
            type: number
            format: double
            nullable: true
          description: Upper band per bucket, aligned with t. Present only when min_max_source is not none.
        min_max_source:
          type: string
          enum: [local, avg_of_60s, none]
          description: >-
            Provenance of the band. local = true host min/max from an on-demand
            local-history pull; avg_of_60s = min/max across the 60 s averages in
            the bucket (not host extrema); none = avg line only, no band.

    MetricRangeResponse:
      type: object
      required: [t, series, downsampled, bucket_s]
      properties:
        t:
          type: array
          items:
            type: integer
            format: int64
          description: >-
            Bucket timestamps in unix seconds, ascending, evenly spaced by
            bucket_s. Aligns 1:1 with each series. The axis comes from the
            requested window, not from what the store holds: it always carries
            (to - from) / bucket_s buckets, so a window over a device with
            little data renders that window with nulls rather than collapsing to
            the few buckets that had a value. The end instant is exclusive.
        series:
          type: array
          items:
            $ref: "#/components/schemas/MetricSeries"
        downsampled:
          type: boolean
          description: True when the server collapsed raw samples into buckets to honor max_points.
        bucket_s:
          type: integer
          description: Bucket width in seconds (the query step) chosen to keep points within max_points.

    HistoryPoint:
      type: object
      required: [ts, value]
      properties:
        ts:
          type: integer
          format: int64
          description: Sample timestamp in unix seconds.
        value:
          type: number
          format: double
          description: The full-resolution sample value at ts.

    DeviceHistoryResponse:
      type: object
      required: [dim, points, truncated]
      properties:
        dim:
          type: string
          description: The dimension this history slice is for.
        points:
          type: array
          items:
            $ref: "#/components/schemas/HistoryPoint"
          description: Full-resolution points in ascending timestamp order.
        truncated:
          type: boolean
          description: True when the window held more than max_points samples and the response was capped.

    DeviceHardware:
      type: object
      required: [device_id, cpu_model, cpu_cores, ram_total_mb, disk_total_mb, disk_free_mb, network_interfaces, updated_at]
      properties:
        device_id:
          type: string
          format: uuid
        cpu_model:
          type: string
        cpu_cores:
          type: integer
        ram_total_mb:
          type: integer
          format: int64
        disk_total_mb:
          type: integer
          format: int64
        disk_free_mb:
          type: integer
          format: int64
        network_interfaces:
          type: array
          items:
            $ref: "#/components/schemas/NetworkInterfaceInfo"
        updated_at:
          type: string
          format: date-time
        amt_available:
          type: boolean
          description: Whether the host exposes an Intel Management Engine interface.
        amt_version:
          type: string
          description: ME/AMT firmware version read by the agent over the MEI interface.
        amt_model:
          type: string
          description: Machine model read from the device over its AMT connection.
        amt_firmware:
          type: string
          description: AMT firmware version read from the device over its AMT connection.

    NetworkInterfaceInfo:
      type: object
      required: [name, mac, ipv4, ipv6]
      properties:
        name:
          type: string
        mac:
          type: string
        ipv4:
          type: array
          items:
            type: string
        ipv6:
          type: array
          items:
            type: string

    DeviceInventory:
      type: object
      required: [device_id, items]
      properties:
        device_id:
          type: string
          format: uuid
        items:
          type: array
          items:
            $ref: "#/components/schemas/InventoryItem"

    InventoryItem:
      type: object
      required: [kind, name, version, port, proto, state, runtime, image, first_seen, last_seen]
      properties:
        kind:
          type: string
          enum: [port, service, db_engine, container, package]
        name:
          type: string
          description: >-
            Primary label — owning process (port), unit (service), engine
            (db_engine), or the name (container / package).
        version:
          type: string
        port:
          type: integer
          description: Listening or engine port; 0 when not applicable to the kind.
        proto:
          type: string
        state:
          type: string
        runtime:
          type: string
        image:
          type: string
        first_seen:
          type: string
          format: date-time
        last_seen:
          type: string
          format: date-time

    DeviceLogsResponse:
      type: object
      required: [entries, total, has_more]
      properties:
        entries:
          type: array
          items:
            $ref: "#/components/schemas/DeviceLogEntry"
        total:
          type: integer
        has_more:
          type: boolean
        available_units:
          type: array
          description: >-
            Distinct emitting units the host source offers for the unit filter
            dropdown (systemd units). Empty for the agent's own files and where
            no host source exists.
          items:
            type: string

    DeviceLogEntry:
      type: object
      required: [timestamp, level, target, message]
      properties:
        timestamp:
          type: string
        level:
          type: string
        target:
          type: string
        message:
          type: string

    UpdateDeviceRequest:
      type: object
      properties:
        site_id:
          type: string
          format: uuid
          nullable: true
          description: >-
            Destination site for the device, which must belong to the device's
            own customer. The all-zeros UUID unfiles the device, leaving it in
            its customer with no site.

    CreateSiteRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        organization_id:
          type: string
          format: uuid
          description: >-
            The customer this site belongs to. Omitted, the site goes under the
            tenant's own customer — the same no-orphan rule a device write
            follows.

    Site:
      type: object
      description: >-
        A location or department inside one customer — the narrowest level
        above the machine itself. A site is a targeting level, not an access
        boundary: the tenant scopes visibility, so every member of a tenant
        sees every site in it.
      required: [id, organization_id, name, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        organization_id:
          type: string
          format: uuid
        name:
          type: string
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    Permissions:
      type: object
      properties:
        desktop:
          type: boolean
        terminal:
          type: boolean
        file_read:
          type: boolean
        file_write:
          type: boolean
        input:
          type: boolean

    CreateSessionRequest:
      type: object
      required: [device_id]
      properties:
        device_id:
          type: string
          format: uuid
        permissions:
          $ref: "#/components/schemas/Permissions"

    CreateSessionResponse:
      type: object
      required: [token, relay_url]
      properties:
        token:
          type: string
        relay_url:
          type: string
        ice_servers:
          type: array
          items:
            $ref: "#/components/schemas/ICEServer"

    ICEServer:
      type: object
      required: [urls]
      properties:
        urls:
          type: array
          items:
            type: string
        username:
          type: string
        credential:
          type: string

    AgentSession:
      type: object
      required: [token, device_id, user_id, created_at]
      properties:
        token:
          type: string
        device_id:
          type: string
          format: uuid
        user_id:
          type: string
          format: uuid
        created_at:
          type: string
          format: date-time

    WebPushSubscribeRequest:
      type: object
      required: [endpoint, p256dh, auth]
      properties:
        endpoint:
          type: string
        p256dh:
          type: string
        auth:
          type: string

    WebPushUnsubscribeRequest:
      type: object
      required: [endpoint]
      properties:
        endpoint:
          type: string

    VapidKeyResponse:
      type: object
      required: [public_key]
      properties:
        public_key:
          type: string

    AuditEvent:
      type: object
      required: [id, user_id, action, target, details, created_at]
      properties:
        id:
          type: integer
          format: int64
        user_id:
          type: string
          format: uuid
        action:
          type: string
        target:
          type: string
        details:
          type: string
        created_at:
          type: string
          format: date-time

    UpdateUserRequest:
      type: object
      properties:
        is_admin:
          type: boolean
        display_name:
          type: string

    AMTPowerRequest:
      type: object
      required: [action]
      properties:
        action:
          type: string
          enum: [power_on, power_cycle, soft_off, hard_reset]

    AgentManifest:
      type: object
      required: [version, os, arch, url, sha256, signature, created_at]
      properties:
        version:
          type: string
        os:
          type: string
        arch:
          type: string
        url:
          type: string
        sha256:
          type: string
        signature:
          type: string
        created_at:
          type: string
          format: date-time

    PublishUpdateRequest:
      type: object
      required: [version, os, arch, url, sha256]
      properties:
        version:
          type: string
        os:
          type: string
        arch:
          type: string
        url:
          type: string
        sha256:
          type: string

    PushUpdateRequest:
      type: object
      required: [version, os, arch]
      properties:
        version:
          type: string
        os:
          type: string
        arch:
          type: string
        device_ids:
          type: array
          items:
            type: string
            format: uuid

    PushUpdateResponse:
      type: object
      required: [pushed_count]
      properties:
        pushed_count:
          type: integer

    DeviceUpdate:
      type: object
      required: [id, device_id, version, status, error, pushed_at]
      properties:
        id:
          type: integer
          format: int64
        device_id:
          type: string
          format: uuid
        version:
          type: string
        status:
          type: string
          enum: [pending, success, failed]
        error:
          type: string
        pushed_at:
          type: string
          format: date-time
        acked_at:
          type: string
          format: date-time

    EnrollmentToken:
      type: object
      required: [id, token, label, created_by, max_uses, use_count, expires_at, created_at]
      properties:
        id:
          type: string
          format: uuid
        token:
          type: string
        label:
          type: string
        created_by:
          type: string
          format: uuid
        max_uses:
          type: integer
        use_count:
          type: integer
        expires_at:
          type: string
          format: date-time
        created_at:
          type: string
          format: date-time

    CreateEnrollmentTokenRequest:
      type: object
      properties:
        label:
          type: string
          default: ""
        max_uses:
          type: integer
          default: 0
        expires_in_hours:
          type: integer
          default: 24

    EnrollRequest:
      type: object
      required: [csr_pem]
      properties:
        csr_pem:
          type: string
          description: PEM-encoded PKCS#10 certificate signing request

    EnrollResponse:
      type: object
      required: [ca_pem, server_addr, server_domain]
      properties:
        ca_pem:
          type: string
        cert_pem:
          type: string
          description: PEM-encoded agent certificate signed by the server CA
        server_addr:
          type: string
        server_domain:
          type: string
        update_signing_key:
          type: string
          description: Hex-encoded Ed25519 public key for verifying update signatures

    CACertResponse:
      type: object
      required: [pem]
      properties:
        pem:
          type: string

    SecurityGroup:
      type: object
      required: [id, name, description, is_system, created_at, updated_at]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        is_system:
          type: boolean
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    SecurityGroupWithMembers:
      type: object
      required: [id, name, description, is_system, created_at, updated_at, members]
      properties:
        id:
          type: string
          format: uuid
        name:
          type: string
        description:
          type: string
        is_system:
          type: boolean
        members:
          type: array
          items:
            $ref: "#/components/schemas/User"
        created_at:
          type: string
          format: date-time
        updated_at:
          type: string
          format: date-time

    CreateSecurityGroupRequest:
      type: object
      required: [name]
      properties:
        name:
          type: string
          minLength: 1
        description:
          type: string
          default: ""

    AddSecurityGroupMemberRequest:
      type: object
      required: [user_id]
      properties:
        user_id:
          type: string
          format: uuid

paths:
  /api/v1/health:
    get:
      operationId: getHealth
      summary: Health check
      responses:
        "200":
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status:
                    type: string
        "503":
          description: Service unavailable
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/client-errors:
    post:
      operationId: reportClientError
      summary: Report a browser-side error for server-side log ingestion
      description: >-
        Unauthenticated, rate-limited endpoint that records frontend crashes in
        the server log (Loki) so production client errors are observable. The
        body is size-bounded; payloads must carry no token, credential, or PII.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClientErrorReport"
      responses:
        "204":
          description: Error recorded
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/auth/register:
    post:
      operationId: register
      summary: Register a new user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RegisterRequest"
      responses:
        "201":
          description: User registered
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

  /api/v1/auth/login:
    post:
      operationId: login
      summary: Authenticate user
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Login successful
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/TokenResponse"
        "400":
          description: Invalid request
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Invalid credentials
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"
        "429":
          description: Too many failed login attempts for this account
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApiError"

