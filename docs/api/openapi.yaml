  /api/v1/devices/{id}/maintenance:
    post:
      operationId: setDeviceMaintenance
      summary: Enter or exit maintenance mode for a device
      description: >-
        Sets the server-authoritative maintenance state for a device. The state
        is persisted and pushed to the agent over the control channel; because
        maintenance is a desired state rather than a live command, this succeeds
        even when the agent is offline and reconciles on its next connect. Every
        change is audited. Requires administrator access.
      security:
        - bearerAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
