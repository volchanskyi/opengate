    blocking: false
  - series: service/server/measured
    metric: memory_percent
    max: 80
    blocking: false
  - series: service/database/measured
    metric: cpu_percent
    max: 80
    blocking: false
  - series: service/database/measured
    metric: memory_percent
    max: 80
    blocking: false
  - series: quic/register/step-500
    metric: latency_p50_ms
    max: 100
    blocking: false
  - series: quic/register/step-500
    metric: latency_p95_ms
    max: 500
    blocking: false
  - series: quic/register/step-1000
    metric: latency_p50_ms
