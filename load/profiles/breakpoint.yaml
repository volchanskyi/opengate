# The phases step up so each failing step is attributable to one load, which a ramp cannot offer.
# It runs on a disposable x86_64 runner stack, so results compare runs and claim no ARM64 capacity.
schema_version: 1
name: breakpoint
# The ladder stops at the first rung that gives, so its walk is a load of its own.
version: 3
family: breakpoint
environment: runner
fixture: small

# Every step runs five minutes so it settles and keeps arrivals under the server's refusal rate.
# The ladder may pass its venue's recorded ceiling, as `gave_out:` declares, with a rung each side.
phases:
  - name: step-500
    duration: 5m
    operator_arrivals_per_second: 5
    connected_agents: 500
    sessions: 5
  - name: step-1000
    duration: 5m
    operator_arrivals_per_second: 10
    connected_agents: 1000
    sessions: 10
  - name: step-2000
    duration: 5m
    operator_arrivals_per_second: 20
    connected_agents: 2000
    sessions: 20
  - name: step-4000
    duration: 5m
    operator_arrivals_per_second: 40
    connected_agents: 4000
    sessions: 40
  - name: step-8000
    duration: 5m
    operator_arrivals_per_second: 80
    connected_agents: 8000
    sessions: 80
  - name: step-16000
    duration: 5m
    operator_arrivals_per_second: 160
    connected_agents: 16000
    sessions: 160
  # The generator never replaces a lost machine, so the drain empties the fleet before recovery.
  - name: drain
    duration: 1m
    operator_arrivals_per_second: 0
    connected_agents: 0
    sessions: 0
  # Held at the starting load and measured, so the technicians' times, the server's and database's
  # load and the returning wave say whether the system came back on its own.
  - name: recovery
    duration: 5m
    operator_arrivals_per_second: 5
    connected_agents: 500
    sessions: 5
    measured: true

# No processor ceiling, because running the processor out is the experiment on a throwaway stack.
# The declared limits keep the room the machine needs to store what the run produces.
safety:
  max_node_memory_percent: 80
  max_error_rate: 0.25

# A rung crossing any limit is where the system gave out, and the rung below is the last that held.
# The figures sit well above the measured waits so ladder noise is not reported as a break.
gave_out:
  error_rate_above: 0.05
  latency_p95_ms_above: 2000
  target_busy_percent_above: 95

gates:
  # The rungs that held keep the ordinary promises; the rung that gave and the walk are watched.
  - series: quic/quic-agents/aggregate
    metric: error_rate
    max: 0.05
    blocking: false
  - series: quic/quic-agents/connect
    metric: latency_p95_ms
    max: 10000
    blocking: false
  - series: quic/quic-agents/register
    metric: latency_p50_ms
    max: 100
    blocking: false
  - series: quic/quic-agents/register
    metric: latency_p95_ms
    max: 500
    blocking: false
  - series: quic/quic-agents/rungs-held
    metric: error_rate
    max: 0
    blocking: true
  - series: quic/quic-agents/rungs-held
    metric: latency_p95_ms
    max: 500
    blocking: true
  - series: quic/quic-agents/rung-gave
    metric: error_rate
    max: 0
    blocking: false
  - series: quic/quic-agents/rung-gave
    metric: latency_p95_ms
    max: 500
    blocking: false
  - series: catchup/live/drain
    metric: within_5s_share
    min: 0.99
    blocking: true
  - series: k6/api-baseline/command_accept
    metric: latency_p50_ms
    max: 100
    blocking: true
  - series: k6/api-baseline/command_accept
    metric: latency_p95_ms
    max: 1000
    blocking: true
  - series: k6/api-baseline/command_accept
    metric: error_rate
    max: 0.01
    blocking: true
  - series: k6/api-baseline/device_detail
    metric: latency_p50_ms
    max: 100
    blocking: true
  - series: k6/api-baseline/device_detail
    metric: latency_p95_ms
    max: 500
    blocking: true
  - series: k6/api-baseline/device_detail
    metric: error_rate
    max: 0.01
    blocking: true
  - series: k6/api-baseline/device_list
    metric: latency_p50_ms
    max: 100
    blocking: true
  - series: k6/api-baseline/device_list
    metric: latency_p95_ms
    max: 300
    blocking: true
  - series: k6/api-baseline/device_list
    metric: error_rate
    max: 0.01
    blocking: true
  - series: k6/relay-throughput/relay
    metric: latency_p50_ms
    max: 400
    blocking: true
  - series: k6/relay-throughput/relay
    metric: latency_p95_ms
    max: 400
    blocking: true
  - series: k6/relay-throughput/relay
    metric: error_rate
    max: 0.01
    blocking: true
  - series: service/server/measured
