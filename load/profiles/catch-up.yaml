# Four thousand machines, one server's ceiling, back with an hour's gap each catch up beside live
# minutes and a busy morning's technicians at production's limits on ARM; its promises gate.
schema_version: 1
name: catch-up
# The fleet's return within 30 s at one server's ceiling, held through the drain, is its own load.
version: 3
family: spike
environment: runner
fixture: small

phases:
  # The whole fleet comes back within 30 s, as after a release restart, faster than the promised
  # rate; every machine was installed and filed before the walk, so it holds its certificate.
  - name: return
    duration: 30s
    operator_arrivals_per_second: 0
    connected_agents: 4000
    sessions: 0
  # Every machine stays while its hour drains, live minutes sent beside it, with the busy
  # morning's technicians at work.
  - name: drain
    duration: 24m
    operator_arrivals_per_second: 15
    connected_agents: 4000
    sessions: 20
    measured: true

# No processor ceiling, since a full store is what the leg sets out to see.
safety:
  max_node_memory_percent: 90
  max_error_rate: 0.05

gates:
  # The catch-up promises, the store probe's marks and the technicians beside the return.
  - series: quic/quic-agents/aggregate
    metric: error_rate
    max: 0.02
    blocking: true
  - series: quic/quic-agents/connect
    metric: latency_p95_ms
    max: 500
    blocking: true
  - series: quic/quic-agents/register
    metric: latency_p50_ms
    max: 100
    blocking: false
  - series: quic/quic-agents/register
    metric: latency_p95_ms
    max: 5000
    blocking: false
  - series: catchup/live/drain
    metric: within_5s_share
    min: 0.99
    blocking: true
  - series: quic/online/return
    metric: online_p95_seconds
    max: 180
    blocking: true
  - series: quic/online/return
    metric: online_all_seconds
    max: 300
    blocking: true
  # The server signs in a hundred returning machines a second while any waits for its answer.
  - series: quic/online/return
    metric: sign_ins_per_second
    min: 100
    blocking: true
  - series: catchup/gaps/drain
    metric: machines_caught_up
    min: 4000
    blocking: true
  - series: catchup/gaps/drain
    metric: fill_seconds
    max: 960
    blocking: true
  - series: catchup/batches/drain
    metric: unanswered
    max: 0
    blocking: true
  - series: catchup/batches/drain
    metric: deferred
    follows: catchup/gaps/drain|fill_seconds
    blocking: false
  - series: catchup/probe-one/probe
    metric: readings_per_second
    min: 10000
    blocking: false
  - series: catchup/probe-one/probe
    metric: live_within_5s_share
    min: 0.99
    blocking: false
  - series: catchup/probe-one/probe
    metric: duration_seconds
    min: 900
    blocking: true
  - series: catchup/probe-two/probe
    metric: readings_per_second
    min: 10000
    blocking: false
  - series: catchup/probe-two/probe
    metric: live_within_5s_share
    min: 0.99
    blocking: false
  - series: catchup/probe-two/probe
    metric: duration_seconds
    min: 900
    blocking: true
  - series: catchup/probe-quiet/probe
    metric: cpu_share
    max: 0.5
    blocking: false
  - series: catchup/probe-quiet/probe
    metric: memory_share
    max: 0.5
    blocking: false
  - series: catchup/probe-store/probe
    metric: peak_memory_share
    max: 0.8
    blocking: false
  - series: catchup/probe-store/probe
    metric: store_failures
    max: 0
    blocking: false
  - series: k6/api-baseline/command_accept
    metric: latency_p50_ms
    max: 100
    blocking: true
  - series: k6/api-baseline/command_accept
    metric: latency_p95_ms
    max: 1000
    blocking: true
  - series: k6/api-baseline/command_accept
    metric: error_rate
    max: 0.01
    blocking: true
  - series: k6/api-baseline/device_detail
