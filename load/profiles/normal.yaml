# The load the system carries on an ordinary day; every other profile departs from this one.
schema_version: 1
name: normal
family: normal
environment: staging
fixture: small

# The fleet is the largest staging holds: both generator pods share 150 of the node's millicores.
# The figure lives in scripts/lib/loadtest-venue-ceilings.sh, which the venue-ceiling test reads.
phases:
  # A ramp warms the connection pool and statement cache before the steady phase is measured.
  - name: ramp
    duration: 1m
    operator_arrivals_per_second: 2
    connected_agents: 250
    sessions: 0
  # The steady phase outlasts the three browser-side scenarios, which run one after another.
  - name: steady
    duration: 8m
    operator_arrivals_per_second: 5
    connected_agents: 500
    sessions: 5
    measured: true
  # A declared wind-down, so a connection closed by the run ending is not counted as dropped.
  - name: drain
    duration: 30s
    operator_arrivals_per_second: 0
    connected_agents: 0
    sessions: 0

safety:
  max_node_cpu_percent: 85
  max_node_memory_percent: 90
  max_error_rate: 0.01

# A blocking row fails the night, and a non-blocking row only reports.
# Every measurement the summarizer emits appears here or under `ungated:`.

gates:
  # A fleet glance, a machine's page and a sent instruction are each timed on their own below.

  - series: k6/api-baseline/http
    metric: latency_p50_ms
    max: 200
    blocking: true
  - series: k6/api-baseline/http
    metric: latency_p95_ms
    max: 200
    blocking: true
  # The tightened target, watched until the spread narrows under separate allocations.
  - series: k6/api-baseline/http
    metric: latency_p95_ms
    max: 100
    blocking: false
  - series: k6/api-baseline/http
    metric: latency_p99_ms
    max: 400
    blocking: false
  - series: k6/api-baseline/http
    metric: rps
    min: 5
    blocking: true
  - series: k6/api-baseline/http
    metric: error_rate
    max: 0.01
    blocking: true

  # A glance at a fleet.
  - series: k6/api-baseline/device_list
    metric: latency_p95_ms
    max: 300
    blocking: true
  - series: k6/api-baseline/device_list
    metric: latency_p99_ms
    max: 2000
    blocking: false

  # One machine's page fans out to its inventory, history and readings.
  - series: k6/api-baseline/device_detail
    metric: latency_p95_ms
    max: 500
    blocking: true
  - series: k6/api-baseline/device_detail
    metric: latency_p99_ms
    max: 2000
    blocking: false

  # The server accepting the instruction, not the machine carrying it out.
  - series: k6/api-baseline/command_accept
    metric: latency_p95_ms
    max: 1000
    blocking: true
  - series: k6/api-baseline/command_accept
    metric: latency_p99_ms
    max: 2000
    blocking: false

  - series: k6/concurrent-agents/http
    metric: latency_p50_ms
    max: 500
    blocking: true
  - series: k6/concurrent-agents/http
    metric: latency_p95_ms
    max: 500
    blocking: true
  - series: k6/concurrent-agents/http
    metric: latency_p99_ms
    max: 500
    blocking: false
  - series: k6/concurrent-agents/http
    metric: rps
    min: 5
    blocking: true
  - series: k6/concurrent-agents/http
    metric: error_rate
    max: 0.001
    blocking: true

  - series: k6/relay-throughput/http
    metric: latency_p50_ms
    max: 500
    blocking: true
  - series: k6/relay-throughput/http
    metric: latency_p95_ms
    max: 500
    blocking: true
  - series: k6/relay-throughput/http
    metric: latency_p99_ms
    max: 1000
    blocking: false
  # Five held sessions each make one request a second, so five a second is the ceiling.
  # The 4.5 floor fires when the generator stops keeping pace; the latency limits cover the server.
  - series: k6/relay-throughput/http
    metric: rps
    min: 4.5
    blocking: true
  - series: k6/relay-throughput/http
    metric: error_rate
    max: 0.01
    blocking: true

  # A keystroke coming back, across three hops and two upgrades.
  - series: k6/relay-throughput/relay
    metric: latency_p50_ms
    max: 400
    blocking: true
  - series: k6/relay-throughput/relay
    metric: latency_p95_ms
    max: 400
    blocking: true
  # Past this a session stops feeling like a conversation; watched until the relay path holds it.
  - series: k6/relay-throughput/relay
    metric: latency_p95_ms
    max: 150
    blocking: false
  - series: k6/relay-throughput/relay
    metric: latency_p99_ms
    max: 700
    blocking: false
  - series: k6/relay-throughput/relay
    metric: rps
    min: 0.25
    blocking: true

  - series: quic/quic-agents/connect
    metric: latency_p50_ms
    max: 800
    blocking: true
  - series: quic/quic-agents/connect
    metric: latency_p95_ms
    max: 2000
    blocking: true
  - series: quic/quic-agents/connect
    metric: latency_p99_ms
    max: 2000
    blocking: false

  - series: quic/quic-agents/handshake
    metric: latency_p50_ms
    max: 400
    blocking: true
  - series: quic/quic-agents/handshake
    metric: latency_p95_ms
    max: 1500
    blocking: true
  - series: quic/quic-agents/handshake
    metric: latency_p99_ms
    max: 2000
    blocking: false

  # The server's own figure, measured where the device row lands.
  # The 99th is watched only: its readings vary more than threefold, so a limit near one is noise.
  - series: quic/quic-agents/register
    metric: latency_p50_ms
    max: 100
    blocking: true
  - series: quic/quic-agents/register
    metric: latency_p95_ms
    max: 500
    blocking: true
  - series: quic/quic-agents/register
    metric: latency_p99_ms
    max: 1000
    blocking: false

  - series: quic/quic-agents/aggregate
    metric: error_rate
    max: 0
    blocking: true

  # A generator that falls behind offers less work, and dropped iterations count that shortfall.
  # The blocking row tolerates a few late iterations; the advisory row is the target.
  - series: k6/api-baseline/http
    metric: dropped_iterations
    max: 50
    blocking: true
  - series: k6/api-baseline/http
    metric: dropped_iterations
    max: 0
    blocking: false
  - series: k6/concurrent-agents/http
    metric: dropped_iterations
    max: 50
    blocking: true
  - series: k6/concurrent-agents/http
    metric: dropped_iterations
    max: 0
    blocking: false

# Measurements this profile has looked at and deliberately left alone.
ungated:
  # The median sits at or below the 95th percentile, so a middle-case ceiling above the
  # tail's limit can never fire.
  - series: k6/api-baseline/device_list
    metric: latency_p50_ms
    reason: the tail is held to 300 ms, so a middle-case ceiling above that can never fire
  - series: k6/api-baseline/device_detail
    metric: latency_p50_ms
    reason: the tail is held to 500 ms, so a middle-case ceiling above that can never fire
  - series: k6/api-baseline/command_accept
    metric: latency_p50_ms
    reason: the tail is held to 1000 ms, so a middle-case ceiling above that can never fire
  # Machines arrive at the profile's own pace, so the rate measures the profile; the error rate
  # and the registration timings above catch a machine that did not arrive.
  - series: quic/quic-agents/aggregate
    metric: rps
    reason: a walked profile paces its own arrivals, so the rate measures the profile rather than the server
