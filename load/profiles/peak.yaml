# The busiest ordinary hour rather than an exceptional one: a morning where a
# whole estate boots at once and every technician is looking at a device page.
#
# It runs on a disposable runner stack rather than on staging. The cluster node
# offers 1,830 millicores with 1,680 reserved, and the fleet this profile asks
# for is several times the largest anything has ever connected to it — so the
# venue could never answer the question, whatever the run did. A runner brings
# its own processors and its own disk and is thrown away at the end of the job.
#
# A runner is x86_64 and production is ARM64, so what this produces is a
# comparison and never an absolute capacity claim about production hardware.
schema_version: 1
name: peak
family: peak
environment: runner
fixture: lopsided

phases:
  - name: ramp
    duration: 1m
    operator_arrivals_per_second: 5
    connected_agents: 500
    sessions: 2
  - name: peak
    duration: 5m
    operator_arrivals_per_second: 15
    connected_agents: 2000
    sessions: 20
    measured: true
  - name: drain
    duration: 1m
    operator_arrivals_per_second: 0
    connected_agents: 0
    sessions: 0

# No processor ceiling. This stack is created by the job and thrown away with
# it, so there is no neighbour to protect, and driving the processor is the
# experiment rather than a hazard.
safety:
  max_node_memory_percent: 90
  max_error_rate: 0.02

gates:
  # This family runs on a throwaway machine with no browser-side generator on
  # it, so a limit naming a browser-side measurement could never be read here.
  # What this venue produces is the machine side, and these are limits on that.
  #
  # The busiest ordinary hour is still an ordinary hour, so the fleet is expected
  # to arrive and the arrival is expected to stay quick. The tail is loose enough
  # that a busy morning clears it and tight enough that a morning nobody could
  # sign in on does not.
  - series: quic/quic-agents/aggregate
    metric: error_rate
    max: 0.02
    blocking: true
  - series: quic/quic-agents/connect
    metric: latency_p95_ms
    max: 3000
    blocking: true
  - series: quic/quic-agents/register
    metric: latency_p95_ms
    max: 1000
    blocking: false
