# The busiest ordinary hour: a whole estate boots while every technician views a device page.
# It runs on a disposable x86_64 runner stack, so results compare runs and claim no ARM64 capacity.
schema_version: 1
name: peak
family: peak
environment: runner
fixture: lopsided

phases:
  - name: ramp
    duration: 1m
    operator_arrivals_per_second: 5
    connected_agents: 500
    sessions: 2
  - name: peak
    duration: 5m
    operator_arrivals_per_second: 15
    connected_agents: 2000
    sessions: 20
    measured: true
  - name: drain
    duration: 1m
    operator_arrivals_per_second: 0
    connected_agents: 0
    sessions: 0

# No processor ceiling, since driving the processor is the experiment on a throwaway stack.
safety:
  max_node_memory_percent: 90
  max_error_rate: 0.02

gates:
  # The machines, the technicians beside them and the parts that serve both, each held to its promise.
  - series: quic/quic-agents/aggregate
    metric: error_rate
    max: 0.02
    blocking: true
  - series: quic/quic-agents/connect
    metric: latency_p95_ms
    max: 500
    blocking: true
  - series: quic/quic-agents/register
    metric: latency_p50_ms
    max: 100
    blocking: true
  - series: quic/quic-agents/register
    metric: latency_p95_ms
    max: 500
    blocking: true
  - series: quic/quic-agents/wave
    metric: arrival_share
    min: 1
    blocking: true
  - series: quic/quic-agents/wave
    metric: latency_p95_ms
    max: 1000
    blocking: true
  - series: catchup/live/drain
    metric: within_5s_share
    min: 0.99
    blocking: true
  - series: k6/api-baseline/command_accept
    metric: latency_p50_ms
    max: 100
    blocking: true
  - series: k6/api-baseline/command_accept
    metric: latency_p95_ms
    max: 1000
    blocking: true
  - series: k6/api-baseline/command_accept
    metric: error_rate
    max: 0.01
    blocking: true
  - series: k6/api-baseline/device_detail
    metric: latency_p50_ms
    max: 100
    blocking: true
  - series: k6/api-baseline/device_detail
    metric: latency_p95_ms
    max: 500
    blocking: true
  - series: k6/api-baseline/device_detail
    metric: error_rate
    max: 0.01
    blocking: true
  - series: k6/api-baseline/device_list
    metric: latency_p50_ms
    max: 100
    blocking: true
  - series: k6/api-baseline/device_list
    metric: latency_p95_ms
    max: 300
    blocking: true
  - series: k6/api-baseline/device_list
    metric: error_rate
    max: 0.01
    blocking: true
  - series: k6/relay-throughput/relay
    metric: latency_p50_ms
    max: 400
    blocking: true
  - series: k6/relay-throughput/relay
    metric: latency_p95_ms
    max: 400
    blocking: true
  - series: k6/relay-throughput/relay
    metric: error_rate
    max: 0.01
    blocking: true
  - series: service/server/measured
    metric: cpu_percent
    max: 80
    blocking: false
  - series: service/server/measured
    metric: memory_percent
    max: 80
    blocking: false
  - series: service/database/measured
    metric: cpu_percent
    max: 80
    blocking: false
  - series: service/database/measured
    metric: memory_percent
    max: 80
    blocking: false
  - series: quic/register/ramp
    metric: latency_p50_ms
    max: 100
    blocking: true
  - series: quic/register/ramp
    metric: latency_p95_ms
    max: 500
    blocking: true
  - series: quic/register/peak
    metric: latency_p50_ms
    max: 100
    blocking: true
  - series: quic/register/peak
    metric: latency_p95_ms
    max: 500
    blocking: true
  - series: quic/register/drain
    metric: latency_p50_ms
    max: 100
    blocking: true
  - series: quic/register/drain
    metric: latency_p95_ms
    max: 500
    blocking: true
