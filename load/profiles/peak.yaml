# The busiest ordinary hour: a whole estate boots while every technician views a device page.
# It runs on a disposable x86_64 runner stack, so results compare runs and claim no ARM64 capacity.
schema_version: 1
name: peak
family: peak
environment: runner
fixture: lopsided

phases:
  - name: ramp
    duration: 1m
    operator_arrivals_per_second: 5
    connected_agents: 500
    sessions: 2
  - name: peak
    duration: 5m
    operator_arrivals_per_second: 15
    connected_agents: 2000
    sessions: 20
    measured: true
  - name: drain
    duration: 1m
    operator_arrivals_per_second: 0
    connected_agents: 0
    sessions: 0

# No processor ceiling, since driving the processor is the experiment on a throwaway stack.
safety:
  max_node_memory_percent: 90
  max_error_rate: 0.02

gates:
  # The evidence bundle judges the leg, so limits name machine-side measurements only.
  # The tail clears on a busy morning and fails on a morning nobody could sign in.
  - series: quic/quic-agents/aggregate
    metric: error_rate
    max: 0.02
    blocking: true
  - series: quic/quic-agents/connect
    metric: latency_p95_ms
    max: 3000
    blocking: true
  - series: quic/quic-agents/register
    metric: latency_p95_ms
    max: 1000
    blocking: false
