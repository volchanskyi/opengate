# The load and data stay constant while the resources vary, so the result is a processor curve.
# It runs on a disposable runner stack, since the sweep needs more points than the cluster offers.
schema_version: 1
name: scaling
family: scaling
environment: runner
fixture: small

# The fleet sits at 2,000 machines, where waits start to bend and processor counts can differ.
# Waits stay flat below it, so a smaller fleet would give every rung the same answer.
phases:
  - name: ramp
    duration: 30s
    operator_arrivals_per_second: 2
    connected_agents: 500
    sessions: 0
  - name: steady
    duration: 3m
    operator_arrivals_per_second: 10
    connected_agents: 2000
    sessions: 5
    measured: true

# No processor ceiling, since driving the processor is the experiment on a throwaway stack.
# The declared limits keep the room the node needs to store what the run produces.
safety:
  max_node_memory_percent: 90
  max_error_rate: 0.01

gates:
  # A rung below one processor is starved on purpose, so its waits read as watched marks there.
  - series: quic/quic-agents/aggregate
    metric: error_rate
    max: 0.005
    blocking: true
  - series: quic/quic-agents/connect
    metric: latency_p95_ms
    max: 500
    blocking_from_cpus: 1
    blocking: true
  - series: quic/quic-agents/register
    metric: latency_p50_ms
    max: 100
    blocking_from_cpus: 1
    blocking: true
  - series: quic/quic-agents/register
    metric: latency_p95_ms
    max: 500
    blocking_from_cpus: 1
    blocking: true
  - series: quic/quic-agents/wave
    metric: arrival_share
    min: 1
    blocking: true
  - series: quic/quic-agents/wave
    metric: latency_p95_ms
    max: 1000
    blocking_from_cpus: 1
    blocking: true
  - series: catchup/live/drain
    metric: within_5s_share
    min: 0.99
    blocking: true
  - series: k6/api-baseline/command_accept
    metric: latency_p50_ms
    max: 100
    blocking_from_cpus: 1
    blocking: true
  - series: k6/api-baseline/command_accept
    metric: latency_p95_ms
    max: 1000
    blocking_from_cpus: 1
    blocking: true
  - series: k6/api-baseline/command_accept
    metric: error_rate
    max: 0.01
    blocking: true
  - series: k6/api-baseline/device_detail
    metric: latency_p50_ms
    max: 100
    blocking_from_cpus: 1
    blocking: true
  - series: k6/api-baseline/device_detail
    metric: latency_p95_ms
    max: 500
    blocking_from_cpus: 1
    blocking: true
  - series: k6/api-baseline/device_detail
    metric: error_rate
    max: 0.01
    blocking: true
  - series: k6/api-baseline/device_list
    metric: latency_p50_ms
    max: 100
    blocking_from_cpus: 1
    blocking: true
  - series: k6/api-baseline/device_list
    metric: latency_p95_ms
    max: 300
    blocking_from_cpus: 1
    blocking: true
  - series: k6/api-baseline/device_list
    metric: error_rate
    max: 0.01
    blocking: true
  - series: k6/relay-throughput/relay
    metric: latency_p50_ms
    max: 400
    blocking_from_cpus: 1
    blocking: true
  - series: k6/relay-throughput/relay
    metric: latency_p95_ms
    max: 400
