# The load and data stay constant while the resources vary, so the result is a processor curve.
# It runs on a disposable runner stack, since the sweep needs more points than the cluster offers.
schema_version: 1
name: scaling
family: scaling
environment: runner
fixture: small

# The fleet sits at 2,000 machines, where waits start to bend and processor counts can differ.
# Waits stay flat below it, so a smaller fleet would give every rung the same answer.
phases:
  - name: ramp
    duration: 30s
    operator_arrivals_per_second: 2
    connected_agents: 500
    sessions: 0
  - name: steady
    duration: 3m
    operator_arrivals_per_second: 10
    connected_agents: 2000
    sessions: 5
    measured: true

# No processor ceiling, since driving the processor is the experiment on a throwaway stack.
# The declared limits keep the room the node needs to store what the run produces.
safety:
  max_node_memory_percent: 90
  max_error_rate: 0.01

gates:
  # No latency limit varies with the rung, since the curve over processor counts is the result.
  # The error limit is half of safety.max_error_rate, so a leg certified as measured never fails.
  - series: quic/quic-agents/aggregate
    metric: error_rate
    max: 0.005
    blocking: true
  # Loose enough that the slowest rung clears it, so it fires only on a leg that stopped working.
  - series: quic/quic-agents/connect
    metric: latency_p95_ms
    max: 2000
    blocking: true
