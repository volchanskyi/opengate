  - name: quiet-06
    duration: 12m
    operator_arrivals_per_second: 1
    connected_agents: 250
    sessions: 1
  - name: busy-07
    duration: 16m
    operator_arrivals_per_second: 3
    connected_agents: 500
    sessions: 3
  - name: quiet-07
    duration: 12m
    operator_arrivals_per_second: 1
    connected_agents: 250
    sessions: 1
  - name: busy-08
    duration: 16m
    operator_arrivals_per_second: 3
    connected_agents: 500
    sessions: 3
  - name: quiet-08
    duration: 12m
    operator_arrivals_per_second: 1
    connected_agents: 250
    sessions: 1
  - name: busy-09
    duration: 16m
    operator_arrivals_per_second: 3
    connected_agents: 500
    sessions: 3
  - name: quiet-09
    duration: 12m
    operator_arrivals_per_second: 1
    connected_agents: 250
    sessions: 1
  - name: busy-10
    duration: 16m
    operator_arrivals_per_second: 3
    connected_agents: 500
    sessions: 3
  - name: quiet-10
    duration: 12m
    operator_arrivals_per_second: 1
    connected_agents: 250
    sessions: 1
  # A declared wind-down, so a connection the run ends is not counted as one the server dropped.
  - name: drain
    duration: 2m
    operator_arrivals_per_second: 0
    connected_agents: 0
    sessions: 0

# No processor ceiling, since the stack is thrown away with the job.
# The declared limits keep the room the machine needs to store what the run produces.
safety:
  max_node_memory_percent: 85
  max_error_rate: 0.01

gates:
  # The evidence bundle judges the run, so these limits confirm the declared load was applied.
  # A leak shows as a slope in the readings, so no limit here tries to catch one.
  - series: quic/quic-agents/aggregate
    metric: error_rate
    max: 0.01
    blocking: true
  # The ceiling holds under the technician load, which does not move the connect path.
  - series: quic/quic-agents/connect
    metric: latency_p95_ms
    max: 2000
    blocking: true
