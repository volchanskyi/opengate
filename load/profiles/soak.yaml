# A steady load held five hours with the fleet coming and going, so a leak shows as a rising trend.
# It runs on a disposable x86_64 runner stack, so results compare runs and claim no ARM64 capacity.
schema_version: 1
name: soak
family: soak
environment: runner
fixture: small

phases:
  - name: ramp
    duration: 2m
    operator_arrivals_per_second: 1
    connected_agents: 250
    sessions: 0
  - name: busy-01
    duration: 16m
    operator_arrivals_per_second: 3
    connected_agents: 500
    sessions: 3
  - name: quiet-01
    duration: 12m
    operator_arrivals_per_second: 1
    connected_agents: 250
    sessions: 1
  - name: busy-02
    duration: 16m
    operator_arrivals_per_second: 3
    connected_agents: 500
    sessions: 3
  - name: quiet-02
    duration: 12m
    operator_arrivals_per_second: 1
    connected_agents: 250
    sessions: 1
  - name: busy-03
    duration: 16m
    operator_arrivals_per_second: 3
    connected_agents: 500
    sessions: 3
  - name: quiet-03
    duration: 12m
    operator_arrivals_per_second: 1
    connected_agents: 250
    sessions: 1
  - name: busy-04
    duration: 16m
    operator_arrivals_per_second: 3
    connected_agents: 500
    sessions: 3
  - name: quiet-04
    duration: 12m
    operator_arrivals_per_second: 1
    connected_agents: 250
    sessions: 1
  - name: busy-05
