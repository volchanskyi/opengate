  # A declared wind-down, so a connection torn down by the run ending is not
  # counted as one the server dropped.
  - name: drain
    duration: 2m
    operator_arrivals_per_second: 0
    connected_agents: 0
    sessions: 0

# No processor ceiling. This stack is created by the job and thrown away with
# it, so there is no neighbour to protect. What is declared is the room the run
# can still exhaust: past it the machine has nowhere to put what the run
# produces, which for an endurance run is the failure mode itself.
safety:
  max_node_memory_percent: 85
  max_error_rate: 0.01

gates:
  # What judges this run is its own evidence bundle, and a bundle states the
  # machine side: a limit naming a browser-side measurement would be held
  # against a row the reader does not produce. The technician load that runs
  # beside the fleet is folded into the bundle all the same, and reported there.
  #
  # An endurance run is judged on whether the load it applied was the load it
  # declared, for the whole of the time it claimed. A leak shows as a slope in
  # the readings rather than as a limit crossed, so nothing here is trying to
  # catch one — these say the run was real.
  #
  # The machines arriving is what this still fails on, and it survives the load
  # beside it: the volume family made the same change at a harder venue — eight
  # thousand machines on a whole processor — and its aggregate stayed at nought
  # across five nights while everything timed beside it moved tenfold. What a
  # technician load costs is the wait for an operation, not the operation being
  # refused.
  - series: quic/quic-agents/aggregate
    metric: error_rate
    max: 0.01
    blocking: true
  # Watched rather than enforced, until nights of the load this leg now offers
  # bracket it. The 2,000 ms was bracketed by nights with nothing beside the
  # fleet at all, and the same change on the volume family took its comparable
  # figure from about 400 ms to between 4,510 and 9,443, with the target's
  # processor use going from 38–62 to 85–87 per cent. A ceiling carried across
  # that is a ceiling on an experiment that is no longer being run, and it would
  # fail a night for the load the night was asked to apply.
  - series: quic/quic-agents/connect
    metric: latency_p95_ms
    max: 2000
    blocking: false
