# A steady load held long enough for what leaks to show, with the fleet coming
# and going throughout. Nothing here is meant to be hard; the finding is a trend
# line that does not flatten — memory, goroutines, open files, pool occupancy,
# dead rows, series count.
#
# Five hours, not eight, and the difference is made up by churn rather than by
# length. Holding a connection is not work: eight hours of an unchanging fleet
# finishes five hundred operations, which is a fifth of what an ordinary eight
# minute night completes, and a leak detector dividing what the target failed to
# give back by the operations between two readings has almost no denominator to
# divide by. The ten cycles below end and restart two hundred and fifty machines
# each, so the same five hours finish two thousand seven hundred and fifty.
#
# That figure is measured rather than projected, from soak run 35066887837 of
# 2026-09-16 — the first of this family to reach its end: 4h44m01s, 2,750
# machine-lives arriving over an arrival window of 4h30m01s, which is 10.2 a
# minute, with nothing failing and the target's goroutines going 30 to 28 across
# the whole of it. A projection had it at five thousand by counting each cycle's
# whole level rather than what the cycle actually replaces: a cycle climbs from
# two hundred and fifty to five hundred and falls back, so it offers two hundred
# and fifty arrivals and not five hundred.
#
# What the denominator buys is what it divides. At 2,750 the run read nought
# retained goroutines per operation, and a handful of goroutines of runtime
# noise is worth under 0.002 each — three hundred times under the half that
# fails a run, which is the margin the leak this family exists for would have
# to cross.
#
# The sessions below add to that count, and they are the operation the leak was
# actually attached to: the defect stranded two goroutines on a session that had
# finished, not on a machine that had arrived. One to three are held open
# through every phase and each is opened and closed again about once a second,
# so the walk finishes tens of thousands of them beside the machine-lives. The
# harness counts each machine side it answers, so they reach the denominator on
# their own.
#
# The machines that come back are the machines that left. An estate does not
# grow when a site's link flaps, so neither does this one: a machine enrols when
# it is first installed and reconnects afterwards with the certificate it
# already holds. A run that enrolled afresh every time would confound its own
# endurance question with the volume dimension, and would spend a burst of
# reconnections against the enrolment ceiling the server enforces on purpose.
#
# Five hours also fits inside one job with an hour to spare, where eight does
# not: a scheduled job is killed at six.
#
# It runs on a disposable runner stack rather than on staging. The run owns the
# whole machine and destroys it, which is what makes the deepest memory
# technique available — following what actually holds a leaked object needs a
# debugger attached to the process, and the staging pod drops every capability,
# runs as a non-root user and has a read-only filesystem.
#
# A runner is x86_64 and production is ARM64, so what this produces is a
# comparison and never an absolute capacity claim about production hardware.
schema_version: 1
name: soak
family: soak
environment: runner
fixture: small

phases:
  - name: ramp
    duration: 2m
    operator_arrivals_per_second: 1
    connected_agents: 250
    sessions: 0
  - name: busy-01
    duration: 16m
    operator_arrivals_per_second: 3
    connected_agents: 500
