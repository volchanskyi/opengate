    max: 80
    blocking: false
  - series: service/server/measured
    metric: memory_percent
    max: 80
    blocking: false
  - series: service/database/measured
    metric: cpu_percent
    max: 80
    blocking: false
  - series: service/database/measured
    metric: memory_percent
    max: 80
    blocking: false
  - series: leak/server/run
    metric: retained_goroutines_per_operation
    max: 0.5
    blocking: true
  - series: leak/server/run
    metric: retained_bytes_per_operation
    max: 2048
    blocking: true
  - series: leak/server/run
    metric: growing_sites
    max: 0
    blocking: true
  - series: quic/register/ramp
    metric: latency_p50_ms
