# A step change with no ramp, measured by how long the system takes to answer normally afterwards.
# It runs on a disposable x86_64 runner stack, so results compare runs and claim no ARM64 capacity.
schema_version: 1
name: spike
family: spike
environment: runner
fixture: small

phases:
  - name: baseline
    duration: 2m
    operator_arrivals_per_second: 5
    connected_agents: 500
    sessions: 5
  # No ramp on purpose. A gradual arrival is a different event and the system
  # absorbs it differently.
  - name: spike
    duration: 30s
    operator_arrivals_per_second: 40
    connected_agents: 2000
    sessions: 20
    measured: true
  # Back to the baseline load, held long enough to see the queue drain.
  - name: recovery
    duration: 3m
    operator_arrivals_per_second: 5
    connected_agents: 500
    sessions: 5

# No processor ceiling, since driving the processor is the experiment on a throwaway stack.
safety:
  max_node_memory_percent: 90
  max_error_rate: 0.05

gates:
  # The burst is held to 5 s and the machines, the technicians and the parts to their promises.
  - series: quic/quic-agents/aggregate
    metric: error_rate
    max: 0.05
    blocking: true
  - series: quic/quic-agents/connect
    metric: latency_p95_ms
    max: 5000
    blocking: true
  - series: quic/quic-agents/register
    metric: latency_p50_ms
    max: 100
    blocking: false
  - series: quic/quic-agents/register
    metric: latency_p95_ms
    max: 5000
    blocking: true
  - series: quic/quic-agents/wave
    metric: arrival_share
    min: 1
    blocking: true
  - series: quic/quic-agents/wave
    metric: latency_p95_ms
    max: 5000
    blocking: true
  - series: catchup/live/drain
    metric: within_5s_share
    min: 0.99
    blocking: true
  - series: k6/api-baseline/command_accept
    metric: latency_p50_ms
    max: 100
    blocking: true
  - series: k6/api-baseline/command_accept
    metric: latency_p95_ms
    max: 1000
    blocking: true
  - series: k6/api-baseline/command_accept
    metric: error_rate
    max: 0.01
    blocking: true
  - series: k6/api-baseline/device_detail
    metric: latency_p50_ms
    max: 100
    blocking: true
  - series: k6/api-baseline/device_detail
    metric: latency_p95_ms
    max: 500
    blocking: true
  - series: k6/api-baseline/device_detail
    metric: error_rate
    max: 0.01
    blocking: true
  - series: k6/api-baseline/device_list
    metric: latency_p50_ms
    max: 100
    blocking: true
  - series: k6/api-baseline/device_list
    metric: latency_p95_ms
    max: 300
    blocking: true
  - series: k6/api-baseline/device_list
    metric: error_rate
    max: 0.01
    blocking: true
  - series: k6/relay-throughput/relay
    metric: latency_p50_ms
    max: 400
    blocking: true
  - series: k6/relay-throughput/relay
    metric: latency_p95_ms
    max: 400
    blocking: true
  - series: k6/relay-throughput/relay
    metric: error_rate
    max: 0.01
    blocking: true
  - series: service/server/measured
    metric: cpu_percent
    max: 80
    blocking: false
  - series: service/server/measured
    metric: memory_percent
    max: 80
    blocking: false
  - series: service/database/measured
    metric: cpu_percent
    max: 80
    blocking: false
  - series: service/database/measured
    metric: memory_percent
    max: 80
    blocking: false
  - series: quic/register/baseline
    metric: latency_p50_ms
    max: 100
    blocking: true
  - series: quic/register/baseline
    metric: latency_p95_ms
    max: 500
    blocking: true
  - series: quic/register/spike
    metric: latency_p50_ms
    max: 100
    blocking: false
  - series: quic/register/spike
    metric: latency_p95_ms
    max: 5000
    blocking: true
