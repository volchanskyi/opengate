# The load is constant while the data already present varies, so a slower run has one cause.
# It runs on a disposable runner stack, since a size comparison needs the same hardware per size.
schema_version: 1
name: volume-500
family: volume
environment: runner
fixture: lopsided

# Each leg varies the enrolled machine count, which is what the database holds.
# Fixture names do not decide that count, so the sweep varies machines directly.
phases:
  - name: ramp
    duration: 30s
    operator_arrivals_per_second: 2
    connected_agents: 100
    sessions: 0
  - name: steady
    duration: 3m
    operator_arrivals_per_second: 5
    connected_agents: 500
    sessions: 5
    measured: true

# No processor ceiling, since driving the processor is the experiment on a throwaway stack.
# The declared limits keep the room the node needs to store what the run produces.
safety:
  max_node_memory_percent: 90
  max_error_rate: 0.01

gates:
  # The machines, the technicians beside them and the parts that serve both, each held to its promise.
  - series: quic/quic-agents/aggregate
    metric: error_rate
    max: 0
    blocking: true
  - series: quic/quic-agents/connect
    metric: latency_p95_ms
    max: 500
    blocking: true
  - series: quic/quic-agents/register
    metric: latency_p50_ms
    max: 100
    blocking: true
  - series: quic/quic-agents/register
    metric: latency_p95_ms
    max: 500
    blocking: true
  - series: quic/quic-agents/wave
    metric: arrival_share
    min: 1
    blocking: true
  - series: quic/quic-agents/wave
    metric: latency_p95_ms
    max: 1000
    blocking: true
  - series: catchup/live/drain
    metric: within_5s_share
    min: 0.99
    blocking: true
  - series: k6/api-baseline/command_accept
    metric: latency_p50_ms
    max: 100
    blocking: true
  - series: k6/api-baseline/command_accept
    metric: latency_p95_ms
    max: 1000
    blocking: true
  - series: k6/api-baseline/command_accept
    metric: error_rate
    max: 0.01
    blocking: true
  - series: k6/api-baseline/device_detail
    metric: latency_p50_ms
    max: 100
    blocking: true
  - series: k6/api-baseline/device_detail
    metric: latency_p95_ms
    max: 500
    blocking: true
  - series: k6/api-baseline/device_detail
    metric: error_rate
    max: 0.01
    blocking: true
  - series: k6/api-baseline/device_list
    metric: latency_p50_ms
    max: 100
    blocking: true
  - series: k6/api-baseline/device_list
    metric: latency_p95_ms
    max: 300
    blocking: true
  - series: k6/api-baseline/device_list
    metric: error_rate
    max: 0.01
    blocking: true
  - series: k6/relay-throughput/relay
    metric: latency_p50_ms
    max: 400
    blocking: true
  - series: k6/relay-throughput/relay
    metric: latency_p95_ms
    max: 400
    blocking: true
  - series: k6/relay-throughput/relay
    metric: error_rate
    max: 0.01
    blocking: true
  - series: service/server/measured
    metric: cpu_percent
    max: 80
    blocking: false
  - series: service/server/measured
    metric: memory_percent
    max: 80
    blocking: false
  - series: service/database/measured
    metric: cpu_percent
    max: 80
    blocking: false
  - series: service/database/measured
    metric: memory_percent
    max: 80
    blocking: false
  - series: quic/register/ramp
    metric: latency_p50_ms
    max: 100
    blocking: true
  - series: quic/register/ramp
    metric: latency_p95_ms
    max: 500
    blocking: true
  - series: quic/register/steady
    metric: latency_p50_ms
    max: 100
    blocking: true
  - series: quic/register/steady
    metric: latency_p95_ms
    max: 500
    blocking: true
