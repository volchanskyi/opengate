# The load is constant while the data already present varies, so a slower run has one cause.
# It runs on a disposable runner stack, since a size comparison needs the same hardware per size.
schema_version: 1
name: volume-8000
family: volume
environment: runner
fixture: lopsided

# The top of the sweep is the largest fleet the throwaway venue is shown to hold.
# loadtest-venue-ceilings.sh records that figure and loadtest-venue-ceiling.test.sh enforces it.
phases:
  # Two minutes keeps all three legs arriving at the same rate, about thirteen machines a second.
  # Thirty seconds would offer fifty-three arrivals a second against a server that accepts a hundred.
  - name: ramp
    duration: 2m
    operator_arrivals_per_second: 2
    connected_agents: 1600
    sessions: 0
  - name: steady
    duration: 3m
    operator_arrivals_per_second: 5
    connected_agents: 8000
    sessions: 5
    measured: true

# No processor ceiling, since driving the processor is the experiment on a throwaway stack.
# The declared limits keep the room the node needs to store what the run produces.
safety:
  max_node_memory_percent: 90
  max_error_rate: 0.01

gates:
  # The evidence bundle judges a leg, so limits name machine-side measurements only.
  # Registration is the write more data slows, timed by the server where the device row lands.
  - series: quic/quic-agents/aggregate
    metric: error_rate
    max: 0
    blocking: true
  # The median is the write itself, while the tail at this fleet size is a queue that varies per run.
  # Across five nights the median read 220 to 255 ms, so 500 ms leaves room without going slack.
  - series: quic/quic-agents/register
    metric: latency_p50_ms
    max: 500
    blocking: true

# Each entry is a measurement this profile deliberately leaves without a limit.
ungated:
  # At the venue's largest fleet the tail reads the target's processor queue, which varies per run.
  # A ceiling above the histogram's last boundary is refused by loadtest-gate-series.test.sh.
  - series: quic/quic-agents/register
    metric: latency_p95_ms
    reason: at the venue's largest fleet the tail is the queue rather than the write, and it does not reproduce between runs
