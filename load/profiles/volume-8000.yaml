# Hold the load constant and vary how much data is already there. Running it any
# other way conflates the two: a slower run against a bigger fleet says nothing
# about which of the two caused it.
#
# It runs on a disposable runner stack rather than on staging, because staging's
# database writes into the same node root production depends on, and because a
# comparison between fixture sizes needs no production-shaped hardware — only
# the same hardware for each size.
schema_version: 1
name: volume-8000
family: volume
environment: runner
fixture: lopsided

# One point of the sweep. The legs differ in machines that actually enrolled,
# because the fixture's name does not decide how much data is there — the large
# and lopsided fixtures plan the same count and differ only in distribution, so
# a sweep over fixture names was a two-point sweep wearing three labels. The
# machines are what the database holds, and they are what varies here.
#
# The top of this sweep is the largest fleet the throwaway venue has been
# shown to hold, rather than a round number: the ladder beside it held this
# and gave one rung higher. The figure lives once, with the run that
# established it, in scripts/lib/loadtest-venue-ceilings.sh, and
# scripts/tests/loadtest-venue-ceiling.test.sh refuses a profile asking its
# venue for more than that.
phases:
  # Two minutes rather than the thirty seconds its siblings take, so all three
  # legs bring their machines in at the same rate — about thirteen a second. A
  # sweep whose legs also differ in how fast the fleet arrives is varying two
  # things, and this leg is the one where the difference bites: sixteen hundred
  # machines in thirty seconds is fifty-three arrivals a second, and each arrival
  # costs another request to file the machine under its customer, against a
  # server that accepts a hundred a second from one address.
  - name: ramp
    duration: 2m
    operator_arrivals_per_second: 2
    connected_agents: 1600
    sessions: 0
  - name: steady
    duration: 3m
    operator_arrivals_per_second: 5
    connected_agents: 8000
    sessions: 5
    measured: true

# No processor ceiling. This stack is created by the job and thrown away with
# it, so there is no neighbour to protect, and driving the processor is the
# experiment rather than a hazard. What is declared is the room the run can
# still exhaust: past it the node has nowhere to put what the run produces.
safety:
  max_node_memory_percent: 90
  max_error_rate: 0.01

gates:
  # What judges a leg here is the evidence bundle, and a bundle states the
  # machine side: a limit naming a browser-side measurement would be held
  # against a row the reader does not produce. The technician load that runs
  # beside the fleet is folded into the bundle all the same, and read by the
  # curve that puts the legs side by side — which is where an estate slowing
  # reads down is visible at all.
  #
  # The write path is what more data slows, and registration is the write this
  # venue times — the server's own figure, taken where the device row lands
  # rather than at the generator's send buffer.
  - series: quic/quic-agents/aggregate
    metric: error_rate
    max: 0
    blocking: true
  # The middle case rather than the tail, and 500 ms rather than the figure the
  # siblings hold their tails to — because this leg offers a different load, and
  # a limit is bracketed by nights of the load its own leg offers.
  #
  # Until the family began offering the technician load its profiles declare,
  # the tail here read 396, 424, 470 and 482 ms across four nights with the
  # target using 38 to 62 per cent of its processor. With that load beside the
  # fleet it reads 4,510 to 9,443 across five, at 85 to 87 per cent — and two
  # valid runs an hour apart under identical load read 5,773 and 9,443, with the
  # 99th of the second reaching 10,000 exactly, which is the histogram's last
  # boundary rather than a measurement. Nothing about the server moved between
  # them. The tail at this fleet is the queue, and it does not reproduce.
  #
  # The middle case does: 220, 239 and 255 ms across those same runs. It is the
  # write rather than the wait for one, which is what this venue is timing, and
  # 500 ms is roughly six times the spread between the three — while saying
  # something a reader can hold on to, that at the largest fleet this venue has
  # been shown to carry half the machines still register inside what the
  # smaller legs' tails do.
  - series: quic/quic-agents/register
    metric: latency_p50_ms
    max: 500
    blocking: true

# Measurements this profile has looked at and deliberately left alone. An entry
# here is a decision; a measurement in neither list is nobody having decided,
# and the two read identically from the outside.
ungated:
  # The top rung of a sweep is driven to the largest fleet its venue has been
  # shown to hold, and there the target uses 87 per cent of its one processor.
  # Registration's tail is then a reading of that queue: two valid runs an hour
  # apart under identical load read 5,773 and 9,443 ms, and the second's 99th
  # reached the histogram's last boundary, where a reading stops being a
  # measurement at all. A ceiling wide enough not to fire on that spread is one
  # that cannot fire on anything, and a ceiling above the boundary is refused by
  # loadtest-gate-series.test.sh for the same reason. What this leg owes at that
  # ceiling is that its machines arrive, which the aggregate above holds at
  # nought; what the family is for is the shape across its three legs, which
  # perf-volume-curve.sh publishes.
  - series: quic/quic-agents/register
    metric: latency_p95_ms
    reason: at the venue's largest fleet the tail is the queue rather than the write, and it does not reproduce between runs
