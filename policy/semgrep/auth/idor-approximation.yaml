# A read by caller-supplied id with no user or scope derivation is the cross-tenant IDOR shape.
# The severity is WARNING because admin-only and global handlers over-fire.
rules:
  - id: og-idor-missing-ownership-check
    languages: [go]
    severity: WARNING
    message: >-
      Resource fetched by caller-supplied id ("$REQ.$IDF") with no ownership
      derivation in this handler (no ContextUserID / isOwner / requireDeviceInScope /
      requireIncidentInScope / denyIfNotAdmin). Confirm the caller is authorized for this specific
      object, not just authenticated. If this is an admin-only or global
      resource, gate it explicitly. ADR-027 (MEDIUM — review, not blocking).
    metadata:
      category: security
      cwe: "CWE-639: Authorization Bypass Through User-Controlled Key"
      owasp: "A01:2021 - Broken Access Control"
      confidence: LOW
      adr: ADR-027
    paths:
      include:
        - "server/internal/api/handlers_*.go"
    patterns:
      - pattern-inside: |
          func ($RECV $TYPE) $NAME(...) (...) {
            ...
          }
      - pattern: $S.$REPO.Get($CTX, $REQ.$IDF)
      - metavariable-regex:
          metavariable: $IDF
          regex: '^(Id|ID|.*Id|.*ID)$'
      - pattern-not-inside: |
          func ($RECV $TYPE) $NAME(...) (...) {
            ...
            ContextUserID(...)
            ...
          }
      - pattern-not-inside: |
          func ($RECV $TYPE) $NAME(...) (...) {
            ...
            $S.isOwner(...)
            ...
          }
      - pattern-not-inside: |
          func ($RECV $TYPE) $NAME(...) (...) {
            ...
            $S.requireDeviceInScope(...)
            ...
          }
      - pattern-not-inside: |
          func ($RECV $TYPE) $NAME(...) (...) {
            ...
            $S.requireIncidentInScope(...)
            ...
          }
      - pattern-not-inside: |
          func ($RECV $TYPE) $NAME(...) (...) {
            ...
            denyIfNotAdmin(...)
            ...
          }
