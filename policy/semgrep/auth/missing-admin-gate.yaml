# Scoped to handlers_*.go, the auth boundary; read handlers fall to the IDOR rule.
# Helpers appear in if-init and struct-field positions, so the exemption is a regex over the body.
rules:
  - id: og-auth-missing-admin-gate
    languages: [go]
    severity: ERROR
    message: >-
      Mutating handler "$NAME" has no authorization check. A
      Create/Update/Delete/Promote/Demote/Revoke/Grant endpoint must gate on
      admin (denyIfNotAdmin / isAdmin), on organization scope
      (requireDeviceInScope / requireAMTDeviceInScope / requireSessionInScope /
      requireIncidentInScope),
      or on ownership (isOwner)
      before acting — see server/internal/api/middleware.go. Add the guard and
      early-return the typed 403, or — if this endpoint is intentionally
      unauthenticated — rename it so it is not mutation-verb-prefixed. ADR-027.
    metadata:
      category: security
      cwe: "CWE-862: Missing Authorization"
      owasp: "A01:2021 - Broken Access Control"
      confidence: MEDIUM
      adr: ADR-027
    paths:
      include:
        - "server/internal/api/handlers_*.go"
    patterns:
      - pattern: |
          func ($RECV $TYPE) $NAME(...) (...) {
            ...
          }
      - metavariable-regex:
          metavariable: $NAME
          regex: '^(Create|Update|Delete|Promote|Demote|Revoke|Grant)'
      - pattern-not-regex: '\b(denyIfNotAdmin|isAdmin|isOwner|requireDeviceInScope|requireAMTDeviceInScope|requireSessionInScope|requireIncidentInScope)\b'
