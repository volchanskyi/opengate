# Fires on Path::new($X) or PathBuf::from($X) of a bare binding with no `$X.contains("..")` screen.
rules:
  - id: og-path-traversal-unchecked
    languages: [rust]
    severity: ERROR
    message: >-
      Path built from "$X" without a parent-directory ("..") screen. A
      caller-supplied path reaching the filesystem must be rejected when it
      contains ".." (or canonicalized and prefix-checked) before use. Add e.g.
      `if $X.contains("..") { return Err(...) }` before constructing the Path.
      ADR-027.
    metadata:
      category: security
      cwe: "CWE-22: Improper Limitation of a Pathname to a Restricted Directory"
      owasp: "A01:2021 - Broken Access Control"
      confidence: MEDIUM
      adr: ADR-027
    patterns:
      - pattern-either:
          - pattern: Path::new($X)
          - pattern: PathBuf::from($X)
      # Bare identifiers only; literals and derived expressions such as `base.join(name)` are skipped.
      - metavariable-regex:
          metavariable: $X
          regex: '^[a-z_][a-z0-9_]*$'
      # A `..` rejection earlier in the enclosing function clears the finding; a separate
      # pattern-inside is omitted because its metavariable binding conflicts with this not-inside.
      - pattern-not-inside: |
          fn $FN(...) -> $RET {
            ...
            if <... $X.contains("..") ...> { ... }
            ...
          }
