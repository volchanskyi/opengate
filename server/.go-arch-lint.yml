# OpenGate Go architecture lint policy, run in strict mode by the gauntlet.
# The catch-all `other` component is unconstrained; only the components below are gated.

version: 3
workdir: .

# Architecture rules apply to production code; tests may import fixtures and fakes freely.
excludeFiles:
  - '_test\.go$'

allow:
  # Only project-internal imports are constrained; vendor imports are checked by the audits.
  depOnAnyVendor: true
  deepScan: true

components:
  # The cert module owns CA/CSR signing and verification and imports stdlib only.
  cert:
    in: internal/cert

  # The shared tenant context and SET LOCAL transaction helper used by Postgres adapters.
  dbtx:
    in: internal/dbtx

  # The audit module owns the audit-log aggregate: repository, Postgres adapter, decorator.
  audit:
    in: internal/audit

  # The update module owns the DeviceUpdate and EnrollmentToken aggregates.
  update:
    in: internal/updater

  # The auth module owns the SecurityGroup aggregate and the JWT and password-hash helpers.
  auth:
    in: internal/auth

  # The device module owns Devices, Groups, Hardware inventory and the cached log read model.
  device:
    in: internal/device

  # The organization module owns one customer inside a tenant.
  organization:
    in: internal/organization

  # The settings module owns the tenancy ladder a value resolves along: machine, site,
  # customer, tenant, then what shipped.
  settings:
    in: internal/settings

  # The notifications module owns the WebPushSubscription aggregate, Notifier and VAPID keys.
  notifications:
    in: internal/notifications

  # The session module owns the agent-session aggregate of browser, relay and agent tokens.
  session:
    in: internal/session

  # The telemetry module owns numeric VictoriaMetrics access and the Postgres RLS process table.
  telemetry:
    in: internal/telemetry

  # The inventory module owns the Postgres RLS device_inventory table.
  inventory:
    in: internal/inventory

  # The alerts module owns alerts and the incidents they fold into; its vocabulary is
  # independent of the wire protocol's, so a wire change never reshapes the database.
  alerts:
    in: internal/alerts

  # The usecase module orchestrates across aggregates by composing their repository ports.
  usecase:
    in: internal/usecase

  # The wire types and codec both languages agree on; a leaf that imports nothing internal.
  protocol:
    in: internal/protocol

  # The rule catalogue, its cost analysis, and the customer bindings and rollout state.
  rules:
    in: internal/rules

  other:
    in:
      - internal/**
      - cmd/**
      - tests/**

deps:
  cert:
    # An empty mayDependOn denies every internal import; the schema requires one allow-flag.
    mayDependOn: []
    anyVendorDeps: true
  dbtx:
    mayDependOn: []
    anyVendorDeps: true
  audit:
    # deepScan is off because the decorator's duck-typed Observer would trace to metrics.Metrics.
    mayDependOn:
      - dbtx
    anyVendorDeps: true
    deepScan: false
  update:
    mayDependOn:
      - dbtx
    anyVendorDeps: true
    deepScan: false
  auth:
    mayDependOn:
      - dbtx
    anyVendorDeps: true
    deepScan: false
  device:
    mayDependOn:
      - dbtx
    anyVendorDeps: true
    deepScan: false
  notifications:
    mayDependOn:
      - dbtx
    anyVendorDeps: true
    deepScan: false
  session:
    mayDependOn:
      - dbtx
    anyVendorDeps: true
    deepScan: false
  organization:
    mayDependOn:
      - dbtx
    anyVendorDeps: true
    deepScan: false
  settings:
    mayDependOn:
      - dbtx
    anyVendorDeps: true
    deepScan: false
  telemetry:
    mayDependOn:
      - dbtx
    anyVendorDeps: true
    deepScan: false
  inventory:
    mayDependOn:
      - dbtx
    anyVendorDeps: true
    deepScan: false
  alerts:
    mayDependOn:
      - dbtx
    anyVendorDeps: true
    deepScan: false
  usecase:
    # deepScan is off because use cases take duck-typed interfaces such as notifications.Notifier.
    mayDependOn:
      - audit
      - notifications
      - session
      - protocol  # protocol.RedactToken
    anyVendorDeps: true
    deepScan: false
  protocol:
    # Both languages encode against the wire vocabulary, so it imports no other component.
    mayDependOn: []
    anyVendorDeps: true
    deepScan: false
  rules:
    mayDependOn:
      - dbtx
      - settings
      - protocol
    anyVendorDeps: true
    deepScan: false
  other:
    anyProjectDeps: true
    anyVendorDeps: true
