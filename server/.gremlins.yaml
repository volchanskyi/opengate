# Gremlins mutation-testing config for the Go server; it excludes generated code,
# entry-point wiring and shared test scaffolding.
unleash:
  exclude-files:
    - "openapi_gen\\.go"
    - "cmd/meshserver/"
    - "tests/loadtest/main\\.go"
    - "internal/testutil/"
  # The per-mutant timeout is the coverage dry-run time times this coefficient, which bounds
  # the budget a never-terminating mutant consumes while leaving slow finishing mutants room.
  timeout-coefficient: 3
