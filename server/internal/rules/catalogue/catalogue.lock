# The digest of every shipped (rule_id, version), as `<id> <version> <sha256>`.
#
# A definition is immutable once published: the rule that raised an alert last
# week still has to mean what it meant then. Loading refuses a definition whose
# digest no longer matches its line here, so changing a rule means adding a new
# version and a new line — never editing a published one.
#
# The digest covers what the rule means, not how it is described, so improving a
# summary is not a version bump. Refresh a line only when adding a version:
#   go test ./internal/rules/ -run TestEmbeddedCatalogueMatchesItsCommittedLock
# names any rule that drifted.

