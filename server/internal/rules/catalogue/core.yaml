rules:
  # Reading rules are pushed to the fleet and cost-bounded at load; every rule is digest-locked.
  # Thresholds are shipped defaults a customer retunes through a binding within bounds.

  - id: disk-critical
    version: 1
    severity: critical
    summary: A disk is nearly full and will stop accepting writes.
    metric: disk.used_percent
    comparator: gte
    threshold: 90
    clear: 85
    sustain_secs: 300
    predicate: Instant
    # Grouped by mount too: a full data volume and a full system volume are two problems.
    group_by: [device, mount]
    group_window_secs: 900
    evidence: [vitals, top_processes, inventory]
    tunable:
      threshold: {min: 50, max: 99}
      clear: {min: 40, max: 98}
      sustain_secs: {min: 60, max: 3600}

  - id: cpu-saturated
    version: 1
    severity: warning
    summary: A machine has been pinned at full CPU long enough to be slow to use.
    metric: cpu.total
    comparator: gte
    threshold: 95
    clear: 85
    sustain_secs: 300
    predicate: Instant
    group_by: [device]
    group_window_secs: 900
    evidence: [vitals, top_processes]
    tunable:
      threshold: {min: 50, max: 100}
      clear: {min: 20, max: 99}
      sustain_secs: {min: 60, max: 3600}

  - id: memory-pressure
    version: 1
    severity: critical
    summary: A machine is nearly out of memory and about to start killing processes.
    metric: mem.used_percent
    comparator: gte
    threshold: 95
    clear: 85
    sustain_secs: 300
    predicate: Instant
    group_by: [device]
    group_window_secs: 900
    evidence: [vitals, top_processes]
    tunable:
      threshold: {min: 50, max: 100}
      clear: {min: 20, max: 99}
      sustain_secs: {min: 60, max: 3600}

  - id: io-stalled
    version: 1
    severity: warning
    summary: Work on this machine is spending its time waiting for storage.
    # Kernel pressure reading: a host or cgroup that publishes no pressure files reports it unsupported.
    metric: stall.io.some
    comparator: gte
    threshold: 40
    clear: 20
    sustain_secs: 300
    # A mean over the window, since storage stalls in bursts and one busy second is no trouble.
    predicate: WindowMean
    window_secs: 300
    group_by: [device]
    group_window_secs: 1800
    evidence: [vitals, top_processes, correlation]
    coverage_requires: [stall.io.some]
    tunable:
      threshold: {min: 10, max: 100}
      clear: {min: 0, max: 99}
      sustain_secs: {min: 60, max: 3600}
      window_secs: {min: 60, max: 1800}

  - id: disk-slow
    version: 1
    severity: warning
    summary: A disk is taking long enough to answer that everything on it feels slow.
    metric: disk.await_ms
    comparator: gte
    threshold: 50
    clear: 20
    sustain_secs: 300
    predicate: WindowMean
    window_secs: 300
    group_by: [device, mount]
    group_window_secs: 1800
    evidence: [vitals, top_processes, correlation]
    coverage_requires: [disk.await_ms]
    tunable:
      threshold: {min: 5, max: 5000}
      clear: {min: 1, max: 4999}
      sustain_secs: {min: 60, max: 3600}
      window_secs: {min: 60, max: 1800}

  # Event rules: the matching phrases live in the machine's log reader, so only the name, revision,
  # severity and grouping are here; with no number to retune, an administrator can still stop one.

  - id: linux-oom-kill
    version: 1
    kind: event
    severity: critical
    summary: The kernel killed a process to reclaim memory.
    # Grouped on the machine: one host reclaiming memory repeatedly is one problem.
    group_by: [device]
    group_window_secs: 900
    evidence: [recent_logs]

  - id: linux-hung-task
    version: 1
    kind: event
    severity: warning
    summary: A task was blocked for over two minutes.
    group_by: [device]
    group_window_secs: 900
    evidence: [recent_logs]

  - id: linux-ata-reset
    version: 1
    kind: event
    severity: warning
    summary: A disk stopped responding and its bus was reset.
    # A failing disk link resets again and again over hours, so the room stays open longer.
    group_by: [device]
    group_window_secs: 1800
    evidence: [recent_logs]

  - id: linux-thermal-throttle
    version: 1
    kind: event
    severity: warning
    summary: The processor slowed itself down under thermal load.
    group_by: [device]
    group_window_secs: 1800
    evidence: [recent_logs]

  - id: linux-service-errors
    version: 1
    kind: event
    severity: warning
    summary: One service has been logging errors repeatedly.
    # The error count already spans a day, so firings an hour apart are one problem.
    group_by: [device]
    group_window_secs: 3600
    evidence: [recent_logs]
