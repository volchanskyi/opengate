sonar.organization=volchanskyi
sonar.projectKey=volchanskyi_opengate
sonar.projectName=OpenGate

sonar.sources=server/internal,agent/crates,web/src
sonar.tests=server/internal,server/tests,agent/crates,web/src
sonar.test.inclusions=**/*_test.go,**/tests/**,**/*.test.ts,**/*.test.tsx,**/*.spec.ts

sonar.go.coverage.reportPaths=server/coverage.out

sonar.javascript.lcov.reportPaths=web/coverage/lcov.info

sonar.rust.lcov.reportPaths=agent/lcov.info

# agent/crates/*/tests/** holds Rust integration tests, whose fixtures would otherwise read as
# vulnerabilities in shipped code.
sonar.exclusions=**/testutil/**,**/testpg/**,**/testdata/**,**/node_modules/**,**/target/**,**/*.test.ts,**/*.test.tsx,**/*_test.go,agent/crates/*/tests/**,**/openapi_gen.go
# A Rust integration test is indexed as a test file, so the test set excludes it too.
sonar.test.exclusions=agent/crates/*/tests/**
# JUSTIFICATIONS (the guard requires one line here per entry below):
#   **/testutil/** — test code: shared helpers imported only from _test.go
#   **/testpg/** — test code: the throwaway-Postgres provisioner
#   **/testdata/** — test code: fixtures
#   **/*_test.go — test code: the Go test files themselves
#   **/*.test.ts — test code: the TypeScript test files themselves
#   **/*.test.tsx — test code: the React test files themselves
#   **/openapi_gen.go — generated by oapi-codegen; api/openapi.yaml is what gets reviewed
#   **/types/** — generated by openapi-typescript from api/openapi.yaml
#   **/*.d.ts — generated type declarations
#   **/main.tsx — browser entry point: mounts the React root, nothing to enter from a test
#   **/App.tsx — router mount; vitest does not instrument it, so Sonar would read it as 0%
sonar.coverage.exclusions=**/testutil/**,**/testpg/**,**/testdata/**,\
  **/*_test.go,**/*.test.ts,**/*.test.tsx,\
  **/openapi_gen.go,\
  **/types/**,\
  **/*.d.ts,\
  **/main.tsx,\
  **/App.tsx

# Go test and benchmark names use underscores, which go:S100 flags.
sonar.issue.ignore.multicriteria=e1,e2,e3,e4,e5,e6
sonar.issue.ignore.multicriteria.e1.ruleKey=go:S100
sonar.issue.ignore.multicriteria.e1.resourceKey=**/*_test.go
# WSConn stores a context because io.ReadWriteCloser fixes its method signatures.
sonar.issue.ignore.multicriteria.e2.ruleKey=godre:S8242
sonar.issue.ignore.multicriteria.e2.resourceKey=**/wsconn.go
# Hardcoded IPs in tests are fixtures.
sonar.issue.ignore.multicriteria.e3.ruleKey=go:S1313
sonar.issue.ignore.multicriteria.e3.resourceKey=**/*_test.go
# Tests connect to servers with self-signed certs.
sonar.issue.ignore.multicriteria.e4.ruleKey=go:S4830
sonar.issue.ignore.multicriteria.e4.resourceKey=**/*_test.go
sonar.issue.ignore.multicriteria.e5.ruleKey=go:S5527
sonar.issue.ignore.multicriteria.e5.resourceKey=**/*_test.go
# HTTP Digest Auth (RFC 2617/7616) mandates MD5 in digest.go; it is not used for security.
sonar.issue.ignore.multicriteria.e6.ruleKey=go:S4790
sonar.issue.ignore.multicriteria.e6.resourceKey=**/wsman/digest.go
